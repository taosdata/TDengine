[profile.default]
retries = 1
test-threads = "num-cpus"
slow-timeout = { period = "5m", terminate-after = 1 }

[[profile.default.overrides]]
filter = 'test(with_taos)'
retries = { backoff = "exponential", count = 5, delay = "3s", jitter = true }

[[profile.default.overrides]]
filter = 'package(taosx-integration-tests)'
retries = { backoff = "exponential", count = 5, delay = "3s", jitter = true }

[profile.ci]
fail-fast = false

[[profile.ci.overrides]]
filter = 'test(with_taos)'
test-group = 'tdengine-vnode'

[[profile.ci.overrides]]
filter = 'test(test_td2local_with_taos)'
slow-timeout = { period = "10m", terminate-after = 1 }

[profile.ci.junit] # this can be some other profile, too
path = "taosx-unit-tests.xml"
store-success-output = true
store-failure-output = true

[test-groups.tdengine-vnode]
max-threads = 1

[profile.perf_test]
retries = 0
slow-timeout = { period = "24h" }
