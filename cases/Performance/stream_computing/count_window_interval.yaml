case2:
  json_file1:
    stream_info: 
      stream_name: perf_stream
      stream_stb: perf_db1.output_streamtb
      trigger_mode: "at_once"
      watermark: "300s"
      count_window: 10000
      source_sql: "select _wstart as wstart, min(c1),max(c2), sum(c0), avg(c0), count(c3), first(c0), last(c1), tbname, now from perf_db1.stb partition by tbname count_window(10000)"
      # source_sql: "select _wstart as wstart, min(c1),max(c2), sum(c0), avg(c0), count(c3), first(c0), last(c1), now  from perf_db1.stb interval(1s)"
      drop: "no"
    json_info:
      host: "u1-55"
      port: 6030
      thread_count: 40
      create_table_thread_count: 40
      result_file: "/root/taosBenchmark_result.log"
      confirm_parameter_prompt: "no"
      insert_interval: 0
      num_of_records_per_req: 1000
      max_sql_len: 1024000
    db_info:
      db_name: "perf_db1"
      drop: "no"
      replica: 1
      precision: "ms"
      keep: 3650
      vgroups: 10
      duration: "1d"
      stt_trigger: 1
    stb_info:
      stb_name: "stb"
      child_table_exists: "no"
      childtable_count: 10000
      childtable_prefix: "stb1_0"
      escape_character: "no"
      auto_create_table: "no"
      batch_create_tbl_num: 1
      data_source: "rand"
      insert_mode: "taosc"
      interlace_rows: 4
      line_protocol: null
      tcp_transfer: "no"
      insert_rows: 10000

      childtable_limit: 0
      childtable_offset: 0
      rows_per_tbl: 0
      max_sql_len: 65480
      disorder_ratio: 0
      disorder_range: 1000
      timestamp_step: 1
      start_timestamp: "2023-01-01 00:00:00"
      sample_format: "csv"
      sample_file: "./sample.csv"
      tags_file: ""
      col_timestamp_count: 1
      col_tinyint_count: 0
      col_smallint_count: 0
      col_int_count: 1
      col_bigint_count: 0
      col_utinyint_count: 0
      col_usmallint_count: 0
      col_uint_count: 0
      col_ubigint_count: 0
      col_float_count: 2
      col_double_count: 0
      col_varchar_count: 0
      col_varchar_length: 16
      col_nchar_count: 0
      col_nchar_length: 4
      col_bool_count: 0

      tag_tinyint_count: 1
      tag_smallint_count: 0
      tag_int_count: 0
      tag_bigint_count: 0
      tag_utinyint_count: 0
      tag_usmallint_count: 0
      tag_uint_count: 0
      tag_ubigint_count: 0
      tag_float_count: 0
      tag_double_count: 0
      tag_binary_count: 1
      tag_binary_length: 16
      tag_varchar_count: 0
      tag_varchar_length: 16
      tag_nchar_count: 0
      tag_nchar_length: 16
      tag_timestamp_count: 0
      tag_bool_count: 0
      keep_trying: -1
      trying_interval: 10000