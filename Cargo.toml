[workspace]
members = [
  "mdsn",
  "taos-error",
  "taos-macros",
  "taos-sys",
  "taos-query",
  "taos",
]

[package]
name = "taosx"
version = "0.0.0"
edition = "2021"
homepage = "https://taosdata.com"
license = "MIT"
description = "taosX - TDengine data integration tool"

exclude = ["/docs", "TODO.md", "*.json", ".vscode"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bincode = "1.3.3"
bitvec_simd = "0.20.5"
chrono-tz = { version = "0.6.1", features = ["serde"] }
clap = { version = "3.1.6", features = ["derive", "env"] }
futures = "0.3.21"
glob = "0.3.0"
log = "0.4.16"
num_enum = "0.5.7"
parquet = { version = "12.0.0", features = ["cli"] }
r2d2 = "0.8.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.59"
simple_logger = "2.1.0"
taos = { path = "taos" }
thread-id = "4.0.0"
tokio = { version = "1", features = ["full"] }
url = { version = "2", features = ["serde"] }

anyhow = "1.0"
linked-hash-map = "0.5.4"
metrics = "0.18.1"
metrics-exporter-prometheus = "0.9.0"
palaver = "0.2.8"
procfs = "0.12.0"
psutil = { version = "3.2.0", default-features = false, features = ["cpu", "process"] }
