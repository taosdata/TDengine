[package]
name = "taosx"
version = "0.0.0"
edition = "2021"
homepage = "https://taosdata.com"
description = "taosX - TDengine data integration tool"

exclude = ["/docs", "TODO.md", "*.json", ".vscode"]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1"
arrow = "20.0.0"
async-compression = { version = "*", features = ["all"] }
async-trait = "0.1"
bitflags = "1"
chrono = "0.4"
clap = { version = "3.2", features = ["default", "derive"] }
clap-verbosity-flag = "1"
config = "0.13.1"
csv-async = { version = "1.2.4", features = ["tokio"] }
futures = "0.3"
log = "0.4"
parquet = { version = "20.0.0" }
pretty_env_logger = "0.4"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
taos = { version = "0.*" }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7" }
toml = "0.5.9"
zstd = "0.11.2"

actix-web = "4"
serde_json = "1.0"
sqlx = { version = "*", features = ["runtime-tokio-native-tls", "sqlite", "chrono"] }
utoipa = { version = "1", features = ["actix_extras", "chrono"] }
utoipa-swagger-ui = { version = "1", features = ["actix-web"] }

lru = "0.7.5"
metrics = "0.20.1"
metrics-exporter-prometheus = "0.11.0"
palaver = "0.2.8"
procfs = "0.14.0"
psutil = { version = "3.2.0", default-features = false, features = ["cpu", "process"] }

[build-dependencies]
sqlx = { version = "*", features = ["runtime-tokio-native-tls", "sqlite", "chrono"] }
dotenv = "*"

[patch.crates-io]
zip = { git = "https://github.com/zip-rs/zip.git" }

[build]
rustflags = ["--cfg", "tokio_unstable"]
