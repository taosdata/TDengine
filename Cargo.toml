[workspace]
members = [
  "taosx-ipc",
  "taosx-core",
  "taosx-agent",
  "taosx-metrics",
  "crates/sqlite-optimizer",
  "crates/arrow-compute-ext",
  "crates/arrow-cast-guess-precision",
  "crates/futures-ext",
  "crates/taoslog",
  "crates/tokio-cron-scheduler",
  "explorer/server",
  "tests/integration",
  "tests/tools",
  "crates/spawners/x-replication",
  "crates/persist-queue",
  "crates/archive",
  "crates/rotate-file",
  "crates/source-mqtt",
  "crates/source-historian",
  "crates/source-influxdb",
  "crates/source-kafka",
  "crates/source-mongodb",
  "crates/source-mssql",
  "crates/source-mysql",
  "crates/source-opc",
  "crates/source-opentsdb",
  "crates/source-oracle",
  "crates/source-pi",
  "crates/source-postgres",
  "crates/source-sparkplugb",
  "crates/sink-parquet",
  "crates/source-csv",
  "crates/sink-mqtt",
  "crates/sink-kafka",
  "crates/task",
  "crates/tmq-to-td",
  "crates/tmq-to-local",
  "crates/local-to-taos",
  "crates/legacy-to-taos",
  "crates/source-orc",
  "crates/taos-to-local",
  "crates/source-kinghistorian",
  "crates/source-kinghistorian/kinghistorian-sys",
  "crates/source-pulsar",
  "crates/reclaim-memory",
]
exclude = ["crates/transform/parsers/hebeipower"]

[workspace.dependencies]
chrono = { version = "0.4.37" }
chrono-tz = { version = "0.10.1" }
shadow-rs = { version = "0.38.1", default-features = false }
itertools = { version = "0.14.0" }
flume = { version = "0.11" }
urlencoding = { version = "2" }
reqwest = { version = "0.12" }
clap = { version = "4.5.30", features = ["default", "derive"] }
clap-verbosity-flag = { version = "3.0.2" }
regex = { version = "1.11.0" }
libc = { version = "0.2" }

arrow = { version = "55", features = [
  "chrono-tz",
  "ipc_compression",
  "prettyprint",
] }
arrow-flight = { version = "55" }
arrow-schema = { version = "55", features = ["serde"] }
arrow-compute-ext = { path = "crates/arrow-compute-ext" }
arrow-cast-guess-precision = { path = "crates/arrow-cast-guess-precision" }
serde_arrow = { version = "0.13", features = ["arrow-55"] }
parquet = "55"

futures-ext = { path = "crates/futures-ext" }
dashmap = "6.1.0"
faststr = { version = "0.2.31", features = ["serde"] }
rayon = { version = "1" }

metrics = "0.24"
metrics-util = { version = "0.20", features = ["storage"] }

scc = { version = "2" }
tonic = "0.12.3"
zerocopy = { version = "0.8.18", features = ["derive"] }
bytes = "1.10.0"
sysinfo = "0.36"
serde_with = { version = "3.14", features = ["chrono"] }

serde = "1"

# NOTE: 当前 arrow-json 不兼容 serde_json 的 arbitrary_precision feature，添加需谨慎
serde_json = { version = "1.0", features = ["raw_value", "preserve_order"] }
fundu = "2.0.1"
opendal = { version = "0.53" }
rumqttc = "0.25.0"
rustls = { version = "0.23.18", default-features = false }
rustls-pemfile = { version = "2" }
rustls-native-certs = "0.8"

snafu = "0.8.5"
tokio = "1.46"
notify = "8.1"
tokio-util = "0.7"
futures = "0.3"
futures-util = "0.3"
tokio-stream = "0.1"
tracing = "0.1"
anyhow = "1"
thiserror = "2"
parking_lot = "0.12.3"
tempfile = "3.13.0"
rand = "0.8"
bitfield = "0.19"
bigdecimal = "0.4"
prost = "0.14"

actix-cors = "0.7.0"
actix-files = "0.6.6"
actix-multipart = "0.7.2"
actix-web = { version = "4.9.0", features = ["rustls-0_23"] }
actix-ws = "0.3.0"
awc = { version = "3", features = ["rustls-0_23"] }
async-stream = "0.3"

hex = "0.4.3"
csv = "1.2"
csv-async = { version = "1.2.4", features = ["tokio"] }

uuid = "1.17"
linked-hash-map = { version = "0.5.6", features = ["serde_impl"] }
tiberius = { version = "0.12.2", default-features = false, features = [
  "chrono",
  "tds73",
  "time",
  "winauth",
  "bigdecimal",
] }
deadpool-tiberius = "=0.1.8"
deadpool = "=0.10"
tokio-process-terminate = { version = "0.3" }
ringbuf = { version = "0.4" }
toml = "0.9"
mongodb = { version = "3.3.0", features = [
  "aws-auth",
  "zstd-compression",
  "zlib-compression",
  "snappy-compression",
  "openssl-tls",
] }
sqlx = { version = "0.8.0", features = [
  "mysql",
  "runtime-tokio",
  "chrono",
  "bigdecimal",
  "tls-rustls",
] }
sqlx-postgres = { version = "0.8", features = [
  "chrono",
  "bigdecimal",
  "bit-vec",
] }
tracing-subscriber = { version = "0.3" }
cfg-if = "1"
base64 = "0.22.1"
oracle = { version = "0.6", features = ["chrono"] }
bit-vec = "0.6"
flate2 = "1.0"
kafka = "0.10.0"
glob = "0.3.1"
humantime = "2.1"
semver = "1"
awaitgroup = "0.7.0"
lazy_static = "1.4"
async-trait = "0.1"
async-backtrace = "0.2.2"
async-compression = { version = "0.4", default-features = false, features = [
  "zstd",
  "tokio",
] }
utoipa = { version = "4", features = ["actix_extras", "chrono"] }
utoipa-swagger-ui = { version = "7", features = ["actix-web", "vendored"] }
socket2 = "0.6"
zstd = "0.13"
crossbeam = "0.8.4"
http = "0.2"
log = "0.4"
strum = { version = "0.27", features = ["derive"] }
paste = "1"
encoding_rs = "0.8"
lz4 = "1.28.0"
snap = "1.1.1"
const_format = "0.2"
assert_cmd = "2"
assert_fs = "1.1.2"
mimalloc = { version = "0.1.48", default-features = false }
libmimalloc-sys = { version = "0.1.44", default-features = false }
pin-project-lite = "0.2"
orc-rust = "0.6"
duckdb = "1.3"
num = "0.4"
criterion = { version = "0.7", features = ["html_reports"] }
dlopen2 = "0.8.0"

pulsar = "6.4.1"
md5 = "0.8"

taosx-core = { path = "./taosx-core", default-features = false }
taosx-ipc.path = "./taosx-ipc"
taosx-task.path = "crates/task"
taosx-metrics.path = "./taosx-metrics"
source-csv.path = "./crates/source-csv"
source-kafka.path = "./crates/source-kafka"
source-kinghistorian.path = "./crates/source-kinghistorian"
tmq-to-local.path = "./crates/tmq-to-local"
tmq-to-td.path = "./crates/tmq-to-td"
legacy-to-taos.path = "./crates/legacy-to-taos"
local-to-taos.path = "./crates/local-to-taos"
source-opc.path = "./crates/source-opc"
taoslog = { path = "crates/taoslog", features = ["ansi"] }
archive = { path = "./crates/archive" }
reclaim-memory = { path = "./crates/reclaim-memory" }

[workspace.dependencies.taos]
# path = "../taos-connector-rust/taos"
rev = "29b8215d"
git = "https://github.com/taosdata/taos-connector-rust.git"
default-features = false
features = ["ws", "optin", "deadpool"]

[workspace.package]
version = "1.11.0"
rust-version = "1.90.0"
edition = "2024"

[workspace.lints.clippy]
too_many_arguments = "allow"

[package]
name = "taosx"
version.workspace = true
build = "build.rs"
edition.workspace = true
exclude = ["/docs", "TODO.md", "*.json", ".vscode"]
homepage = "https://taosdata.com"
rust-version = { workspace = true }
description = "taosX - TDengine data integration tool"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow.workspace = true
arrow = { workspace = true }
arrow-flight = { workspace = true }
zerocopy = { workspace = true }
opendal = { workspace = true, features = ["services-s3"] }
#multi_index_map = "0.15.0"
multi_index_map = { git = "https://github.com/acerDebugman/multi_index_map.git", tag = "v0.1-taos" }
scc = { workspace = true, features = ["serde"] }
semver.workspace = true
shadow-rs = { workspace = true }
strum = { workspace = true, features = ["derive"] }
sqlite-optimizer = { path = "crates/sqlite-optimizer" }

twelf = { version = "0.15.0", default-features = false, features = [
  "toml",
  "env",
  "clap",
] }

chrono = { workspace = true }
clap = { workspace = true, features = ["default", "derive", "env"] }
clap-verbosity-flag = { workspace = true }
csv.workspace = true
csv-async.workspace = true
dashmap = { workspace = true }
fundu.workspace = true
futures.workspace = true
lazy_static.workspace = true
linked-hash-map.workspace = true
itertools.workspace = true
log = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_yaml = "0.9.19"
thiserror = { workspace = true }
tokio = { workspace = true, features = [
  "rt",
  "rt-multi-thread",
  "io-util",
  "io-std",
  "net",
  "time",
  "process",
  "macros",
  "sync",
  "signal",
  "fs",
] }
tokio-util.workspace = true
toml.workspace = true

actix-cors.workspace = true
actix-files.workspace = true
actix-multipart.workspace = true
actix-web.workspace = true
actix-ws.workspace = true
base64.workspace = true
serde_json = { version = "1.0", features = ["raw_value"] }
sqlx = { workspace = true, features = ["sqlite", "chrono", "json"] }
utoipa.workspace = true
utoipa-swagger-ui.workspace = true
uuid = { workspace = true, features = [
  "v4",
  "fast-rng",
  "macro-diagnostics",
  "serde",
] }

# tonic version is restricted by arrow-flight
socket2.workspace = true
tokio-stream = { workspace = true, features = ["net"] }
tonic = { workspace = true, features = ["tls", "tls-native-roots", "gzip"] }
rustls = { workspace = true, features = ["ring"] }

# lru = "0.7.5"
const_format.workspace = true
metrics = { workspace = true }

metrics-util = { workspace = true }
sysinfo = { workspace = true }

async-backtrace.workspace = true
dotenv = "0.15.0"

flume.workspace = true
futures-util.workspace = true
serde_with.workspace = true
tokio-cron-scheduler = { path = "crates/tokio-cron-scheduler" }

mimalloc = { workspace = true, optional = true }
tempfile.workspace = true

bytes = { workspace = true }
jsonwebtoken = "9.1.0"
rand.workspace = true

console-subscriber = { version = "0.4.0", optional = true }
opentelemetry = { version = "0.30" }
opentelemetry-otlp = { version = "0.30", features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "0.30" }
reqwest = { workspace = true, features = ["json"] }
tracing = { workspace = true, features = ["log"] }
tracing-actix-web = "0.7"
tracing-opentelemetry = { version = "0.31" }
tracing-subscriber = { workspace = true, features = [
  "time",
  "local-time",
  "env-filter",
] }

gethostname = "1"
prettytable = "0.10.0"
taos = { workspace = true }

notify.workspace = true
taoslog.workspace = true
tokio-retry2 = { version = "0.5.6", features = ["jitter", "tracing"] }

# taosx crates
taosx-core.workspace = true
taosx-ipc.workspace = true
taosx-metrics.workspace = true
taosx-task.workspace = true
source-kafka.workspace = true
tmq-to-local.workspace = true
tmq-to-td.workspace = true
legacy-to-taos.workspace = true
local-to-taos.workspace = true
source-opc.workspace = true
source-csv.workspace = true
source-kinghistorian.workspace = true
reclaim-memory.workspace = true

archive = { workspace = true }
cached = { version = "0.56.0", features = ["async"] }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { version = "0.6.0", optional = true }
tikv-jemalloc-sys = { version = "0.6.0", features = [
  "unprefixed_malloc_on_supported_platforms",
  "stats",
  "profiling",
], optional = true }
tikv-jemalloc-ctl = { version = "0.6.0", optional = true }
jemalloc_pprof = { version = "0.8.0", git = "https://github.com/polarsignals/rust-jemalloc-pprof.git", optional = true }

[build-dependencies]
sqlx = { workspace = true, features = ["sqlite", "chrono"] }
dotenv = "0.15.0"

shadow-rs = { workspace = true }

[dev-dependencies]
assert_cmd.workspace = true
shlex = "1"
opendal = { workspace = true, features = ["services-s3"] }
urlencoding = { workspace = true }
deadpool = { workspace = true }

taosx-integration-tests = { path = "./tests/integration" }
fastrand = "2"

[features]
default = ["rustls", "mimalloc"]
optin = []
mimalloc = ["dep:mimalloc", "reclaim-memory/mimalloc"]
jemallocator = [
  "tikv-jemallocator",
  "tikv-jemalloc-sys",
  "tikv-jemalloc-ctl",
  "jemalloc_pprof",
]
rustls = ["sqlx/runtime-tokio-rustls", "taos/ws-rustls", "taosx-core/rustls"]
native-tls = [
  "sqlx/runtime-tokio-native-tls",
  "taos/ws-native-tls",
  "taosx-core/native-tls",
]
disable-enterprise-only-validation = [
  "taosx-core/disable-enterprise-only-validation",
]
disable-enterprise-connector-validation = [
  "taosx-core/disable-enterprise-connector-validation",
]

tokio-tracing = ["tokio/tracing", "console-subscriber"]

[profile.sani]
inherits = "release"
debug = 2

[profile.production]
inherits = "release"
codegen-units = 1
debug = 2
split-debuginfo = "packed"
strip = "debuginfo"

[patch.crates-io]
sasl2-sys = { path = "./crates/rust-sasl/sasl2-sys" }
orc-rust = { git = "https://github.com/datafusion-contrib/orc-rust.git", rev = "refs/pull/49/head" }

[lints]
workspace = true
