[package]
name = "taosx"
version = "0.4.1-alpha.0"
edition = "2021"
homepage = "https://taosdata.com"
description = "taosX - TDengine data integration tool"

exclude = ["/docs", "TODO.md", "*.json", ".vscode"]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1"
arrow = "29.0.0"
async-compression = { version = "*", features = ["all"] }
async-trait = "0.1"
bitflags = "1"
chrono = "0.4"
clap = { version = "4.0.11", features = ["default", "derive"] }
clap-verbosity-flag = "2.0.0"
config = "0.13.2"
convert_case = "0.6.0"
csv-async = { version = "1.2.4", features = ["tokio"] }
dashmap = "5.4.0"
futures = "0.3"
itertools = "0.10.4"
lazy_static = "1.4"
linked-hash-map = { version = "0.5.6", features = ["serde_impl"] }
log = "0.4"
parquet = "29.0.0"
parse_duration = "2.1"
pretty_env_logger = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7" }
toml = "0.5.9"
zstd = "0.12.1"

actix-web = "4"
serde_json = "1.0"
sqlx = { version = "0.6", features = ["sqlite", "chrono"] }
utoipa = { version = "2.0.0", features = ["actix_extras", "chrono"] }
utoipa-swagger-ui = { version = "3.0.1", features = ["actix-web"] }

# lru = "0.7.5"
const_format = "0.2.30"
metrics = "0.20.1"
metrics-exporter-prometheus = { version = "0.11.0", default-features = false, features = ["push-gateway"] }
sysinfo = "0.27.1"
palaver = "0.2.8"
shadow-rs = "0.20.0"

[dependencies.taos]
version = "0.4.16"
default-features = false
git = "https://github.com/taosdata/taos-connector-rust.git"
features = ["ws", "r2d2"]

[target.'cfg(not(target_os = "windows"))'.dependencies]
jemallocator = { version = "0.5.0", optional = true }

[build-dependencies]
sqlx = { version = "0.6", features = ["sqlite", "chrono"] }
dotenv = "0.15.0"
shadow-rs = "0.20.0"

[features]
default = ["sys", "native-tls"]
optin = ["taos/optin"]
sys = ["taos/native"]
rustls = ["sqlx/runtime-tokio-rustls", "taos/ws-rustls"]
native-tls = ["sqlx/runtime-tokio-native-tls", "taos/ws-native-tls"]
disable-enterprise-only-validation = []

[profile.sanitizer]
inherits = "dev"

[profile.min]
inherits = "release"
codegen-units = 1
opt-level = "z"
strip = true
lto = true
