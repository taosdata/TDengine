[package]
name = "taosx"
version = "0.0.0"
edition = "2021"
homepage = "https://taosdata.com"
description = "taosX - TDengine data integration tool"

exclude = ["/docs", "TODO.md", "*.json", ".vscode"]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1"
arrow = "23.0.0"
async-compression = { version = "*", features = ["all"] }
async-trait = "0.1"
bitflags = "1"
chrono = "0.4"
clap = { version = "4.0.11", features = ["default", "derive"] }
clap-verbosity-flag = "2.0.0"
config = "0.13.2"
convert_case = "0.6.0"
csv-async = { version = "1.2.4", features = ["tokio"] }
futures = "0.3"
itertools = "0.10.4"
lazy_static = "1.4"
linked-hash-map = { version = "0.5.6", features = ["serde_impl"] }
log = "0.4"
parquet = "23.0.0"
pretty_env_logger = "0.4"
regex = "1"
scc = "0.11.1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7" }
toml = "0.5.9"
zstd = "0.11.2"

taos = { version = "0.4.3", default-features = false, features = ["ws"] }

actix-web = "4"
serde_json = "1.0"
sqlx = { version = "0.6", features = ["runtime-tokio-native-tls", "sqlite", "chrono"] }
utoipa = { version = "2.0.0", features = ["actix_extras", "chrono"] }
utoipa-swagger-ui = { version = "2.0.0", features = ["actix-web"] }

# lru = "0.7.5"
metrics = "0.20.1"
metrics-exporter-prometheus = { version = "0.11.0", default-features = false, features = ["push-gateway"] }
palaver = "0.2.8"
procfs = "0.14.0"
psutil = { version = "3.2.0", default-features = false, features = ["cpu", "process"] }

[build-dependencies]
sqlx = { version = "0.6", features = ["runtime-tokio-native-tls", "sqlite", "chrono"] }
dotenv = "0.15.0"

[features]
default = ["sys"]
optin = ["taos/optin"]
sys = ["taos/native"]

[profile.release]
codegen-units = 1
opt-level = "z"
strip = true
lto = true
