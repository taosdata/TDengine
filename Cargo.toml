[workspace]
members = [
  "taos-error",
  "taos-macros",
  "taos-sys",
  "taos-query",
  "taos",
]

[package]
name = "taosx"
version = "0.0.0"
edition = "2021"
homepage = "https://taosdata.com"
license = "MIT"
description = "taosX - TDengine data integration tool"

exclude = ["/docs", "TODO.md", "*.json", ".vscode"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bitvec_simd = "0.20.5"
chrono-tz = { version = "0.6.1", features = ["serde"] }
clap = { version = "3.1.6", features = ["derive", "env"] }
futures = "0.3.21"
parquet = {version = "11.0.0", features = ["cli"]}
glob = "0.3.0"
libtaos = "*"
log = "0.4.16"
serde = { version = "1", features = ["derive"] }
simple_logger = "2.1.0"
thread-id = "4.0.0"
r2d2 = "0.8.9"
serde_json = "1.0.59"
num_enum = "0.5.7"
bincode = "1.3.3"
taos = { path = "taos" }
taos-sys = { path = "taos-sys" }
tokio = { version = "1", features = ["full"] }
url = { version = "2", features = ["serde"] }
