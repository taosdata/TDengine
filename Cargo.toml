[workspace]
members = [
  "taos-error",
  "taos-sys",
  "taos",
]

[package]
name = "taosx"
version = "0.0.0"
edition = "2021"
homepage = "https://taosdata.com"
license = "MIT"
description = "taosX - TDengine data integration tool"

exclude = ["/docs", "TODO.md", "*.json", ".vscode"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono-tz = { version = "0.6.1", features = ["serde"] }
clap = { version = "3.1.6", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
url = { version = "2", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
taos = { path = "taos" }
taos-sys = { path = "taos-sys"}
futures = "0.3.21"
libtaos = "*"
parquet = "11.0.0"
glob = "0.3.0"
bitvec_simd = "0.20.5"
log = "0.4.16"
simple_logger = "2.1.0"
thread-id = "4.0.0"
r2d2 = "0.8.9"
bevy_reflect = "0.6.0"