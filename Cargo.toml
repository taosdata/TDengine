[workspace]
members = [
  "mdsn",
  "taos-error",
  "taos-macros",
  "taos-sys",
  "taos-query",
  "taos-ws",
  "taos-ws-sys",
  "taos",
]

[package]
name = "taosx"
version = "0.0.0"
edition = "2021"
homepage = "https://taosdata.com"
description = "taosX - TDengine data integration tool"

exclude = ["/docs", "TODO.md", "*.json", ".vscode"]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1"
async-compression = { version = "*", features = ["all"] }
async-trait = "0.1"
bitflags = "1"
chrono = "0.4"
clap = { version = "3.2", features = ["default", "derive"] }
clap-verbosity-flag = "1"
config = "0.13.1"
futures = "0.3"
log = "0.4"
pretty_env_logger = "0.4"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
taos = { path = "./taos" }
tokio = { version = "1", features = ["full"] }
toml = "0.5.9"
zstd = "0.11.2"
