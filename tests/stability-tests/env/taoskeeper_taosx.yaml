settings:
  - name: taosd
    fqdn: [node232]
    spec:
      version: 3.3.6.5  # 默认最新版
      config: # common config for all dnodes
        firstEP: node232:6030

      dnodes:
        - endpoint: node232:6030
          config_dir: /etc/taos
          code_dir: /root/TDengine
          update_branch: main
          config: # will write into taos.cfg
            dataDir: /var/lib/taos
            logDir: /var/log/taos
            debugFlag: 135
            supportVnodes: 1024
            logKeepDays:  -1
            numOfLogLines: 300000000
            checkpointInterval: 60
            snodeAddress: 127.0.0.1:873
            ratioOfVnodeStreamThreads: 4
            maxInsertBatchRows: 10000
            UdfdLdLibPath: /usr/local/lib/python3.8/site-packages/taospyudf:/usr/local/lib/python3.8/dist-packages/taospyudf
            monitor: 1
            monitorFQDN: localhost
            audit: 1
  - name: taospy
    fqdn: [node232]
    spec:
      version: 3.3.6.5
      client_version: 3.3.6.5
      config:
        firstEP: node232:6030
        logDir: /var/log/taos
        debugFlag: 135
        asyncLog: 0
        maxQueryTimeRange: 3
        disableCount: 0
        queryTableNotExistAsEmpty: false
        maxInsertBatchRows: 10000

  - name: taosAdapter
    fqdn: [node232]
    spec:
      version: 3.3.6.5
      config_file: /etc/taos/taosadapter.toml
      adapter_config:
        logLevel: info
        port: 6041
        taosConfigDir: /etc/taos
        log:
          path: /var/log/taos
        opentsdb_telnet:
          enable: true
          maxTCPConnections: 250
          tcpKeepAlive: false
          dbs: ["telnet_tcp"]
          ports: [6046]
          user: root
          password: taosdata
          worker: 1000

      taos_config:
        firstEP: node232:6030
        logDir: /var/log/taos
        debugFlag: 135

  - name: taosKeeper
    fqdn: [node232]
    spec:
      version: 3.3.6.5
      config_file: /etc/taos/taoskeeper.toml
      keeper_config:
        loglevel: info
        port: 6043
        gopoolsize: 50000
        RotationInterval: 15s
        tdengine:
          host: 192.168.1.230
          port: 16041
          username: "root"
          password: "taosdata"
          usessl: false
        log:
          path: /var/log/taos
          rotationCount: 5
          rotationTime: 24h
          rotationSize: 100000000

  - name: taosx
    fqdn: [node232]
    spec:
      version: 3.3.6.5
      config_file: /etc/taos/taosx.toml
      taosx_config:
        instanceId: 100
        monitor:
          fqdn: localhost
        log:
          path: /var/log/taos
        serve:
        log.loggers:

  - name: taosBenchmark
    fqdn: [node232]
    spec:
      version: 3.3.6.5
      taos_version: 3.3.6.5
      config_dir: /etc/taos
      taos_config:
        firstEP: node232:6030
        logDir: /var/log/taos
        debugFlag: 131
