settings:
  - name: taosd
    fqdn: [cs219, node221, node222, node223]
    spec:
      version: 3.0.0.0  # 默认最新版
      config: # common config for all dnodes
        firstEP: cs219:6030
      dnodes:
        - endpoint: cs219:6030
          config_dir: /etc/taos
          config: # will write into taos.cfg
            dataDir: /data/lib/taos
            logDir: /data/log/taos
            debugFlag: 135
        - endpoint: node221:6030
          config_dir: /etc/taos
          config: # will write into taos.cfg
            dataDir: /var/lib/taos
            logDir: /var/log/taos
            debugFlag: 135
        - endpoint: node222:6030
          config_dir: /etc/taos
          config: # will write into taos.cfg
            dataDir: /var/lib/taos
            logDir: /var/log/taos
            debugFlag: 135

  - name: taospy
    fqdn: [cs219]
    spec:
      version: 2.2.0
      client_version: 2.4.0.0
      config:
        firstEP: cs219:6030
        logDir: /var/log/taos
        debugFlag: 135

  - name: create_table_tool
    fqdn: [k8smaster, k8sslave, node223]
    spec:
      version: 3.0.0.0

  - name: prometheus
    fqdn: [ceph02]
    spec:
      server:
        run_dir: /opt/prometheus # 默认path, 选配
        config: # 所有key都选配
          global:
            evaluation_interval: 1s
            scrape_interval: 3s
            scrape_timeout: 3s
          scrape_configs:
            job_name: prometheus
            targets: [localhost:9090]
      node_exporter:
        fqdn: [cs219, node221, node222, node223]
        run_dir: /opt/node_exporter # 默认path, 选配
      process_exporter:
        fqdn: [cs219, node221, node222, node223, k8smaster, k8sslave] # 元素个数要大于等于custom_process中的key个数
        run_dir: /opt/process_exporter # 默认path, 选配
        config: # common_process和custom_process都选配, 但全配置的话custom_process会覆盖common_process的配置
          common_process: [taosd]
          custom_process:
            cs219: [taosd]
            node223: [create_table]
            k8smaster: [create_table]
            k8sslave: [create_table]