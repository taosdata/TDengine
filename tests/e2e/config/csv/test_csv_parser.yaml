"parser": {
  "parser": {
    "parse": {
      "value": {
        "json": ""
      }
    },
    "model": {
      "name": "d{id}",
      "using": "csv_meters",
      "tags": [
        "id"
      ],
      "columns": [
        "ts",
        "current",
        "voltage",
        "phase",
        "desc"
      ]
    },
    "mutate": [
      {
        "map": {
          "ts": {
            "cast": "ts",
            "as": "TIMESTAMP(ms)"
          },
          "current": {
            "expr": "int(parse_float(current))",
            "as": "INT"
          },
          "voltage": {
            "cast": "voltage",
            "as": "INT"
          },
          "phase": {
            "cast": "phase",
            "as": "DOUBLE"
          },
          "desc": {
            "cast": "desc",
            "as": "BINARY(64)"
          },
          "id": {
            "cast": "id",
            "as": "INT"
          }
        }
      }
    ]
  },
  "format": {
    "currentPage": 1,
    "pageCount": 7,
    "pageSize": 20
  },
