
task_name: mssql
task_type: mssql

from:
  fromhost: mssql://{0}/ci_test
  sql: select * from ci_test.dbo.TestTable where dDateTimeOffset > ${start} and dDateTimeOffset < ${end}
  start: '2024-07-05T00:00:00Z'
  end: '2024-07-06T00:00:00Z'
  interval: 12h
  read_concurrency: 1
  delay: 0
  sample_data_limit: 5
  trust_cert: "true"

to:
  target_type: taos
  target_dbname: ci_db_mssql

task_exec_time: 10
via: 1
