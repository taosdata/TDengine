task_name: ci_opcda
task_type: opcda

# 除必要的显式配置外所有配置都使用默认值

from:
  fromhost: opcda://{0}/Matrikon.OPC.Simulation.1
  connect_timeout: 10
  request_timeout: 10
  interval: 1
  log_level: info
  write_concurrency: 0
  batch_size: 1000
  batch_timeout: 1
  keep_raw_data: "false"
  keep_raw_data_days: 1

to:
  target_type: taos
  target_dbname: ci_opcda

via: 7
task_exec_time: 10
