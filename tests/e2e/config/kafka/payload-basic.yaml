parser:
  {
    "parse": {
      "ts":{"as":"timestamp(ms)"},
      "topic": {"as": "varchar", "alias": "t"},
      "partition": {"as": "int", "alias": "p"},
      "offset": {"as": "bigint", "alias": "o" },
      "key": {"as": "varchar", "alias": "k"},
      "value": {
        "json": [
          {"name": "id", "alias": "id", "cast": "INT"},
          {"name": "current", "alias": "current", "cast": "FLOAT"},
          {"name": "phase", "alias": "phase", "cast": "DOUBLE"},
          {"name": "voltage", "alias": "voltage", "cast": "INT UNSIGNED"},
          {"name": "groupid", "alias": "groupid", "cast": "INT"},
          {"name": "location", "alias": "location", "cast": "VARCHAR(64)"}
        ]
      }
    },
    "model": {
      "name": "kafka_{id}",
      "using": "kafkaStb",
      "columns": ["ts", "id", "current", "voltage", "phase"],
      "tags": [
        "groupid",
        "location"
      ]
    }
  }
