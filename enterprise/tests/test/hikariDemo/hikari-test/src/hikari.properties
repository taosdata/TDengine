driverClassName=com.taosdata.jdbc.TSDBDriver
#jdbcUrl=jdbc:TSDB://192.168.0.1:0/?user=root&password=taosdata
jdbcUrl=jdbc:TSDB://127.0.0.1:0/?user=root&password=taosdata&locale=en_US.UTF-8&timezone=UTC-8
username=root
password=taosdata
maximumPoolSize=1000
minimumIdle=5
connectionTestQuery=describe slowquery # show dnodes cause connection leaks at client side
autoCommit=true
dataSource.cachePrepStmts=true
dataSource.prepStmtCacheSize=250
dataSource.prepStmtCacheSqlLimit=2048
dataSource.useServerPrepStmts=false
dataSource.useLocalSessionState=true
dataSource.useLocalTransactionState=true
dataSource.rewriteBatchedStatements=true
dataSource.cacheResultSetMetadata=false
dataSource.cacheServerConfiguration=true
dataSource.elideSetAutoCommits=true
dataSource.maintainTimeStats=false
