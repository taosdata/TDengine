########################################################
#                                                      #
#          TDengine Configuration for CSV              #
#   Any questions, please email support@taosdata.com   #
#                                                      #
########################################################

# Below is the configuration entry for importing CSV files
 
# Program Configuration
csvThreadNum 10
# range [5, 1000000]
fileCacheRows 100000
localFile /home/ubuntu/slguan/kc-09-207-sink0.1557882000199.txt
# localDir /home/slguan/work/v15/kit/taoscsv/input
hdfsUrl hdfs://192.168.1.19:54310
hdfsIoStreamBuffSize 4096
hdfsFileEncoding UTF-8
hdfsDecompressData true
hdfsCompressedDataFormat lzo
hdfsFile /user/jyhou/lzotest/kc-09-207-sink0.1557882000199.lzo
# hdfsDir /user/jyhou/lzotest

# may be bigint, or patterns like yyyyMMdd/HHmmss
timestampPattern yyyyMMdd/HHmmss
# the precision parsed from column, while timestampPattern is bigint, second, millisecond, microsecond is allowed
timestampPrecision millisecond
timestampMinValue 20170101
timestampMaxValue 20250101
# You can start this option
# 1. timestampPrecision is second
# 2. timestampPrecision is millisecond, and datadbMicroSecond is enabled
retainDuplicate false
sortBeforeInsert false
autoTimestamp false
discardOldData true

# Log File section
logDir /home/ubuntu/slguan/
numOfLogLines 1000000
# debugFlag 8 bits mask: FILE-SCREEN-UNUSED-HeartBeat-DUMP-TRACE_WARN-ERROR
# 131: output warning and error，135: output info, warning and error to log.
# 199: output debug, info, warning and error to both screen and file, 195
debugFlag 135

# File Configuration
split ,
colSize 30
ignoreFirstLine false
binaryContainQuotation false
# dispose lines like "1554048015000","64963137490"
splitContainQuotation false
# dispose lines like CAITS 0_0 70111_17036059169 410703 U_REPT 
splitContainBlank true
# dispose lines like 1:64228842,2:21250152
splitContainColon true
# dispose lines like 990:1,vid:7413088259427309444}
splitContainRightBracket true
# can be csv or zjxl
fileType zjxl

# TDengine Connection Configuration
user root
password taosdata
host 192.168.0.1

# Log Configuration Items
logdbRecord true
logdbName log
logdbCache 2048
logdbAblocks 2
logdbTblocks 50
logdbTables 20
logdbRows 4096
logdbKeep 3650
logdbDays 10
logdbReplica 1
logdbTablePrefix txt

# Target database configuration items
datadbName db
datadbCache 16384
datadbAblocks 2
datadbTblocks 100
datadbTables 20000
datadbRows 10000
datadbKeep 3650
datadbDays 10
datadbReplica 1
datadbMicroSecond true

# stable configuration items
stableName st

# table configuration items
# tableNameColumn : aggregate multiple column into one column as table name, such as $0$1$2, also can be fileName
# tableRadix : use this value to aggregate multiple sensors into one table (treat tablename as integer)
tableNameColumn $2
tableFieldSize 21
tableTagSize 5
tablePrefix h
tableRadix 0
tableNameMd5 false
tableIgnoreFrontNum 0

# fields configuration can be found here
# 1.column: aggregate multiple columns into one column, such as $0$1$2, also can be tableName or fileName
# 2.name : the name of table field
# 3.type: the type of table field
fieldColumn $10 ts            timestamp
fieldColumn $5  ftype         tinyint
fieldColumn $6  fret          tinyint
fieldColumn $7  f1            int
fieldColumn $8  f2            int
fieldColumn $9  f3            smallint
# fieldColumn $10 f4            timestamp
fieldColumn $11 f5            smallint
fieldColumn $12 f6            int
fieldColumn $13 f7            smallint
fieldColumn $14 f8            int
fieldColumn $15 f9            int
fieldColumn $16 f20           int
fieldColumn $17 f24           int
fieldColumn $18 f500          int
fieldColumn $19 f519          int
fieldColumn $20 f700          tinyint
fieldColumn $21 f701          int
fieldColumn $22 f702          tinyint
fieldColumn $23 f703          tinyint
fieldColumn $24 f990          tinyint
fieldColumn $27 f999          int

# tags configuration can be found here
# 1.column : aggregate multiple columns into one column, such as $0$1$2, also can be tableName or fileName
# 2.name : the name of table tag
# 3.type : the type of table tag
tagColumn $29 vid            binary(30)
tagColumn $3  tareacode      int 
tagColumn $25 t104           nchar(10)
tagColumn $26 t202           smallint
tagColumn $28 t1000          int



