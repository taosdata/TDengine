spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.driver-class-name=com.taosdata.jdbc.TSDBDriver
spring.datasource.hikari.jdbc-url=jdbc:TAOS://127.0.0.1:0/db?user=root&password=taosdata
spring.datasource.hikari.username=root
spring.datasource.hikari.password=taosdata
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-test-query=show dnodes
spring.datasource.hikari.auto-commit=true