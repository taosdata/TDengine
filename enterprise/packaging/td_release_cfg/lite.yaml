name: Release TDengine Lite package
type: feature

prepareActions:
  enable: false
  actions: 
    - pullTDinternal:
        - python3
        - new_release/pullRepo.py
        - --repo taosdata/TDinternal
        - --target main
        - --path .
    - pullTDengine:
        - python3
        - new_release/pullRepo.py
        - --repo taosdata/TDengine
        - --path ../../community
        # - --target 373c128a7add2132e7b253ad71932c91f86548f6
        - --target main

postActions:
  enable: false
  actions:
    - postTo131:
        - scp ../../community/release/* root@192.168.1.131:/nas/TDengine/v3.0.3.0
    - pushDocker: 
        - ./dockerManifest.sh 
        - -n 3.9.9.9 
        - -p tbase125! 
        - -V stable 
        - -a y
    - pushApt:
        - ./new_release/pushAptRepo.sh -b 3.0 -c x64 -n 3.9.9.9 
        - ./new_release/pushAptRepo.sh -b develop -c x64 -n 3.9.9.9
    - pushWebsite:
        - ./new_release/upload-pkg.sh 3.0.1.2
    - updatePHP:
        - ./uploadPhp.sh
    - prVersionUpdate:
        - bash updateVersion.sh --branch 3.0 --version 3.0.3.0 


parameters:
  verMode: edge
  pagMode: lite
  dockerMode: "no" # push|latest|no
  dockerProject: "tdengine"

  buildOptions:
    OSTYPE: Linux
    CPUTYPE: x64
    WEBSOCKET: false
    SOMODE: dynamic
    DBNAME: taos
    VERTYPE: stable
    VERDATE: true
    GITINFO: community/$(git rev-parse --verify HEAD)
    GITINFOI: NULL
    VERNUMBER: 3.0.3.0
    VERCOMPATIBLE: 3.0.0.0
    PAGMODE: lite
    BUILD_HTTP: true
    BUILD_TOOLS: false
    BUILD_EXPLORER: false
    CUS_NAME: TDengine
    CUS_PROMPT: taos
    CUS_EMAIL: support@taosdata.com
  
  OEMFLAG:
   enable: 
       false
   CUS_NAME:
       PowerDB 
   CUS_PROMPT:
       power
   CUS_EMAIL: 
       suppoert@power.com

  allBins:
  - &remove communityScriptDir/remove.sh
  - &set_core communityScriptDir/set_core.sh
  - &startPre communityScriptDir/startPre.sh
  - &clientName buildDir/bin/taos
  - &taosadapter buildDir/bin/taosadapter
  - &serverName buildDir/bin/taosd
  - &taosd-dump-cfg communityScriptDir/taosd-dump-cfg.gdb
  - &taos-explorer buildDir/bin/taos-explorer
  - &taoskeeper releaseDir/build-taoskeeper/taoskeeper
  - &udfd buildDir/bin/udfd
  - &get_client  communityScriptDir/get_client.sh
  - &remove_client communityScriptDir/remove_client.sh
  - &install_client communityScriptDir/install_client.sh
  - &install_server communityScriptDir/install.sh

  taosxBins:
  - &taosx buildDir/bin/taosx
  taosToolsBins:
  - &taosdump buildDir/bin/taosdump
  - &taosBenchmark buildDir/bin/taosBenchmark
  - &tdengine-datasource_zip buildDir/bin/tdengine-datasource.zip
  - &tdengine-datasource_zip_md5sum buildDir/bin/tdengine-datasource.zip.md5sum
  - &TDinsight buildDir/bin/TDinsight.sh
  libs:
    - &libtaos  buildDir/lib/libtaos.so.
    - &libtaows buildDir/lib/libtaosws.so
  configs:
    - &keeper releaseDir/build-taoskeeper/config/taoskeeper.toml
    - &keeper_serice releaseDir/build-taoskeeper/taoskeeper.service
    - &taosadapter_service compileDir/test/cfg/taosadapter.service
    - &taosAdapter compileDir/test/cfg/taosadapter.toml
    - &taos_cfg communityCfgDir/taos.cfg
    - &taos_service communityCfgDir/taosd.service
    - &nginxd_service communityCfgDir/nginxd.service
  headers:
    - &taos_h communityDir/include/client/taos.h
    - &taosdef_h communityDir/include/common/taosdef.h
    - &taoserror_h communityDir/include/util/taoserror.h
    - &taosudf_h communityDir/include/libs/function/taosudf.h
    - &taosws_h buildDir/include/taosws.h
  init.d:
    - &rpm_server communityDir/packaging/rpm/taosd
    - &deb_server communityDir/packaging/deb/taosd

  TDenginePackages:
    enable: true
    tar.gz: 
      enable: true
      server: 
        enable: true
        component:
          package.tar.gz:
            bin:
              - *remove
              - *serverName
              - *clientName
              - *set_core
            cfg:
              - *taos_cfg
              - *taos_service
            inc:
              - *taos_h
              - *taosdef_h
              - *taoserror_h
              - *taosudf_h
            init.d:
              - *rpm_server
              - *deb_server 
          driver:
            - *libtaos
            - vercomp.txt
          examples:
            - c
          install.sh: *install_server

      client: 
        enable: true
        component:
          package.tar.gz:
            bin:
              - *clientName
              - *remove_client
            cfg:
              - *taos_cfg
            inc:
              - *taos_h
              - *taosdef_h
              - *taoserror_h
              - *taosudf_h
          driver:
            - *libtaos
            - vercomp.txt
          examples:
            - c
          install_client.sh: *install_client
