<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="">
	<meta name="author" content="">
	<title>TDengine</title>
	<link rel="icon" href="images/db.png">
	<link type="text/css" href="bootstrap-3.3.7-dist/css/bootstrap.min.css" rel="stylesheet">
	<link type="text/css" href="css/login.css" rel="stylesheet">	
	<script type="text/javascript" src="js/dbSession.js"></script>
	<script type="text/javascript" src="js/dbCache.js"></script>
	<script type="text/javascript" src="js/dbUtil.js"></script>
	<script type="text/javascript" src="js/dbBase64.js"></script>
</head>
<body onload="dbOnLoad()">
	<div class="container">
		<div class="form-signin "style="max-width: 378px;">
			<h2 class="form-signin-heading">TDengine Management</h2>
			<label for="inputUser" class="sr-only">User Name</label>
			<input type="name" id="inputUser" class="form-control" placeholder="User name" autofocus>
			<label for="inputPassword" class="sr-only">Password</label>
			<input type="password" id="inputPassword" class="form-control" placeholder="Password">
			<button class="btn btn-lg btn-primary btn-block" onclick="dbLogin()">Login</button>
		</div>
	</div> 
	
	<div class="modal" id="infoDialog" tabindex="-1" role="dialog" aria-labelledby="infoModalLabel" aria-hidden="true">
		<div class="modal-dialog" style="width: 350px;">
			<div class="modal-content">
				<div class="modal-header">
					<!-- <button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button> -->
					<h4 class="modal-title" id="infoType"></h4>
				</div>
				<div class="modal-body">
					<p id="infoContent"></p> 
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
				</div>
			</div>
		</div>
	</div>
	
	<script type="text/javascript">
	
	function dbOnLoad() {
		DbSession.Clear();
	}
	
	var username;
	var password;
	
	function dbLogin() {
		username = $.trim($('#inputUser').val());
		password = $.trim($('#inputPassword').val());
		if (username == null || password == null || username == "" || password == "") {
			return DbUtil.Error(DB_CODE_NULL_USER_OR_PWD);
		}
		
		$.ajax({
			type: "post",
			//url: "admin/login/" + username + "/" + password,
			url: "admin/login",
			headers: {
				'Authorization' : "Basic " + DbBase64.encode(username + ":" + password)
			},
			dataType: "json",
			success: dbLoginCb,
			error: function(msg) { 
				if (msg != null && msg.responseJSON != null) {
					dbLoginCb(msg.responseJSON);
				}
				else {
					DbUtil.ErrorWithMsg(DB_CODE_SERVER_NULL, msg);
				}
			}		
		});		
	}
	
	function dbLoginCb(d)
	{
		if (d == null || d.status == null) {
			DbUtil.Error(DB_CODE_INVALID_FORMAT);
			return;
		} 
		if (d.status == "error") {
			DbUtil.ErrorDialog(d.desc);
		}
		else if (d.status == "succ") {
			DbSession.SetToken(d.desc);
			DbSession.SetUser(username);
			var date = new Date();
			DbSession.SetDate(date.toLocaleString());
			DbUtil.GotoPage("home.html");
		}	
		else{
			DbUtil.Error(DB_CODE_INVALID_FORMAT);
		}
	}
	
	</script>
	
	<!-- Bootstrap core JavaScript
	================================================== -->
	<!-- Placed at the end of the document so the pages load faster -->
	<script type="text/javascript" src="js/jquery-2.0.2.min.js"></script>
	<script type="text/javascript" src="bootstrap-3.3.7-dist/js/bootstrap.min.js"></script>
</body>
</html>
