	<script type="text/javascript">
	function dbOnLoad()
	{
		DbSession.ValidSession();
	}
	
	function dbCreateDatabase()
	{
		var dbName = $.trim($("#dbname").val());
		if (!DbUtil.CheckName(dbName, "Database Name"))
		{
			return;
		}
		
		var replica = $.trim($("#replica").val());
		var days = $.trim($("#days").val());
		var keep = $.trim($("#keep").val());
		var sql = "create database " + dbName;
		if (replica != null && replica != "") {
			sql = sql + " replica " + replica;
		}
		if (days != null && days != "") {
			sql = sql + " days " + days;
		}
		if (keep != null && keep != "") {
			sql = sql + " keep " + keep;
		}
		
		$.ajax({
			type: "post",
			url: "admin/sql",
			headers: {
				'Authorization' : "Taosd " + DbSession.GetToken()
			},
			data: sql,
			dataType: "json",
			success: dbCreateDatabaseCb,
			error: function(msg) { 
				if (msg != null && msg.responseJSON != null) {
					dbCreateDatabaseCb(msg.responseJSON);
				}
				else {
					DbUtil.ErrorWithMsg(DB_CODE_SERVER_NULL, msg);
				}
			}		
		});		
	}
	
	function dbCreateDatabaseCb(d)
	{
		if (d == null || d.status == null) {
			DbUtil.Error(DB_CODE_INVALID_FORMAT);
			return;
		} 
		if (d.status == "error") {
			DbUtil.HandleError(d);
		}
		else if (d.status == "succ") {
			if (d.affect_rows == 0) {
				DbUtil.Error(DB_CODE_EXEC_ERROR);
			}
			else {
				DbUtil.GotoPage("dbs.html");
			}
		}	
		else{
			DbUtil.Error(DB_CODE_UNKNOWN);
		}
	}
	
	function dbGotoDatabase()
	{
		DbSession.SetCacheFlag();
		DbUtil.GotoPage("dbs.html");
	}
	
	</script>
