
user root;
worker_processes  1;

error_log /usr/local/nginxd/logs/error.log warn;
events {
    worker_connections 1024;
}
http {
    log_format timed_combined '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        '$request_time $upstream_response_time $pipe';
    access_log /usr/local/nginxd/logs/access.log timed_combined;

  
    server {
        listen              0.0.0.0:6060;
        include             mime.types;
        default_type        application/octet-stream;
        sendfile            on;
        keepalive_timeout   65;

        location / {
            root   /usr/local/nginxd/admin;
            index  login.html;
        }
        location /admin/ {
            proxy_pass    http://127.0.0.1:6020/admin/;
            proxy_redirect default ;
        }
        location /rest/ {
            proxy_pass    http://127.0.0.1:6020/rest/;
            proxy_redirect default ;
        }
        location /gc/ {
            proxy_pass    http://127.0.0.1:6020/gc/;
            proxy_redirect default ;
        }
    }
}

