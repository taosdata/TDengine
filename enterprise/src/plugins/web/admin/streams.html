	<script type="text/javascript">
	
	var dbStreamIdArray = [];
	
	function dbOnLoad()
	{
		DbSession.ValidSession();
		DbCache.Clear();
		DbCache.Init(null, dbFillTableBody);
		dbQuery();
	}
	
	function dbQuery() {
		$.ajax({
			type: "post",
			url: "admin/sql",
			headers: {
				'Authorization' : "Taosd " + DbSession.GetToken()
			},
			data: "show streams",
			dataType: "json",
			success: dbQueryCb,
			error: function(msg) { 
				if (msg != null && msg.responseJSON != null) {
					dbQueryCb(msg.responseJSON);
				} else if (msg != null) {
					DbUtil.ErrorWithMsg(DB_CODE_INVALID_FORMAT, msg);
				} else {
					DbUtil.ErrorWithMsg(DB_CODE_SERVER_NULL, msg);
				}
			}		
		});	
	}
	
	function dbQueryCb(d)
	{
		if (d == null || d.status == null) {
			DbUtil.Error(DB_CODE_INVALID_FORMAT);
			return;
		} 
		if (d.status == "error") {
			DbUtil.HandleError(d);
		}
		else if (d.status == "succ") {
			DbCache.OnData(d);
		}	
		else{
			DbUtil.Error(DB_CODE_UNKNOWN);
		}
	}
	
	function dbFillTableBody(d)
	{
		var rowNum = d.data.length;
		var rowBegin = "<tr>";
		var rowEnd = "</tr>";
		var colNum = d.head.length;		
		var colBegin = "<td>";
		var colEnd = "</td>";
		
		var oper1Begin = '<a class="dboper" onclick="dbKill(\'';
		var oper1End = '\')">Kill Stream</a>';
		
		var oper2 = '<a class="dboper">Already Killed</a>';
		
		var rowIndex = 0;
		var bodyContent = "";
		for (rowIndex = 0; rowIndex < rowNum; ++rowIndex) {
			var row = rowBegin + colBegin + DbCache.GetRowIndex(rowIndex) + colEnd;
			var data = d.data[rowIndex]; 	
			for (colIndex = 0; colIndex < colNum; colIndex++) {
				row = row + colBegin + data[colIndex] + colEnd;
			}
			
			var id = data[0];
			if (dbStreamIdArray[id] == true) {
				row = row + colBegin + oper2 + colEnd + rowEnd;	
			}
			else {
				var oper = oper1Begin + data[0] + oper1End;
				row = row + colBegin + oper + colEnd + rowEnd;	
			}
			
			bodyContent += row;
		}
		for (; rowIndex < DbCache.RowsPerPage(); ++rowIndex) {
			var row = rowBegin + colBegin + '-' + colEnd;
			for (colIndex = 0; colIndex < colNum; colIndex++) {
				row = row + colBegin + colEnd;
			}
			
			row = row + colBegin + colEnd + rowEnd;	
			bodyContent += row;
		}
		
		$('#dbTableBody').html(bodyContent);
	}	
	
	//while push delete button
	var dbQueryId = "";
	function dbKill(id)
	{		
		dbQueryId = id;
		DbUtil.ConfirmDialog(DB_CODE_CONFIRM, "kill stream: " + dbQueryId);
	}
	
	//while confirm kill
	function dbExecuteKill()
	{
		$.ajax({
			type: "post",
			url: "admin/sql",
			headers: {
				'Authorization' : "Taosd " + DbSession.GetToken()
			},
			data: "kill stream " + dbQueryId,
			dataType: "json",
			success: dbExecuteKillCb,
			error: function(msg) { 
				if (msg != null && msg.responseJSON != null) {
					dbExecuteKillCb(msg.responseJSON);
				} else if (msg != null) {
					DbUtil.ErrorWithMsg(DB_CODE_INVALID_FORMAT, msg);
				} else {
					DbUtil.ErrorWithMsg(DB_CODE_SERVER_NULL, msg);
				}
			}		
		});		
	}
	
	function dbExecuteKillCb(d)
	{
		if (d == null || d.status == null) {
			DbUtil.Error(DB_CODE_INVALID_FORMAT);
			return;
		} 
		if (d.status == "error") {
			DbUtil.HandleError(d);
		}
		else if (d.status == "succ") {
			dbStreamIdArray[dbQueryId] = true;
			DbCache.Refresh();
		}	
		else{
			DbUtil.Error(DB_CODE_UNKNOWN);
		}
	}
	
	function dbGotoQuery()
	{
		DbUtil.GotoPage("query.html");
	}
	
	function dbGotoStream()
	{
		DbUtil.GotoPage("streams.html");
	}
	
	function dbGotoConn()
	{
		DbUtil.GotoPage("conns.html");
	}
	
	</script>
