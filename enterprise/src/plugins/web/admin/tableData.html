	<script type="text/javascript">

	var dbTableName = "";
	var dbTableFirstCol = "";
	function dbOnLoad()
	{
		DbSession.ValidSession();
		DbCache.Clear();
		DbCache.Init(dbFillTableHead, dbFillTableBody);
		
		dbTableName = DbUtil.GetUrlFirstPara();
		if (dbTableName == null || dbTableName == "") {
			DbUtil.Error(DB_CODE_TABLE_NAME_NULL);
			return;
		}
		dbShowTableName(dbTableName);
		
		dbQuery("sql");
	}
	
	//file the head of dbTableHead
	function dbFillTableHead(data)
	{
		var rowBegin = "<tr>";
		var rowEnd = "</tr>";
		var colNum = data.head.length;		
		var colBegin = "<th style='font-weight: normal'>";
		var colEnd = "</th>";
		
		row = rowBegin + colBegin + "No" + colEnd;
		for (colIndex = 0; colIndex < colNum; colIndex++) {
			if (colIndex == 0) {
				dbTableFirstCol = data.head[colIndex];
			}
			row = row + colBegin + data.head[colIndex] + colEnd;
		}
		row = row + rowEnd;
		
		$('#dbTableHead').html(row);
	}
	
	//file the body of dbTableBody
	function dbFillTableBody(d)
	{
		var rowNum = d.data.length;
		var rowBegin = "<tr>";
		var rowEnd = "</tr>";
		var colNum = d.head.length;		
		var colBegin = "<td>";
		var colEnd = "</td>";
		
		var rowIndex = 0;
		var bodyContent = "";
		for (rowIndex = 0; rowIndex < rowNum; ++rowIndex) {
			var row = rowBegin + colBegin + DbCache.GetRowIndex(rowIndex) + colEnd;
			var data = d.data[rowIndex]; 	
			for (colIndex = 0; colIndex < colNum; colIndex++) {
				row = row + colBegin + data[colIndex] + colEnd;
			}
			bodyContent += row;
		}
		for (; rowIndex < DbCache.RowsPerPage(); ++rowIndex) {
			var row = rowBegin + colBegin + '-' + colEnd;
			for (colIndex = 0; colIndex < colNum; colIndex++) {
				row = row + colBegin + colEnd;
			}
			bodyContent += row;
		}
		
		$('#dbTableBody').html(bodyContent);
	}
	
	function dbFilter()
	{
		DbCache.Clear();
		dbQuery("sql");
	}
	
	function dbQuery(path)
	{
		var sql = "select * from " + DbSession.GetDb() + "." + dbTableName;
		
		if (dbTableFirstCol != "") {
			var begin = $.trim($('#dbBeginTime').val());
			var end = $.trim($('#dbEndTime').val());
			
			if (begin != "" && end != ""){
				sql = sql + " where " + dbTableFirstCol + " >= '" + begin + "' and " + dbTableFirstCol + " <= '" + end + "'";
			}
			else if (begin != "") {
				sql = sql + " where " + dbTableFirstCol + " >= '" + begin + "'";
			}
			else if  (end != "") {
				sql = sql + " where " + dbTableFirstCol + " <= '" + end + "'";
			}
			else {}
		}
		
		if (path == "sql") {
			DbCache.Clear();
		}

		$.ajax({
			type: "post",
			url: "admin/" + path,
			headers: {
				'Authorization' : "Taosd " + DbSession.GetToken()
			},
			data: sql,
			dataType: "json",
			success: dbQueryCb,
			error: function(msg) { 
				if (msg != null && msg.responseJSON != null) {
					dbQueryCb(msg.responseJSON);
				} else if (msg != null) {
					DbUtil.ErrorWithMsg(DB_CODE_INVALID_FORMAT, msg);
				} else {
					DbUtil.ErrorWithMsg(DB_CODE_SERVER_NULL, msg);
				}
			}		
		});	
	}
	
	function dbQueryCb(d) {
		if (d == null || d.status == null) {
			DbUtil.Error(DB_CODE_INVALID_FORMAT);
			return;
		} 
		if (d.status == "error") {
			DbUtil.HandleError(d);
		}
		else if (d.status == "succ") {
			DbCache.OnData(d);
		}	
		else{
			DbUtil.Error(DB_CODE_UNKNOWN);
		}
	}
			
	function dbShowTableName()
	{
		var db = DbSession.GetDb();
		$('#dbTableName').html("<a href='#' onclick='dbGotoDatabase()'>DB</a>: " + db + "/<a href='#' onclick='dbGotoTable()'>Table</a>: " + dbTableName + "/<a href='#' onclick='dbGotoTableInfo()'>Info</a>/Data");
	}
	
	function dbGotoDatabase()
	{
		DbSession.SetCacheFlag();
		DbUtil.GotoPage("dbs.html");
	}
	
	function dbGotoTable()
	{
		DbSession.SetCacheFlag();
		DbUtil.GotoPage("tables.html");
	}
	
	function dbGotoTableInfo()
	{
		DbUtil.GotoPage("tableInfo.html?table=" + dbTableName);
	}
	
	</script>
