	<script type="text/javascript">
	
	dbDnodeIp = "";

	function dbOnLoad()
	{
		DbSession.ValidSession();
		DbCache.Clear();
		DbCache.Init(null, dbFillTableBody);
		dbDnodeIp = DbUtil.GetUrlFirstPara();
		dbQuery();
	}
	
	function dbGetLevelStr(level)
	{
		switch (level) {
		case 0: return "Info";
		case 1: return "Warning";
		case 2: return "Error";
		}
		return "Undefine";
	}
	
	function dbOnData(d)
	{
		for (i = 0; i < d.data.length; ++i) {
			d.data[i][1] = dbGetLevelStr(d.data[i][1]);
		}
		DbCache.OnData(d);
	}

	function dbFilter()
	{
		DbCache.Clear();
		dbQuery();
	}

	function dbQuery() {
		var sql = "select * from log.log";
		
		var begin = $.trim($('#dbBeginTime').val());
		var end = $.trim($('#dbEndTime').val());
		var infoLevel = $.trim($('#dbInfoLevel').val())
		var keywords = $.trim($('#dbKeyWords').val())
		var ipaddr = $.trim($('#dbIpAddr').val())
			
		if (begin != "" && end != ""){
			sql = sql + " where ts >= '" + begin + "' and ts <= '" + end + "'";
		}
		else if (begin != "") {
			sql = sql + " where ts >= '" + begin + "'";
		}
		else if  (end != "") {
			sql = sql + " where ts <= '" + end + "'";
		}
		else {
			sql = sql + " where ts > 0"
		}

		if (infoLevel != "") {
			sql = sql + " and level = " + infoLevel;
		}
		if (keywords != "") {
			sql = sql + " and content like '%" + keywords +"%'";
		}
		if (ipaddr != "") {
			sql = sql + " and ipaddr ='" + ipaddr +"'";
		}

		$.ajax({
			type: "post",
			url: "admin/sql",
			headers: {
				'Authorization' : "Taosd " + DbSession.GetToken()
			},
			data: sql,
			dataType: "json",
			success: dbQueryCb,
			error: function(msg) { 
				if (msg != null && msg.responseJSON != null) {
					dbQueryCb(msg.responseJSON);
				} else if (msg != null) {
					DbUtil.ErrorWithMsg(DB_CODE_INVALID_FORMAT, msg);
				} else {
					DbUtil.ErrorWithMsg(DB_CODE_SERVER_NULL, msg);
				}
			}		
		});	
	}
	
	function dbQueryCb(d)
	{
		if (d == null || d.status == null) {
			DbUtil.Error(DB_CODE_INVALID_FORMAT);
			return;
		} 
		if (d.status == "error") {
			DbUtil.HandleError(d);
		}
		else if (d.status == "succ") {
			dbOnData(d);
		}	
		else{
			DbUtil.Error(DB_CODE_UNKNOWN);
		}
	}
	
	function dbFillTableBody(d)
	{
		var rowNum = d.data.length;
		var rowBegin = "<tr>";
		var rowEnd = "</tr>";
		var colNum = d.head.length;		
		var colBegin = "<td>";
		var colEnd = "</td>";
		
		var rowIndex = 0;
		var bodyContent = "";
		for (rowIndex = 0; rowIndex < rowNum; ++rowIndex) {
			var row = rowBegin + colBegin + DbCache.GetRowIndex(rowIndex) + colEnd;
			var data = d.data[rowIndex]; 	
			for (colIndex = 0; colIndex < colNum; colIndex++) {
				row = row + colBegin + data[colIndex] + colEnd;
			}
			bodyContent += row;
		}
		for (; rowIndex < DbCache.RowsPerPage(); ++rowIndex) {
			var row = rowBegin + colBegin + '-' + colEnd;
			for (colIndex = 0; colIndex < colNum; colIndex++) {
				row = row + colBegin + colEnd;
			}
			
			bodyContent += row;
		}
		
		$('#dbTableBody').html(bodyContent);
	}	
	
	function dbGotoMonitor()
	{
		DbUtil.GotoPage("monitor.html?dnode=" + dbDnodeIp);
	}
	
	function dbGotoSlowQuery()
	{
		DbUtil.GotoPage("slowquery.html?dnode=" + dbDnodeIp);
	}
	
	function dbGotoLog()
	{
		DbUtil.GotoPage("log.html?dnode=" + dbDnodeIp);
	}
	
	</script>
