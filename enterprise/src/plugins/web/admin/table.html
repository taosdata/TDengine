	<script type="text/javascript">
	function dbOnLoad()
	{
		DbSession.ValidSession();
		var dbSTableName = DbUtil.GetUrlFirstPara();
		if (dbSTableName != null && dbSTableName != "") {
			$('#isUScheckbox').attr("checked", "checked");
			$('#stableSelect').removeAttr("disabled");

		}

	var dbColumnIndex = -1;
	var dbColumnTypes = [];
	var dbColumnNames = [];
	var dbColumnLengths = [];
	var dbTableName = "";
	var dbTableFirstKey = "";
	var dbTagIndex = -1;
	var dbTagTypes = [];
	var dbTagNames = [];
	var dbTagLengths = [];

	var dbTagTitles = [];

	/**
	 * read all value of ctrls
	 * for add/delete ctrls
	 */
	function dbFetchCtrlValue()
	{
		dbTableName = $.trim($('#dbTableName').val());
		dbTableFirstKey = $.trim($('#dbTimestampColumn').val());
		
		dbColumnTypes.length = 0;
		dbColumnNames.length = 0;
		dbColumnLengths.length = 0;
		for (var i = 0; i <= dbColumnIndex; ++i) {
			dbColumnTypes[i] = $.trim($('#dbGroupType' + i).text());
			dbColumnNames[i] = $.trim($('#dbGroupName' + i).val());
			dbColumnLengths[i] = 0;
			if (dbColumnTypes[i] == "binary") {
				var name = dbColumnNames[i];
				dbColumnNames[i] = dbGetBinaryName(name);
				dbColumnLengths[i] = dbGetBinaryLength(name);
			}
		}

		dbTagTypes.length = 0;
		dbTagNames.length = 0;
		dbTagLengths.length = 0;
		for (var i = 0; i <= dbTagIndex; ++i) {
			dbTagTypes[i] = $.trim($('#dbGroupType_' + i).text());
			dbTagNames[i] = $.trim($('#dbGroupName_' + i).val());
			dbTagLengths[i] = 0;
			if (dbTagTypes[i] == "binary") {
				var name = dbTagNames[i];
				dbTagNames[i] = dbGetBinaryName(name);
				dbTagLengths[i] = dbGetBinaryLength(name);
			}
		}

	}

	/**
	 * split name like (12), and get the value of 12
	 */
	function dbGetBinaryLength(name)
	{
		var left = name.indexOf("(");
		var right = name.indexOf(")");
		if (left == -1 || right == -1){
			return 0;
		}
		
		strs = name.split("(");   
		if (strs.length != 2) {
			return 0;
		}
		
		rightName = strs[1];
		rightNameStrs = rightName.split(")");   
		if (rightNameStrs.length != 2) {
			return 0;
		}
		
		var length = rightNameStrs[0] * 1;
		if (length <= 0 || length > 500) {
			length = 10;
		}
		return length;
	}

	/**
	 * split name like abc(12), and get the value of abc
	 */
	function dbGetBinaryName(name)
	{
		var left = name.indexOf("(");
		var right = name.indexOf(")");
		if (left == -1 || right == -1){
			return name;
		}
		
		strs = name.split("(");   
		if (strs.length != 2) {
			return name;
		}
		
		return strs[0];
	}

	/**
	 * reset all value of ctrls from exist cache
	 * for add/delete ctrls
	 * @index skip this columns
	 */
	function dbResetCtrlValue(index)
	{
		for (var i = 0; i <= dbColumnIndex; ++i) {
			var columnType = dbColumnTypes[i];
			var columnName = dbColumnNames[i];
			var columnLength = dbColumnLengths[i];
			if (columnType == "binary" && columnLength != 0) {
				columnName = columnName + "(" + columnLength + ")";
			}
			
			$('#dbGroupType' + i).text(columnType);
			$('#dbGroupName' + i).val(columnName);
		}
	}

	/**
	* Add one column then re-arrayge the input datas
	* @index the index of current column
	*/ 
	function dbAddColumn(index)
	{
		if (dbColumnIndex >= 30) {
			return DbUtil.Error(DB_CODE_TABLE_MAX_COLUMNS);
		}
		
		dbFetchCtrlValue();

		var i = 0;
		for (i = dbColumnIndex + 1; i > index + 1; --i) {
			dbColumnTypes[i] = dbColumnTypes[i-1];
			dbColumnNames[i] = dbColumnNames[i-1];
			dbColumnLengths[i] = dbColumnLengths[i-1];
		}
		dbColumnTypes[i] = "Data Type";
		dbColumnNames[i] = "";
		dbColumnLengths[i] = 0;
			
		dbColumnIndex++;
		var html = '<div id="dbGroup' + dbColumnIndex + '" class="input-group input-group-sm"  style="width:300px">'
			+ '<div class="input-group-btn" >'
			+ '	<button type="button" class="btn btn-default dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" style="width:120px" aria-expanded="false"><span id="dbGroupType' + dbColumnIndex + '">Data Type</span> <span class="caret"></span></button>'
			+ '	<ul class="dropdown-menu dropdown-menu-right" style="width:30px">'
			+ '		<li><a onclick="dbSetColumnType(' + dbColumnIndex + ', \'bool\')">bool</a></li>'
			+ '		<li><a onclick="dbSetColumnType(' + dbColumnIndex + ', \'tinyint\')">tinyint</a></li>'
			+ '		<li><a onclick="dbSetColumnType(' + dbColumnIndex + ', \'smallint\')">smallint</a></li>'
			+ '		<li><a onclick="dbSetColumnType(' + dbColumnIndex + ', \'int\')">int</a></li>'
			+ '		<li><a onclick="dbSetColumnType(' + dbColumnIndex + ', \'bigint\')">bigint</a></li>'
			+ '		<li><a onclick="dbSetColumnType(' + dbColumnIndex + ', \'float\')">float</a></li>'
			+ '		<li><a onclick="dbSetColumnType(' + dbColumnIndex + ', \'double\')">double</a></li>'
			+ '		<li><a onclick="dbSetColumnType(' + dbColumnIndex + ', \'binary\')">binary</a></li>'
			+ '		<li><a onclick="dbSetColumnType(' + dbColumnIndex + ', \'timestamp\')">timestamp</a></li>'
			+ '	</ul>'
			+ '</div>'
			+ '<input id="dbGroupName' + dbColumnIndex + '" type="text" class="form-control"  placeholder="column name" aria-label="...">'
			+ '<span class="input-group-btn">'
			+ '	<button class="btn btn-default " type="button" onclick="dbRemoveColumn(' + dbColumnIndex + ')">-</button>'
			+ '	<button class="btn btn-default " type="button" onclick="dbAddColumn(' + dbColumnIndex + ')">+</button>'+ '</span>'
			+ '</div>'
			+ '<br id="dbGroupBr' + dbColumnIndex + '">';
		
		$('#dbFrom1').append(html);
		dbResetCtrlValue();
	}

	function dbSetColumn(name, type, colLength){
		dbColumnIndex++;
		dbColumnTypes[dbColumnIndex] = type;
		dbColumnNames[dbColumnIndex] = name;
		dbColumnLengths[dbColumnIndex] = colLength;
			
		var html = '<div id="dbGroup' + dbColumnIndex + '" class="input-group input-group-sm"  style="width:300px">'
			+ '<div class="input-group-btn" >'
			+ '	<button disabled type="button" class="btn btn-default dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" style="width:120px" aria-expanded="false"><span id="dbGroupType' + dbColumnIndex + '">' + type + '</span> <span class="caret"></span></button>'
			+ '	<ul class="dropdown-menu dropdown-menu-right" style="width:30px">'
			+ '		<li><a onclick="dbSetColumnType(' + dbColumnIndex + ', \'bool\')">bool</a></li>'
			+ '		<li><a onclick="dbSetColumnType(' + dbColumnIndex + ', \'tinyint\')">tinyint</a></li>'
			+ '		<li><a onclick="dbSetColumnType(' + dbColumnIndex + ', \'smallint\')">smallint</a></li>'
			+ '		<li><a onclick="dbSetColumnType(' + dbColumnIndex + ', \'int\')">int</a></li>'
			+ '		<li><a onclick="dbSetColumnType(' + dbColumnIndex + ', \'bigint\')">bigint</a></li>'
			+ '		<li><a onclick="dbSetColumnType(' + dbColumnIndex + ', \'float\')">float</a></li>'
			+ '		<li><a onclick="dbSetColumnType(' + dbColumnIndex + ', \'double\')">double</a></li>'
			+ '		<li><a onclick="dbSetColumnType(' + dbColumnIndex + ', \'binary\')">binary</a></li>'
			+ '		<li><a onclick="dbSetColumnType(' + dbColumnIndex + ', \'timestamp\')">timestamp</a></li>'
			+ '	</ul>'
			+ '</div>'
			+ '<input disabled id="dbGroupName' + dbColumnIndex + '" type="text" class="form-control" value="'+ name +'"  placeholder="column name" aria-label="...">'
			+ '<span class="input-group-btn">'
			+ '	<button class="btn btn-default " type="button" disabled onclick="dbRemoveColumn(' + dbColumnIndex + ')">-</button>'
			+ '	<button class="btn btn-default " type="button" disabled onclick="dbAddColumn(' + dbColumnIndex + ')">+</button>'+ '</span>'
			+ '</div>'
			+ '<br id="dbGroupBr' + dbColumnIndex + '">';
		
		$('#dbFrom1').append(html);
	}
	
	function dbSetTag(name, type, colLength){
		dbTagIndex++;
		dbTagTypes[dbTagIndex] = type;
		dbTagNames[dbTagIndex] = "";
		dbTagLengths[dbTagIndex] = colLength;

		dbTagTitles[dbTagIndex] = name;
		
		var html = '<div id="dbGroup' + dbTagIndex + '" class="input-group input-group-sm"  style="width:300px">'
			+ '<div class="input-group-btn" >'
			+ '	<button disabled type="button" class="btn btn-default dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" style="width:120px" aria-expanded="false"><span id="dbGroupType_' + dbTagIndex + '">' + type + '</span> <span class="caret"></span></button>'
			+ '	<ul class="dropdown-menu dropdown-menu-right" style="width:30px">'
			+ '	</ul>'
			+ '</div>'
			+ '<input id="dbGroupName_' + dbTagIndex + '" type="text" class="form-control" placeholder="'+ name +'" aria-label="...">'
			+ '<span class="input-group-btn">'
			+ '	<button class="btn btn-default " type="button" disabled onclick="dbRemoveColumn(' + dbTagIndex + ')">-</button>'
			+ '	<button class="btn btn-default " type="button" disabled onclick="dbAddColumn(' + dbTagIndex + ')">+</button>'+ '</span>'
			+ '</div>'
			+ '<br id="dbGroupBr' + dbTagIndex + '">';
		
		$('#dbFrom2').append(html);
	}

	/**
	* Remove current column
	* @index the index of current column
	*/ 
	function dbRemoveColumn(index)
	{
		if (dbColumnIndex <= 0 ) {
			return DbUtil.Error(DB_CODE_TABLE_MIN_COLUMNS);
		}
		
		dbFetchCtrlValue();
		for (i = index; i < dbColumnIndex; ++i) {
			dbColumnTypes[i] = dbColumnTypes[i+1];
			dbColumnNames[i] = dbColumnNames[i+1];
			dbColumnLengths[i] = dbColumnLengths[i+1];
		}
		dbColumnTypes.length = dbColumnTypes.length - 1;
		dbColumnNames.length = dbColumnNames.length - 1;
		dbColumnLengths.length = dbColumnLengths.length - 1;
		
		var columnDivID = "dbGroup" + dbColumnIndex;
		var columnDiv = $('#' + columnDivID);
		if (columnDiv != null) {
			columnDiv.remove();
		}
		
		var columnBrID = "dbGroupBr" + dbColumnIndex;
		var columnBr = $('#' + columnBrID);
		if (columnBr != null) {
			columnBr.remove();
		}
		
		dbColumnIndex--;
		dbResetCtrlValue();
	}

	/**
	* Set the type of current column
	* @index the index of current column
	* @type the index of current column, it will as follows
	* bool
	* tinyint
	* smallint
	* bigint
	* float
	* double
	* binary
	* timestamp
	*/ 
	function dbSetColumnType(index, type)
	{
		var btn = $('#dbGroupType' + index);
		btn.text(type);
	}
			
	/**
	 * Set the type of current column
	 */
	function dbCreate()
	{
		dbFetchCtrlValue();

		if (!DbUtil.CheckName(dbTableName, "table name"))
		{
			return;
		}
		if (!DbUtil.CheckName(dbTableFirstKey, "the name of timestamp column"))
		{
			return;
		}
		
		if (dbColumnIndex < 0) {
			return DbUtil.Error(DB_CODE_TABLE_COL_NUM_ZERO);
		}

		var sql = "create table ";
		if($('#stableSelect').val()=="0"){
			//create table SQL
			sql += DbSession.GetDb() + "." + dbTableName + "(" + dbTableFirstKey + " timestamp";
			for (var i = 0; i <= dbColumnIndex; ++i)
			{
				var columnType = dbColumnTypes[i];
				var columnName = dbColumnNames[i];
				var columnLength = dbColumnLengths[i];
				if (columnType == "Data Type") {
					return DbUtil.Error(DB_CODE_TABLE_COL_TYPE_NULL);
				}
				if (!DbUtil.CheckName(columnName, "the name of column"))
				{
					return;
				}
				
				//if (columnName == "") {
				//	return DbUtil.Error(DB_CODE_TABLE_COL_NAME_NULL);
				//}
				if (columnType == "binary")
				{
					if (columnLength <= 0) {
						return DbUtil.Error(DB_CODE_TABLE_COL_BINARY_NULL);
					}
					else {
						columnType = columnType + "(" + columnLength + ")";
					}
				}
				sql = sql + ", " + columnName + " " + columnType;
			}
			sql += ")";
		} else {
			//create table using stable SQL
			var stableName = $('#stableSelect').val();
			sql += DbSession.GetDb() + "." + dbTableName + " using " + DbSession.GetDb() + "." + stableName;

			var flag = false 
			var noneNullTagIndex = []
			for (var i = 0; i <= dbTagIndex; ++i){
				if (dbTagNames[i])
				{
					noneNullTagIndex.push(i)
					flag = true;
				}
			}

			if (flag) {
				sql += ' ' + '('
				for (var i = 0; i < noneNullTagIndex.length; ++i) {
					var index = noneNullTagIndex[i];
					var tagType = dbTagTypes[index];
					var tagName = dbTagNames[index];
					var tagTitle = dbTagTitles[index];

					if (!DbUtil.CheckTagType(index, tagType, tagName))
					{
						return;
					}

					if(i != 0){
						sql = sql + ", " + tagTitle;
					} else {
						sql = sql + tagTitle;
					}	
				}
				sql += ') TAGS (';
				for (var i = 0; i < noneNullTagIndex.length; ++i) {
					var index = noneNullTagIndex[i];
					var tagName = dbTagNames[index];

					if(i != 0){
						sql = sql + ", " + tagName;
					} else {
						sql = sql + tagName;
					}	
				}
				sql += ")";
			} else {
				DbUtil.ErrorDialog(" need at least one tag")
				return;
			}

			
		}
	
		$.ajax({
			type: "post",
			url: "admin/sql",
			headers: {
				'Authorization' : "Taosd " + DbSession.GetToken()
			},
			data: sql,
			dataType: "json",
			success: dbCreateCb,
			error: function(msg) { 
				if (msg != null && msg.responseJSON != null) {
					dbCreateCb(msg.responseJSON);
				} else if (msg != null) {
					DbUtil.ErrorWithMsg(DB_CODE_INVALID_FORMAT, msg);
				} else {
					DbUtil.ErrorWithMsg(DB_CODE_SERVER_NULL, msg);
				}
			}		
		});		
	}
	
	function dbCreateCb(d)
	{
		if (d == null || d.status == null) {
			DbUtil.Error(DB_CODE_INVALID_FORMAT);
			return;
		} 
		if (d.status == "error") {
			DbUtil.HandleError(d);
		}
		else if (d.status == "succ") {
			if (d.affect_rows == 0) {
				DbUtil.Error(DB_CODE_EXEC_ERROR);
			}
			else {
				DbUtil.GotoPage("tables.html");
			}
		}	
		else{
			DbUtil.Error(DB_CODE_UNKNOWN);
		}
	}

	/**
	 * Return to the tables page

	{
		DbSession.SetCacheFlag();
		DbUtil.GotoPage("tables.html");
	}

	function handleUScheckboxChange(){
		if($('#isUScheckbox').prop("checked")){
			dbQueryStables();
			$('#stableSelect').removeAttr("disabled");
		} else {
			removeStable();
		}
	}

	function handleUSselectChange(){
		if($('#stableSelect').val()!="0"){
			useStable($('#stableSelect').val());
		} else {
			removeStable();	
		}
	}

	function removeStable(){
		$('#stableSelect').attr("disabled", "disabled");
		$('#stableSelect').html('<option value="0">Not use Stable</option>');
		$('#stableSelect').val("0");
		$('#isUScheckbox').removeAttr("checked")

		dbColumnIndex = -1;
		dbColumnTypes = [];
		dbColumnNames = [];
		dbColumnLengths = [];

		dbTagIndex = -1;
		dbTagTypes = [];
		dbTagNames = [];
		dbTagLengths = [];
		
		$('#dbFrom1').html("");
		$('#dbFrom2').html("");

		$('#dbTimestampColumn').removeAttr("disabled");
		$('#dbTimestampColumnBtn').removeAttr("disabled");
		$('#dbTimestampColumn').val("");
	}

	function useStable(stableName){
		$.ajax({
			type: "post",
			url: "admin/sql",
			headers: {
				'Authorization' : "Taosd " + DbSession.GetToken()
			},
			data: "DESCRIBE " + DbSession.GetDb() + "." + stableName,
			dataType: "json",
			success: function(d){
				if (d == null || d.status == null) {
					DbUtil.Error(DB_CODE_INVALID_FORMAT);
					return;
				} 
				if (d.status == "error") {
					DbUtil.HandleError(d);
				}
				else if (d.status == "succ") {
					assembleForm(d.data);
				}
				else{
					DbUtil.Error(DB_CODE_UNKNOWN);
				}
			},
			error: function(msg) { 
				if (msg != null && msg.responseJSON != null) {
					dbOnLoadCb(msg.responseJSON);
				} else if (msg != null) {
					DbUtil.ErrorWithMsg(DB_CODE_INVALID_FORMAT, msg);
				} else {
					DbUtil.ErrorWithMsg(DB_CODE_SERVER_NULL, msg);
				}
			}		
		});		
	
	}

	function dbQueryStables(selected)
	{
		$.ajax({
			type: "post",
			url: "admin/sql",
			headers: {
				'Authorization' : "Taosd " + DbSession.GetToken()
			},
			data: "show " + DbSession.GetDb() +".stables",
			dataType: "json",
			success: function(d){
				dbQueryStablesCallback(d, selected)
			},
			error: function(msg) { 
				if (msg != null && msg.responseJSON != null) {
					dbQueryStablesCallback(msg.responseJSON);
				} else if (msg != null) {
					DbUtil.ErrorWithMsg(DB_CODE_INVALID_FORMAT, msg);
				} else {
					DbUtil.ErrorWithMsg(DB_CODE_SERVER_NULL, msg);
				}
			}		
		});		
	}
	
	function dbQueryStablesCallback(d, selected)
	{
		if (d == null || d.status == null) {
			DbUtil.Error(DB_CODE_INVALID_FORMAT);
			return;
		} 
		if (d.status == "error") {
			DbUtil.HandleError(d);
		}
		else if (d.status == "succ") {
			setUSselect(d.data, selected)
		}	
		else{
			DbUtil.Error(DB_CODE_UNKNOWN);
		}
	}

	function setUSselect(data, selected){
		var len = data.length;
		var html = '<option value="0">Not use Stable</option>';
		for (var i = 0; i < len; ++i) {
			html += '<option value="' + data[i][0] + '">' + data[i][0] + '</option>';
		}
		$('#stableSelect').html(html);
		if(selected){
			$('#stableSelect').val(selected);
		}
	}
	
	function assembleForm(data){
		$('#dbTimestampColumn').attr("disabled", "disabled");
		$('#dbTimestampColumnBtn').attr("disabled", "disabled");
		$('#dbTimestampColumn').val(data[0][0]);
		var len = data.length;

		dbColumnIndex = -1;
		dbColumnTypes = [];
		dbColumnNames = [];
		dbColumnLengths = [];

		dbTagIndex = -1;
		dbTagTypes = [];
		dbTagNames = [];
		dbTagLengths = [];

		dbTagTitles = [];
		
		$('#dbFrom1').html("");
		$('#dbFrom2').html("<label>Tags:</label>");
		for(var i=1; i<len; ++i){
			if(!data[i][3]){
				dbSetColumn(data[i][0], data[i][1], data[i][2])
			}else{
				dbSetTag(data[i][0], data[i][1], data[i][2])
			}
		}
	}
