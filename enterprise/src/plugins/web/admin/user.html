	<script type="text/javascript">
	function dbOnLoad()
	{
		DbSession.ValidSession();
	}
	
	function dbCreateUser()
	{
		var user = $.trim($("#userName").val());
		if (!DbUtil.CheckName(user, "User Name"))
		{
			return;
		}
		var pass = $.trim($("#userPass").val());
		if (pass == null || pass == "") {
			DbUtil.ErrorDialog("User Password can't be null");
			return;
		}
		var passRepeat = $.trim($("#passRepeat").val());
		if (passRepeat == null || passRepeat == "") {
			DbUtil.ErrorDialog("Repeat Password can't be null");
			return;
		}
		if (passRepeat != pass) {
			DbUtil.ErrorDialog("repeat password not same");
			return;
		}
		
		
		var sql = "create user " + user + " pass '" + pass + "'";
		
		$.ajax({
			type: "post",
			url: "admin/sql",
			headers: {
				'Authorization' : "Taosd " + DbSession.GetToken()
			},
			data: sql,
			dataType: "json",
			success: dbCreateUserCb,
			error: function(msg) { 
				if (msg != null && msg.responseJSON != null) {
					dbCreateUserCb(msg.responseJSON);
				} else if (msg != null) {
					DbUtil.ErrorWithMsg(DB_CODE_INVALID_FORMAT, msg);
				} else {
					DbUtil.ErrorWithMsg(DB_CODE_SERVER_NULL, msg);
				}
			}		
		});		
	}
	
	function dbCreateUserCb(d)
	{
		if (d == null || d.status == null) {
			DbUtil.Error(DB_CODE_INVALID_FORMAT);
			return;
		} 
		if (d.status == "error") {
			DbUtil.HandleError(d);
		}
		else if (d.status == "succ") {
			if (d.affect_rows == 0) {
				DbUtil.Error(DB_CODE_EXEC_ERROR);
			}
			else {
				DbUtil.GotoPage("users.html");
			}
		}	
		else{
			DbUtil.Error(DB_CODE_UNKNOWN);
		}
	}
	
	function dbGotoUser()
	{
		DbUtil.GotoPage("users.html");
	}
	
	</script>
