				</div>

	<script type="text/javascript">
	function dbOnLoad()
	{
		DbSession.ValidSession();
		var type = DbUtil.GetUrlFirstPara();
		$('#udfTypeSelect').val(type)
		if(type == '0'){
			setFileFrom1()
		}else if(type == '1'){
			setFileFrom1()
		} else {
			setScriptFrom2()
		}
	}	
	var funcName = ''
	var outputtype = "float"
	var buffsize = 512
	var isAggregate = 0
	var script = ''
	

	function dbClearCtrlValue(){

	}

	function dbFetchCtrlValue(){
		funcName = $.trim($('#funcName').val());
		outputtype = $.trim($('#outputtype').val());
		buffsize = $.trim($('#buffsize').val());
		isAggregate = $.trim($('#isAggregate').val());
		script = $.trim($('#script').val());
	}
	/**
	 * Set the type of current column
	 */
	function dbCreate()
	{
		dbFetchCtrlValue();

		if (!DbUtil.CheckName(funcName, "funcName"))
		{
			return;
		}

		if ($('#udfTypeSelect').val()=='2')
		{

			if(!DbUtil.CheckNULL(script, "script")) {
				return;
			}

			$.ajax({	
				type: "post",
				url: "/rest/udf/" + funcName + "/" + outputtype + "/" + isAggregate + "/" + buffsize,
				headers: {
					'Authorization' : "Taosd " + DbSession.GetToken()
				},
				data: script,
				dataType: "json",
				success: dbCreateCb,
				error: function(msg) { 
					if (msg != null && msg.responseJSON != null) {
						dbCreateCb(msg.responseJSON);
					} else if (msg != null) {
						DbUtil.ErrorWithMsg(DB_CODE_INVALID_FORMAT, msg);
					} else {
						DbUtil.ErrorWithMsg(DB_CODE_SERVER_NULL, msg);
					}
				}		
			});	
			
		} else if ($('#udfTypeSelect').val()=='0'){
			// 
			var file = $('#fileInput')[0].files[0]
			if(file){
				var reader = new FileReader()
				reader.readAsText(file)
				reader.onload = function(e){
				$.ajax({
					type: "post",
					url: "/rest/udf/" + funcName + "/" + outputtype + "/" + isAggregate + "/" + buffsize,
					headers: {
						'Authorization' : "Taosd " + DbSession.GetToken()
					},
					data: this.result,
					dataType: "json",
					success: dbCreateCb,
					error: function(msg) { 
						if (msg != null && msg.responseJSON != null) {
							dbCreateCb(msg.responseJSON);
						} else if (msg != null) {
							DbUtil.ErrorWithMsg(DB_CODE_INVALID_FORMAT, msg);
						} else {
							DbUtil.ErrorWithMsg(DB_CODE_SERVER_NULL, msg);
						}
					}		
			});	
				}
			} else {
				DbUtil.ErrorDialog("no file");
			}
			
		}  else if ($('#udfTypeSelect').val()=='1'){
			// 
			var file = $('#fileInput')[0].files[0]
			if(file){
				var reader = new FileReader()
				reader.readAsArrayBuffer(file)
				reader.onload = function(e){
				$.ajax({
					type: "post",
					url: "/rest/udf/" + funcName + "/" + outputtype + "/" + isAggregate + "/" + buffsize,
					headers: {
						'Authorization' : "Taosd " + DbSession.GetToken()
					},
					data: new Int8Array(this.result),
					dataType: "json",
					success: dbCreateCb,
					error: function(msg) { 
						if (msg != null && msg.responseJSON != null) {
							dbCreateCb(msg.responseJSON);
						} else if (msg != null) {
							DbUtil.ErrorWithMsg(DB_CODE_INVALID_FORMAT, msg);
						} else {
							DbUtil.ErrorWithMsg(DB_CODE_SERVER_NULL, msg);
						}
					}		
			});	
				}
			} else {
				DbUtil.ErrorDialog("no file");
			}
			
		}
	
	
	}
	
	function dbCreateCb(d)
	{
		if (d == null || d.status == null) {
			DbUtil.Error(DB_CODE_INVALID_FORMAT);
			return;
		} 
		if (d.status == "error") {
			DbUtil.HandleError(d);
		}
		else if (d.status == "succ") {
			if (d.affect_rows == 0) {
				DbUtil.Error(DB_CODE_EXEC_ERROR);
			}
			else {
				DbUtil.GotoPage("udfs.html");
			}
		}	
		else{
			DbUtil.Error(DB_CODE_UNKNOWN);
		}
	}

	/**
	 * Return to the tables page
	 */
	function dbReturn()
	{
		DbSession.SetCacheFlag();
		DbUtil.GotoPage("tables.html");
	}

	function handleUScheckboxChange(){
		if($('#isAggregate').prop("checked")){
			$('#isAggregate').val(1)
		} else {
			$('#isAggregate').val(0)
		}
	}

	function handleUSselectChange(){
		if($('#udfTypeSelect').val() == '0'){
			setFileFrom1()
		} else if($('#udfTypeSelect').val() == '1'){
			setFileFrom1()
		} else {
			setScriptFrom2()
		}
	}

	function setFileFrom1(){
		$('#dbFrom2').html('');
		var html = '<label style="display: block; margin-top: 5px;">Upload File:</label>'
		html += '<input type="file" id="fileInput">'
		$('#dbFrom1').html(html);
	}

	function setScriptFrom2(){
		$('#dbFrom1').html('');
		var html = '<label style="display: block; margin-top: 5px;">Script(lua):</label>'
		html += '<textarea class="form-control" rows="5" id="script"></textarea>'
		$('#dbFrom2').html(html);
	}
	
	</script>
