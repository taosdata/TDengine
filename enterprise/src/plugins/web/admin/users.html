	<script type="text/javascript">
	function dbOnLoad()
	{
		DbSession.ValidSession();
		DbCache.Clear();
		DbCache.Init(dbFillTableHead, dbFillTableBody);
		dbQuery("sql");
	}
		
	//file the head of dbTableHead
	function dbFillTableHead(data)
	{
		var rowBegin = "<tr>";
		var rowEnd = "</tr>";
		var colNum = data.head.length;		
		var colBegin = '<th style="font-weight: normal">';
		var colEnd = "</th>";
		
		if (data == null || data.head == null) {
			return;
		}
		
		row = rowBegin + colBegin + "No" + colEnd;
		for (colIndex = 0; colIndex < colNum; colIndex++) {
			row = row + colBegin + data.head[colIndex] + colEnd;
		}
		row = row + colBegin + "operation" + colEnd;
		row = row + rowEnd;
		
		$('#dbTableHead').html(row);
	}
	
	//file the body of dbTableBody
	function dbFillTableBody(d)
	{
		var rowNum = d.data.length;
		var rowBegin = "<tr>";
		var rowEnd = "</tr>";
		var colNum = d.head.length;		
		var colBegin = "<td>";
		var colEnd = "</td>";
		
		var operBegin = '<a class="dboper" onclick="dbDelete(\'';
		var operEnd = '\')">Delete</a>';
		
		var rowIndex = 0;
		var bodyContent = "";
		for (rowIndex = 0; rowIndex < rowNum; ++rowIndex) {
			var row = rowBegin + colBegin + DbCache.GetRowIndex(rowIndex) + colEnd;
			var data = d.data[rowIndex]; 	
			for (colIndex = 0; colIndex < colNum; colIndex++) {
				row = row + colBegin + data[colIndex] + colEnd;
			}
			
			var oper = operBegin + data[0] + operEnd;
			row = row + colBegin + oper + colEnd + rowEnd;	
			bodyContent += row;
		}
		for (; rowIndex < DbCache.RowsPerPage(); ++rowIndex) {
			var row = rowBegin + colBegin + '-' + colEnd;
			for (colIndex = 0; colIndex < colNum; colIndex++) {
				row = row + colBegin + colEnd;
			}
			
			row = row + colBegin + colEnd + rowEnd;	
			bodyContent += row;
		}
		
		$('#dbTableBody').html(bodyContent);
	}
	
	//while push delete button
	var dbUserName = "";
	function dbDelete(id)
	{		
		dbUserName = id;
		DbUtil.ConfirmDialog(DB_CODE_CONFIRM, "drop user: " + dbUserName);
	}
	
	//while confirm delete
	function dbExecuteDelete()
	{
		$.ajax({
			type: "post",
			url: "admin/sql",
			headers: {
				'Authorization' : "Taosd " + DbSession.GetToken()
			},
			data: "drop user " + dbUserName,
			dataType: "json",
			success: dbExecuteDeleteCb,
			error: function(msg) { 
				if (msg != null && msg.responseJSON != null) {
					dbExecuteDeleteCb(msg.responseJSON);
				}
				else {
					DbUtil.ErrorWithMsg(DB_CODE_SERVER_NULL, msg);
				}
			}		
		});		
	}
	
	function dbExecuteDeleteCb(d)
	{
		if (d == null || d.status == null) {
			DbUtil.Error(DB_CODE_INVALID_FORMAT);
			return;
		} 
		if (d.status == "error") {
			DbUtil.HandleError(d);
		}
		else if (d.status == "succ") {
			if (d.affect_rows == 0) {
				DbUtil.Error(DB_CODE_EXEC_ERROR);
			}
			else {
				DbUtil.GotoPage("users.html");
			}
		}	
		else{
			DbUtil.Error(DB_CODE_UNKNOWN);
		}
	}
					
	function dbAdd()
	{
		DbUtil.GotoPage("user.html");
	}
	
	function dbQuery(path) {
		$.ajax({
			type: "post",
			url: "admin/" + path,
			headers: {
				'Authorization' : "Taosd " + DbSession.GetToken()
			},
			data: "show users",
			dataType: "json",
			success: dbQueryCb,
			error: function(msg) { 
				if (msg != null && msg.responseJSON != null) {
					dbQueryCb(msg.responseJSON);
				}
				else {
					DbUtil.ErrorWithMsg(DB_CODE_SERVER_NULL, msg);
				}
			}		
		});		
	}
	
	function dbQueryCb(d)
	{
		if (d == null || d.status == null) {
			DbUtil.Error(DB_CODE_INVALID_FORMAT);
			return;
		} 
		if (d.status == "error") {
			DbUtil.HandleError(d);
		}
		else if (d.status == "succ") {
			DbCache.OnData(d);
		}	
		else{
			DbUtil.Error(DB_CODE_UNKNOWN);
		}
	}
	</script>
