	<script type="text/javascript">
	function dbOnLoad()
	{
		DbSession.ValidSession();
	}
	
	function dbCreateDNode()
	{
		var ip = $.trim($("#ip").val());
		
		if (ip == null || ip == "") {
			DbUtil.ErrorDialog("DNode IP can't be null");
			return;
		}
		
		var sql = "create dnode " + ip;
		
		$.ajax({
			type: "post",
			url: "admin/sql",
			headers: {
				'Authorization' : "Taosd " + DbSession.GetToken()
			},
			data: sql,
			dataType: "json",
			success: dbCreateDNodeCb,
			error: function(msg) { 
				if (msg != null && msg.responseJSON != null) {
					dbCreateDNodeCb(msg.responseJSON);
				} else if (msg != null) {
					DbUtil.ErrorWithMsg(DB_CODE_INVALID_FORMAT, msg);
				} else {
					DbUtil.ErrorWithMsg(DB_CODE_SERVER_NULL, msg);
				}
			}		
		});		
	}
	
	function dbCreateDNodeCb(d)
	{
		if (d == null || d.status == null) {
			DbUtil.Error(DB_CODE_INVALID_FORMAT);
			return;
		} 
		if (d.status == "error") {
			DbUtil.HandleError(d);
		}
		else if (d.status == "succ") {
			if (d.affect_rows == 0) {
				DbUtil.Error(DB_CODE_EXEC_ERROR);
			}
			else {
				DbUtil.GotoPage("dnodes.html");
			}
		}	
		else{
			DbUtil.Error(DB_CODE_UNKNOWN);
		}
	}
	
	function dbGotoDNode()
	{
		DbUtil.GotoPage("dnodes.html");
	}
	
	</script>
