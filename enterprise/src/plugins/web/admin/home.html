	<script type="text/javascript">
	function dbOnLoad()
	{
		DbSession.ValidSession();
		dbQuerySummary();
		dbQueryEvents();
	}
	
	function dbQuerySummary()
	{
		$.ajax({
			type: "post",
			url: "admin/info",
			headers: {
				'Authorization' : "Taosd " + DbSession.GetToken()
			},
			dataType: "json",
			success: dbQuerySummaryCallback,
			error: function(msg) { 
				if (msg != null && msg.responseJSON != null) {
					dbQuerySummaryCallback(msg.responseJSON);
				} else if (msg != null) {
					DbUtil.ErrorWithMsg(DB_CODE_INVALID_FORMAT, msg);
				} else {
					DbUtil.ErrorWithMsg(DB_CODE_SERVER_NULL, msg);
				}
			}		
		});		
	}
	
	function dbQuerySummaryCallback(d)
	{
		if (d == null || d.status == null) {
			DbUtil.Error(DB_CODE_INVALID_FORMAT);
			return;
		} 
		if (d.status == "error") {
			DbUtil.HandleError(d);
		}
		else if (d.status == "succ") {
			for (i = 0; i < d.data.length; ++i) {
				data = d.data[i];
				$('#DBs').text(data.dbs + " DBs");
				$('#Tables').text(data.tables + " Tables");
				$('#Users').text(data.users + " Users");
				
				if (DbSession.IsRoot()) {
					$('#DNodes').text(data.dnodes + " DNodes");
				}
				else {	
					$('#DNodes').hide();
				}
			}
		}	
		else{
			DbUtil.Error(DB_CODE_UNKNOWN);
		}
	}
	
	function dbGetLevelStr(level)
	{
		switch (level) {
		case 0: return "Info";
		case 1: return "Warning";
		case 2: return "Error";
		}
		return "Undefine";
	}
	
	function dbQueryEvents()
	{
		var user = DbSession.GetUser();
		var date = DbSession.GetDate();
		if (user == "invalid" || date == "invalid") {
			return;
		}
		
		if (!DbSession.IsRoot()) {
			$('#events').html("<tr><td>" + user + " login at " + date + "</td><tr>");
			return;
		}
		
		var eventsDiv = $('#eventsID');
		if (eventsDiv == null || eventsDiv == undefined) return;
		eventsDiv.show();
		
		$.ajax({
			type: "post",
			url: "admin/sql",
			headers: {
				'Authorization' : "Taosd " + DbSession.GetToken()
			},
			data: "select * from log.log limit 13",
			dataType: "json",
			success: dbQueryEventsCb,
			error: function(msg) { 
				if (msg != null && msg.responseJSON != null) {
					dbQueryEventsCb(msg.responseJSON);
				} else if (msg != null) {
					DbUtil.ErrorWithMsg(DB_CODE_INVALID_FORMAT, msg);
				} else {
					DbUtil.ErrorWithMsg(DB_CODE_SERVER_NULL, msg);
				}
			}		
		});	
	}
	
	function dbQueryEventsCb(d)
	{
		if (d == null || d.status == null) {
			DbUtil.Error(DB_CODE_INVALID_FORMAT);
			return;
		} 
		if (d.status == "error") {
			DbUtil.HandleError(d);
		}
		else if (d.status == "succ") {
			var eventHtml = "";
			for (i = 0; i < d.data.length; ++i) {
				data = d.data[i];		
				//eventHtml += "<tr><td>" + data[0] + "</td><td>" + data[1] +  "</td><td>" + data[2] + "</td><td>" + data[3] + "</td><tr>";
				eventHtml += "<tr><td>" + data[0] + "</td><td>" + dbGetLevelStr(data[1]) +  "</td><td>" + data[2] + "</td><td>" + data[3] + "</td><tr>";
				if (i > 13) {
					break;
				}
			}
			if (eventHtml != "") {
				$('#events').html(eventHtml);
			}
		}	
		else{
			DbUtil.Error(DB_CODE_UNKNOWN);
		}
	} 

	function dbGotoLog()
	{
		DbUtil.GotoPage("log.html");
	}
	</script>
