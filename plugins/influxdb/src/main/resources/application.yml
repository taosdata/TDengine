# 服务端口
server:
  port: 0
# 日志配置
logging:
  config: classpath:log4j2.yml
  level:
    _org.springframework.*: off
    org.springframework.*: off
    org.apache.*: off
    io.netty.util.*: off
spring:
  main:
    log-startup-info: false
    banner-mode: off
  profiles:
    include: db-source, netty

# task parameters
task:
  # whether to resume running from the last breakpoint: normal(default)/resume
  mode: normal
  # empty is all, follow this principle
  buckets:
    - taosdata
    - test
  measurements:
  beginTime: 2023-05-16 08:00:00
  # empty is now
  endTime: 2023-06-30 16:14:00
  # specify the way of task assignment: 1-queue 2-average
  assignmentType: 1

#performance parameters
performance:
  tolerance: 10000
  limitConnect: 2
  limitBatch: 1000
  limitSpeed: 100000
  retryTimes: 3
  # millisecond
  retryInterval: 200
  readWindow: m
  maxThread: 50
  queueSizeT: 1000
  queueSizeD: 500000
  thread:
    # MessageThread线程
    processMessageInterval: 1
    processMessageEmptyInterval: 10
    # PushPrepareThread线程
    readBucketDataBatch: 10000
    pushPrepareInterval: 10
    # PushThread线程
    pushInterval: 0
    pushEmptyInterval: 10
    # BucketThread线程
    createBucketInterval: 5
    createBucketFullInterval: 200
    # BucketDataThread线程
    readBucketBatch: 2000
    readBucketInterval: 1
    readBucketFullInterval: 200
    # ScheduleThread线程
    scheduleInterval: 5
    # MonitorThread线程
    monitorInterval: 500
