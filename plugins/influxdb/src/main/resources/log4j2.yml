  Loggers:
    # 系统操作日志
    Root:
      # 日志级别
      level: info
      # 关联输出
      AppenderRef:
        - ref: console
#        - ref: sys-info
#        - ref: sys-error
    Logger:
      # sys-user日志
      - name: sys-user
        # 是否将日志流反馈到root中
        additivity: false
        # 日志级别
        level: info
        # 关联输出
        AppenderRef:
          - ref: console
#          - ref: sys-user