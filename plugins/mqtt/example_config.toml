log_level = "debug"
remote = "192.168.0.201:6056"

[mqtt]
address = "tcp://127.0.0.1:1883"
version = "3.0"
client_id = "mqtt_test"
username = "user"
password = "pass"
keep_alive = 60
clean_session = true

[topics]
"topic1" = 0
"topic2" = 0
"topic3" = 0

[dump]
enable = true
path = "./tmp/mqtt"
keep = 7

[batch]
# Maximum number of messages to send in a batch
size = 100
# Maximum time to wait before sending a batch
timeout = 500
