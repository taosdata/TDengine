opc_type = "opcua" # opcua or opcda (only for windows)
debug = true # debug mode. only for testing, should not be used in production

[connect]

[connect.ua] # opc ua config.
endpoint = "opc.tcp://0.0.0.0:4840/" # opc endpoint
connect_timeout = 10 # timeout for connect to endpoint in second
request_timeout = 10 # timeout for a request in second
security_policy = "None" # None/Basic128Rsa15/Basic256/Basic256Sha256
security_mode = "None" # None/Sign/SignAndEncrypt
certificate = "" # Path to cert.pem. Required when security mode or policy isn't "None"
private_key = "" # Path to private key.pem. Required when security mode or policy isn't "None"
auth_method = "Anonymous" # Authentication Method. Certificate/UserName/Anonymous
username = "" # Required for auth_method == "UserName"
password = "" # Required for auth_method == "UserName"

#[connect.da]  # opc da config.
#server = "Matrikon.OPC.Simulation.1" # opc da server
#nodes = ["localhost"] # opc da nodes

[collect]
interval = 1 # collect data interval in second
[[collect.ua.nodes]] # opc ua nodes. needs node id and value type. value type is same with data type in tdengine
id = "ns=2;i=1008"
value_type = "tinyint"

#[[collect.da.tags]] # opc da tags. needs tag name and value type. value type is same with data type in tdengine
#tag = "g1.r1"
#value_type = "INT"

[report]
remote = "192.168.0.201:6051" # taosx's address ip:port or socket path
concurrent = 2
batch_size = 1
batch_timeout = 10
