# ======================================================================
# TDengine TSDB — 调试用完整流水线（基于 .gitlab-ci.yml，含并行双构建 NoSan + San）
# ======================================================================
# 改动说明（相比 .gitlab-ci.yml）：
#   1. 三步构建（build stage）：
#        build-externals (串行)  → 构建全部第三方库，stamps → externals-others-amd64/
#            ↓ needs
#        build-noasan (NoSan)  → TSDB_SRC/debug-others/     → externals-others-amd64（读 stamps 跳过）
#        build-asan  (ASAN)   → TSDB_SRC_SAN/debug-others/ → externals-others-amd64（读 stamps 跳过）
#      三个 build job 统一使用 --image others:latest，externals stamps 写入同一目录，
#      externals stamps 位于 TD_EXTERNALS_BASE_DIR（cache/externals-others-amd64/ 挂载为
#      /mnt/.externals），与 debug/ 无关，--clean 不会清除，并行安全。
#   2. upload-nexus（verify 通过后）打包两份产物上传 Nexus：
#        ${NEXUS_PATH}/nosan/linux-x64-nosan.tar.gz   ← 来自 build-noasan
#        ${NEXUS_PATH}/san/linux-x64-san.tar.gz       ← 来自 build-asan
#      二进制清单新增: replay_test, sml_test, get_db_name_test, varbinary_test,
#        write_raw_block_test, tmq_* (对齐 legacy transfer_debug_dirs)
#      lib/: cp -rP 保留 .so 符号链接（libtaos.so → libtaos.so.3 等）
#      share/: 随产物一起打包（taosd 配置模板）
#   3. 测试 job 移除 SANITIZER 变量（现在 cases.task 第3字段 y/n 按用例路由）
#   4. CI_NO_ASAN=1 始终设置（ASAN 内置于 debugSan 二进制，无需 LD_PRELOAD 注入）
# ======================================================================
workflow:
  auto_cancel:
    on_new_commit: interruptible   # 新 commit 推送时自动取消标记了 interruptible 的旧 pipeline
  rules:
    # ── Builder 亲和性路由 ────────────────────────────────────────────────────
    # 通过 workflow:rules:variables 设置 TSDB_BUILDER_TAG，保证同一 pipeline 内
    # 所有 builder job（prepare / build / check / unit-test / upload / coordinator）
    # 落在同一台机器上，避免跨节点找不到 workspace。
    #
    # 路由策略：MR IID 末位数字 % N → 固定 builder（同一 MR 始终同一台）。
    # 扩展步骤：
    #   1. 新 runner 注册唯一 tag（如 tsdb-builder-2）
    #   2. 在下方「路由区」加一行 if + 对应数字组
    #   3. 调整已有行的数字分组（10 个数字均分给 N 台）
    # 示例（6 台）：
    #   /[01]$/→0  /[23]$/→1  /[45]$/→2  /[67]$/→3  /[8]$/→4  /[9]$/→5
    # ─────────────────────────────────────────────────────────────────────────
    # 子流水线场景：source 会变成 parent_pipeline，需要在这里重新设置 builder 路由。
    - if: $CI_PIPELINE_SOURCE == "parent_pipeline" && $PARENT_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_IID =~ /[01234]$/
      variables:
        TSDB_BUILDER_TAG: "tsdb-builder-0"
    - if: $CI_PIPELINE_SOURCE == "parent_pipeline" && $PARENT_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_IID =~ /[56789]$/
      variables:
        TSDB_BUILDER_TAG: "tsdb-builder-1"
    - if: $CI_PIPELINE_SOURCE == "parent_pipeline" && $PARENT_PIPELINE_SOURCE == "schedule" && $CI_PIPELINE_ID =~ /[01234]$/
      variables:
        TSDB_BUILDER_TAG: "tsdb-builder-0"
    - if: $CI_PIPELINE_SOURCE == "parent_pipeline" && $PARENT_PIPELINE_SOURCE == "schedule" && $CI_PIPELINE_ID =~ /[56789]$/
      variables:
        TSDB_BUILDER_TAG: "tsdb-builder-1"
    - if: $CI_PIPELINE_SOURCE == "parent_pipeline" && $PARENT_PIPELINE_SOURCE == "web" && $CI_PIPELINE_ID =~ /[01234]$/
      variables:
        TSDB_BUILDER_TAG: "tsdb-builder-0"
    - if: $CI_PIPELINE_SOURCE == "parent_pipeline" && $PARENT_PIPELINE_SOURCE == "web" && $CI_PIPELINE_ID =~ /[56789]$/
      variables:
        TSDB_BUILDER_TAG: "tsdb-builder-1"
    # 父流水线已完成来源过滤；这里允许子流水线创建。
    - if: $CI_PIPELINE_SOURCE == "parent_pipeline"
    # ①【分支过滤区】—— MR 目标分支不在白名单内则不创建 pipeline
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME != "main" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME !~ /^3\.3\.6/ && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME !~ /^3\.0/
      when: never
    # Draft MR 不触发 CI（标题以 "Draft:" 或 "WIP:" 开头时跳过）
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE =~ /^(Draft:|WIP:)/
      when: never
    # ②【路由区】—— MR 按 IID 末位路由（与分支无关，加 builder 只改这里）
    # TSDB_BUILDER_TAG 即 coordinator 主机名（需在各 worker /etc/hosts 中注册），无需额外 IP 映射
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_IID =~ /[01234]$/
      variables:
        TSDB_BUILDER_TAG: "tsdb-builder-0"    # u1-47
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_IID =~ /[56789]$/
      variables:
        TSDB_BUILDER_TAG: "tsdb-builder-1"    # u2-104
    # ③ schedule / web 按 pipeline ID 末位路由
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_PIPELINE_ID =~ /[01234]$/
      variables:
        TSDB_BUILDER_TAG: "tsdb-builder-0"
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_PIPELINE_ID =~ /[56789]$/
      variables:
        TSDB_BUILDER_TAG: "tsdb-builder-1"
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_PIPELINE_ID =~ /[01234]$/
      variables:
        TSDB_BUILDER_TAG: "tsdb-builder-0"
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_PIPELINE_ID =~ /[56789]$/
      variables:
        TSDB_BUILDER_TAG: "tsdb-builder-1"

stages:
  - prepare
  - check      # check-void + check-enum（并行，任意失败立即终止后续构建）
  - build
  - quality    # check-assert（代码质量检查）
  - verify     # unit-test
  - upload
  - test
  - cleanup

variables:
  # 子流水线透传：父流水线通过 trigger variables 传入 PARENT_PIPELINE_SOURCE。
  # 独立运行时（CI 配置文件直接指向本文件）默认值回退到 $CI_PIPELINE_SOURCE，行为不变。
  PARENT_PIPELINE_SOURCE: $CI_PIPELINE_SOURCE
  NEXUS_URL: "https://nexus.tdengine.net"
  NEXUS_REPO: "tdtest"
  # ── Builder 亲和性标签（由 workflow:rules:variables 按 MR 路由覆盖）─────
  # COORDINATOR_HOST 由 prepare-workspace 在 builder 上自动探测 IP 并写入 build.env
  TSDB_BUILDER_TAG: "tsdb-builder-0"      # 默认 fallback，正常情况被 workflow:rules 覆盖
  # ── 基础路径配置（按部署环境修改这两个变量即可）──────────────────────────
  CI_BASE_DIR: "/data1/tdengine-ci"        # CI 工作根目录（workspace、platform、fail-logs 均在此）
  CI_CACHE_DIR: "/data/cache/tsdb-builder" # 构建缓存目录（externals stamps、Docker layer 等）
  BUILDER_IMAGE_TAG: "0.3.1"                 # 构建镜像版本（与 BUILDER_SCRIPT_IMAGE 保持同步）
  BUILDER_SCRIPT_IMAGE: "others:${BUILDER_IMAGE_TAG}" # build.sh --image 参数；切换镜像时改此处即可（如 core:${BUILDER_IMAGE_TAG}）
  BUILDER_IMAGE: "harbor.tdengine.net/tsdb-builder/others:${BUILDER_IMAGE_TAG}-amd64"
  # ── 调度激进度（0=保守, 1=折中激进[默认], 2=激进）───────────────────────────
  # 同时控制 coordinator 批量分配阈值和 worker TEST_CONCURRENCY 上限系数：
  #   0: stop=70%  tiers=30/50/75%   idle=ncpus*0.50  max_conc=nproc*0.6
  #   1: stop=80%  tiers=40/65/85%   idle=ncpus*0.75  max_conc=nproc*0.7  ← 推荐
  #   2: stop=85%  tiers=50/75/100%  idle=ncpus*1.00  max_conc=nproc*0.8
  CI_SCHED_AGGR: "1"

.rules-code-change:
  rules:
    - if: $PARENT_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/*.{c,h,cpp,cmake}"
        - "CMakeLists.txt"
        - "source/**"
        - "source/**/*"
        - "scripts/**"
        - "scripts/**/*"
        - ".gitlab-ci.yml"
        - ".gitlab/.gitlab-ci.yml"
        - "source/**/test/ci/cases.task"
        - "tests/ci/scripts/**"
    - if: $PARENT_PIPELINE_SOURCE != "merge_request_event"

# ======================================================================
# Stage: prepare
# ======================================================================
prepare-workspace:
  stage: prepare
  tags: [$TSDB_BUILDER_TAG]
  timeout: 10 minutes
  interruptible: true
  extends: .rules-code-change

  script:
    - |
      if [ "${PARENT_PIPELINE_SOURCE}" = "merge_request_event" ]; then
        WORKSPACE="${CI_BASE_DIR}/mr${CI_MERGE_REQUEST_IID}"
      elif [ "${PARENT_PIPELINE_SOURCE}" = "schedule" ]; then
        WORKSPACE="${CI_BASE_DIR}/daily-${CI_COMMIT_BRANCH}-$(date +%Y%m%d)"
      elif [ "${PARENT_PIPELINE_SOURCE}" = "web" ]; then
        WORKSPACE="${CI_BASE_DIR}/web-${CI_PIPELINE_ID}"
      else
        WORKSPACE="${CI_BASE_DIR}/push-${CI_COMMIT_BRANCH}-${CI_COMMIT_SHORT_SHA}"
      fi
      TSDB_SRC="${WORKSPACE}/tsdb"
      TSDB_SRC_SAN="${WORKSPACE}/tsdb-san"
      echo "WORKSPACE=${WORKSPACE}"
      echo "TSDB_SRC=${TSDB_SRC}"
      echo "TSDB_SRC_SAN=${TSDB_SRC_SAN}"
      echo "WORKSPACE=${WORKSPACE}"     > build.env
      echo "TSDB_SRC=${TSDB_SRC}"      >> build.env
      echo "TSDB_SRC_SAN=${TSDB_SRC_SAN}" >> build.env
      # 自动探测本机 IP（就是 coordinator 将要监听的 IP），写入 dotenv 供 test-linux 继承
      _SELF_IP=$(hostname -I 2>/dev/null | tr ' ' '\n' | grep '^192\.168\.' | head -1)
      [ -z "${_SELF_IP}" ] && _SELF_IP=$(hostname -I 2>/dev/null | awk '{print $1}')
      echo "COORDINATOR_HOST=${_SELF_IP}" >> build.env
      echo "[prepare] COORDINATOR_HOST=${_SELF_IP} (written to build.env)"

    - |
      # 确保 git server 的 host key 已添加（新节点部署后可能缺失）
      mkdir -p ~/.ssh && chmod 700 ~/.ssh
      ssh-keyscan git.tdengine.net >> ~/.ssh/known_hosts 2>/dev/null || true

    - |
      # 清理旧 workspace（Docker 容器可能产生 root 所有的文件，普通用户无法直接删除）
      if [ -d "${WORKSPACE}" ]; then
        chmod -R u+w "${WORKSPACE}" 2>/dev/null || true
        rm -rf "${WORKSPACE}" 2>/dev/null || true
      fi
      # 如果常规删除失败，通过 Docker 容器以 root 身份清理
      # 注意：shell glob * 不匹配 dotfile/dotdir（如 .git/），必须用 find 代替 rm -rf /cleanup/*
      if [ -d "${WORKSPACE}" ]; then
        echo "[WARN] rm -rf failed, retrying via Docker (root)..."
        docker run --rm -v "${WORKSPACE}":/cleanup "${BUILDER_IMAGE}" \
          sh -c 'chmod -R 777 /cleanup && find /cleanup -mindepth 1 -delete' 2>/dev/null || true
        rm -rf "${WORKSPACE}" 2>/dev/null || true
      fi
      mkdir -p "${WORKSPACE}"
      if [ "${PARENT_PIPELINE_SOURCE}" = "merge_request_event" ]; then
        _BRANCH="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"
      else
        _BRANCH="${CI_COMMIT_BRANCH}"
      fi
      # ── checkout 辅助函数 ──────────────────────────────────────────────────
      # MR 触发时：fetch GitLab 服务端预合并的虚拟 merge commit
      #   refs/merge-requests/<IID>/merge  ←→  GitHub 的 refs/pull/<N>/merge
      #   该引用由 GitLab 在 MR 无冲突时自动维护，代表 source 已 merge 进 target 的结果。
      #   CI 在合并后的代码上运行，与 GitHub prepare_test_env.py 行为一致。
      # 非 MR 触发时（schedule/web/push）：直接 checkout 对应 commit。
      _checkout_merged() {
        local _dir="$1"
        cd "${_dir}"
        if [ "${CI_PIPELINE_SOURCE}" = "merge_request_event" ]; then
          git fetch origin "refs/merge-requests/${CI_MERGE_REQUEST_IID}/merge"
          git checkout -qf FETCH_HEAD
          echo "[prepare] checked out MR !${CI_MERGE_REQUEST_IID} merged result: $(git rev-parse --short HEAD)"
        else
          git checkout -qf "${CI_COMMIT_SHA}"
          echo "[prepare] checked out commit: $(git rev-parse --short HEAD)"
        fi
      }

      # NoSan 源码目录
      git clone --branch "${_BRANCH}" --depth 50 \
        git@git.tdengine.net:rd-public/tsdb.git "${TSDB_SRC}"
      _checkout_merged "${TSDB_SRC}"
      # San 独立源码目录（与 NoSan 并行构建，互不干扰）
      git clone --branch "${_BRANCH}" --depth 50 \
        git@git.tdengine.net:rd-public/tsdb.git "${TSDB_SRC_SAN}"
      _checkout_merged "${TSDB_SRC_SAN}"

    - |
      # 确保 platform 工具仓库存在并为最新；flock 防止多 MR 并发时同时 clone/pull
      PLATFORM_DIR="${CI_BASE_DIR}/platform"
      PLATFORM_BRANCH="main"
      mkdir -p "$(dirname "${PLATFORM_DIR}")"
      (
        flock -x 9
        if [ ! -d "${PLATFORM_DIR}/.git" ]; then
          echo "[prepare] Cloning platform repo (branch: ${PLATFORM_BRANCH})..."
          git clone --branch "${PLATFORM_BRANCH}" \
            git@git.tdengine.net:rd-public/platform.git "${PLATFORM_DIR}"
        else
          echo "[prepare] Updating platform repo (branch: ${PLATFORM_BRANCH})..."
          git -C "${PLATFORM_DIR}" fetch origin --prune
          git -C "${PLATFORM_DIR}" checkout "${PLATFORM_BRANCH}" 2>/dev/null \
            || git -C "${PLATFORM_DIR}" checkout -b "${PLATFORM_BRANCH}" "origin/${PLATFORM_BRANCH}"
          git -C "${PLATFORM_DIR}" reset --hard "origin/${PLATFORM_BRANCH}"
        fi
      ) 9>${CI_BASE_DIR}/.platform-clone.lock

  artifacts:
    reports:
      dotenv: build.env
    expire_in: 1 day

# ======================================================================
# Stage: build — 串行三步：externals 预构建 → NoSan 与 San 并行
# ======================================================================
# 流水线设计：
#   build-externals (串行) → 构建全部第三方库，stamps 写入 externals-others-amd64/
#       ↓ needs
#   build-noasan (NoSan)   build-asan (ASAN)     ← 并行，各用独立源码目录
#   TSDB_SRC/debug-others/      TSDB_SRC_SAN/debug-others/
#
# 关键：三个 build job 统一使用 --image others:latest，ExternalProject stamp 存储在
#   TD_EXTERNALS_BASE_DIR（= /mnt/.externals = cache/externals-others-amd64/），
#   而非 debug/ 内。--clean 只清 debug/，stamps 始终存活。build-externals 完成后，
#   两个并行 job 的 cmake 均发现 stamps 已存在，跳过所有 externals，仅编译
#   TDengine 主体代码，彻底消除并行 externals 竞态。
# ======================================================================
build-externals:
  stage: build
  tags: [$TSDB_BUILDER_TAG]
  timeout: 60 minutes
  interruptible: true
  needs: [prepare-workspace, check-void, check-enum]
  extends: .rules-code-change

  script:
    - |
      echo "=== [build-externals] Pre-building all external dependencies ==="
      # 哨兵文件快速通道：若本分支的 external.cmake 自上次构建以来未变化，直接跳过 flock + cmake。
      # 不同分支（main/3.0/3.3.6）的 external.cmake 内容不同（如 main 无 ext_arrow），
      # 各分支独立维护一个哨兵文件，避免分支间互相误判造成不必要的重建。
      _branch_slug="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-${CI_COMMIT_REF_NAME}}"
      _branch_slug="${_branch_slug//[^a-zA-Z0-9._-]/_}"
      _cmake_file="${CI_PROJECT_DIR}/source/taos-community/cmake/external.cmake"
      _sentinel="${CI_CACHE_DIR}/externals-others-amd64/.externals-ready.${_branch_slug}.md5"
      if [ -f "${_sentinel}" ] && [ -f "${_cmake_file}" ]; then
          _expected=$(md5sum "${_cmake_file}" | awk '{print $1}')
          _actual=$(awk '{print $1}' "${_sentinel}" 2>/dev/null)
          if [ "${_expected}" = "${_actual}" ]; then
              echo "[build-externals] sentinel match (branch=${_branch_slug}), externals up-to-date, skipping"
              exit 0
          fi
          echo "[build-externals] sentinel mismatch (branch=${_branch_slug}), proceeding with build"
      else
          echo "[build-externals] no sentinel for branch '${_branch_slug}', proceeding with build"
      fi
      # flock: 多 MR 并发时排队，防止同时写入同一 externals 缓存目录导致踩踏。
      # 通过哨兵快速通道后，绝大多数 MR 在进入此处之前已 exit 0。
      (
        flock -x 9
        echo "[build-externals] acquired exclusive lock, checking sentinel again..."
        # 拿到锁后再次检查哨兵（双重检查锁定）：
        # 当多个 MR 并发时均未命中哨兵而进入此处，第一个 MR 完成构建并更新哨兵后，
        # 后续 MR 拿到锁再次检查，发现哨兵已匹配则直接跳过，避免重复构建。
        if [ -f "${_sentinel}" ] && [ -f "${_cmake_file}" ]; then
          _expected2=$(md5sum "${_cmake_file}" | awk '{print $1}')
          _actual2=$(awk '{print $1}' "${_sentinel}" 2>/dev/null)
          if [ "${_expected2}" = "${_actual2}" ]; then
            echo "[build-externals] sentinel match after lock (branch=${_branch_slug}), skipping rebuild"
            exit 0
          fi
        fi
        echo "[build-externals] starting build..."
        # cmake 3.21 bug 预处理：在 cmake configure 运行前，提前为 external.cmake 中所有
        # ExternalProject_Add 目标创建 PREFIX/tmp/ 目录。
        # cmake 3.21 在 configure 阶段会向 PREFIX/tmp/ 写 git clone/update 脚本，但不会
        # 自动先 mkdir（cmake 3.25+ 已修复）。若目录不存在则 configure_file 失败，build.sh
        # 非零返回，set -e 终止脚本，导致后面的 sentinel 写入和 post-cmake 补偿循环都跑不到。
        # 此处在 cmake 运行前统一预创建，彻底消除首次构建（空缓存）时的失败。
        _ext_debug_dir_pre="${CI_CACHE_DIR}/externals-others-amd64/build/Debug"
        while IFS= read -r _ext_name; do
          mkdir -p "${_ext_debug_dir_pre}/${_ext_name}/tmp" 2>/dev/null || true
        done < <(grep -oP 'ExternalProject_Add\(\Kext_\S+' "${_cmake_file}" 2>/dev/null)
        echo "[build-externals] pre-created tmp/ for all ExternalProject_Add targets (cmake 3.21 pre-fix)"
        # 清理 externals 缓存中残留的 devtoolset-7 CMakeCache（来自旧 core: 镜像）。
        # others:latest 用 gcc-toolset-14，路径不同；stale cache 会导致 ext_libs3 等
        # ExternalProject configure 步骤报 "compiler not found" 并失败。
        # 只删除 build 子目录和对应 stamp，install/ 中已安装的库不受影响。
        _ext_debug="${CI_CACHE_DIR}/externals-others-amd64/build/Debug"
        if [ -d "${_ext_debug}" ]; then
          while IFS= read -r _cache; do
            _bdir=$(dirname "$_cache")
            _ext=$(basename "$_bdir" | sed 's/-build$//')
            _sdir="$(dirname "$_bdir")/${_ext}-stamp"
            echo "[build-externals] stale devtoolset-7 cache, cleaning: ${_ext}"
            rm -rf "${_bdir}" "${_sdir}"
          done < <(find "${_ext_debug}" -name "CMakeCache.txt" \
                       -exec grep -l "devtoolset-7" {} \; 2>/dev/null)
        fi
        # Integrity check: if an external stamp exists but the installed library
        # is missing (partial/corrupted previous run), remove the stamp so
        # ExternalProject rebuilds it from scratch.
        _ext_ins="${CI_CACHE_DIR}/externals-others-amd64/install"
        _ext_stamp_base="${CI_CACHE_DIR}/externals-others-amd64/build/Debug"
        for _chk_file in \
            "ext_gtest/Debug/lib/libgtest_main.a" \
            "ext_gtest/Debug/lib/libgtest.a" \
            "ext_arrow/Debug/lib/libarrow.a" \
            "ext_arrow/Debug/lib/libparquet.a" ; do
          if [ ! -f "${_ext_ins}/${_chk_file}" ]; then
            _ext_name=$(echo "${_chk_file}" | cut -d/ -f1)
            _stamp_dir="${_ext_stamp_base}/${_ext_name}-stamp"
            if [ -d "${_stamp_dir}" ]; then
              echo "[build-externals] integrity check: ${_chk_file} missing, removing stamp to force rebuild"
              rm -rf "${_ext_stamp_base}/${_ext_name}-build" "${_stamp_dir}"
            fi
          fi
        done
        ${CI_BASE_DIR}/platform/tsdb-builder/build.sh \
          --image ${BUILDER_SCRIPT_IMAGE} \
          --src "${TSDB_SRC}" \
          --cache ${CI_CACHE_DIR}/ \
          --clean \
          --make-target build_externals \
          -DCMAKE_BUILD_TYPE=Debug \
          -DBUILD_TEST=ON \
          -DBUILD_COVERAGE=ON \
          -DBUILD_ENTERPRISE=ON \
          -DBUILD_ENGINE=ON \
          -DBUILD_ASSERT_NOT_CORE=OFF \
          -DBUILD_KEEPER=ON \
          -DBUILD_ADAPTER=ON \
          -DBUILD_RUST=ON \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DBUILD_SANITIZER=OFF \
          -DBUILD_CONTRIB=ON \
          -DBUILD_TOOLS=ON
        # 构建成功，更新哨兵文件（供本分支后续 MR 快速跳过）
        md5sum "${_cmake_file}" > "${_sentinel}"
        echo "[build-externals] sentinel updated for branch '${_branch_slug}': ${_sentinel}"
        # cmake 3.21 并发兜底：build-noasan/asan cmake configure 与 build-externals 并发时，
        # 若 build-externals 的 cmake 刚创建了新的 ext_*/ 目录但还未写入 tmp/，另一个 MR 的
        # noasan/asan cmake configure 可能先于此处运行而看不到 tmp/。
        # 在 flock -x 内补一遍，确保独占锁释放后所有 ext_*/tmp/ 均存在。
        _ext_debug_dir="${CI_CACHE_DIR}/externals-others-amd64/build/Debug"
        for _ext_dir in "${_ext_debug_dir}"/ext_*/; do
          [ -d "${_ext_dir}" ] && mkdir -p "${_ext_dir}/tmp" "${_ext_dir}/src" 2>/dev/null || true
        done
        echo "[build-externals] post-cmake: ensured tmp/src for all ext_* (concurrency safety)"
      ) 9>${CI_CACHE_DIR}/.externals-build.lock
      echo "=== [build-externals] Externals done ==="
      # 若切换回 --image core:${BUILDER_IMAGE_TAG}，需要将 externals-core-amd64 符号链接到 externals-others-amd64：
      # ln -sfn "${CI_CACHE_DIR}/externals-core-amd64" \
      #         "${CI_CACHE_DIR}/externals-others-amd64" 2>/dev/null || true
      # echo "[build-externals] externals-others-amd64 -> externals-core-amd64 (symlink)"

  after_script:
    - |
      echo "=== externals cache size ==="
      du -sh ${CI_CACHE_DIR}/externals-others-amd64/ 2>/dev/null || true
      # du -sh ${CI_CACHE_DIR}/externals-core-amd64/ 2>/dev/null || true  # 切换回 core 镜像时改此行

build-noasan:
  stage: build
  tags: [$TSDB_BUILDER_TAG]
  timeout: 60 minutes
  interruptible: true
  needs: [prepare-workspace, build-externals]
  extends: .rules-code-change

  script:
    - |
      echo "=== [build-noasan] Building NoSan ==="
      _EXT_INSTALL="${CI_CACHE_DIR}/externals-others-amd64/install"
      # 读写锁模式：共享锁（flock -s）持有 **整个 build 过程**。
      # 多个共享锁可以并存 → 同一台 builder 上所有 MR 的 noasan/asan 可以同时运行。
      # build-externals（独占锁）必须等待所有共享锁释放后才能写入 externals 缓存，
      # noasan/asan 也会等待 build-externals 的独占锁释放后才开始读取。
      # 这样无论多少 MR 并发，都不会出现 build-externals 写入时 noasan/asan 正在链接的竞态。
      (
        flock -s 9
        echo "[build-noasan] acquired shared lock (held for entire build)"
        # 验证关键 externals 文件存在（提前失败，避免晦涩的链接错误）
        for _p in ext_libs3/Debug/lib/liblibs3.a ext_curl/Debug/lib/libcurl.a ext_zlib/Debug/lib/libz.a; do
          if [ ! -f "${_EXT_INSTALL}/${_p}" ]; then
            echo "FATAL: Missing external: ${_EXT_INSTALL}/${_p}"
            echo "Available externals:"
            find "${_EXT_INSTALL}" -name '*.a' -type f 2>/dev/null | head -30
            exit 1
          fi
        done
        echo "[build-noasan] externals validation passed, starting build"
        ${CI_BASE_DIR}/platform/tsdb-builder/build.sh \
            --image ${BUILDER_SCRIPT_IMAGE} \
            --src "${TSDB_SRC}" \
            --cache ${CI_CACHE_DIR}/ \
            --clean \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TEST=ON \
            -DBUILD_COVERAGE=ON \
            -DBUILD_ENTERPRISE=ON \
            -DBUILD_ENGINE=ON \
            -DBUILD_ASSERT_NOT_CORE=OFF \
            -DBUILD_TOOLS=ON \
            -DBUILD_KEEPER=ON \
            -DBUILD_ADAPTER=ON \
            -DBUILD_RUST=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_SANITIZER=OFF \
            -DROCKSDB_USE_DEPS=OFF \
            -DTD_EXTERNALS_USE_ONLY=ON
      ) 9>>${CI_CACHE_DIR}/.externals-build.lock
      echo "=== [build-noasan] NoSan done: $(ls ${TSDB_SRC}/debug-others/build/bin | wc -l) binaries ==="

  after_script:
    - mkdir -p "${CI_PROJECT_DIR}/build-logs"
    - cp "${TSDB_SRC}/build.log" "${CI_PROJECT_DIR}/build-logs/build-nosan.log" 2>/dev/null || true

  artifacts:
    when: always
    paths:
      - build-logs/build-nosan.log
    expire_in: 7 days

build-asan:
  stage: build
  tags: [$TSDB_BUILDER_TAG]
  timeout: 90 minutes
  interruptible: true
  needs: [prepare-workspace, build-externals]
  extends: .rules-code-change

  script:
    - |
      echo "=== [build-asan] Building ASAN ==="
      _EXT_INSTALL="${CI_CACHE_DIR}/externals-others-amd64/install"
      # 同 build-noasan：共享锁（flock -s）持有**整个 build 过程**，实现读写锁语义。
      # 多个 noasan/asan（来自不同 MR）可同时持共享锁，互不干扰。
      # build-externals（独占锁）与所有 noasan/asan（共享锁）互斥，保证 externals 缓存一致性。
      (
        flock -s 9
        echo "[build-asan] acquired shared lock (held for entire build)"
        for _p in ext_libs3/Debug/lib/liblibs3.a ext_curl/Debug/lib/libcurl.a ext_zlib/Debug/lib/libz.a; do
          if [ ! -f "${_EXT_INSTALL}/${_p}" ]; then
            echo "FATAL: Missing external: ${_EXT_INSTALL}/${_p}"
            echo "Available externals:"
            find "${_EXT_INSTALL}" -name '*.a' -type f 2>/dev/null | head -30
            exit 1
          fi
        done
        echo "[build-asan] externals validation passed, starting build"
        ${CI_BASE_DIR}/platform/tsdb-builder/build.sh \
            --image ${BUILDER_SCRIPT_IMAGE} \
            --src "${TSDB_SRC_SAN}" \
            --cache ${CI_CACHE_DIR}/ \
            --clean \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TEST=OFF \
            -DBUILD_ENTERPRISE=ON \
            -DBUILD_ENGINE=ON \
            -DBUILD_ASSERT_NOT_CORE=OFF \
            -DBUILD_TOOLS=ON \
            -DBUILD_KEEPER=ON \
            -DBUILD_ADAPTER=ON \
            -DBUILD_RUST=ON \
            -DBUILD_SANITIZER=ON \
            -DTOOLS_SANITIZE=ON \
            -DJEMALLOC_ENABLED=0 \
            -DROCKSDB_USE_DEPS=OFF \
            -DTD_EXTERNALS_USE_ONLY=ON
      ) 9>>${CI_CACHE_DIR}/.externals-build.lock
      echo "=== [build-asan] ASAN done: $(ls ${TSDB_SRC_SAN}/debug-others/build/bin | wc -l) binaries ==="

  after_script:
    - mkdir -p "${CI_PROJECT_DIR}/build-logs"
    - cp "${TSDB_SRC_SAN}/build.log" "${CI_PROJECT_DIR}/build-logs/build-asan.log" 2>/dev/null || true

  artifacts:
    when: always
    paths:
      - build-logs/build-asan.log
    expire_in: 7 days

# ======================================================================
# Stage: quality — 代码质量检查
# ======================================================================
check-assert:
  stage: quality
  tags: [$TSDB_BUILDER_TAG]
  timeout: 10 minutes
  interruptible: true
  needs: [prepare-workspace, build-noasan]
  extends: .rules-code-change

  script:
    - |
      # count_assert.py 通过 self_path.find("community") 推算项目根目录；
      # 在 /mnt/source/taos-community/… 路径下会截断错误，故建立 symlink
      # 让脚本看到期望的 /check/community 和 /check/enterprise 结构。
      docker run --rm \
        -v "${TSDB_SRC}/source/taos-community":/check/community:ro \
        -v "${TSDB_SRC}/source/taos-internal":/check/enterprise:ro \
        ${BUILDER_IMAGE} bash -c "
          pip3 install loguru -q
          python3 /check/community/test/ci/count_assert.py
        "

  after_script:
    - echo "[check-assert] done"

  artifacts:
    when: on_failure
    paths:
      - build-logs/
    expire_in: 7 days

check-void:
  stage: check
  tags: [$TSDB_BUILDER_TAG]
  timeout: 10 minutes
  interruptible: true
  needs: [prepare-workspace]
  extends: .rules-code-change

  script:
    - |
      docker run --rm \
        -v "${TSDB_SRC}":/mnt \
        ${BUILDER_IMAGE} bash -c "
          bash /mnt/source/taos-community/test/ci/check_void.sh \
            -c /mnt/source/taos-community/test/ci/func.txt \
            -f /mnt/source/taos-community/source/
        "

  after_script:
    - mkdir -p "${CI_PROJECT_DIR}/build-logs"
    - cp "${TSDB_SRC}/check-void.log" "${CI_PROJECT_DIR}/build-logs/" 2>/dev/null || true

  artifacts:
    when: always
    paths:
      - build-logs/check-void.log
    expire_in: 7 days

check-enum:
  stage: check
  tags: [$TSDB_BUILDER_TAG]
  timeout: 15 minutes
  interruptible: true
  allow_failure: true    # enum 检查失败不阻塞 build 阶段，仅警告
  needs: []
  extends: .rules-code-change

  script:
    - |
      # 仅 MR 触发时有 diff 上下文；schedule/web 跳过
      if [ "${CI_PIPELINE_SOURCE}" != "merge_request_event" ]; then
        echo "[check-enum] Non-MR pipeline, skipping."
        exit 0
      fi
      TARGET_BRANCH="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"
      echo "[check-enum] Target branch: ${TARGET_BRANCH}"

      # 使用 CI_PROJECT_DIR（GitLab runner 直接 checkout 的 source branch HEAD）
      # 而不是 TSDB_SRC（_checkout_merged 得到的合并结果），原因：
      #   refs/merge-requests/<IID>/merge 由 GitLab 异步计算，pipeline 启动后可能
      #   尚未更新到最新 commit，导致 TSDB_SRC 拿到旧的合并结果，漏检。
      #   CI_PROJECT_DIR 由 runner 直接 checkout source branch HEAD，无竞态。
      cd "${CI_PROJECT_DIR}"
      git fetch origin "${TARGET_BRANCH}" --depth=1

      # FETCH_HEAD = target branch tip；HEAD = source branch HEAD（CI_COMMIT_SHA）
      # 两点 diff：不依赖 merge-base，浅克隆安全
      CHANGED_FILES=$(git diff --name-only FETCH_HEAD HEAD \
        | grep -E '\.(c|h)$' || true)

      if [ -z "${CHANGED_FILES}" ]; then
        echo "[check-enum] No changed C/H files, skipping."
        exit 0
      fi

      echo "[check-enum] Changed C/H files:"
      echo "${CHANGED_FILES}"

      # 写入临时文件供容器内 readarray 使用
      echo "${CHANGED_FILES}" > "${CI_PROJECT_DIR}/.enum_check_files"

      docker run --rm \
        -v "${CI_PROJECT_DIR}":/mnt \
        ${BUILDER_IMAGE} bash -c "
          pip3 install libclang -q 2>&1 | tail -1
          cd /mnt
          readarray -t FILES < .enum_check_files
          python3 source/taos-community/.github/scripts/check_enum_append_only.py \
            --base-branch origin/${TARGET_BRANCH} \
            \"\${FILES[@]}\"
        "

  after_script:
    - rm -f "${CI_PROJECT_DIR}/.enum_check_files" 2>/dev/null || true

# ======================================================================
# Stage: verify — 单元测试（code-quality 通过后才执行）
# ======================================================================
unit-test:
  stage: verify
  tags: [$TSDB_BUILDER_TAG]
  timeout: 40 minutes
  interruptible: true
  needs: [prepare-workspace, build-noasan, check-assert, check-void]
  extends: .rules-code-change

  script:
    - |
      # ── 在容器内运行 ctest，生成 JUnit XML + 原始日志 ──────────────────────
      cat > "${TSDB_SRC}/.ctest-runner.sh" << 'RUNNER_EOF'
      #!/bin/bash
      set -e
      # 提高文件描述符限制，避免 stmt2Test 等用例 "Too many open files"
      ulimit -n 1048576 2>/dev/null || ulimit -n 65536 2>/dev/null || true
      pgrep taosd > /dev/null 2>&1 || /mnt/debug-others/build/bin/taosd > /dev/null 2>&1 &
      sleep 10
      cd /mnt/debug-others/source/taos-community
      ctest -E 'cunit_test|pcre*|example*|clientTest|connectOptionsTest|tmqTest|taoscTest|cosTest|tcs_test|osFileTests|decompressTest|idxFstTest|sessionTest' \
          --output-on-failure --output-junit /mnt/junit.xml --timeout 1200 -j8 2>&1 | tee /mnt/ctest.log
      ctest_ret=${PIPESTATUS[0]}
      if grep -q 'No tests were found' /mnt/ctest.log; then
          echo 'ERROR: No tests were found' | tee -a /mnt/ctest.log
          exit 1
      fi
      /mnt/debug-others/build/bin/clientTest 2>&1 | tee -a /mnt/ctest.log
      client_ret=${PIPESTATUS[0]}
      /mnt/debug-others/build/bin/connectOptionsTest 2>&1 | tee -a /mnt/ctest.log
      connect_ret=${PIPESTATUS[0]}
      overall=0
      [ "${ctest_ret}" -eq 0 ]   || { overall=${ctest_ret};   echo "[FAIL] ctest exited ${ctest_ret}" | tee -a /mnt/ctest.log; }
      [ "${client_ret}" -eq 0 ]  || { overall=${client_ret};  echo "[FAIL] clientTest exited ${client_ret}" | tee -a /mnt/ctest.log; }
      [ "${connect_ret}" -eq 0 ] || { overall=${connect_ret}; echo "[FAIL] connectOptionsTest exited ${connect_ret}" | tee -a /mnt/ctest.log; }
      exit ${overall}
      RUNNER_EOF
      chmod +x "${TSDB_SRC}/.ctest-runner.sh"
      timeout 1200 docker run --rm --privileged \
        -v "${TSDB_SRC}":/mnt \
        ${BUILDER_IMAGE} bash /mnt/.ctest-runner.sh
      ctest_rc=$?
      [ $ctest_rc -eq 124 ] && echo '[ERROR] unit-test TIMEOUT' | tee -a "${TSDB_SRC}/ctest.log"

    - |
      # ── 解析失败用例，在 job 日志中打印折叠的详情 + 汇总表 ─────────────────
      LOG="${TSDB_SRC}/ctest.log"

      # 提取失败用例名（ctest 输出格式："  N - TestName (Failed)"）
      mapfile -t FAILED_NAMES < <(
        grep -E '^\s+[0-9]+ - .+ \(Failed\)' "${LOG}" 2>/dev/null \
          | sed 's/^\s*[0-9]* - //' | sed 's/ (Failed)$//' || true
      )

      if [ ${#FAILED_NAMES[@]} -gt 0 ]; then
        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  FAILED UNIT TESTS: ${#FAILED_NAMES[@]}"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

        for name in "${FAILED_NAMES[@]}"; do
          sec_id="ut_$(echo "${name}" | tr -dc 'a-zA-Z0-9' | head -c 40)"
          # 折叠块：默认收起，点击展开
          echo -e "\e[0Ksection_start:$(date +%s):${sec_id}[collapsed=true]\r\e[0K❌ ${name}"
          # 提取该用例的输出块（在两行 "---------" 之间）
          awk "/^Output from ${name}:/{found=1; next}
               found && /^-{40}/{count++; if(count==2){found=0; count=0; next}}
               found{print}" "${LOG}" | head -300
          echo -e "\e[0Ksection_end:$(date +%s):${sec_id}\r\e[0K"
        done

        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  SUMMARY — Failed test cases:"
        for name in "${FAILED_NAMES[@]}"; do
          echo "    ❌  ${name}"
        done
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      else
        # 从 ctest 汇总行提取通过数
        PASS_LINE=$(grep -E 'tests passed' "${LOG}" 2>/dev/null | tail -1 || true)
        echo ""
        echo "✅  All unit tests passed. ${PASS_LINE}"
      fi
      exit ${ctest_rc}

  after_script:
    - mkdir -p "${CI_PROJECT_DIR}/build-logs"
    - cp "${TSDB_SRC}/ctest.log"  "${CI_PROJECT_DIR}/build-logs/" 2>/dev/null || true
    - cp "${TSDB_SRC}/junit.xml"  "${CI_PROJECT_DIR}/build-logs/" 2>/dev/null || true

  artifacts:
    when: always
    paths:
      - build-logs/ctest.log
    reports:
      junit: build-logs/junit.xml
    expire_in: 7 days



# ======================================================================
# Stage: upload — 追加 San 构建，打包两份产物上传 Nexus
# ======================================================================
# 产物目录结构（Nexus）：
#   ${NEXUS_PATH}/nosan/linux-x64-nosan.tar.gz  — 非 ASAN 二进制
#   ${NEXUS_PATH}/san/linux-x64-san.tar.gz      — ASAN 内置二进制
#
# 二进制清单（对齐 legacy transfer_debug_dirs）：
#   taos*, taosd, taosadapter, taoskeeper, taosBenchmark, taosudf*
#   tmq_*, sml_test, get_db_name_test, replay_test, varbinary_test, write_raw_block_test
#   create_table, asyncdemo
# lib/：cp -rP 保留 .so 符号链接（libtaos.so → libtaos.so.3 → libtaos.so.3.X.Y.Z）
# share/：taosd 配置模板等运行时资源
#
# CI_NO_ASAN=1 用法：
#   始终由 run_container.sh 注入（不论用例 san 字段为 y/n）。
#   debugSan 二进制通过 -DBUILD_SANITIZER=1 内置 ASAN，运行时自动激活，
#   不需要外部 LD_PRELOAD 注入；而 Python fork + LD_PRELOAD=libasan 在
#   Ubuntu 24.04（kernel 6.8）会导致死锁，因此两种构建均设置 CI_NO_ASAN=1。
# ======================================================================
upload-nexus:
  stage: upload
  tags: [$TSDB_BUILDER_TAG]
  timeout: 30 minutes
  # unit-test 与 upload-nexus 均在 quality 通过后并行执行。
  needs: [prepare-workspace, build-noasan, build-asan, check-assert, check-void]
  extends: .rules-code-change

  script:
    # ── Step 1: 打包两份产物 ─────────────────────────────────────────────────
    # NoSan: ${TSDB_SRC}/debug-others/         (来自 build-noasan job)
    # San:   ${TSDB_SRC_SAN}/debug-others/     (来自 build-asan  job，独立源码目录)
    # 内部结构：debug-others/build/{bin,lib,share}/
    # 下载端（pull-artifacts.sh）解压后 mv debug-others/ → debugNoSan/ 或 debugSan/
    - |
      pack_variant() {
        local label=$1     # nosan | san
        local src_debug=$2 # 源 debug 目录的绝对路径（${TSDB_SRC}/debugNoSan 等）
        local out_tar=$3   # 输出 tar.gz 路径

        local BIN_SRC="${src_debug}/build/bin"
        local LIB_SRC="${src_debug}/build/lib"
        local SHARE_SRC="${src_debug}/build/share"

        echo "[pack] [${label}] Validating binaries..."
        for bin in taos taosd taosadapter taoskeeper taosBenchmark; do
          [ -f "${BIN_SRC}/${bin}" ] || { echo "[FAIL] [${label}] ${bin}: NOT FOUND"; return 1; }
          echo "  [OK] ${bin}: $(du -h "${BIN_SRC}/${bin}" | cut -f1)"
        done
        [ -f "${LIB_SRC}/libtaos.so" ] || \
          ls "${LIB_SRC}"/libtaos.so* > /dev/null 2>&1 || \
          { echo "[FAIL] [${label}] libtaos.so: NOT FOUND"; return 1; }

        # ctest 二进制
        echo "[pack] [${label}] ctest binaries:"
        for bin in replay_test sml_test get_db_name_test varbinary_test write_raw_block_test; do
          [ -f "${BIN_SRC}/${bin}" ] && echo "  [OK] ${bin}" \
            || echo "  [MISSING] ${bin} (check cmake BUILD_TEST=ON)"
        done

        local TAR_ROOT="${TSDB_SRC}/staging-${label}"
        local TAR_BIN="${TAR_ROOT}/debug/build/bin"
        local TAR_LIB="${TAR_ROOT}/debug/build/lib"
        local TAR_SHARE="${TAR_ROOT}/debug/build/share"
        mkdir -p "${TAR_BIN}" "${TAR_LIB}"

        # 运行时 + ctest 二进制（对齐 legacy transfer_debug_dirs 列表）
        find "${BIN_SRC}" -maxdepth 1 -type f -executable \
          | grep -E '/(taos[^/]*|taosd[^/]*|tmq_[^/]*|sml_[^/]*|get_db[^/]*|replay_test|varbinary_test|write_raw_block_test|create_table|asyncdemo|taosudf[^/]*|grantTest)$' \
          | xargs -I{} cp {} "${TAR_BIN}/" 2>/dev/null || true
        # taosd 可能被 taos* 通配覆盖，单独确保
        [ -f "${BIN_SRC}/taosd" ] && cp "${BIN_SRC}/taosd" "${TAR_BIN}/" || true

        # lib：cp -rP 保留相对符号链接（libtaos.so → libtaos.so.3 → libtaos.so.3.X.Y.Z）
        # 包含 libtaos, libtaosnative, libtaosws, librocksdb 等所有 .so*
        if ls "${LIB_SRC}"/*.so* > /dev/null 2>&1; then
          cp -rP "${LIB_SRC}/." "${TAR_LIB}/"
        fi
        # 清理 lib 中非 .so 文件（cmake 产物：.a, .cmake 等）防止打包过大
        find "${TAR_LIB}" -maxdepth 1 -not -name '*.so*' -not -type d -delete 2>/dev/null || true

        # share/（taosd 配置模板等运行时资源）
        if [[ -d "${SHARE_SRC}" ]]; then
          mkdir -p "${TAR_SHARE}"
          cp -r "${SHARE_SRC}/." "${TAR_SHARE}/"
        fi

        # include/：打包 C 头文件供测试容器 -I 使用
        local TAR_INC="${TAR_ROOT}/debug/include"
        mkdir -p "${TAR_INC}"
        local COMM_SRC="${TSDB_SRC}/source/taos-community"
        for hdr in \
            "${COMM_SRC}/include/client/taos.h" \
            "${COMM_SRC}/include/common/taosdef.h" \
            "${COMM_SRC}/include/util/taoserror.h" \
            "${COMM_SRC}/include/libs/function/taosudf.h"; do
          [ -f "${hdr}" ] && cp "${hdr}" "${TAR_INC}/" \
            || echo "[WARN] [${label}] header not found: $(basename ${hdr})"
        done
        # taosws.h 由 Rust connector 构建时生成
        local TAOSWS_H="${src_debug}/build/taos-connector-rust/target/debug/taosws.h"
        [ -f "${TAOSWS_H}" ] && cp "${TAOSWS_H}" "${TAR_INC}/" \
          || echo "[WARN] [${label}] taosws.h not found at rust target dir"

        # libtaosws.so：若 build/lib 中不存在，从 rust target output 补充
        if ! ls "${TAR_LIB}"/libtaosws.so* > /dev/null 2>&1; then
          local TAOSWS_SO="${src_debug}/build/taos-connector-rust/output/libtaosws.so"
          if [ -f "${TAOSWS_SO}" ]; then
            cp "${TAOSWS_SO}" "${TAR_LIB}/"
            echo "[pack] [${label}] added libtaosws.so from rust output dir"
          else
            echo "[WARN] [${label}] libtaosws.so not found in build/lib or rust output"
          fi
        fi

        # asan 编译时 BUILD_TEST=OFF，从 noasan build 补充 ctest 测试二进制和 UDF .so
        if [[ "${label}" == "asan" ]]; then
          _NOSAN_BIN="${TSDB_SRC}/debug-others/build/bin"
          _NOSAN_LIB="${TSDB_SRC}/debug-others/build/lib"
          echo "[pack] [asan] Supplementing test-only binaries from noasan build..."
          for _tbin in tmq_get_meta_json tmq_vtable tmq_batch_alter_tag tmq_taosx_ci tmq_sim \
                       replay_test sml_test get_db_name_test varbinary_test write_raw_block_test; do
            if [ -f "${_NOSAN_BIN}/${_tbin}" ]; then
              cp "${_NOSAN_BIN}/${_tbin}" "${TAR_BIN}/"
              echo "  [OK] ${_tbin}"
            else
              echo "  [WARN] ${_tbin} not found in noasan build"
            fi
          done
          echo "[pack] [asan] Supplementing UDF .so from noasan lib..."
          for _so in libudf1.so libudf2.so libudftd.so libperm_entropy.so; do
            if [ -f "${_NOSAN_LIB}/${_so}" ]; then
              cp "${_NOSAN_LIB}/${_so}" "${TAR_LIB}/"
              echo "  [OK] ${_so}"
            else
              echo "  [WARN] ${_so} not found in noasan lib"
            fi
          done
        fi

        echo "[pack] [${label}] $(ls "${TAR_BIN}" | wc -l) binaries, $(ls "${TAR_LIB}" | wc -l) libs, $(ls "${TAR_INC}" | wc -l) headers"
        (cd "${TAR_ROOT}" && tar czf "${out_tar}" debug/)
        rm -rf "${TAR_ROOT}"
        echo "[pack] [${label}] $(du -h "${out_tar}" | cut -f1) → $(basename ${out_tar})"
      }

      STAGING="${TSDB_SRC}/staging"
      mkdir -p "${STAGING}/noasan" "${STAGING}/asan"
      pack_variant "noasan" "${TSDB_SRC}/debug-others"     "${STAGING}/noasan/linux-x64-noasan.tar.gz"
      pack_variant "asan"   "${TSDB_SRC_SAN}/debug-others" "${STAGING}/asan/linux-x64-asan.tar.gz"
      echo "=== Staging contents ==="
      ls -lh "${STAGING}/noasan/" "${STAGING}/asan/"

    # ── Step 4: 安装 platform-cli 并上传至 Nexus ───────────────────────────
    - |
      # 将 platform-cli 安装到 pipeline 专属目录（$CI_PROJECT_DIR/.local/bin）。
      # install.sh 的第二个参数即 INSTALL_DIR，每个 pipeline 有独立路径，
      # 完全避免并发 pipeline 共享 $HOME/.local/bin/platform-cli 导致的
      # ETXTBSY / curl exit 23 问题，也无需 flock 串行化。
      _CLI_DIR="$CI_PROJECT_DIR/.local/bin"
      echo "[upload-nexus] Installing platform-cli to ${_CLI_DIR}..."
      curl -fsSL --retry 3 --retry-all-errors --retry-delay 3 \
        https://nexus.tdengine.net/repository/platform/platform-cli/install.sh | \
        NEXUS_URL=https://nexus.tdengine.net NEXUS_REPO=platform bash -s -- latest "${_CLI_DIR}" \
        || { echo "[FATAL] platform-cli install failed"; exit 1; }
      export PATH="${_CLI_DIR}:$PATH"

      if [ "${PARENT_PIPELINE_SOURCE}" = "merge_request_event" ]; then
        NEXUS_PATH="tsdb/ci/mr${CI_MERGE_REQUEST_IID}/linux/x64"
      elif [ "${PARENT_PIPELINE_SOURCE}" = "schedule" ]; then
        NEXUS_PATH="tsdb/daily/$(date +%Y%m%d)/${CI_COMMIT_BRANCH}/linux/x64"
      elif [ "${PARENT_PIPELINE_SOURCE}" = "web" ]; then
        NEXUS_PATH="tsdb/release/${RELEASE_VERSION:-${CI_COMMIT_TAG:-manual}}/linux/x64"
      else
        NEXUS_PATH="tsdb/ci/branch-${CI_COMMIT_BRANCH}/linux/x64"
      fi
      echo "Nexus dest: ${NEXUS_PATH}"

      HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
        -u "${NEXUS_USERNAME}:${NEXUS_PASSWORD}" \
        "${NEXUS_URL}/service/rest/v1/status/check")
      [ "${HTTP_STATUS}" = "200" ] || { echo "ERROR: Nexus auth failed (${HTTP_STATUS})"; exit 1; }

      STAGING="${TSDB_SRC}/staging"
      # 分别上传 nosan/ 和 san/ 子目录，对应 Nexus 路径 ${NEXUS_PATH}/nosan/  和  /san/
      platform-cli nexus \
        --url "${NEXUS_URL}" --repo "${NEXUS_REPO}" \
        --username "${NEXUS_USERNAME}" --password "${NEXUS_PASSWORD}" \
        upload \
        --dir "${STAGING}/noasan" \
        --dest "${NEXUS_PATH}/noasan" \
        || { echo "ERROR: NoAsan upload failed"; exit 1; }

      platform-cli nexus \
        --url "${NEXUS_URL}" --repo "${NEXUS_REPO}" \
        --username "${NEXUS_USERNAME}" --password "${NEXUS_PASSWORD}" \
        upload \
        --dir "${STAGING}/asan" \
        --dest "${NEXUS_PATH}/asan" \
        || { echo "ERROR: Asan upload failed"; exit 1; }

      echo "Upload complete."
      echo "  noasan: ${NEXUS_URL}/repository/${NEXUS_REPO}/${NEXUS_PATH}/noasan/"
      echo "  asan:   ${NEXUS_URL}/repository/${NEXUS_REPO}/${NEXUS_PATH}/asan/"

  after_script:
    - rm -rf "${TSDB_SRC}/staging" 2>/dev/null || true

  artifacts:
    expire_in: 7 days

# ======================================================================
# Stage: test — 分布式执行系统测试（per-case NoSan/San 路由）
# ======================================================================
# 用例路由机制：
#   cases.task 第3字段 y → run_container.sh 使用 $WORKDIR/debugSan/ 
#                          (ASAN 内置，不注入 LD_PRELOAD)
#   cases.task 第3字段 n → run_container.sh 使用 $WORKDIR/debugNoSan/
#   两种情况均设置 CI_NO_ASAN=1（见 run_container.sh 注释）
# ======================================================================
.test-linux-base:
  stage: test
  timeout: 240 minutes
  needs: [upload-nexus, prepare-workspace]
  extends: .rules-code-change
  interruptible: true

  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: "1"
    # TEST_CONCURRENCY 不再硬编码：run-test-dynamic.sh 通过 flock 计数器感知
    # 本机同时在跑的 pipeline 数，自动计算 floor(nproc*0.8/active_pipelines)，
    # 限定在 [2, 16]。10 条并行 PR 和 1 条 PR 均能自适应，互不踩踏。
    # 如需手动覆盖，在具体 job 的 variables 中设置 TEST_CONCURRENCY: "N"。
    POLL_INTERVAL: "3"
    MAX_IDLE_SECONDS: "1200"
    # COORDINATOR_HOST 由 prepare-workspace 自动探测 builder IP 并写入 build.env dotenv

  script:
    - export WORKDIR="${CI_BASE_DIR}/job-${CI_JOB_ID}"
    - export PATH="$HOME/.local/bin:$PATH"
    - |
      echo "=== Test Node ${CI_NODE_INDEX} (dynamic coordinator mode) ==="
      echo "Runner: $(hostname)  Job: ${CI_JOB_ID}"
      echo "MR/Pipeline: ${CI_MERGE_REQUEST_IID:-N/A} / ${CI_PIPELINE_ID}"
      echo "WORKDIR: ${WORKDIR}"
    - bash "${CI_PROJECT_DIR}/tests/ci/scripts/sparse-checkout.sh"
    - |
      # pull-artifacts.sh 自动计算 BASE_PATH，下载 noasan/ 和 asan/ 两份产物
      if [ "${PARENT_PIPELINE_SOURCE}" = "merge_request_event" ]; then
        export OVERRIDE_NEXUS_PATH="tsdb/ci/mr${CI_MERGE_REQUEST_IID}/linux/x64"
      elif [ "${PARENT_PIPELINE_SOURCE}" = "schedule" ]; then
        export OVERRIDE_NEXUS_PATH="tsdb/daily/$(date +%Y%m%d)/${CI_COMMIT_BRANCH}/linux/x64"
      elif [ "${PARENT_PIPELINE_SOURCE}" = "web" ]; then
        export OVERRIDE_NEXUS_PATH="tsdb/release/${RELEASE_VERSION:-manual}/linux/x64"
      else
        export OVERRIDE_NEXUS_PATH="tsdb/ci/branch-${CI_COMMIT_BRANCH}/linux/x64"
      fi
      echo "Nexus path: ${OVERRIDE_NEXUS_PATH}"
    - bash "${CI_PROJECT_DIR}/tests/ci/scripts/pull-artifacts.sh"
    - |
      # ── Step 3: 等待协调器就绪 ──────────────────────────────────────────
      # COORDINATOR_HOST 由 prepare-workspace 在 builder 上自动探测本机 IP 并写入
      # build.env dotenv artifact，test-linux 通过 needs 继承，无需任何手动配置。
      _COORD_PORT=$(( CI_PIPELINE_ID % 10000 + 20000 ))
      export COORDINATOR_URL="http://${COORDINATOR_HOST}:${_COORD_PORT}"
      echo "Waiting for coordinator at ${COORDINATOR_URL}/api/status ..."
      _wait_ok=0
      for i in $(seq 1 120); do
        if curl -sf --max-time 3 "${COORDINATOR_URL}/api/status" >/dev/null 2>&1; then
          echo "Coordinator is ready."
          _wait_ok=1
          break
        fi
        echo "  attempt ${i}/120, retrying in 5s..."
        sleep 5
      done
      if [[ "${_wait_ok}" == "0" ]]; then
        echo "ERROR: coordinator did not become available after 600s (120 × 5s)."
        echo "  If you only retried this worker job, please also retry the coordinator job."
        exit 1
      fi
    - bash "${CI_PROJECT_DIR}/tests/ci/scripts/run-test-dynamic.sh"

  artifacts:
    when: on_failure   # reports.junit 不受 when 限制，始终上传；paths 仅在失败时上传，避免 413
    reports:
      junit: "results/junit-*.xml"
    paths:
      - "results/logs/*/run.log.txt"   # 每个失败用例的运行日志
      - "results/junit-*.xml"          # JUnit 报告
    expire_in: 7 days

  after_script:
    - |
      WORKDIR="${CI_BASE_DIR}/job-${CI_JOB_ID}"
      SLOT_DIR="${WORKDIR}/slots-n${CI_NODE_INDEX}"
      LOGS_DIR="${CI_PROJECT_DIR}/results/logs"
      echo "=== [after_script] Stopping containers for job ${CI_JOB_ID} ==="
      docker ps --filter "name=tdci-${CI_JOB_ID}" --format "{{.Names}}" 2>/dev/null \
        | xargs -r docker stop --time 15 2>/dev/null || true
      sleep 2
      docker ps --filter "name=tdci-${CI_JOB_ID}" --format "{{.Names}}" 2>/dev/null \
        | xargs -r docker kill 2>/dev/null || true
      echo "=== [after_script] Collecting partial logs ==="
      mkdir -p "${LOGS_DIR}"
      # 遍历所有 thread_volume 下每个线程号目录
      find "${WORKDIR}/tmp/thread_volume" -mindepth 1 -maxdepth 1 -type d 2>/dev/null \
        | sort | while IFS= read -r tvol; do
          tnum=$(basename "${tvol}")
          # 直接读 tnum 级 slug 映射，无需计算 TEST_CONCURRENCY
          slug_file="${SLOT_DIR}/tnum-${tnum}.slug"
          if [[ -f "${slug_file}" ]]; then
            dest="${LOGS_DIR}/$(cat "${slug_file}")"
          else
            dest=""   # 未知用例（超时/killed），fallback 到 t{tnum}-* 平铺
          fi
          # sim/ 下保留原始路径结构，补充 process_finished_slot 可能遗漏的文件
          # 收集 psim/log、psim/cfg、dnode*/log、dnode*/cfg、var_taoslog、asan
          if [[ -d "${tvol}/sim" ]]; then
            find "${tvol}/sim" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | while IFS= read -r _sd; do
              _sn=$(basename "${_sd}")
              if [[ "${_sn}" == "psim" || "${_sn}" == "dnode"* ]]; then
                for _sub in log cfg; do
                  if [[ -d "${_sd}/${_sub}" && "$(ls -A "${_sd}/${_sub}" 2>/dev/null)" ]]; then
                    if [[ -n "${dest}" ]]; then
                      mkdir -p "${dest}/sim/${_sn}/${_sub}"
                      cp -rn "${_sd}/${_sub}/." "${dest}/sim/${_sn}/${_sub}/" 2>/dev/null || true
                    else
                      find "${_sd}/${_sub}" -type f 2>/dev/null | while IFS= read -r f; do
                        cp "$f" "${LOGS_DIR}/t${tnum}-$(basename "$f")" 2>/dev/null || true
                      done
                    fi
                  fi
                done
              elif [[ "${_sn}" == "asan" || "${_sn}" == "var_taoslog" ]]; then
                if [[ "$(find "${_sd}" -type f 2>/dev/null | head -1)" ]]; then
                  if [[ -n "${dest}" ]]; then
                    mkdir -p "${dest}/sim/${_sn}"
                    cp -rn "${_sd}/." "${dest}/sim/${_sn}/" 2>/dev/null || true
                    # ASAN 日志（dnode1.asan、psim.info 等）无扩展名，GitLab artifact
                    # 浏览器无法内联预览，为每个文件创建 .txt 软链方便直接查看
                    if [[ "${_sn}" == "asan" ]]; then
                      find "${dest}/sim/asan" -maxdepth 1 -type f ! -name '*.txt' 2>/dev/null \
                        | while IFS= read -r _af; do
                            ln -sf "$(basename "${_af}")" "${_af}.txt" 2>/dev/null || true
                          done
                    fi
                  else
                    find "${_sd}" -type f 2>/dev/null | while IFS= read -r f; do
                      cp "$f" "${LOGS_DIR}/t${tnum}-$(basename "$f")" 2>/dev/null || true
                    done
                  fi
                fi
              fi
            done
          fi
          # case-*.log（in-flight 用例的运行日志，slug 未知时才收集）
          if [[ -z "${dest}" ]]; then
            find "${tvol}" -maxdepth 2 -name 'case-*.log' -type f 2>/dev/null | while IFS= read -r f; do
              cp "$f" "${LOGS_DIR}/t${tnum}-$(basename "$f")" 2>/dev/null || true
            done
          fi
        done || true
      echo "=== [after_script] Cleaning up WORKDIR ==="
      rm -rf "${WORKDIR}" 2>/dev/null || true

  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# ======================================================================
# coordinator — 运行于 test-builder，为所有 worker 提供用例队列服务
# 端口 = CI_PIPELINE_ID % 10000 + 20000（所有 job 中相同）
# coordinator 跟随 TSDB_BUILDER_TAG 路由，与 prepare/build/upload 落在同一台 builder
# test-linux worker 在 step 3 通过 case 语句从 TSDB_BUILDER_TAG 推导 coordinator 主机名
# ======================================================================
coordinator:
  stage: test
  tags: [$TSDB_BUILDER_TAG]
  timeout: 300 minutes
  needs: [upload-nexus]
  extends: .rules-code-change
  interruptible: true

  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: "1"
    SANITIZER: "n"
    PROMETHEUS_URL: "http://192.168.1.42:9090"
    PROM_INTERVAL: "30"
    # Prometheus rate() 窗口长度：[1m] 使 score 在 1 分钟内跟上真实负载变化，
    # 消除 [5m] 窗口的滞后（pipeline 刚起来时 cpu_busy 被历史空载数据拉低，
    # 导致初期分配量被 idle 系数限制而用不满资源）。
    # 多 MR 并发时各机器负载 1 分钟内反映到 score，天然限流无需额外旁路逻辑。
    PROM_RATE_WINDOW: "1m"
    PYTHONUNBUFFERED: "1"   # 确保 Python print() 即时刷出，GitLab section 标记不被缓冲截断
    # ── Rerun 模式（Retry 时自动生效，无需额外操作）──────────────────────
    # auto = 自动检测：存在上次结果时仅重跑失败 case，否则全量（默认）
    # 空   = 强制全量跑所有 case
    # failed = 仅重跑上次失败的 case
    # worker:HOST = 仅重跑上次分配给 HOST 的全部 case（如 worker:u3-141）
    # failed:HOST = 仅重跑上次 HOST 上失败的 case（如 failed:u3-141）
    RERUN_MODE: "auto"

  script:
    - export RESULTS_DIR="${CI_PROJECT_DIR}/results"
    - export CASES_TASK="${CI_PROJECT_DIR}/source/taos-community/test/ci/cases.task"
    - mkdir -p "${RESULTS_DIR}"
    - |
      _COORD_PORT=$(( CI_PIPELINE_ID % 10000 + 20000 ))
      echo "[coordinator] Pipeline: ${CI_PIPELINE_ID}  Port: ${_COORD_PORT}"
      echo "[coordinator] CASES_TASK: ${CASES_TASK}"
      echo "[coordinator] Prometheus: ${PROMETHEUS_URL}"
      [ -f "${CASES_TASK}" ] || { echo "ERROR: cases.task not found"; exit 1; }
    - python3 "${CI_PROJECT_DIR}/tests/ci/scripts/coordinator.py"

  artifacts:
    when: always       # case-timing.txt 无论成功失败均上传；reports.junit 始终上传
    reports:
      junit: "results/junit-aggregate.xml"
    paths:
      - "results/logs/*/run.log.txt"   # 每个失败用例的运行日志
      - "results/junit-*.xml"          # JUnit 报告
      - "results/case-timing.txt"      # 所有用例耗时汇总（按耗时降序）
    expire_in: 14 days

