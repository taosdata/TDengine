# =============================================================================
# TSDB 父流水线 — 唯一 CI 入口
# 触发两个独立子流水线（并行）：
#   tsdb-ci   →  .gitlab/.gitlab-ci.yml        (代码构建 + 测试)
#   tsdb-docs →  .gitlab/tsdb-build-docs.yml   (文档 lint + 构建，仅文档变更时)
# =============================================================================
# ⚠️ 重要：rules:changes 路径写法约定（误用会导致整个 pipeline 不创建）
# -----------------------------------------------------------------------------
# GitLab rules:changes 使用 doublestar glob，路径末尾的 `**` 只匹配"目录路径段"，
# 不匹配该目录下的文件。例如 `source/taos-community/docs/**` 不会匹配到
# `source/taos-community/docs/zh/30-idmp.md`，导致 changes 永远不命中、job 不会被
# 创建，进而（当所有 trigger job 都未命中时）整个 pipeline 都不会创建。
#
# 正确写法：
#   ✅  source/taos-community/docs/**/*   ← 匹配目录下所有层级的文件
#   ✅  source/taos-community/docs/**/*.md
#   ❌  source/taos-community/docs/**     ← 不会匹配文件，慎用！
#
# 新增/修改 changes: 列表时请遵循此规则。已在 MR !300/!302 排查确认。
# =============================================================================

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^3\.3\.6/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^3\.0/
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - dispatch

tsdb-ci:
  stage: dispatch
  trigger:
    include:
      - local: .gitlab/.gitlab-ci.yml
    strategy: depend
  variables:
    PARENT_PIPELINE_SOURCE: $CI_PIPELINE_SOURCE
    # CI_MERGE_REQUEST_IID 是 MR 类预定义变量，GitLab 不保证自动导出到子流水线作业环境，
    # 显式透传以确保 coordinator.py 的 _compute_workspace() 能正确计算工作区路径。
    PARENT_MR_IID: $CI_MERGE_REQUEST_IID
    # 透传父 pipeline ID，供子 pipeline 中的 coordinator 在 MR 合并时取消整条流水线
    PARENT_PIPELINE_ID: $CI_PIPELINE_ID
  rules:
    - if: $RUN_TSDB_CI == "true"
    # MR 场景：仅当代码相关文件变更时触发（排除纯文档/打包/tdgpt 变更）
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - source/taos-community/source/**/*
        - source/taos-community/include/**/*
        - source/taos-community/cmake/**/*
        - source/taos-community/CMakeLists.txt
        - source/taos-community/contrib/**/*
        - source/taos-community/tests/**/*
        - source/taos-community/examples/**/*
        - source/taos-community/tools/**/*
        - source/taos-community/docs/examples/**/*
        - source/taos-community/deps/**/*
        - source/taos-community/utils/**/*
        - source/taos-internal/**/*
        - source/taos-adapter/**/*
        - "source/taos-community/test/**/*"
        - "tests/ci/scripts/**/*"
        - cmake/**/*
        - CMakeLists.txt
        - .gitlab/.gitlab-ci.yml
        - .gitlab-ci.yml
    - if: $CI_PIPELINE_SOURCE == "schedule" && $RUN_DOCS_CD != "true"
    - if: $CI_PIPELINE_SOURCE == "web"

tsdb-docs:
  stage: dispatch
  trigger:
    include:
      - local: .gitlab/tsdb-build-docs.yml
    strategy: depend
  rules:
    - if: >
        $CI_PIPELINE_SOURCE == "merge_request_event" &&
        (
          $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" ||
          $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "3.0" ||
          $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^3\.3\.6/ ||
          $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "docs-cloud"
        )
      changes:
        - source/taos-community/docs/**/*
        - .gitlab/scripts/tsdb-docs-ci/**/*
        - .gitlab/tsdb-build-docs.yml

# docs CD — schedule-only deploy. Configure a GitLab pipeline schedule on the
# main branch with whatever cadence you want (e.g. every 2h). Legacy CD on
# 192.168.0.30 stays alive until this is verified.
tsdb-docs-cd:
  stage: dispatch
  trigger:
    include:
      - local: .gitlab/tsdb-deploy-docs.yml
    strategy: depend
    forward:
      pipeline_variables: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $RUN_DOCS_CD == "true"
