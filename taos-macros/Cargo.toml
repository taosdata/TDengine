[package]
name = "taos-macros"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1.0.18"
syn = "1"

[dev-dependencies]
taos = { path = "../taos", features = ["test"] }
tokio = "*"
