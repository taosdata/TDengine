[default.extend-words]
avaliable = "avaliable"
optin = "optin"
ba = "ba"
testng = "testng"

[type.csv]
extend-glob = ["*.csv"]
check-file = false

[type.txt]
extend-glob = ["*.txt", "*.text"]
check-file = false

[type.json]
extend-glob = ["*.json"]
check-file = true

[type.sql]
extend-glob = ["*.sql"]
check-file = false

[type.svg]
extend-glob = ["*.svg"]
check-file = false

[files]
extend-exclude = ["taosx-ipc/tests/**", "taosx-core/tests/str-slice.rs", "plugins/", "packaging/**", "CHANGELOG.md"]

[default]
extend-ignore-re = ["(?s)(#|//)\\s*spellchecker:off.*?\\n\\s*(#|//)\\s*spellchecker:on"]
