[package]
name = "taos-query"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
itertools = "0.10.3"
log = "0.4"
mdsn = { path = "../mdsn" }
num_enum = "0.5.7"
thiserror = "1.0"
url = "2.2.2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1.7"

nom = "7"
paste = "1"

async-trait = "0.1.53"
futures = "0.3.21"

# column
bitvec_simd = { version = "0.20.5", features = ["use_serde"] }

r2d2 = { version = "0.8.9", optional = true }

[dev-dependencies]
pretty_env_logger = "*"
rand = "*"
taos = { path = "../taos" }
taos-macros = { path = "../taos-macros" }
tokio = "1"

[features]
default = ["r2d2"]
nightly = []
