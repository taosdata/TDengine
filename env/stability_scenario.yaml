settings:
  - name: taosd
    fqdn: [node225]
    spec:
      version: 3.0.1.4  # 默认最新版
      config: # common config for all dnodes
        firstEP: node225:6030
      dnodes:
        - endpoint: node225:6030
          config_dir: /etc/taos
          config: # will write into taos.cfg
            dataDir: /var/lib/taos
            logDir: /var/log/taos
            debugFlag: 135
            supportVnodes: 1024
            querySmaOptimize: 1
        - endpoint: node222:6030
          config_dir: /etc/taos
          config: # will write into taos.cfg
            dataDir: /var/lib/taos
            logDir: /var/log/taos
            debugFlag: 135
            supportVnodes: 1024
            querySmaOptimize: 1
      reserve_dnodes:
        - endpoint: node226:6030
          config_dir: /etc/taos
          config: # will write into taos.cfg
            dataDir: /var/lib/taos
            logDir: /var/log/taos
            debugFlag: 135
            supportVnodes: 1024
            querySmaOptimize: 1

  - name: taospy
    fqdn: [node225]
    spec:
      version: 3.0.1.4
      client_version: 3.0.1.4
      config:
        firstEP: node225:6030
        logDir: /var/log/taos
        querySmaOptimize: 1
        debugFlag: 135
        asyncLog: 0

  - name: taosAdapter
    fqdn: [node225]
    spec:
      version: 3.0.1.4
      config_file: /etc/taos/taosadapter.toml
      adapter_config:
        logLevel: info
        port: 6041
        taosConfigDir: /etc/taos
        log:
          path: /var/log/taos
        opentsdb_telnet:
          enable: true
          maxTCPConnections: 250
          tcpKeepAlive: false
          dbs: ["telnet_tcp"]
          ports: [6046]
          user: root
          password: taosdata
          worker: 1000

      taos_config:
        firstEP: node225:6030
        logDir: /var/log/taos
        debugFlag: 135
  - name: taosBenchmark
    # fqdn: [u1-55, u1-55, u1-56, u1-56, u1-56, u1-57, u1-57, u1-57, u1-58, u1-58, u1-58, u1-59, u1-59]
    fqdn: [node222]
    spec:
      version: 3.0.1.8
      taos_version: 3.0.1.8
      config_dir: /etc/taos
      taos_config:
        firstEP: node225:6030
        logDir: /var/log/taos
        debugFlag: 131