settings:
  - name: taosd
    fqdn: [u1-54, u1-58, u1-60]
    spec:
      version: 3.0.5.0  # 默认最新版
      config: # common config for all dnodes
        firstEP: u1-54:6030
      dnodes:
        - endpoint: u1-54:6030
          config_dir: /etc/taos
          config: # will write into taos.cfg
            dataDir: /var/lib/taos
            logDir: /var/log/taos
            qDebugFlag: 131
            tqDebugFlag: 131
            supportVnodes: 1024
            asynclog: 0
            numOfLogLines: 2000000000
        - endpoint: u1-58:6030
          config_dir: /etc/taos
          config: # will write into taos.cfg
            dataDir: /var/lib/taos
            logDir: /var/log/taos
            qDebugFlag: 131
            tqDebugFlag: 131
            supportVnodes: 1024
            asynclog: 0
            numOfLogLines: 2000000000
        - endpoint: u1-60:6030
          config_dir: /etc/taos
          config: # will write into taos.cfg
            dataDir: /var/lib/taos
            logDir: /var/log/taos
            qDebugFlag: 131
            tqDebugFlag: 131
            supportVnodes: 1024
            asynclog: 0
            numOfLogLines: 2000000000
            # logKeepDays:  -1
            # numOfRpcSessions: 20000
  - name: taospy
    fqdn: [u1-60]
    spec:
      version: 3.0.5.0
      client_version: 3.0.5.0
      config:
        firstEP: u1-54:6030
        logDir: /var/log/taos
        debugFlag: 131
        asyncLog: 0

  - name: taosBenchmark
    fqdn: [u1-60, u1-60, u1-60]
    spec:
      version: 3.0.5.0
      taos_version: 3.0.5.0
      config_dir: /etc/taos
      taos_config:
        firstEP: u1-60:6030
        logDir: /var/log/taos
        debugFlag: 131
  - name: taosAdapter
    fqdn: [u1-54, u1-58, u1-60]
    spec:
      version: 3.0.0.0
      config_file: /etc/taos/taosadapter.toml
      adapter_config:
        logLevel: info
        port: 6041
        taosConfigDir: /etc/taos
        log:
          path: /var/log/taos
        opentsdb_telnet:
          enable: true
          maxTCPConnections: 250
          tcpKeepAlive: false
          dbs: ["telnet_tcp"]
          ports: [6046]
          user: root
          password: taosdata
          worker: 1000

      taos_config:
        firstEP: u1-54:6030
        dataDir: /var/lib/taos
        logDir: /var/log/taos
        debugFlag: 135
