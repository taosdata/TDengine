settings:
  - name: taosd
    fqdn: [u1-55, u1-56, u1-57]
    spec:
      version: 3.1.1.8  # 默认最新版
      config: # common config for all dnodes
        firstEP: u1-55:6030
      dnodes:
        - endpoint: u1-55:6030
          config_dir: /etc/taos
          code_dir: /root/TDengine
          update_branch: main
          config: # will write into taos.cfg
            dataDir: /var/lib/taos
            logDir: /var/log/taos
            mDebugFlag: 135
            tqDebugFlag: 131
            stDebugFlag: 131
            supportVnodes: 1024
            asynclog: 0
        - endpoint: u1-56:6030
          config_dir: /etc/taos
          code_dir: /root/TDengine
          update_branch: main
          config: # will write into taos.cfg
            dataDir: /var/lib/taos
            logDir: /var/log/taos
            mDebugFlag: 135
            tqDebugFlag: 131
            stDebugFlag: 131
            supportVnodes: 1024
            asynclog: 0
        - endpoint: u1-57:6030
          config_dir: /etc/taos
          code_dir: /root/TDengine
          update_branch: main
          config: # will write into taos.cfg
            dataDir: /var/lib/taos
            logDir: /var/log/taos
            mDebugFlag: 135
            tqDebugFlag: 131
            stDebugFlag: 131
            supportVnodes: 1024
            asynclog: 0
  - name: taospy
    fqdn: [u1-55]
    spec:
      version: 3.1.1.8
      client_version: 3.1.1.8
      config:
        firstEP: u1-55:6030
        logDir: /var/log/taos
        debugFlag: 131
        asyncLog: 0
        maxQueryTimeRange: 3

  - name: taosBenchmark
    fqdn: [u1-53, u1-53, u1-55, u1-56, u1-57]
    spec:
      version: 3.0.1.8
      taos_version: 3.0.1.8
      config_dir: /etc/taos
      taos_config:
        firstEP: u1-55:6030
        logDir: /var/log/taos
        debugFlag: 131
