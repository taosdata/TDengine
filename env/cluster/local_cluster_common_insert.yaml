  - name: taosBenchmark
    fqdn: [localhost]
    spec:
      version: 3.0.0.0
      taos_version: 3.0.0.0
      config_dir: /etc/taos
      taos_config:
        firstEP: localhost:6030
        logDir: /var/log/taos
        debugFlag: 131
  - name: taospy
    fqdn: [localhost]
    spec:
      version: 3.0.0.0
      client_version: 3.0.0.0
      config:
        firstEP: localhost:6030
        dataDir: /var/lib/taos
        logDir: /var/log/taos
        debugFlag: 131
        asynclog: 0
        logkeepDays: 2
        numOfLogLines: 200000000