settings:
  - name: taosd
    fqdn: [u1-41]
    spec:
      version: 3.0.1.111  # 默认最新版
      config: # common config for all dnodes
        firstEP: u1-41:6030
      dnodes:
        - endpoint: u1-41:6030
          config_dir: /data/cyjia/data/taosd/cluster1
          config: # will write into taos.cfg
            dataDir: /data/cyjia/data/taosd/cluster1
            logDir: /data/cyjia/data/taosd/cluster1
            debugFlag: 135

  - name: taosd
    fqdn: [u1-41]
    spec:
      version: 3.0.1.111  # 默认最新版
      config: # common config for all dnodes
        firstEP: u1-41:6130
      dnodes:
        - endpoint: u1-41:6130
          config_dir: /data/cyjia/data/taosd_1/cluster1
          config: # will write into taos.cfg
            serverPort: '6130'
            dataDir: /data/cyjia/data/taosd_1/cluster1
            logDir: /data/cyjia/data/taosd_1/cluster1
            debugFlag: 135
            supportVnodes: 1024

  - name: taospy
    fqdn: [u1-41]
    spec:
      version: 2.7.10
      client_version: 3.0.1.100
      config:
        firstEP: u1-41:6030
        logDir: /data/cyjia/data/taosd
        debugFlag: 143
  - name: taospy
    fqdn: [u1-41]
    spec:
      version: 2.7.10
      client_version: 3.0.1.100
      config:
        firstEP: u1-45:6030
        logDir: /data/cyjia/data/taosd_1
        debugFlag: 143

  - name: taosBenchmark
    fqdn: [u1-41]
    spec:
      version: 3.0.0.1
      taos_version: 3.0.0.1
      config_dir: /data/cyjia/data/taosd
      taos_config:
        firstEP: u1-41:6030
        logDir: /data/cyjia/data/taosd
        debugFlag: 143
  - name: taosx
    fqdn: [u1-41]
    spec:
      version: 0.0.0.0
      taos_version: 3.0.0.1
      config_dir: /data/cyjia/data/taosd
      taos_config:
        firstEP: u1-41:6030
        logDir: /data/cyjia/data/taosd
        debugFlag: 143
