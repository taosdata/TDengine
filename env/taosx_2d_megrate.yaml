settings:
  - name: taosd
    fqdn: [u1-40,u1-41,u1-42]
    spec:
      version: 3.0.1.111  # 默认最新版
      config: # common config for all dnodes
        firstEP: u1-40:6030
      dnodes:
        - endpoint: u1-40:6030
          config_dir: /data/cyjia/data/taosd/cluster1
          config: # will write into taos.cfg
            serverPort: '6030'
            dataDir: /data/cyjia/data/taosd/cluster1
            logDir: /data/cyjia/data/taosd/cluster1
            debugFlag: 131
        - endpoint: u1-41:6030
          config_dir: /data/cyjia/data/taosd/cluster2
          config: # will write into taos.cfg
            dataDir: /data/cyjia/data/taosd/cluster2
            logDir: /data/cyjia/data/taosd/cluster2
            debugFlag: 131
        - endpoint: u1-42:6030
          config_dir: /data/cyjia/data/taosd/cluster3
          config: # will write into taos.cfg
            dataDir: /data/cyjia/data/taosd/cluster3
            logDir: /data/cyjia/data/taosd/cluster3
            debugFlag: 131 
  - name: taosd

    fqdn: [u1-45,u1-61,u1-62]
    spec:
      version: 3.0.1.111  # 默认最新版
      config: # common config for all dnodes
        firstEP: u1-45:6030
      dnodes:
        - endpoint: u1-45:6030
          config_dir: /data/cyjia/data/taosd_1/cluster1

          config: # will write into taos.cfg
            serverPort: '6030'
            dataDir: /root/data/cyjia/data/taosd_1/cluster1
            logDir: /root/data/cyjia/data/taosd_1/cluster1
            debugFlag: 131

        - endpoint: u1-61:6030
          config_dir: /data/cyjia/data/taosd_1/cluster2

          config: # will write into taos.cfg
            dataDir: /data/cyjia/data/taosd_1/cluster2
            logDir: /data/cyjia/data/taosd_1/cluster2
            debugFlag: 131
        - endpoint: u1-62:6030
          config_dir: /data/cyjia/data/taosd_1/cluster3
          config: # will write into taos.cfg
            dataDir: /data/cyjia/data/taosd_1/cluster3
            logDir: /data/cyjia/data/taosd_1/cluster3
            debugFlag: 131
  - name: taospy
    fqdn: [u1-40]
    spec:
      version: 2.2.0
      client_version: 3.0.1.1111
      config:
        firstEP: u1-40:6030
        logDir: /data/cyjia/data/taosd
        debugFlag: 131
  - name: taospy
    fqdn: [vm85]
    spec:
      version: 2.2.0
      client_version: 3.0.1.1111
      config:
        firstEP: u1-45:6030
        logDir: /data/cyjia/data/taosd_1
        debugFlag: 131
  - name: taosAdapter
    fqdn: [u1-40]
    spec:
      version: 3.0.1.0
      config_file: /root/data/cyjia/data/taosd/taosadaper.toml
      adapter_config:
        logLevel: info
        port: 6041
        taosConfigDir: /root/data/cyjia/data/taosd
        log:
          path: /root/data/cyjia/data/taosd
      taos_config:
        firstEP: u1-40:6030
        logDir: /data/cyjia/data/taosd
        debugFlag: 131
  - name: taosAdapter
    fqdn: [u1-45]
    spec:
      version: 3.0.1.0
      config_file: /root/data/cyjia/data/taosd_1/taosadaper.toml
      adapter_config:
        logLevel: info
        port: 6041
        taosConfigDir: /root/data/cyjia/data/taosd_1
        log:
          path: /root/data/cyjia/data/taosd_1
      taos_config:
        firstEP: u1-45:6030
        logDir: /data/cyjia/data/taosd_1
        debugFlag: 131
  - name: taosBenchmark
    fqdn: [u1-40]
    spec:
      version: 3.0.0.1
      taos_version: 3.0.0.1
      config_dir: /data/cyjia/data/taosd
      taos_config:
        firstEP: u1-40:6030
        logDir: /data/cyjia/data/taosd
        debugFlag: 131
  - name: taosx
    fqdn: [vm85]
    spec:
      version: 0.0.0.0
      taos_version: 3.0.0.1
      config_dir: /data/cyjia/data/taosd
      taos_config:
        firstEP: vm85:6030
        logDir: /data/cyjia/data/taosd
        debugFlag: 131
