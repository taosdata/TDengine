settings:
  - name: taosd
    fqdn: [vm85]
    spec:
      version: 3.0.1.0  # 默认最新版
      config: # common config for all dnodes
        firstEP: vm85:6030
      dnodes:
        - endpoint: vm85:6030
          config_dir: /data/cyjia/data/taosd/cluster1
          config: # will write into taos.cfg
            serverPort: '6030'
            dataDir: /data/cyjia/data/taosd/cluster1
            logDir: /data/cyjia/data/taosd/cluster1
            debugFlag: 135
            supportVnodes: 1024
        - endpoint: vm85:6050
          config_dir: /data/cyjia/data/taosd/cluster2
          config: # will write into taos.cfg
            dataDir: /data/cyjia/data/taosd/cluster2
            logDir: /data/cyjia/data/taosd/cluster2
            debugFlag: 135
            supportVnodes: 1024
        - endpoint: vm85:6070
          config_dir: /data/cyjia/data/taosd/cluster3
          config: # will write into taos.cfg
            dataDir: /data/cyjia/data/taosd/cluster3
            logDir: /data/cyjia/data/taosd/cluster3
            debugFlag: 135
            supportVnodes: 1024    
  - name: taosd
    fqdn: [vm85]
    spec:
      version: 3.0.1.0  # 默认最新版
      config: # common config for all dnodes
        firstEP: vm85:6130
      dnodes:
        - endpoint: vm85:6130
          config_dir: /data/cyjia/data/taosd_1/cluster1
          config: # will write into taos.cfg
            serverPort: '6130'
            dataDir: /data/cyjia/data/taosd_1/cluster1
            logDir: /data/cyjia/data/taosd_1/cluster1
            debugFlag: 135
            supportVnodes: 1024
        - endpoint: vm85:6150
          config_dir: /data/cyjia/data/taosd_1/cluster2
          config: # will write into taos.cfg
            dataDir: /data/cyjia/data/taosd_1/cluster2
            logDir: /data/cyjia/data/taosd_1/cluster2
            debugFlag: 135
            supportVnodes: 1024
        - endpoint: vm85:6170
          config_dir: /data/cyjia/data/taosd_1/cluster3
          config: # will write into taos.cfg
            dataDir: /data/cyjia/data/taosd_1/cluster3
            logDir: /data/cyjia/data/taosd_1/cluster3
            debugFlag: 135
            supportVnodes: 1024
  - name: taospy
    fqdn: [vm85]
    spec:
      version: 2.2.0
      client_version: 3.0.1.0
      config:
        firstEP: vm85:6030
        logDir: /data/cyjia/data/taosd
        debugFlag: 143
  - name: taospy
    fqdn: [vm85]
    spec:
      version: 2.2.0
      client_version: 3.0.1.0
      config:
        firstEP: vm85:6130
        logDir: /data/cyjia/data/taosd_1
        debugFlag: 143
  - name: taosAdapter
    fqdn: [vm85]
    spec:
      version: 3.0.1.0
      config_file: /data/cyjia/data/taosd/taosadaper.toml
      adapter_config:
        logLevel: info
        port: 6041
        taosConfigDir: /data/cyjia/data/taosd
        log:
          path: /data/cyjia/data/taosd
        collectd:
          enable: false
        influxdb:
          enable: false
        node_exporter:
          enable: false
        opentsdb_telnet:
          enable: false
        prometheus:
          enable: false
        statsd:
          enable: false
      taos_config:
        firstEP: vm85:6030
        logDir: /data/cyjia/data/taosd
        debugFlag: 143
  - name: taosAdapter
    fqdn: [vm85]
    spec:
      version: 3.0.1.0
      config_file: /data/cyjia/data/taosd_1/taosadaper.toml
      adapter_config:
        logLevel: info
        port: 6141
        taosConfigDir: /data/cyjia/data/taosd_1
        log:
          path: /data/cyjia/data/taosd_1
        collectd:
          enable: false
        influxdb:
          enable: false
        node_exporter:
          enable: false
        opentsdb_telnet:
          enable: false
        prometheus:
          enable: false
        statsd:
          enable: false
      taos_config:
        firstEP: vm85:6130
        logDir: /data/cyjia/data/taosd_1
        debugFlag: 143
  - name: taosBenchmark
    fqdn: [vm85]
    spec:
      version: 3.0.0.1
      taos_version: 3.0.0.1
      config_dir: /data/cyjia/data/taosd
      taos_config:
        firstEP: vm85:6030
        logDir: /data/cyjia/data/taosd
        debugFlag: 143
  - name: taosx
    fqdn: [vm85]
    spec:
      version: 0.0.0.0
      taos_version: 3.0.0.1
      config_dir: /data/cyjia/data/taosd
      taos_config:
        firstEP: vm85:6030
        logDir: /data/cyjia/data/taosd
        debugFlag: 143
