settings:
  - name: taosd
    fqdn: [u1-41]
    spec:
      version: 3.0.5.0  # 默认最新版
      config: # common config for all dnodes
        firstEP: u1-41:6030
      dnodes:
        - endpoint: u1-41:6030
          config_dir: /data/cyjia/data/taosd/cluster1
          config: # will write into taos.cfg
            dataDir: /data/cyjia/data/taosd/cluster1
            logDir: /data/cyjia/data/taosd/cluster1
            debugFlag: 131
        - endpoint: u1-41:6070
          config_dir: /data/cyjia/data/taosd/cluster2
          config: # will write into taos.cfg
            dataDir: /data/cyjia/data/taosd/cluster2
            logDir: /data/cyjia/data/taosd/cluster2
            debugFlag: 131
        - endpoint: u1-41:6090
          config_dir: /data/cyjia/data/taosd/cluster3
          config: # will write into taos.cfg
            dataDir: /data/cyjia/data/taosd/cluster3
            logDir: /data/cyjia/data/taosd/cluster3
            debugFlag: 131
  - name: taosd
    fqdn: [u1-42]
    spec:
      version: 3.0.5.0  # 默认最新版
      config: # common config for all dnodes
        firstEP: u1-42:6030
      dnodes:
        - endpoint: u1-42:6030
          config_dir: /data/cyjia/data/taosd_1/cluster1
          config: # will write into taos.cfg
            dataDir: /data/cyjia/data/taosd_1/cluster1
            logDir: /data/cyjia/data/taosd_1/cluster1
            debugFlag: 135
            supportVnodes: 1024
        - endpoint: u1-42:6070
          config_dir: /data/cyjia/data/taosd_1/cluster2
          config: # will write into taos.cfg
            dataDir: /data/cyjia/data/taosd_1/cluster2
            logDir: /data/cyjia/data/taosd_1/cluster2
            debugFlag: 135
            supportVnodes: 1024
        - endpoint: u1-42:6090
          config_dir: /data/cyjia/data/taosd_1/cluster2
          config: # will write into taos.cfg
            dataDir: /data/cyjia/data/taosd_1/cluster2
            logDir: /data/cyjia/data/taosd_1/cluster2
            debugFlag: 135
            supportVnodes: 1024
  - name: taospy
    fqdn: [u1-41]
    spec:
      version: 2.7.10
      client_version: 3.0.1.0
      config:
        firstEP: u1-41:6030
        logDir: /data/cyjia/data/taosd
        debugFlag: 143
  - name: taospy
    fqdn: [u1-42]
    spec:
      version: 2.7.10
      client_version: 3.0.1.0
      config:
        firstEP: u1-42:6030
        logDir: /data/cyjia/data/taosd_1
        debugFlag: 143
  - name: taosAdapter
    fqdn: [u1-41]
    spec:
      version: 3.0.5.0
      config_file: /data/cyjia/data/taosd/taosadaper.toml
      adapter_config:
        logLevel: debug
        port: 6041
        taosConfigDir: /data/cyjia/data/taosd/cluster1
        log:
          path: /data/cyjia/data/taosd/cluster1
      taos_config:
        firstEP: u1-41:6030
        logDir: /data/cyjia/data/taosd
        debugFlag: 143
  - name: taosAdapter
    fqdn: [u1-42]
    spec:
      version: 3.0.5.0
      config_file: /data/cyjia/data/taosd_1/taosadaper.toml
      adapter_config:
        logLevel: info
        port: 6041
        taosConfigDir: /data/cyjia/data/taosd_1/cluster1
        log:
          path: /data/cyjia/data/taosd_1/cluster1
      taos_config:
        firstEP: u1-41:6030
        logDir: /data/cyjia/data/taosd_1
        debugFlag: 143
  - name: taosBenchmark
    fqdn: [u1-41]
    spec:
      version: 3.0.5.0
      taos_version: 3.0.5.0
      config_dir: /data/cyjia/data/taosd
      taos_config:
        firstEP: u1-41:6030
        logDir: /data/cyjia/data/taosd
        debugFlag: 143
  - name: taosx
    fqdn: [u1-41]
    spec:
      version: 0.0.0.0
      taos_version: 3.0.5.0
      config_dir: /data/cyjia/data/taosd
      taos_config:
        firstEP: u1-41:6030
        logDir: /data/cyjia/data/taosd
        debugFlag: 143
