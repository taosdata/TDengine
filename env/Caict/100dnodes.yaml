settings:
  - name: taosd
    fqdn: [u1-60]
    spec:
      version: 3.0.5.0  # 默认最新版
      config: # common config for all dnodes
        firstEP: u1-60:6030
      dnodes:
        - endpoint: u1-60:6030
          config_dir: /etc/taos
          config: # will write into taos.cfg
            dataDir: /var/lib/taos
            logDir: /var/log/taos
            qDebugFlag: 131
            supportVnodes: 1024
  - name: taospy
    fqdn: [u1-60]
    spec:
      version: 3.0.5.0
      client_version: 3.0.5.0
      config:
        firstEP: u1-60:6030
        logDir: /var/log/taos
        debugFlag: 131
        asyncLog: 0

  - name: docker
    fqdn: [u1-60]
    net_name: taostest_net
    subnet: 172.12.0.1/16
    image: tdengine/tdengine
    dnode_count: 100