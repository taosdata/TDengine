settings:
  - name: taosd
    fqdn: [u1-55, u1-56, u1-57]
    spec:
      version: 3.0.6.0  # 默认最新版
      config: # common config for all dnodes
        firstEP: u1-55:6030
      dnodes:
        - endpoint: u1-55:6030
          config_dir: /etc/taos
          config: # will write into taos.cfg
            supportVnodes: 1024
            dataDir: /var/lib/taos
            logDir: /var/log/taos
            debugFlag: 131
            asynclog: 0
        - endpoint: u1-56:6030
          config_dir: /etc/taos
          config: # will write into taos.cfg
            supportVnodes: 1024
            dataDir: /var/lib/taos
            logDir: /var/log/taos
            debugFlag: 131
            asynclog: 0
        - endpoint: u1-57:6030
          config_dir: /etc/taos
          config: # will write into taos.cfg
            supportVnodes: 1024
            dataDir: /var/lib/taos
            logDir: /var/log/taos
            debugFlag: 131
            asynclog: 0

  - name: taospy
    fqdn: [u1-55]
    spec:
      version: 3.0.6.0
      client_version: 3.0.6.0
      config:
        firstEP: u1-55:6030
        dataDir: /var/lib/taos
        logDir: /var/log/taos
        debugFlag: 131
        asynclog: 0


  - name: taosBenchmark
    fqdn: [u1-55, u1-56, u1-57]
    spec:
      version: 3.0.6.0
      taos_version: 3.0.6.0
      config_dir: /etc/taos
      taos_config:
        firstEP: u1-55:6030
        logDir: /var/log/taos
        debugFlag: 131

