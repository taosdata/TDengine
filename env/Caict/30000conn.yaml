settings:
  - name: taosd
    fqdn: [127.0.0.1]
    spec:
      version: 3.0.6.0  # 默认最新版
      config: # common config for all dnodes
        firstEP: 127.0.0.1:6030
      dnodes:
        - endpoint: 127.0.0.1:6030
          config_dir: /etc/taos
          config: # will write into taos.cfg
            dataDir: /var/lib/taos
            logDir: /var/log/taos
            debugFlag: 131
            supportVnodes: 1024
  - name: taospy
    fqdn: [127.0.0.1]
    spec:
      version: 3.0.6.0
      client_version: 3.0.6.0
      config:
        firstEP: 127.0.0.1:6030
        logDir: /var/log/taos
        debugFlag: 135
        asyncLog: 0

  - name: taosBenchmark
    fqdn: [127.0.0.1, 127.0.0.1, 127.0.0.1]
    spec:
      version: 3.0.6.0
      taos_version: 3.0.6.0
      config_dir: /etc/taos
      taos_config:
        firstEP: 127.0.0.1:6030
        logDir: /var/log/taos
        debugFlag: 131
