settings:
  - name: taosd
    fqdn: [ceph01]
    spec:
      version: 2.4.0.12  # 默认最新版
      config: # common config for all dnodes
        firstEP: ceph01:6030
      dnodes:
        - endpoint: ceph01:6030
          config_dir: /etc/taos
          code_dir: /root/TDengine
          update_branch: main
          config: # will write into taos.cfg
            dataDir: /var/lib/taos
            logDir: /var/log/taos
            debugFlag: 131
            supportVnodes: 1024
            mndSdbWriteDelta: 20
            mndLogRetention: 500
  - name: taospy
    fqdn: [ceph01]
    spec:
      version: 2.2.0
      client_version: 2.4.0.12
      config:
        firstEP: ceph01:6030
        logDir: /var/log/taos
        debugFlag: 131
        asyncLog: 0

  - name: taosAdapter
    fqdn: [ceph01]
    spec:
      version: 2.4.0.12
      config_file: /etc/taos/taosadaper.toml
      adapter_config:
        logLevel: info
        port: 6041
        taosConfigDir: /etc/taos
        log:
          path: /var/log/taos
        opentsdb_telnet:
          enable: true
          maxTCPConnections: 250
          tcpKeepAlive: false
          dbs: ["telnet_tcp"]
          ports: [6046]
          user: root
          password: taosdata
          worker: 1000

      taos_config:
        firstEP: ceph01:6030
        logDir: /var/log/taos
        debugFlag: 131
