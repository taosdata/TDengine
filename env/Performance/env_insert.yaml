settings:
  - name: taosd
    fqdn: [node221]
    spec:
      version: 2.4.0.0  #
      config: # common config for all dnodes
        firstEP: node221:6030
      dnodes:
        - endpoint: node221:6030
          config_dir: /etc/taos
          config: # will write into taos.cfg
            dataDir: /var/lib/taos
            logDir: /var/log/taos
            debugFlag: 131
        
  - name: taospy
    fqdn: [node221]
    spec:
      version: 2.2.0  
      client_version: 2.4.0.0
      config:
        firstEP: node221:6030
        logDir: /var/log/taos
        debugFlag: 131
    
  - name: taosBenchmark
    fqdn: [node221]
    spec:
      version: 1.0.0
      taos_version: 2.4.0.0
      config_dir: /etc/taos
      taos_config:
        firstEP: node221:6030
        logDir: /var/log/taos
        debugFlag: 131


  - name: prometheus
    fqdn: [BCC-2]
    spec:
      server:
        run_dir: /opt/prometheus
        config:
          global:
            evaluation_interval: 1s
            scrape_interval: 3s
            scrape_timeout: 3s
          scrape_configs:
            job_name: prometheus
            targets: [BCC-2:9090]
      node_exporter:
        fqdn: [vm85,vm83]
        run_dir: /opt/node_exporter
      process_exporter:
        fqdn: [vm85,vm83]
        run_dir: /opt/process_exporter
        config:
          common_process: [taosd, taosBenchmark,taosadapter]
          custom_process:
            vm85: [taosd,taosadapter]
            vm83: [taosBenchmark]

