settings:
  - name: taosd
    fqdn: [vm83, trd01, trd04, u1-35, test218]
    spec:
      version: 3.0.1.0  # 默认最新版
      config: # common config for all dnodes
        firstEP: vm83:6030
      dnodes:
        - endpoint: vm83:6030
          config_dir: /etc/taos
          config: # will write into taos.cfg
            supportVnodes: 64
            dataDir: /var/lib/taos
            logDir: /var/log/taos
            debugFlag: 131
        - endpoint: trd01:6030
          config_dir: /etc/taos
          config: # will write into taos.cfg
            supportVnodes: 64
            dataDir: /var/lib/taos
            logDir: /var/log/taos
            debugFlag: 131
        - endpoint: trd04:6030
          config_dir: /etc/taos
          config: # will write into taos.cfg
            supportVnodes: 64
            dataDir: /var/lib/taos
            logDir: /var/log/taos
            debugFlag: 131
        - endpoint: u1-35:6030
          config_dir: /etc/taos
          config: # will write into taos.cfg
            supportVnodes: 64
            dataDir: /var/lib/taos
            logDir: /var/log/taos
            debugFlag: 131
        - endpoint: test218:6030
          config_dir: /etc/taos
          config: # will write into taos.cfg
            supportVnodes: 64
            dataDir: /var/lib/taos
            logDir: /var/log/taos
            debugFlag: 131

  - name: taospy
    fqdn: [vm83]
    spec:
      version: 3.0.1.0
      client_version: 3.0.1.0
      config:
        firstEP: vm83:6030
        dataDir: /var/lib/taos
        logDir: /var/log/taos
        debugFlag: 131
        asynclog: 0
  - name: taosAdapter
    fqdn: [vm83, trd01, trd04, u1-35, test218]
    spec:
      version: 3.0.1.0
      config_file: /etc/taos/taosadaper.toml
      adapter_config:
        logLevel: info
        port: 6041
        taosConfigDir: /etc/taos
        log:
          path: /var/log/taos
        opentsdb_telnet:
          enable: true
          maxTCPConnections: 250
          tcpKeepAlive: false
          dbs: ["telnet_tcp"]
          ports: [6046]
          user: root
          password: taosdata

      taos_config:
        firstEP: vm83:6030
        dataDir: /var/lib/taos
        logDir: /var/log/taos
        debugFlag: 131

  - name: taosBenchmark
    fqdn: [vm83, trd01, trd04, u1-35, test218]
    # fqdn: [vm83]
    spec:
      version: 3.0.1.0
      taos_version: 3.0.1.0
      config_dir: /etc/taos
      taos_config:
        firstEP: vm83:6030
        logDir: /var/log/taos
        debugFlag: 131
        
  - name: prometheus
    fqdn: [vm83]
    spec:
      server:
        run_dir: /opt/prometheus
        config:
          global:
            evaluation_interval: 1s
            scrape_interval: 3s
            scrape_timeout: 3s
          scrape_configs:
            job_name: prometheus
            targets: [192.168.1.83:9090]
      node_exporter:
        fqdn: [vm83, trd01, trd04, u1-35, test218]
        run_dir: /opt/node_exporter
      process_exporter:
        fqdn: [vm83, trd01, trd04, u1-35, test218]
        run_dir: /opt/process_exporter
        config:
          common_process: [taosd, taosBenchmark]
          custom_process:
            vm83: [taosd, taosBenchmark]
            trd01: [taosd, taosBenchmark]
            trd04: [taosd, taosBenchmark]
            u1-35: [taosd, taosBenchmark]
            test218: [taosd, taosBenchmark]
            # vm83: [taosBenchmark]
