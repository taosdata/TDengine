settings:
  - name: taosd
    fqdn: [vm85]
    spec:
      version: 3.0.1.0  # 默认最新版
      config: # common config for all dnodes
        firstEP: vm85:6030
      dnodes:
        - endpoint: vm85:6030
          config_dir: /root/data/taosd
          config: # will write into taos.cfg
            serverPort: '6030'
            dataDir: /root/data/taosd
            logDir: /root/data/taosd
            debugFlag: 135
            supportVnodes: 1024
  - name: taosd
    fqdn: [node222]
    spec:
      version: 3.0.1.0  # 默认最新版
      config: # common config for all dnodes
        firstEP: node222:6030
      dnodes:
        - endpoint: node222:6030
          config_dir: /root/data/taosd
          config: # will write into taos.cfg
            serverPort: '6030'
            dataDir: /root/data/taosd
            logDir: /root/data/taosd
            debugFlag: 135
            supportVnodes: 1024
  - name: taospy
    fqdn: [vm85]
    spec:
      version: 2.2.0
      client_version: 3.0.1.0
      config:
        firstEP: vm85:6030
        logDir: /root/data/taosd
        debugFlag: 131
  - name: taospy
    fqdn: [node222]
    spec:
      version: 2.2.0
      client_version: 3.0.1.0
      config:
        firstEP: node222:6030
        logDir: /root/data/taosd
        debugFlag: 131
  - name: taosAdapter
    fqdn: [vm85]
    spec:
      version: 3.0.1.0
      config_file: /root/data/taosd/taosadaper.toml
      adapter_config:
        logLevel: info
        taosConfigDir: /root/data/taosd
        log:
          path: /root/data/taosd
      taos_config:
        firstEP: vm85:6030
        logDir: /root/data/taosd
        debugFlag: 135
  - name: taosAdapter
    fqdn: [node222]
    spec:
      version: 3.0.1.0
      config_file: /root/data/taosd/taosadaper.toml
      adapter_config:
        logLevel: info
        taosConfigDir: /root/data/taosd
        log:
          path: /root/data/taosd
      taos_config:
        firstEP: node222:6030
        logDir: /root/data/taosd
        debugFlag: 135        
  - name: taosBenchmark
    fqdn: [vm85]
    spec:
      version: 3.0.0.1
      taos_version: 3.0.0.1
      config_dir: /root/data/taosd
      taos_config:
        firstEP: vm85:6090
        logDir: /root/data/taosd
        debugFlag: 131
  - name: taosx
    fqdn: [vm85]
    spec:
      version: 0.0.0.0
      taos_version: 3.0.0.1
      config_dir: /root/data/taosd
      taos_config:
        firstEP: vm85:6030
        logDir: /root/data/taosd
        debugFlag: 131
