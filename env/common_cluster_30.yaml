settings:
  - name: taosd
    fqdn: [ceph01, node221, node222]
    spec:
      version: 3.0.0.0  # 默认最新版
      config: # common config for all dnodes
        firstEP: ceph01:6030
      dnodes:
        - endpoint: ceph01:6030
          config_dir: /etc/taos
          config: # will write into taos.cfg
            supportVnodes: 128
            dataDir: /var/lib/taos
            logDir: /var/log/taos
            debugFlag: 135
        - endpoint: node221:6030
          config_dir: /etc/taos
          config: # will write into taos.cfg
            dataDir: /var/lib/taos
            logDir: /var/log/taos
            debugFlag: 135
        - endpoint: node222:6030
          config_dir: /etc/taos
          config: # will write into taos.cfg
            dataDir: /var/lib/taos
            logDir: /var/log/taos
            debugFlag: 135

  - name: taospy
    fqdn: [ceph01]
    spec:
      version: 3.0.0.0
      client_version: 3.0.0.0
      config:
        firstEP: ceph01:6030
        logDir: /var/log/taos
        debugFlag: 135
        asynclog: 0