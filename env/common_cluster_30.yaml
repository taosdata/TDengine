settings:
  - name: taosd
    fqdn: [ceph01, node221, node222]
    spec:
      version: 3.0.0.0  # 默认最新版
      config: # common config for all dnodes
        firstEP: ceph01:6030
      dnodes:
        - endpoint: ceph01:6030
          config_dir: /etc/taos
          config: # will write into taos.cfg
            supportVnodes: 128
            dataDir: /var/lib/taos
            logDir: /var/log/taos
            debugFlag: 135
            asyncLog: 0
            logkeepDays: 2
            numOfLogLines: 300000000
        - endpoint: node221:6030
          config_dir: /etc/taos
          config: # will write into taos.cfg
            supportVnodes: 128
            dataDir: /var/lib/taos
            logDir: /var/log/taos
            debugFlag: 135
            asyncLog: 0
            logkeepDays: 2
            numOfLogLines: 300000000
        - endpoint: node222:6030
          config_dir: /etc/taos
          config: # will write into taos.cfg
            supportVnodes: 128
            dataDir: /var/lib/taos
            logDir: /var/log/taos
            debugFlag: 135
            asyncLog: 0
            logkeepDays: 2
            numOfLogLines: 300000000
  - name: taosBenchmark
    fqdn: [ceph01]
    spec:
      version: 3.0.0.0
      taos_version: 3.0.0.0
      config_dir: /etc/taos
      taos_config:
        firstEP: ceph01:6030
        logDir: /var/log/taos
        debugFlag: 131
  - name: taospy
    fqdn: [ceph01]
    spec:
      version: 3.0.0.0
      client_version: 3.0.0.0
      config:
        firstEP: ceph01:6030
        dataDir: /var/lib/taos
        logDir: /var/log/taos
        debugFlag: 135
        asynclog: 0
        logkeepDays: 2
        numOfLogLines: 200000000
  - name: taosAdapter
    fqdn: [ceph01]
    spec:
      version: 3.0.0.0
      config_file: /etc/taos/taosadapter.toml
      adapter_config:
        logLevel: info
        port: 6041
        taosConfigDir: /etc/taos
        log:
          path: /var/log/taos
        opentsdb_telnet:
          enable: true
          maxTCPConnections: 250
          tcpKeepAlive: false
          dbs: ["telnet_tcp"]
          ports: [6046]
          user: root
          password: taosdata
          worker: 1000

      taos_config:
        firstEP: ceph01:6030
        dataDir: /var/lib/taos
        logDir: /var/log/taos
        debugFlag: 135
        numOfLogLines: 50000000
