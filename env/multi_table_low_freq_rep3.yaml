settings:
  - name: taosd
    fqdn: [u1-55, u1-56, u1-57]
    spec:
      version: 3.0.7.0  # 默认最新版
      config: # common config for all dnodes
        firstEP: u1-55:6030
      dnodes:
        - endpoint: u1-55:6030
          config_dir: /etc/taos
          config: # will write into taos.cfg
            dataDir: /var/lib/taos
            logDir: /var/log/taos
            debugFlag: 131
            numOfCommitThreads: 8
        - endpoint: u1-56:6030
          config_dir: /etc/taos
          config: # will write into taos.cfg
            dataDir: /var/lib/taos
            logDir: /var/log/taos
            debugFlag: 131
            numOfCommitThreads: 8
        - endpoint: u1-57:6030
          config_dir: /etc/taos
          config: # will write into taos.cfg
            dataDir: /var/lib/taos
            logDir: /var/log/taos
            debugFlag: 131
            numOfCommitThreads: 8
  - name: taospy
    fqdn: [u1-55]
    spec:
      version: 3.0.7.0
      client_version: 3.0.7.0
      config:
        firstEP: u1-55:6030
        logDir: /var/log/taos
        debugFlag: 131

  - name: taosAdapter
    fqdn: [u1-55]
    spec:
      version: 3.0.7.0
      config_file: /etc/taos/taosadaper.toml
      adapter_config:
        logLevel: info
        port: 6041
        taosConfigDir: /etc/taos
        log:
          path: /var/log/taos
        opentsdb_telnet:
          enable: true
          maxTCPConnections: 250
          tcpKeepAlive: false
          dbs: ["telnet_tcp"]
          ports: [6046]
          user: root
          password: taosdata
          worker: 1000

      taos_config:
        firstEP: u1-55:6030
        logDir: /var/log/taos
        debugFlag: 131
  - name: taosBenchmark
    fqdn: [u1-60]
    spec:
      version: 3.0.1.8
      taos_version: 3.0.1.8
      config_dir: /etc/taos
      taos_config:
        firstEP: u1-55:6030
        logDir: /var/log/taos
        debugFlag: 131
  - name: prometheus
    fqdn: [u1-55]
    spec:
      server:
        run_dir: /opt/prometheus
        config:
          global:
            evaluation_interval: 10s
            scrape_interval: 15s
            scrape_timeout: 15s
          scrape_configs:
            job_name: prometheus
            targets: [192.168.1.55:9090]
      node_exporter:
        fqdn: [u1-55, u1-56, u1-57, u1-60]
        run_dir: /opt/node_exporter
      process_exporter:
        fqdn: [u1-55, u1-56, u1-57, u1-60]
        run_dir: /opt/process_exporter
        config:
          common_process: [taosd, taosBenchmark]
          custom_process:
            u1-55: [taosd, taosBenchmark]
            u1-56: [taosd, taosBenchmark]
            u1-57: [taosd, taosBenchmark]
            u1-60: [taosd, taosBenchmark]
