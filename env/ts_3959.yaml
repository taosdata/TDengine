settings:
  - name: taosd
    fqdn: [u1-60]
    spec:
      version: 3.0.4.1  # 默认最新版
      config: # common config for all dnodes
        firstEP: u1-60:6030
      dnodes:
        - endpoint: u1-60:6030
          config_dir: /etc/taos
          code_dir: /root/TDengine
          update_branch: main
          init_version_path: /root/TDengine-server-3.0.4.1
          fatal_version_path: /root/TDengine-server-3.1.1.0
          config: # will write into taos.cfg
            dataDir: /var/lib/taos
            logDir: /var/log/taos
            debugFlag: 131
            supportVnodes: 1024
  - name: taospy
    fqdn: [u1-60]
    spec:
      version: 3.0.4.1
      client_version: 3.0.4.1
      config:
        firstEP: u1-60:6030
        logDir: /var/log/taos
        debugFlag: 131
        asyncLog: 0