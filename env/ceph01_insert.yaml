settings:
  - name: taosd
    fqdn: [ceph01]
    spec:
      version: 2.4.0.0  # 默认最新版
      config: # common config for all dnodes
        firstEP: ceph01:6030
      dnodes:
        - endpoint: ceph01:6030
          config_dir: /var/dnode1/config
          config: # will write into taos.cfg
            dataDir: /var/dnode1/data
            logDir: /var/dnode1/log
            debugFlag: 135
  - name: taospy
    fqdn: [ceph01]
    spec:
      version: 2.2.0  
      client_version: 2.4.0.0
      config:
        firstEP: ceph01:6030
        logDir: /var/dnode1/log
        debugFlag: 135

  - name: prometheus
    fqdn: [ceph02]
    spec: 
      server: 
        run_dir: /opt/prometheus # 默认path, 选配
        config: # 所有key都选配
          global:
            evaluation_interval: 1s
            scrape_interval: 3s
            scrape_timeout: 3s
          scrape_configs:
            job_name: prometheus
            targets: [localhost:9090]
      node_exporter:
        fqdn: [k8sslave]
        run_dir: /opt/node_exporter # 默认path, 选配
      process_exporter:
        fqdn: [k8smaster, k8sslave] # 元素个数要大于等于custom_process中的key个数
        run_dir: /opt/process_exporter # 默认path, 选配
        config: # common_process和custom_process都选配, 但全配置的话custom_process会覆盖common_process的配置
          common_process: [taosd, taosadapter, taosBenchmark]
          custom_process:
            k8smaster: [taosd, taosadapter]
            k8sslave: [taosBenchmark, taosadapter, nginx]