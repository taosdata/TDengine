settings:
  - name: taosd
    fqdn: [node230, node232]
    spec:
      version: 2.4.0.121111  # 默认最新版
      config: # common config for all dnodes
        firstEP: node230:6030
      dnodes:
        - endpoint: node230:6030
          config_dir: /etc/taos
          code_dir: /root/TDengine
          update_branch: main
          config: # will write into taos.cfg
            dataDir: /var/lib/taos
            logDir: /var/log/taos
            debugFlag: 131
            supportVnodes: 1024
            logKeepDays:  -1
            numOfLogLines: 300000000
            checkpointInterval: 60
            snodeAddress: 127.0.0.1:873
            ratioOfVnodeStreamThreads: 4
            maxInsertBatchRows: 10000
            UdfdLdLibPath: /usr/local/lib/python3.8/site-packages/taospyudf:/usr/local/lib/python3.8/dist-packages/taospyudf
      reserve_dnodes:
        - endpoint: node232:6030
          config_dir: /etc/taos
          code_dir: /root/TDengine
          update_branch: main
          config: # will write into taos.cfg
            dataDir: /var/lib/taos
            logDir: /var/log/taos
            debugFlag: 131
            supportVnodes: 1024
            logKeepDays:  -1
            numOfLogLines: 300000000
            checkpointInterval: 60
            snodeAddress: 127.0.0.1:873
            ratioOfVnodeStreamThreads: 4
            maxInsertBatchRows: 10000
            UdfdLdLibPath: /usr/local/lib/python3.8/site-packages/taospyudf:/usr/local/lib/python3.8/dist-packages/taospyudf
  - name: taospy
    fqdn: [node230]
    spec:
      version: 2.2.0111
      client_version: 2.4.0.12111
      config:
        firstEP: node230:6030
        logDir: /var/log/taos
        debugFlag: 131
        asyncLog: 0
        maxQueryTimeRange: 3
        disableCount: 0
        queryTableNotExistAsEmpty: false
        maxInsertBatchRows: 10000

  - name: taosAdapter
    fqdn: [node230, node232]
    spec:
      version: 2.4.0.12
      config_file: /etc/taos/taosadapter.toml
      adapter_config:
        logLevel: info
        port: 6041
        taosConfigDir: /etc/taos
        log:
          path: /var/log/taos
        opentsdb_telnet:
          enable: true
          maxTCPConnections: 250
          tcpKeepAlive: false
          dbs: ["telnet_tcp"]
          ports: [6046]
          user: root
          password: taosdata
          worker: 1000

      taos_config:
        firstEP: 127.0.0.1:6030
        logDir: /var/log/taos
        debugFlag: 131
  - name: taosBenchmark
    fqdn: [node230]
    spec:
      version: 3.0.1.8
      taos_version: 3.0.1.8
      config_dir: /etc/taos
      taos_config:
        firstEP: node230:6030
        logDir: /var/log/taos
        debugFlag: 131

  - name: taosKeeper
    fqdn: [node230, node232]
    spec:
      version: 3.3.6.5
      config_file: /etc/taos/taoskeeper.toml
      keeper_config:
        loglevel: info
        port: 6043
        gopoolsize: 50000
        RotationInterval: 15s
        tdengine:
          host: 127.0.0.1
          port: 6041
          username: "root"
          password: "taosdata"
          usessl: false
        log:
          path: /var/log/taos
          rotationCount: 5
          rotationTime: 24h
          rotationSize: 100000000

  - name: taosExplorer
    fqdn: [node230, node232]
    spec:
      version: 3.3.6.5
      config_file: /etc/taos/explorer.toml
      explorer_config:
        log_level: info
        port: 6060
        addr: "0.0.0.0"
        cluster: "http://127.0.0.1:6041"
        x_api:   "http://127.0.0.1:6050"
        grpc: "http://127.0.0.1:6055"
        cors : true
        log:
          path: /var/log/taos
          rotationCount: 5
          rotationTime: 24h
          rotationSize: "1GB"

  - name: taosx
    fqdn: [node230, node232]
    spec:
      config_file: /etc/taos/taosx.toml
      port: 6060
      taosx_config:
        instanceId: 100
        log:
          path: /var/log/taos
        monitor:
          fqdn: localhost
      version: 3.3.*.*
