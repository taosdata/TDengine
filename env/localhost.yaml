settings:
  - name: taosd
    fqdn: [localhost]
    spec:
      version: 3.3.5.0
      config: # common config for all dnodes
        firstEP: localhost:6030
      dnodes:
        - endpoint: localhost:6030
          config_dir: /etc/taos
          code_dir: /root/TDengine
          update_branch: main
          config: # will write into taos.cfg
            dataDir: /var/lib/taos
            logDir: /var/log/taos
            debugFlag: 135
            supportVnodes: 1024
            logKeepDays:  -1
            numOfLogLines: 300000000
            checkpointInterval: 60
            snodeAddress: 127.0.0.1:873
            ratioOfVnodeStreamThreads: 4
            maxInsertBatchRows: 10000
  - name: taospy
    fqdn: [localhost]
    spec:
      version: 2.n
      client_version: 2.n
      config:
        firstEP: localhost:6030
        logDir: /var/log/taos
        debugFlag: 135
        asyncLog: 0
        maxQueryTimeRange: 3
        disableCount: 0
        queryTableNotExistAsEmpty: false
        maxInsertBatchRows: 10000

  - name: taosAdapter
    fqdn: [localhost]
    spec:
      version: 2.n
      config_file: /etc/taos/taosadapter.toml
      adapter_config:
        logLevel: info
        port: 6041
        taosConfigDir: /etc/taos
        log:
          path: /var/log/taos
        opentsdb_telnet:
          enable: true
          maxTCPConnections: 250
          tcpKeepAlive: false
          dbs: ["telnet_tcp"]
          ports: [6046]
          user: root
          password: taosdata
          worker: 1000

      taos_config:
        firstEP: localhost:6030
        logDir: /var/log/taos
        debugFlag: 135
  - name: taosBenchmark
    fqdn: [localhost]
    spec:
      version: 3.3.5.0
      taos_version: 3.3.5.0
      config_dir: /etc/taos
      taos_config:
        firstEP: localhost:6030
        logDir: /var/log/taos
        debugFlag: 131
