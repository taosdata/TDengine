settings:
  - name: taosd
    fqdn: [localhost]
    spec:
      version: 3.1.1.45  # 默认最新版
      config: # common config for all dnodes
        firstEP: localhost:6030
      dnodes:
        - endpoint: localhost:6030
          config_dir: /etc/taos
          config: # will write into taos.cfg
            supportVnodes: 128
            dataDir: /var/lib/taos
            logDir: /var/log/taos
            qDebugFlag: 131
            asyncLog: 0
            numOfLogLines: 2000000000

  - name: taospy
    fqdn: [localhost]
    spec:
      version: 3.1.1.45
      client_version: 3.1.1.45
      config:
        firstEP: localhost:6030
        dataDir: /var/lib/taos
        logDir: /var/log/taos
        debugFlag: 131
        asynclog: 0

  - name: playwright
    fqdn: [localhost]
    spec:
      playwright:
        # Screenshot configuration
        screenshot:
          viewport_width: 1280
          viewport_height: 720
          full_page: true  # Whether to capture the full page
          wait_timeout: 30000  # Wait timeout in milliseconds
          wait_for_selector: null  # Wait for specific selector to appear (optional)
        
        # Browser configuration
        browser:
          type: "chromium"  # Options: chromium, firefox, webkit
        
        # Optional: whether to delete installation directory on cleanup
        cleanup_on_destroy: false