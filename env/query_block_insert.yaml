settings:
  - name: taosd
    fqdn: [u1-54]
    spec:
      version: 3.0.2.4  # 默认最新版
      config: # common config for all dnodes
        firstEP: u1-54:6030
      dnodes:
        - endpoint: u1-54:6030
          config_dir: /etc/taos
          config: # will write into taos.cfg
            dataDir: /var/lib/taos
            logDir: /var/log/taos
            cdebugFlag: 135
            tscdebugFlag: 135
            qdebugFlag: 135
            tsdbdebugFlag: 135
            asyncLog: 0
            supportVnodes: 1024

  - name: taospy
    fqdn: [u1-54]
    spec:
      version: 3.0.2.4
      client_version: 3.0.2.4
      config:
        firstEP: u1-54:6030
        logDir: /var/log/taos
        querySmaOptimize: 1
        debugFlag: 135
        asyncLog: 0

  - name: taosBenchmark
    fqdn: [u1-58]
    spec:
      version: 3.0.2.4
      taos_version: 3.0.2.4
      config_dir: /etc/taos
      taos_config:
        firstEP: u1-54:6030
        logDir: /var/log/taos
        debugFlag: 131