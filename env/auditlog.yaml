settings:
  - name: taosd
    fqdn: [u1-60]
    spec:
      version: 3.0.2.0  # 默认最新版
      config: # common config for all dnodes
        firstEP: u1-60:6030
      dnodes:
        - endpoint: u1-60:6030
          config_dir: /etc/taos/1
          config: # will write into taos.cfg
            dataDir: /var/lib/taos/1
            logDir: /var/log/taos/1
            debugFlag: 135
            supportVnodes: 1024
            audit: 1
            monitorFqdn: u1-58
            monitorPort: 6043
            monitorCompaction: 1
      reserve_dnodes:
        - endpoint: u1-60:6031
          config_dir: /etc/taos/2/
          config: # will write into taos.cfg
            supportVnodes: 40
            dataDir: /var/lib/taos/2
            logDir: /var/log/taos/2
            debugFlag: 131
            asynclog: 0
  - name: taospy
    fqdn: [u1-60]
    spec:
      version: 3.0.2.0
      client_version: 3.0.2.0
      config:
        firstEP: u1-60:6030
        logDir: /var/log/taos
        debugFlag: 135
        asyncLog: 0
        maxQueryTimeRange: 3

  - name: taosAdapter
    fqdn: [u1-60]
    spec:
      version: 3.0.2.0
      config_file: /etc/taos/taosadapter.toml
      adapter_config:
        logLevel: info
        port: 6041
        taosConfigDir: /etc/taos
        log:
          path: /var/log/taos
        opentsdb_telnet:
          enable: true
          maxTCPConnections: 250
          tcpKeepAlive: false
          dbs: ["telnet_tcp"]
          ports: [6046]
          user: root
          password: taosdata
          worker: 1000

      taos_config:
        firstEP: u1-60:6030
        logDir: /var/log/taos
        debugFlag: 135
