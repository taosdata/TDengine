name: Label PR by Team

on:
  # App credentials are required for labeling, so this workflow must use the
  # base branch definition and must never check out or execute pull request code.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  label-pr:
    runs-on: ubuntu-latest

    steps:
        - name: Generate GitHub App Token
          id: app-token
          uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
          with:
            app-id: ${{ vars.TAOSDATA_BOT_ID }}
            private-key: ${{ secrets.TAOSDATA_BOT_KEY }}
            owner: ${{ github.repository_owner }}
            repositories: ${{ github.event.repository.name }}
            permission-issues: write
            permission-members: read

        - name: Add PR Labels
          uses: taosdata/.github/.github/actions/add-pr-labels@390f5ddff13d137d842642ce09eed9f0c648ddc9 # main, pinned 2026-09-17
          with:
            github-token: ${{ steps.app-token.outputs.token }}


                
