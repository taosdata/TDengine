name: TDengine Doc Build and Check

on:
  pull_request:
    branches:
      - 'main'
      - '3.0'
      - '3.3.6'
      - 'docs-cloud'
    paths:
      - 'docs/**'
      - '.github/workflows/tdengine-docs-ci.yml'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-with-typos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Actions Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use custom zh config file
        uses: crate-ci/typos@b1a1ef3893ff35ade0cfa71523852a49bfd05d19 # v1.31.1
        with:
          files: 'docs/zh/'
          config: docs/typos.toml

      - name: Use custom en config file
        uses: crate-ci/typos@b1a1ef3893ff35ade0cfa71523852a49bfd05d19 # v1.31.1
        with:
          files: 'docs/en/'
          config: docs/typos.toml

      - name: Use custom en config file
        uses: crate-ci/typos@b1a1ef3893ff35ade0cfa71523852a49bfd05d19 # v1.31.1
        with:
          files: './*.md'
          config: docs/typos.toml

  check-with-autocorrect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: AutoCorrect
        id: autocorrect
        uses: huacnlee/autocorrect-action@8101fa7ed2ea14e3e4591e8f4ef04bf612cb1f15 # v2
        with:
          args: --lint docs/zh/* docs/en/*
        continue-on-error: true

      - name: Report ReviewDog
        if: always() && steps.autocorrect.outcome == 'failure'
        uses: tomchon/autocorrect-action@39574019517181c82eeb0f3194206e3a7db9937f # fix/review-dog, pinned 2026-09-17
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
        with:
          reviewdog: true
          args: ./docs/zh/*  ./docs/en/*

      - name: Fail if AutoCorrect found issues
        if: steps.autocorrect.outcome == 'failure'
        run: |
          echo "❌ AutoCorrect found formatting issues"
          exit 1

  check-with-markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed files
        uses: tj-actions/changed-files@ed68ef82c095e0d48ec87eccea555d944a631a4c # v46
        id: changed-files
        with:
          files: |
            **/*.md
            **/*.mdx
          files_ignore: |
            .claude/**
            contrib/**
            tools/**
          separator: ","
      - name: Check with Markdownlint
        uses: DavidAnson/markdownlint-cli2-action@992badcdf24e3b8eb7e87ff9287fe931bcb00c6e # v20
        if: steps.changed-files.outputs.any_changed == 'true'
        with:
          config: 'docs/.markdownlint-cli2.jsonc'
          globs: ${{ steps.changed-files.outputs.all_changed_files }}
          separator: ','

  # Disabled by request: this job uses the self-hosted doc-build runner.
  build-doc:
    if: ${{ false }}
    env:
      DOC_WKC: '/root/doc_ci_work'
      ZH_DOC_REPO: 'docs.taosdata.com'
      EN_DOC_REPO: 'docs.tdengine.com'
      TD_REPO: 'TDengine'
      TOOLS_REPO: 'taos-tools'
    runs-on:
      group: CI
      labels: [self-hosted, doc-build]
    needs:
        - check-with-typos
        - check-with-autocorrect
        - check-with-markdownlint
    steps:
      - name: Get the latest document contents
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -e
          cd "$DOC_WKC/$TD_REPO"
          git reset --hard
          git clean -f
          git remote prune origin
          git fetch
          git checkout -B "$BASE_REF" "origin/$BASE_REF"
          git pull >/dev/null
          git fetch origin "+refs/pull/${PR_NUMBER}/merge"
          git checkout -qf FETCH_HEAD

      - name: Check document changes
        id: changed-doc-files
        uses: tj-actions/changed-files@ed68ef82c095e0d48ec87eccea555d944a631a4c # v46
        with:
          files: 'docs/**'
          path: ${{ env.DOC_WKC }}/${{ env.TD_REPO }}
          # settings for pull request event
          base_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Check whether the chinese or english docment is built
        id: check-doc-lang
        env:
          ALL_CHANGED_DOCS: ${{ steps.changed-doc-files.outputs.all_changed_files }}
          ADDED_DOCS: ${{ steps.changed-doc-files.outputs.added_files }}
          MODIFIED_DOCS: ${{ steps.changed-doc-files.outputs.modified_files }}
          DELETED_DOCS: ${{ steps.changed-doc-files.outputs.deleted_files }}
        run: |
          zh_doc_changed=false
          en_doc_changed=false
          printf 'All changed files: %s\n' "$ALL_CHANGED_DOCS"
          printf 'Added files: %s\n' "$ADDED_DOCS"
          printf 'Modified files: %s\n' "$MODIFIED_DOCS"
          printf 'Deleted files: %s\n' "$DELETED_DOCS"
          for file in $ALL_CHANGED_DOCS; do
            case $file in
              *docs/zh/*)
                zh_doc_changed=true
                ;;
              *docs/en/*)
                en_doc_changed=true
                ;;
              *docs/examples/*)
                zh_doc_changed=true
                en_doc_changed=true
                ;;
            esac
          done
          echo "zh_doc_changed=$zh_doc_changed"
          echo "en_doc_changed=$en_doc_changed"
          echo "zh_doc_changed=$zh_doc_changed" >> "$GITHUB_OUTPUT"
          echo "en_doc_changed=$en_doc_changed" >> "$GITHUB_OUTPUT"

      - name: Build the chinese document
        if: ${{ steps.check-doc-lang.outputs.zh_doc_changed == 'true'}}
        run: |
          cd "$DOC_WKC/$ZH_DOC_REPO"
          rm -rf build/* && rm -rf docs/* && git restore docs/
          git checkout -f master && git pull origin master
          yarn install
          yarn ass local
          yarn build
      - name: Build the english document
        if: ${{ steps.check-doc-lang.outputs.en_doc_changed == 'true'}}
        run: |
          cd "$DOC_WKC/$EN_DOC_REPO"
          rm -rf build/* && rm -rf docs/* && git restore docs/
          git checkout -f main && git pull origin main
          yarn install
          yarn ass local
          yarn build
