name: InfluxDB

on:
  pull_request:
    paths:
    - '.github/workflows/influxdb.yaml'
    - 'plugins/influxdb/**'
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v3
        with:
          clean: false

      - name: Build taosx-influxdb
        run: |
          cargo make taosx-influxdb
