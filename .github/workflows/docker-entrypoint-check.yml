# Static guard rails for the community image entrypoint.
#
# packaging/docker/bin/entrypoint.sh only supervises processes, so a regression
# there is invisible until a container "stays up but is dead" in production.
# The checks here are text-based and need neither docker nor a C++ build, which
# keeps the job a few seconds long.
#
# Behavioural coverage needs a docker daemon and lives in
# packaging/docker/test/run-local.sh -- run it locally after touching the
# entrypoint.

name: Docker Entrypoint Check

on:
  pull_request:
    branches:
      - 'main'
      - '3.0'
      - '3.3.8'
    paths:
      - 'packaging/docker/**'
      - '.github/workflows/docker-entrypoint-check.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  entrypoint-static:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check shell syntax
        run: bash -n packaging/docker/bin/entrypoint.sh

      - name: Check supervision contract
        run: |
          # The guard rails are added together with the entrypoint fix. Until
          # that lands the job only checks the shell syntax, so this workflow
          # can be merged before the fix itself without turning main red.
          if [ ! -f packaging/docker/test/test_entrypoint_community.py ]; then
            echo "test_entrypoint_community.py is not present yet, skipping"
            exit 0
          fi
          cd packaging/docker/test
          python3 -m unittest -v test_entrypoint_community
