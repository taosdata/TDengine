      - name: Copy report config file
        run: |
          # Copy report configuration files
          cp tests/tools/sample/perf_cases.toml "$BASE_DIR/records/" || true

  generate_report:
    name: Generate Performance Report
    needs: [run_td2td, run_tmq2td, run_tmq2local, run_csv2td]
    runs-on: [self-hosted, Linux, X64, qa, perf]
    if: always()
    steps:
      - name: Checkout taosx repository
        uses: actions/checkout@v4
        with:
          clean: false
      - name: Generate performance report
        run: |
          echo "Generating performance report using perf_report.rs"
          cargo run -p taosx-tools --bin perf-report -- -i "$BASE_DIR/records" -o "$BASE_DIR/report"
          echo "Generated reports:"
          ls -la "$BASE_DIR/report/"
      - name: Archive results
        run: |
          echo "Performance test completed at $(date)"
          echo "Results available at: $BASE_DIR/report"
          echo "Test records available at: $BASE_DIR/records"

  publish_report:
    name: Publish Report via Nginx
    needs: generate_report
    if: always()
    runs-on: [self-hosted, Linux, X64, qa, perf]
    outputs:
      report_url: ${{ steps.report_url.outputs.report_url }}
    steps:
      - name: Ensure nginx installed
        run: |
          if ! command -v nginx >/dev/null 2>&1; then
            echo "nginx not found, installing..."
            if command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update -y
              sudo apt-get install -y nginx rsync
            elif command -v yum >/dev/null 2>&1; then
              sudo yum install -y epel-release || true
              sudo yum install -y nginx rsync
              sudo systemctl enable nginx || true
            else
              echo "No supported package manager found to install nginx"; exit 1
            fi
          else
            echo "nginx already installed: $(nginx -v 2>&1)"
            command -v rsync >/dev/null 2>&1 || { echo "Installing rsync"; (command -v apt-get && sudo apt-get install -y rsync) || (command -v yum && sudo yum install -y rsync) || true; }
          fi
      - name: Sync report to web root (Plan B)
        run: |
          SRC="$BASE_DIR/report"
          WEB_ROOT="/usr/share/nginx/html"
          DEST_DIR="$WEB_ROOT/performance-report"
          if [ ! -d "$SRC" ]; then
            echo "Source report dir $SRC not found"; ls -la "$BASE_DIR" || true; exit 1; fi
          sudo mkdir -p "$DEST_DIR"
          sudo rsync -a "$SRC/" "$DEST_DIR/"
          # Permissions
          sudo find "$DEST_DIR" -type d -exec chmod 755 {} \;
          sudo find "$DEST_DIR" -type f -exec chmod 644 {} \;
          echo "Synced report to $DEST_DIR"
      - name: Configure nginx site
        run: |
          PORT=18080
          SITE_CONF="/etc/nginx/conf.d/taosx_performance.conf"
          sudo rm -f "$SITE_CONF" || true
          echo "Writing nginx config to $SITE_CONF"
          cat <<'EOF' > /tmp/taosx_performance.conf
          server {
            listen 18080;
            server_name _;
            charset utf-8;
            root /usr/share/nginx/html;
            location /performance-report/ {
              alias /usr/share/nginx/html/performance-report/;
              autoindex on;
              add_header Cache-Control "no-cache";
              try_files $uri $uri/ =404;
            }
            location = /performance-report { return 301 /performance-report/; }
            location / { return 302 /performance-report/; }
          }
          EOF
          sudo mv /tmp/taosx_performance.conf "$SITE_CONF"
          sudo nginx -t
      - name: Reload/start nginx
        run: |
          if command -v systemctl >/dev/null 2>&1; then
            sudo systemctl restart nginx || { echo "systemctl restart failed, trying nginx -s reload"; sudo nginx -s reload || sudo nginx; }
          else
            if pgrep -x nginx >/dev/null 2>&1; then
              sudo nginx -s reload || true
            else
              sudo nginx || true
            fi
          fi
          echo "Nginx processes:"; ps -ef | grep nginx | grep -v grep || true
      - name: Output access URL
        id: report_url
        run: |
          IP=$(hostname -I 2>/dev/null | awk '{print $1}')
          [ -z "$IP" ] && IP=$(ip addr show | grep 'inet ' | awk '{print $2}' | cut -d/ -f1 | head -n1)
          URL="http://${IP}:18080/performance-report/"
          echo "Report URL: $URL"
          echo "REPORT_URL=$URL" >> $GITHUB_ENV
          echo "report_url=$URL" >> $GITHUB_OUTPUT

  feishu_notify:
    name: Feishu Notify
    needs: publish_report
    if: always()
    runs-on: [self-hosted, Linux, X64, qa, perf]
    steps:
      - name: Send Feishu Message
        run: |
          function post_to_feishu() {
            local text="$1"
            curl -X POST -H "Content-Type: application/json" \
            -d @- https://open.feishu.cn/open-apis/bot/v2/hook/209e9aba-167a-49de-8d7b-15e12abd7922 <<EOF
            {
                "msg_type": "text",
                "content": {
                "text": "$text"
                }
            }
          EOF
          }

          REPORT_URL='${{ needs.publish_report.outputs.report_url }}'
          PR_INFO="taosX 性能测试报告已生成，请查看: $REPORT_URL"
          post_to_feishu "$PR_INFO"
