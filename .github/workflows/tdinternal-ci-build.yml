name: TDinternal Build

on:
  pull_request:
    branches:
      - 'main'
      - '3.0'
      - '3.3.6'
    paths-ignore:
      - 'enterprise/packaging/**'
      - 'enterprise/tests/**'
      - '*.md'
      
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          # - macos-13
          # - macos-14
          # - macos-15

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.0

      - name: Install dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt update -y
          sudo apt install -y build-essential cmake \
            libgeos-dev libjansson-dev libsnappy-dev liblzma-dev libz-dev \
            zlib1g pkg-config libssl-dev gawk

      - name: Install dependencies on macOS
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install argp-standalone gflags pkg-config  snappy zlib geos jansson gawk openssl
      
      - name: Generate GitHub App Token
        id: app-token
        uses: tibdex/github-app-token@v1
        with:
          app_id: ${{ vars.TAOSDATA_BOT_ID }}
          private_key: ${{ secrets.TAOSDATA_BOT_KEY }}
          
      - name: Configure Git authentication
        run: |
          # 配置全局git配置      
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"
          
      - name: Get CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.31.6
          
      - name: Build and install TDinternal
        run: |
          mkdir debug && cd debug
          cmake .. -DBUILD_TOOLS=true \
            -DBUILD_KEEPER=true \
            -DBUILD_HTTP=internal \
            -DBUILD_TEST=true \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TAOSX=false \
            -DBUILD_DEPENDENCY_TESTS=false \
            -DTAOSADAPTER_GIT_TAG:STRING=${{ github.base_ref }}
          make -j 4
          sudo make install
          which taosd
          which taosadapter
          which taoskeeper
          
      - name: Start taosd
        run: |
          cp /etc/taos/taos.cfg ./
          sudo echo "supportVnodes 256" >> taos.cfg
          nohup sudo taosd -c taos.cfg &

      - name: Start taosadapter
        run: nohup sudo taosadapter &

      - name: Run tests with taosBenchmark
        run: |
          taosBenchmark -t 10 -n 10 -y 
          taos -s "select count(*) from test.meters"
         
      - name: Clean up
        if: always()
        run: |
          if pgrep taosd; then sudo pkill taosd; fi
          if pgrep taosadapter; then sudo pkill taosadapter; fi
