name: TDengine Coverage

on:
  workflow_dispatch:
    inputs:
      specified_tdinternal_test_branch:
        description: 'Enter the test branch of TDinternal'
        required: false
        type: string
        default: 'fix/tdinternal-sync-build' # default value for TDinternal test branch
      specified_tdengine_test_branch:
        description: 'Enter the test branch of TDengine'
        required: false
        type: string
        default: 'fix/tdinternal-sync-build' # default value for TDengine test branch
  schedule:
    - cron: '0 17 * * *'
    # - cron: '0 18 * * *'
    # - cron: '0 */12 * * *'


concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.specified_tdinternal_test_branch || 'fix/tdinternal-sync-build' }}-${{ github.event.inputs.specified_tdengine_test_branch || 'fix/tdinternal-sync-build' }}-TDengine
  cancel-in-progress: true

env:
  WK: '/var/lib/jenkins/workspace/TDinternal/'
  WKC: '/var/lib/jenkins/workspace/TDinternal/community'

permissions:
  contents: read

jobs:
  run-tests-on-linux:
    uses: taosdata/.github/.github/workflows/run-coverage-tests-on-linux.yml@2a74c302e3f701d03e22d7a896152f6cea0f4dbc # fix/coverage-setup-python, pinned 2026-11-01
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'}}
    with:
      specified_tdinternal_test_branch: ${{ github.event_name == 'schedule' && '3.0' || github.event.inputs.specified_tdinternal_test_branch || 'fix/tdinternal-sync-build' }}
      specified_tdengine_test_branch: ${{ github.event_name == 'schedule' && '3.0' || github.event.inputs.specified_tdengine_test_branch || 'fix/tdinternal-sync-build' }}
