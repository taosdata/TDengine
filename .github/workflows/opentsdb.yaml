name: OpenTSDB

on:
  pull_request:
    paths:
    - '.github/workflows/opentsdb.yaml'
    - 'plugins/opentsdb/**'
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: [self-hosted, linux, x64, app2]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Build taosx-opentsdb
        working-directory: plugins/opentsdb
        run: mvn clean test

      - name: Generate jacoco report
        working-directory: plugins/opentsdb
        run: mvn jacoco:report

      - name: Save Jacoco report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage report of taosx-opentsdb
          path: plugins/opentsdb/target/site/jacoco/*

      - name: Generate JaCoCo badge
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: plugins/opentsdb/target/site/jacoco/jacoco.csv
