name: TDengine Release Build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'packaging/**'
      - 'tests/**'
      - '**/*.md'
      - '.github/workflows/tdengine-docs-ci.yml'
      
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Run on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - macos-14

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt update -y
          sudo apt install -y \
            build-essential \
            cmake \
            gawk \
            libgeos-dev \
            libjansson-dev \
            liblzma-dev \
            libsnappy-dev \
            libssl-dev \
            libz-dev \
            pkg-config \
            zlib1g

      - name: Install dependencies on macOS
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install \
            argp-standalone \
            gawk \
            gflags \
            geos \
            jansson \
            snappy \
            zlib

      - name: Prepare install path
        run: |
          sudo mkdir -p /usr/local/lib
          sudo mkdir -p /usr/local/include

      - name: Get CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.31.6

      - name: Build and install TDengine
        run: |
          mkdir debug && cd debug
          cmake .. -DBUILD_TOOLS=true \
            -DBUILD_KEEPER=true \
            -DBUILD_HTTP=false \
            -DBUILD_TEST=true \
            -DWEBSOCKET=true \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_CONTRIB=ON \
            -DBUILD_ROCKSDB=ON \
            -DBUILD_DEPENDENCY_TESTS=false
          make -j 4
          make install
          which taosd
          which taosBenchmark

      - name: Statistics ldd
        run: |
          find ${{ github.workspace }}/debug/build/lib -type f -name "*.so" -print0 | xargs -0 ldd || true
          find ${{ github.workspace }}/debug/build/bin -type f -print0 | xargs -0 ldd || true

      - name: Statistics size
        run: |
          find ${{ github.workspace }}/debug/build/lib -type f -print0 | xargs -0 ls -lhrS
          find ${{ github.workspace }}/debug/build/bin -type f -print0 | xargs -0 ls -lhrS

      - name: Start taosd
        timeout-minutes: 2
        run: |
          # Keep server and clients under the same user, away from root-owned
          # installation state. The runner temp directory is unique to this job.
          smoke_dir=$(mktemp -d "$RUNNER_TEMP/tdengine-release-smoke.XXXXXX")
          echo "TDENGINE_SMOKE_DIR=$smoke_dir" >> "$GITHUB_ENV"
          mkdir -p "$smoke_dir/cfg" "$smoke_dir/data" "$smoke_dir/log" "$smoke_dir/tmp"
          cat > "$smoke_dir/cfg/taos.cfg" <<EOF
          fqdn localhost
          firstEp localhost:6030
          supportVnodes 256
          dataDir $smoke_dir/data
          logDir $smoke_dir/log
          tempDir $smoke_dir/tmp
          EOF
          nohup taosd -c "$smoke_dir/cfg" > "$smoke_dir/taosd.out" 2>&1 &
          taosd_pid=$!
          echo "$taosd_pid" > "$smoke_dir/taosd.pid"
          # A running process does not yet mean SQL connections are ready.
          for attempt in {1..60}; do
            echo "Waiting for SQL readiness ($attempt/60)"
            if ! kill -0 "$taosd_pid" 2>/dev/null; then
              echo "taosd exited before becoming ready"
              cat "$smoke_dir/taosd.out"
              exit 1
            fi
            # The CLI can exit zero after a SQL error, so also require its
            # successful result marker from a query handled by the server.
            if taos -c "$smoke_dir/cfg" -h localhost -s "show databases" > "$smoke_dir/ready.out" 2>&1 &&
               grep -Eq '^Query OK, [0-9]+ row\(s\) in set ' "$smoke_dir/ready.out"; then
              cat "$smoke_dir/ready.out"
              exit 0
            fi
            sleep 1
          done
          echo "taosd did not become ready within 60 attempts"
          cat "$smoke_dir/taosd.out" "$smoke_dir/ready.out"
          exit 1

      - name: Run tests with taosBenchmark
        run: |
          taosBenchmark -c "$TDENGINE_SMOKE_DIR/cfg" -h localhost -t 10 -n 10 -y
          taos -c "$TDENGINE_SMOKE_DIR/cfg" -h localhost -s "select count(*) from test.meters"

      - name: Upload smoke test diagnostics
        if: failure() && env.TDENGINE_SMOKE_DIR != ''
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke-${{ matrix.os }}
          path: |
            ${{ env.TDENGINE_SMOKE_DIR }}/cfg
            ${{ env.TDENGINE_SMOKE_DIR }}/log
            ${{ env.TDENGINE_SMOKE_DIR }}/*.out
          retention-days: 7

      - name: Clean up
        if: always()
        run: |
          if [ -n "${TDENGINE_SMOKE_DIR:-}" ] && [ -f "$TDENGINE_SMOKE_DIR/taosd.pid" ]; then
            taosd_pid=$(cat "$TDENGINE_SMOKE_DIR/taosd.pid")
            if kill -0 "$taosd_pid" 2>/dev/null; then
              kill "$taosd_pid"
              for attempt in {1..10}; do
                if ! kill -0 "$taosd_pid" 2>/dev/null; then
                  break
                fi
                echo "Waiting for taosd to stop ($attempt/10)"
                sleep 1
              done
              if kill -0 "$taosd_pid" 2>/dev/null; then
                kill -KILL "$taosd_pid"
              fi
            fi
          fi
