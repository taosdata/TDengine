name: New Framework Test

on:
  workflow_dispatch:
    inputs:
      specified_source_branch:
        description: 'Enter the source branch name of TDengine'
        required: true
        type: string
      specified_target_branch:
        description: 'Enter the target branch name of TDengine'
        required: true
        type: string
      specified_pr_number:
        description: 'Enter the PR number of TDengine'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-
    ${{ inputs.specified_target_branch }}-
    ${{ inputs.specified_pr_number }}-TDengineNewFramework
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-new-cases:
    if: github.event_name == 'workflow_dispatch'
    uses: taosdata/.github/.github/workflows/new-framework-test.yml@390f5ddff13d137d842642ce09eed9f0c648ddc9 # main, pinned 2026-09-17
    with:
      tdinternal: false
      specified_source_branch: ${{ inputs.specified_source_branch }}
      specified_target_branch: ${{ inputs.specified_target_branch }}
      specified_pr_number: ${{ inputs.specified_pr_number }}
