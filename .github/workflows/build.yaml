name: CI

on:
  pull_request:
  workflow_dispatch:

env:
  RUSTFLAGS: "--cfg tokio_unstable"

jobs:
  build:
    name: Build
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v3
        with:
          clean: false

      - uses: actions/cache@v3
        name: Target Caches
        with:
          path: |
            target
          key: ${{ runner.os }}-target

      - name: Compile check
        run: |
          cargo check --all

      - name: Format check
        run: |
          cargo fmt --check --all
