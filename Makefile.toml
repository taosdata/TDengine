[tasks.build-docker-dev]
cwd = "docker/dev/"
script = """
echo use manylinux2014 as base image with docker/dev/Dockerfile .
set -e
PLATFORM=""
while [ $# -gt 0 ]; do
  case "$1" in
    --platform)
      PLATFORM="$2"
      shift 2
      ;;
    --platform=*)
      PLATFORM="${1#--platform=}"
      shift
      ;;
    *)
      echo "Unknown param: $1, ignored"
      ;;
  esac
done
if [ -z "$PLATFORM" ]; then
  PLATFORM="linux/amd64,linux/arm64" # default platform
fi
echo "Building taosx/dev:${RUST_VERSION} for platform: ${PLATFORM}"
docker buildx build --platform ${PLATFORM} -t taosx/dev:${RUST_VERSION} --build-arg RUST_VERSION=${RUST_VERSION} --load .
"""
[tasks.install-taosx-dev-docker-image]
install_script = """
#!/bin/bash
echo "Prepare dev image for version $RUST_VERSION"
if ! docker image inspect taosx/dev:${RUST_VERSION} >/dev/null 2>&1; then
  echo "Dev image taosx/dev:${RUST_VERSION} not found locally. Building..."
  cargo make build-docker-dev
else
  echo "Dev image taosx/dev:${RUST_VERSION} already present. Skipping build."
fi
"""

[tasks.check-aarch64]
alias = "check-arm64"
[tasks.check-arm64]
dependencies = ["assert-explorer-dist"]
script_runner = "bash"
script = """
if [[ "$@" = "" ]]; then
  extras="--workspace";
else
  extras="$@";
fi
echo cargo check $extras
export PLATFORM=linux/arm64
export TARGET_DIR=$PWD/target/${PLATFORM}
mkdir -p $TARGET_DIR
docker run --platform $PLATFORM --rm \
  -v .:/app \
  -e VER_NUMBER=${VER_NUMBER} \
  -v $HOME/.cargo/registry:/root/.cargo/registry \
  -v $HOME/.cargo/git:/root/.cargo/git \
  -v $TARGET_DIR:/app/target \
  taosx/dev:${RUST_VERSION} \
  cargo check
"""

# # Examples
#
# 1. Build aarch64 taosx: cargo make build-centos7-release --platform linux/arm64 -p taosx
# 2. Build aarch64 taosx and agent: cargo make build-centos7-release --platform linux/amd64 -p taosx -p taosx-agent
#
[tasks.build-centos7-release]
dependencies = ["install-taosx-dev-docker-image"]
script = """
echo Build taosX release binaries with taosx/dev image.

# Parse arguments: extract --platform (linux/amd64 or linux/arm64) and pass remaining to cargo.
PLATFORM=""
EXTRAS=""
while [ $# -gt 0 ]; do
  case "$1" in
    --platform)
      PLATFORM="$2"
      shift 2
      ;;
    --platform=*)
      PLATFORM="${1#--platform=}"
      shift
      ;;
    *)
      if [ -z "$EXTRAS" ]; then
        EXTRAS="$1"
      else
        EXTRAS="$EXTRAS $1"
      fi
      shift
      ;;
  esac
done

if [ -z "$PLATFORM" ]; then
  PLATFORM="linux/amd64" # default platform
fi

case "${PLATFORM}" in
  "linux/amd64"|"linux/arm64")
    echo "Build taosX release for target ${PLATFORM}"
    echo "EXTRAS: ${EXTRAS}"
    echo "BUILD_PROFILE: ${BUILD_PROFILE}"
    TARGET_DIR=$PWD/target/${PLATFORM}
    mkdir -p "$TARGET_DIR"
    docker run --platform "${PLATFORM}" --rm \
      -v .:/app \
      -v $HOME/.cargo/registry:/root/.cargo/registry \
      -v $HOME/.cargo/git:/root/.cargo/git \
      -v "$TARGET_DIR":/app/target \
      -e DATABASE_URL=sqlite:/app/target/taosx.dev.db \
      -e VER_NUMBER=${VER_NUMBER} \
      taosx/dev:${RUST_VERSION} \
      cargo build --profile "${BUILD_PROFILE}" ${EXTRAS}
    ;;
  *)
    echo "Unsupported platform: ${PLATFORM}. Allowed: linux/amd64 or linux/arm64"
    exit 1
    ;;
esac

"""

