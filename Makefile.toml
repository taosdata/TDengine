#!/bin/bash
echo "Prepare zigbuilder image for aarch64"
docker images --format json | jq 'select(.Repository == "taosx/zigbuilder")' || cargo make zigbuild-aarch64-image
"""
script = """
docker run --rm -v .:/app -w /app \
  -v $HOME/.cargo/registry:/root/.cargo/registry \
  -v $HOME/.cargo/git:/root/.cargo/git \
  -e DATABASE_URL=sqlite:/app/target/taosx.dev.db \
