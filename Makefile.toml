stop_container() {
  docker stop $container
  if [ $? -ne 0 ]; then
    echo "Failed to stop container $container"
  else
    echo "Waiting for container $container to stop..."
    while [ "$(docker inspect -f '{{.State.Running}}' $container)" = "true" ]; do
