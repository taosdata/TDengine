# command "toml get ..." requires installation of "toml-cli" first, ref https://github.com/gnprice/toml-cli
[config]
load_cargo_aliases = false
skip_core_tasks = true
default_to_workspace = false

[env]
VER_NUMBER = { script = [
  "git tag |grep ver-|sed s/ver-//|sort -V|tail -n1",
], condition = { env_not_set = [
  "VER_NUMBER",
] } }
UPX_DIR = "./target/deploy/upx/"
BUILD_PROFILE = { value = "release", condition = { env_not_set = [
  "BUILD_PROFILE",
] } }

[tasks.build]
command = "cargo"
args = ["build", "--profile", "${BUILD_PROFILE}"]

[tasks.dump-env]
script = """
echo $VER_NUMBER
"""

#[tasks.cargo-update]
#command = "cargo"
#args = ["update"]

[tasks.taosx]
command = "cargo"
args = ["build", "-p", "taosx", "--profile", "${BUILD_PROFILE}"]
#dependencies = ["cargo-update"]

[tasks.taosx.windows]
command = "cargo"
args = [
  "build",
  "-p",
  "taosx",
  "--profile",
  "${BUILD_PROFILE}",
  "--no-default-features",
  "--features",
  "optin,native-tls",
]
#dependencies = ["cargo-update"]

[tasks.taosx-agent]
command = "cargo"
args = ["build", "--release", "-p", "taosx-agent"]
#dependencies = ["cargo-update"]

[tasks.plugins]
dependencies = ["taosx-influxdb", "taosx-opentsdb", "taosx-mqtt", "taosx-opc"]

[tasks.taos-explorer]
script = """
cd ../explorer && git checkout main && git pull
rsync -u root@192.168.0.30:/root/enterprise-docs/docs-zh.zip .
rsync -u root@192.168.0.30:/root/enterprise-docs/docs-en.zip .
rm -rf public/docs && unzip docs-zh.zip -d public/docs
rm -rf public/docs-en && unzip docs-en.zip -d public/docs-en
cargo update
yarn install && yarn build:bin
mkdir -p ../taosx/target/release/ && cp target/release/taos-explorer ../taosx/target/release/taos-explorer
"""

[tasks.clean-plugins]
script = """
set -ex
rm -rf plugins/influxdb/target
rm -rf plugins/opentsdb/target
rm -rf plugins/mqtt/dist
rm -rf plugins/opc/taosx-opc
"""

[tasks.taosx-influxdb]
command = "mvn"
args = ["package", "-f", "plugins/influxdb/pom.xml"]

[tasks.taosx-opentsdb]
command = "mvn"
args = ["package", "-f", "plugins/opentsdb/pom.xml"]

[tasks.taosx-mqtt]
cwd = "plugins/mqtt"
script = """
commit=$(git rev-parse HEAD | cut -c 1-8)
built=$(date +"%F %T %:z")
path=github.com/taosdata/taosx/plugins/mqtt
go mod tidy
go build -o dist/taosx-mqtt \
  -ldflags "-X $path/version.Commit=${commit} -X '$path/version.BuildTime=$built'"
"""

[tasks.taosx-opc]
cwd = "plugins/opc"
script = """
commit=$(git rev-parse HEAD | cut -c 1-8)
built=$(date +"%F %T %:z")
go mod tidy
go build -o taosx-opc \
  -ldflags "-X collector/version.CommitID=${commit} -X 'collector/version.BuildAt=$built'"
"""

[tasks.package]
# script = { file = "./scripts/package.sh" }
# dependencies = ["build-all"]
script = """
PKG=target/packaging/linux
[ -d $PKG ] && rm -rf $PKG
mkdir -p $PKG/usr/bin
mkdir -p $PKG/usr/local/taos/plugins/influxdb
mkdir -p $PKG/usr/local/taos/plugins/opentsdb
mkdir -p $PKG/usr/local/taos/plugins/mqtt
mkdir -p $PKG/usr/local/taos/plugins/opc

mkdir -p $PKG/etc/systemd
mkdir -p $PKG/etc/taos

cp target/release/taosx target/release/taosx-agent $PKG/usr/bin
cp plugins/influxdb/target/taosx-influxdb.jar $PKG/usr/local/taos/plugins/influxdb
cp plugins/opentsdb/target/taosx-opentsdb.jar $PKG/usr/local/taos/plugins/opentsdb
cp plugins/mqtt/dist/taosx-mqtt $PKG/usr/local/taos/plugins/mqtt/
cp plugins/opc/taosx-opc $PKG/usr/local/taos/plugins/opc/
cp packaging/uninstall.sh $PKG/usr/local/taos/

cp target/*.service $PKG/etc/systemd/
cp taosx-agent/examples/agent.toml $PKG/etc/taos/agent.example.toml

cd $PKG
version=$(./usr/bin/taosx --version|cut -f 2 -d " ")
tar cavf ../taosx-$version.tar.gz ./*
ln -f ../taosx-$version.tar.gz ../taosx-latest.tar.gz
"""

[tasks.dev-install-taosx]
script = """
sudo systemctl stop taosx || true
sudo install target/debug/taosx /usr/local/taos/bin/
sudo ln -sf /usr/local/taos/bin/taosx /usr/bin/taosx
sudo systemctl start taosx
"""

[tasks.dev-install-plugins]
script = """
plugins=/usr/local/taos/plugins
sudo mkdir -p $plugins/opc $plugins/mqtt $plugins/influxdb $plugins/opentsdb
sudo cp plugins/influxdb/target/taosx-influxdb.jar /usr/local/taos/plugins/influxdb/
sudo cp plugins/opentsdb/target/taosx-opentsdb.jar /usr/local/taos/plugins/opentsdb/
sudo cp plugins/mqtt/dist/taosx-mqtt /usr/local/taos/plugins/mqtt/
sudo cp plugins/opc/taosx-opc /usr/local/taos/plugins/opc/
"""
[tasks.install]
cwd = "target/packaging"
dependencies = ["package"]
script = """
sudo tar -C / --no-same-owner -xvf taosx-latest.tar.gz
"""

[tasks.uninstall]
script = """
echo $@
sudo rm /usr/local/taos/bin/taos-explorer
sudo rm /usr/local/taos/bin/taosx
sudo rm /usr/local/taos/bin/taosx-agent
sudo rm /etc/systemd/systemd/taos-explorer.service
sudo rm /etc/systemd/systemd/taosx.service
sudo rm /etc/systemd/systemd/taosx-agent.service
sudo systemctl daemon-reload
if [ "$1" == "--all" ]; then
  sudo rm -rf /var/lib/taos/taosx/
fi
"""

[tasks.build-all]
dependencies = ["taosx", "taosx-agent", "plugins"]

[tasks.build-sanitizer]
command = "cargo"
env = { "RUSTFLAGS" = "-Zsanitizer=address --cfg tokio_unstable" }
args = [
  "build",
  "--profile",
  "sani",
  "--target",
  "x86_64-unknown-linux-gnu",
  "-Zbuild-std",
]

[tasks.clean-all]
dependencies = ["clean-plugins", "clean"]

[tasks.docker-cloud]
script = """
set -e
push=0
build=0
for arg in "$@"; do
  case $arg in
    --push|-p)
      push=1
      ;;
    --build|-b)
      build=1
      ;;
  esac
done

commit=$(git rev-parse HEAD | cut -c 1-8)
version=$(toml get Cargo.toml workspace.package.version -r)
echo TDengine version in cloud image is "${VER_NUMBER}"

if [ "$build" = "1" ]; then
  cargo build --release
fi
docker build --build-arg VER_NUMBER=${VER_NUMBER} -t image.cloud.taosdata.com/taosx/serve:$version-$commit .
if [ "$push" = "1" ]; then
  docker push image.cloud.taosdata.com/taosx/serve:$version-$commit
fi
"""
dependencies = ["plugins"]

[tasks.docker-push]
script = """
commit=$(git rev-parse HEAD | cut -c 1-8)
version=$(toml get Cargo.toml workspace.package.version -r)
docker push image.cloud.taosdata.com/taosx/serve:$version-$commit
"""

[tasks.build-all-and-cloud]
dependencies = ["build-all", "docker-cloud"]

[tasks.build-and-push-docker-cloud]
dependencies = ["build-all", "docker-cloud", "docker-push"]

[tasks.build-docker]
run_task = [
  { name = "build-docker-serve-source", condition = { env = { "mode" = "serve", "type" = "source" } } },
  { name = "build-docker-serve-bin", condition = { env = { "mode" = "serve", "type" = "bin" } } },
  { name = "build-docker-agent-source", condition = { env = { "mode" = "agent", "type" = "source" } } },
  { name = "build-docker-agent-bin", condition = { env = { "mode" = "agent", "type" = "bin" } } },
  { name = "build-docker-integrated-bin", condition = { env = { "mode" = "integrated" } } },
  { name = "build-docker-integrated-bin" },
]

[tasks.build-docker-serve-source]
script = """
set -e
commit=$(git rev-parse HEAD | cut -c 1-8)
echo TDengine version in cloud image is "${VER_NUMBER}"
mkdir -p ./docker/serve/release/plugins/
rsync -u root@192.168.1.213:/nas/TDengine/v${VER_NUMBER}/enterprise/TDengine-enterprise-client-${VER_NUMBER}-Linux-x64.tar.gz .
tar vxf TDengine-enterprise-client-${VER_NUMBER}-Linux-x64.tar.gz
cp -r ./TDengine-enterprise-client-${VER_NUMBER} ./docker/serve/release/TDengine-enterprise-client
cp ./target/release/taosx ./docker/serve/release/taosx
cp ./plugins/influxdb/target/taosx-influxdb.jar ./docker/serve/release/plugins/taosx-influxdb.jar
cp ./plugins/opentsdb/target/taosx-opentsdb.jar ./docker/serve/release/plugins/taosx-opentsdb.jar
cp ./plugins/opc/taosx-opc ./docker/serve/release/plugins/taosx-opc
cp ./plugins/mqtt/dist/taosx-mqtt ./docker/serve/release/plugins/taosx-mqtt
docker build -t image.cloud.taosdata.com/taosx/serve:${VER_NUMBER}-$commit ./docker/serve/
rm -rf ./docker/serve/release
rm -rf ./TDengine-enterprise-client-${VER_NUMBER}
"""
