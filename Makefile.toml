  wget -c https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz
docker build -t taosx/zigbuilder -f build.arm64.Dockerfile --build-arg ZIG_VERSION=${ZIG_VERSION} .
"""

[tasks.zigbuild-aarch64-taosx]
