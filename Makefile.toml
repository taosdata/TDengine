# command "toml get ..." requires installation of "toml-cli" first, ref https://github.com/gnprice/toml-cli

# Use env scripts to get the latest version from git tags to make it available for any platform.
env_scripts = ['''
  #!@duckscript

  # setup version
  ver = get_env VER_NUMBER
  if is_empty ${ver}
    out = exec git describe --tags --abbrev=0
    ver = trim ${out.stdout}
    ver = replace ${ver} "ver-" ""
    echo "* last published version: ${ver}"
    set_env "VER_NUMBER" "${ver}"
  end

  # 获取编译器版本信息
  gcc_version = exec cc -dumpversion
  version = trim ${gcc_version.stdout}
  if is_empty ${version}
    set_env "CFLAGS" "-fno-builtin"
  else
    echo "GCC version: ${version}"

    if contains ${version} "."
      version = semver_parse "${version}"
    else
      version = semver_parse "${version}.0.0"
    end
    echo "Major version: ${version.major}"

    # 比较主版本号是否大于 9
    if greater_than ${version.major} 9
        echo "GCC version is 10+"
    else
        echo "GCC version is 9 or lower, use -fno-builtin"
        set_env "CFLAGS" "-fno-builtin"
    end
  end

  cus_name = get_env "CUS_NAME"
  echo ${cus_name}
  if is_empty "${cus_name}"
    cus_name = set "TDengine"
    set_env "CUS_NAME" "${cus_name}"
  end
  echo "Product: ${cus_name}"

  if eq "${cus_name}" "TDengine TSDB-Lite"
    set_env "TSDB_LITE" "true"
  end

  cus_prompt = get_env "CUS_PROMPT"
  if is_empty "${cus_prompt}"
    cus_prompt = set "taos"
    set_env "CUS_PROMPT" "${cus_prompt}"
  end
  echo "Prompt: ${cus_prompt}"

  # 获取插件目录
  plugins_home = get_env "PLUGINS_HOME"

  # 获取当前系统平台
  os = os_family
  echo "Build on OS: ${os}"
  set_env "CARGO_MAKE_BUILD_OS_FAMILY" "${os}"
  if is_empty "${plugins_home}"
    if eq ${os} "windows"
      set_env "PLUGINS_HOME" "C:\\${cus_name}\\plugins"
    else
      set_env "PLUGINS_HOME" "/usr/local/${cus_prompt}/plugins"
    end
  end
  ''']

[config]
load_cargo_aliases = false
skip_core_tasks = true
default_to_workspace = false

[env]
UPX_DIR = "./target/deploy/upx/"
BUILD_PROFILE = { value = "release", condition = { env_not_set = [
  "BUILD_PROFILE",
] } }
RUST_VERSION = "1.90.0"
ZIG_VERSION = "0.14.1"

[tasks.build]
command = "cargo"
args = ["build", "--profile", "${BUILD_PROFILE}", "${@}"]

[tasks.dump-env]
script = """
echo VER_NUMBER=$VER_NUMBER
echo BUILD_PROFILE=$BUILD_PROFILE
echo CFLAGS=$CFLAGS
echo PLUGINS_HOME=$PLUGINS_HOME
"""
[tasks.taosx-unlicensed]
condition.files_modified = { input = [
  "${CARGO_MAKE_WORKING_DIRECTORY}/**/Cargo.*",
  "src/**/*.rs",
  "crates/**/*.rs",
  "taosx-core/src/**/*.rs",
  "taosx-ipc/src/**/*.rs",
  "taosx-metrics/src/**/*.rs",
], output = [
  "target/${BUILD_PROFILE}/taosx",
] }
dependencies = ["install-protoc"]
command = "cargo"
args = [
  "build",
  "-p",
  "taosx",
  "--features",
  "disable-enterprise-only-validation,disable-enterprise-connector-validation",
  "--profile",
  "${BUILD_PROFILE}",
]

[tasks.taosx]
condition.files_modified = { input = [
  "${CARGO_MAKE_WORKING_DIRECTORY}/**/Cargo.*",
  "src/**/*.rs",
  "crates/**/*.rs",
  "taosx-core/src/**/*.rs",
  "taosx-ipc/src/**/*.rs",
  "taosx-metrics/src/**/*.rs",
], output = [
  "target/${BUILD_PROFILE}/taosx",
] }
dependencies = ["install-protoc"]
command = "cargo"
args = ["build", "-p", "taosx", "--profile", "${BUILD_PROFILE}"]

[tasks.taosx.windows]
command = "cargo"
args = [
  "build",
  "-p",
  "taosx",
  "--profile",
  "${BUILD_PROFILE}",
  "--no-default-features",
  "--features",
  "optin,native-tls",
]

[tasks.taosx-agent]
command = "cargo"
dependencies = ["install-protoc"]
args = ["build", "--profile", "${BUILD_PROFILE}", "-p", "taosx-agent"]

[tasks.plugins]
dependencies = ["taosx-influxdb", "taosx-opentsdb", "taosx-opc"]

[tasks.clean-plugins]
