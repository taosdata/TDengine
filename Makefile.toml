if eq ${BUILD_PROFILE} "dev"
  cp target/${BUILD_PROFILE}/taosx target/deploy/${CUS_PROMPT}x
  cp target/debug/${CUS_PROMPT}x.service target/deploy/${CUS_PROMPT}x.service
else
  upx_run target/${BUILD_PROFILE}/taosx target/deploy/${CUS_PROMPT}x
  cp target/${BUILD_PROFILE}/${CUS_PROMPT}x.service target/deploy/${CUS_PROMPT}x.service
end
"""

