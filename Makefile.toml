    docker rm $container
  done
  fi
}
stop_container || true
docker run --rm --name $container -d image.cloud.taosdata.com/taosx/integrated:${VER_NUMBER}-$commit
sleep 5
docker logs $container 2>&1 |grep "enable taosx" || (echo "taosx should be enabled"; stop_container; exit 1)
stop_container || true
docker run --rm --name $container -e ENABLE_TAOSX=0 -d image.cloud.taosdata.com/taosx/integrated:${VER_NUMBER}-$commit
sleep 5
docker logs $container  2>&1|grep "enable taosx" && (echo "taosx should not be enabled"; stop_container; exit 1)
