[tasks.check-aarch64]
alias = "check-arm64"
[tasks.check-arm64]
dependencies = ["assert-explorer-dist"]
script_runner = "bash"
script = """
if [[ "$@" = "" ]]; then
  extras="--workspace";
else
  extras="$@";
fi
echo cargo check $extras
export PLATFORM=linux/arm64
export TARGET_DIR=$PWD/target/${PLATFORM}
mkdir -p $TARGET_DIR
docker run --platform $PLATFORM --rm \
  -v .:/app \
  -v $HOME/.cargo/registry:/root/.cargo/registry \
  -v $HOME/.cargo/git:/root/.cargo/git \
  -v $TARGET_DIR:/app/target \
  taosx/dev \
  cargo check
"""

# # Examples
#
# 1. Build aarch64 taosx: cargo make build-centos7-release --platform linux/arm64 -p taosx
# 2. Build aarch64 taosx and agent: cargo make build-centos7-release --platform linux/amd64 -p taosx -p taosx-agent
#
[tasks.build-centos7-release]
# dependencies = ["build-docker-dev"]
script = """
echo Build taosX release binaries with taosx/dev image.

# Get platform
export PLATFORM=$(echo "$@" | rg '\\--platform (\\S+)' -o -r '$1')
export EXTRAS=$(echo "$@" | rg '\\--platform (\\S+)' -r '')

case "${PLATFORM}" in
  "linux/amd64" | "linux/arm64")
    echo Build taosX release for target $PLATFORM
    export TARGET_DIR=$PWD/target/${PLATFORM}
    mkdir -p $TARGET_DIR
    docker run --platform $PLATFORM --rm \
      -v .:/app \
      -v $HOME/.cargo/registry:/root/.cargo/registry \
      -v $HOME/.cargo/git:/root/.cargo/git \
      -v $TARGET_DIR:/app/target \
      -e DATABASE_URL=sqlite:/app/target/taosx.dev.db \
      taosx/dev \
      cargo build --release $EXTRAS
    ;;
  "")
    export TARGET_DIR=$PWD/target/centos7
    mkdir -p $TARGET_DIR
    docker run --rm \
      -v .:/app \
      -v $HOME/.cargo/registry:/root/.cargo/registry \
      -v $HOME/.cargo/git:/root/.cargo/git \
      -v $TARGET_DIR:/app/target \
      taosx/dev \
      cargo build --release $@
    ;;
  *)
    echo Unsupported platform $PLATFORM
    exit -1
    ;;
esac

"""

