sudo systemctl start taosx
"""

[tasks.dev-install-plugins]
description = "Use install-plugins instead"
deprecated = true

[tasks.install-plugins]
description = "Install all available plugins"
run_task = { name = [
  "install-plugin-opc",
  "install-plugin-influxdb",
  "install-plugin-opentsdb",
