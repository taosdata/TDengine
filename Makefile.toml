[tasks.upx-local]
script_runner = "@duckscript"
script = """
!print "* Use local UPX binary"
os = os_family
echo "Detect OS ${os}"

upx_dir = get_env "UPX_DIR"
echo "Use upx dir ${upx_dir}"

version = set "4.2.4"

if eq ${os} "windows"
  if is_path_exists "${upx_dir}/upx.exe"
    echo "UPX binary already exists"
    exit 0
  end
  echo "Download UPX binary in windows"

  file = set ${upx_dir}/upx.zip

  if is_path_exists ${file}
    echo "UPX already downloaded as ${file}"
  else
    url = set "https://github.com/upx/upx/releases/download/v${version}/upx-${version}-win64.zip"
    echo ${url}
    response_size = wget -O ${file} ${url}
    echo Got response size: ${response_size}
  end

  exec powershell -command "Expand-Archive -Force '${file}' '${upx_dir}/'"
	exec powershell -command "Move-Item '${upx_dir}/upx-${version}-win64/upx.exe' '${upx_dir}/'"
  rm ${file}
else
  if is_path_exists "${upx_dir}/upx"
    echo "* UPX binary already exists"
    exit 0
  end

  echo "* Downloading UPX binary in linux..."

  file = set ${upx_dir}/upx.tar.xz

  if is_path_exists ${file}
    echo "UPX already downloaded: ${file}"
  else
    triple = get_env CARGO_MAKE_RUST_TARGET_TRIPLE
    echo Target triple: ${triple}
    if contains ${triple} "aarch64"
      arch = set "arm64"
    else
      arch = set "amd64"
      version = set "3.96"
    end
    url = set "https://github.com/upx/upx/releases/download/v${version}/upx-${version}-${arch}_linux.tar.xz"
    echo ${url}
    response_size = wget -O ${file} ${url}
    echo Got response size: ${response_size}
  end

  exec tar -xvf ${file} --strip-components=1 -C ${upx_dir}
  echo "* UPX binary downloaded, remove ${file}"
  rm ${file}
end
"""

[tasks.upx]
script_runner = "@duckscript"
script = """
!include_files .github/helpers.duck
upx_run ${1} ${2}
"""

[tasks.deploy-taosx]
