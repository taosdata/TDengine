[tasks.install-protoc]
script_runner = "@duckscript"
install_script = """
# 设置 protoc 版本和下载 URL
protoc_version = set "33.0"
protoc_url_prefix = set "https://github.com/protocolbuffers/protobuf/releases/download/v${protoc_version}"

protoc_cmd = which protoc
if is_empty ${protoc_cmd}
  echo "Install protoc v${protoc_version}"
else
  installed_version = exec protoc --version
  echo "Protoc has been installed: ${installed_version.stdout}"
  exit
end

family = os_family

if equals ${family} "windows"
  file = set "protobuf-${protoc_version}.zip"
elseif equals ${family} "mac"
  file = set "protoc-${protoc_version}-osx-aarch_64.zip"
else
  apt_exe = which apt-get
  if is_empty ${apt_exe}
  else
    code = exec --get-exit-code sudo apt-get install protobuf-compiler
    if equals ${code} 0
      installed_version = exec protoc --version
      echo successfully installed.. ${installed_version}
      exit
    end
  end

  arch = get_env "CARGO_MAKE_RUST_TARGET_ARCH"
  echo "Build arch: " ${arch}
  if equals "${arch}" "x86_64"
    file = set "protoc-${protoc_version}-linux-x86_64.zip"
  elseif equals ${arch} "aarch64"
    file = set "protoc-${protoc_version}-linux-aarch_64.zip"
  elseif equals ${arch} "s390"
    file = set "protoc-${protoc_version}-linux-s390_64.zip"
  elseif equals ${arch} "powerpc64le"
    file = set "protoc-${protoc_version}-linux-ppcle_64.zip"
  else
    echo "Unsupported architecture: ${arch}"
    exit 1
  end
end

download_url = set "${protoc_url_prefix}/${file}"

echo "Downloading: ${download_url}"

size = wget -O ${file} ${download_url}

install_path = get_env "CARGO_HOME"

unzip_exe = which unzip
if is_empty ${unzip_exe}
  echo "Guess you're using windows"
  exec powershell -command "Expand-Archive -Force '${file}' '${install_path}/'"
else
  output = exec unzip -o "${file}" -d ${install_path}
  stdout = set ${output.stdout}
  stderr = set ${output.stderr}
  exit_code = set ${output.code}

  if equals ${exit_code} 0
    echo "Stdout:"
    echo ${stdout}
  else
    echo "Stderr:"
    echo ${stderr}
  end
end

protoc_file = join_path "${install_path}" bin protoc
echo "Installed at: " ${protoc_file}
chmod 770 ${protoc_file}

protoc_expect = which protoc
if is_empty "${protoc_expect}"
  echo "Error: Protoc installation failed: protoc file not found in ${install_path}"
  exit 1
end
echo "Installed proto compiler (protoc)"
rm ${file}
"""
