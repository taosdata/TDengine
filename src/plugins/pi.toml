id = "pi"

# PI server name
server_name = "WIN"
# PI system name
system_name = "WIN"

# A TCP stream socket for arrow ipc
ipc_stream = "127.0.0.1:6051"

# A REST API url for SQL queries.
sql_api = "127.0.0.1:6052/sql"

ipc_socket = "/path/to/taosx.socket"

# PI AF database name
database = "MT1"

# interval – 获取更新值每个周期间隔的毫秒数 Default: 10000.
interval = 1000

[points]
current = { table = "meters", column = "current", ty = "VARCHAAR(12)" }


taosx-opc --///


TAOSX_IPC_STREAM=/path/to/taosx.socket
TAOSX_IPC_STREAM=192.168.0.1:6050

taosx-opc --host server --port

# taosx-opc --list --host > point.list

{ "00001": { "name" } }

# taosx-opc --host --select <point.list>
