taosx_sys_cpus: 系统 CPU 核数
taosx_sys_total_memory: 系统总内存，单位：字节
taosx_sys_used_memory: 系统已用内存, 单位：字节
taosx_sys_available_memory: 系统可用内存，单位：字节
taosx_sys_uptime_in_seconds: 系统启动时长，单位：秒
taosx_process_cpu_percent: taosX 进程占用 CPU 百分比
taosx_process_mem_percent: taosX 进程占用内存百分比
total_execute_time: 任务历史累计运行时间
total_written_rows: 成功写入 TDengine 的总行数（数据包含重复记录时可能大于实际值）
total_written_points: 累计写入成功点数(等于数据块包含的行数乘以数据块包含的列数)
total_rows_per_second: 任务累计平均每秒写入行数
total_points_per_second: 任务累计平均每秒写入测点数
start_time: 任务启动时间(每次重启任务会被重置)
written_rows: 本次运行此任务成功写入 TDengine 的总行数（执行返回的 affected rows 之和）
written_points: 本次运行写入成功点数，可能大于实际值。当用 write_block 接口写入时等于数据块包含的行数乘以数据块包含的列数， 当用 sql 写入时等于影响行数乘以目标表的列数
execute_time: 任务本次运行时间
rows_per_second: 任务本次运行平均每秒写入行数
points_per_second: 任务本次运行平均每秒写入测点数
read_concurrency: 并发读取数据源的数据 worker 数
total_stables: 需要迁移的超级表数据数量
total_updated_tags: 累计更新 tag 数
total_created_tables: 累计创建子表数
total_tables: 需要迁移的子表数量
total_finished_tables: 完成数据迁移的子表数(任务中断重启可能大于实际值)
total_success_blocks: 累计写入成功的数据块数
finished_tables: 本次运行完成迁移子表数
success_blocks: 本次写入成功的数据块数
updated_tags: 本次运行更新 tag 数
total_messages: 通过 TMQ 累计收到的消息总数
total_messages_of_meta: 通过 TMQ 累计收到的 Meta 类型的消息总数
total_messages_of_data: 通过 TMQ 累计收到的 Data 和 MetaData 类型的消息总数
total_write_raw_fails: 累计写入 TMQ 消息失败次数
topics: 通过 TMQ 订阅的主题数
consumers: TMQ 消费者数
messages: 本次运行通过 TMQ 收到的消息总数
messages_of_meta: 本次运行通过 TMQ 收到的 Meta 类型的消息总数
messages_of_data: 本次运行通过 TMQ 收到的 Data 和 MetaData 类型的消息总数
success_messages: 本次运行通过 TMQ 成功写入的消息总数
write_raw_fails: 本次运行写入 TMQ 消息失败次数
total_received_batches: 通过 IPC Stream 收到的数据总批数
total_processed_batches: 已经成功处理的总批数
total_failed_batches: 处理失败的总批数
total_parsed_rows: 执行解析后的总行数
total_filter_skipped_rows: 执行解析后过滤器筛掉的总行数
total_check_skipped_rows: 执行解析后前置合法检查筛掉的行数
total_write_ready_rows: 待写入的行数
total_processed_rows: 已经成功处理的总行数（等于成功处理的 batch 包含的数据行数之和）
total_inserted_sqls: 成功执行的 INSERT SQL 总条数
total_failed_sqls: 执行失败的 INSERT SQL 总条数
total_created_stables: 尝试创建超级表总数（可能大于实际值）
total_failed_rows: 写入失败的总行数
total_drained_rows: 排除时间戳无法入库的总行数
total_failed_points: 写入失败的总点数
total_written_raw_blocks: 写入成功的 raw block 总数
total_failed_raw_blocks: 写入失败的 raw block 总数
total_success_messages: 写入成功的消息总数
received_batches: 本次运行此任务通过 IPC Stream 收到的数据总批数
processed_batches: 本次运行此任务已经成功处理的批数
failed_batches: 本次运行此任务处理失败的批数
parsed_rows: 执行解析后的总行数
filter_skipped_rows: 执行解析后过滤器筛掉的行数
check_skipped_rows: 执行解析后前置合法检查筛掉的行数
write_ready_rows: 待写入的行数
processed_rows: 本次成功处理的总行数（transform 之前的 Batch 行数之和）
inserted_sqls: 本次运行此任务成功执行的 INSERT SQL 总条数
failed_sqls: 本次运行此任务执行失败的 INSERT SQL 总条数
created_stables: 本次运行此任务尝试创建超级表数（可能大于实际值）
created_tables: 本次运行此任务尝试创建子表数(可能大于实际值,不包括自动创建的子表)
failed_rows: 本次运行此任务写入失败的行数
drained_rows: 本次运行此任务排除时间戳无法入库的总行数
failed_points: 本次运行此任务写入失败的点数
written_raw_blocks: 本次运行此任务写人成功的 raw block 数
failed_raw_blocks: 本次运行此任务写入失败的 raw block 数
persist_read_messages: 当前任务读取的持久化消息数
persist_write_messages: 当前任务写入的持久化消息数
persist_received_acks: 当前任务持久化组件接收到的 ACK 数 
persist_send_batches: 当前任务持久化组件发送的批次数
kafka_consumers: Kafka 消费者数
kafka_total_partitions: Kafka topic 总分区数
kafka_consuming_partitions: 正在消费的分区数
kafka_consumed_messages: 已经消费的消息数
total_kafka_consumed_messages: 累计消费的消息总数
mqtt_fetched_messages: 本次运行任务消息拉取总数量
mqtt_received_bytes: 本次任务接收到的消息字节数
mqtt_dumped_messages: 本次运行任务已 dump 的消息数
mqtt_fetched_acks: 本次运行任务接收到的 ACK 总数
mqtt_ack_fails: 本次运行任务启动开始 ACK 失败总次数
mqtt_unprocessed_messages: 本次运行任务缓存队列中当前消息数量
mqtt_sent_batches: 本次运行任务已发送的批次数量
mqtt_discarded_messages: 本次运行任务丢弃的消息数量
mqtt_discarded_dump_messages: 本次运行任务 dump 操作丢弃的消息数量
total_csv_files: CSV 文件总数量
total_csv_files_completed: CSV 文件已处理完成数量
total_csv_files_completed_rows: CSV 文件已处理完成行数
csv_files: CSV 文件总数量
csv_files_completed: 本次运行此任务 CSV 文件已处理完成数量
csv_files_completed_rows: 本次运行此任务 CSV 文件已处理完成行数
received_messages: 本次运行此任务接收到的消息总数
processed_messages: 本次运行此任务已经处理的消息总数
out_of_range_rows: 本次运行此任务超出时间范围的行数
total_out_of_range_rows: 累计超出时间范围的行数
archived_rows: 本次运行此任务归档的行数
total_archived_rows: 累计归档的行数
total_messages_bytes: 累计通过 TMQ 接收的消息总字节数
messages_bytes: 本次运行此任务通过 TMQ 接收的消息总字节数
commits: 本次运行此任务提交的消息数
total_commits: 累计提交的消息数
task_name: 任务名称
spb_received_messages: 本次运行任务消息拉取总数量
spb_received_metrics: 本次运行任务指标拉取总数量
spb_fetched_acks: 本次运行任务接收到的 ACK 总数
spb_sent_batches: 本次运行任务已发送的批次数量
tmq2mqtt_received_messages: 本次运行任务从 TMQ 接收到的消息数量
tmq2mqtt_published_messages: 本次运行任务发送到 MQTT 的消息数量
