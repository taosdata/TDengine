taosx_sys_cpus: System CPU cores
taosx_sys_total_memory: Total system memory in bytes
taosx_sys_used_memory: "System used memory, unit: bytes"
taosx_sys_available_memory: "System available memory, unit: bytes"
taosx_sys_uptime_in_seconds: system start-up duration, in seconds
taosx_process_cpu_percent: "% CPU usage of taosx process"
taosx_process_mem_percent: "% of memory occupied by taosx processes"
taosx_process_io_read_bytes: Number of read bytes since the last refresh
taosx_process_io_written_bytes: Number of written bytes since the last refresh
taosx_process_tasks: Number of threads run by this process
total_execute_time: Total execute time
total_written_rows: Total rows written to TDengine.(may greater than actual value when there are duplicate records)
total_written_points: Total points written successfully, may greater than actual value. When using the write_block interface, it is equal to the number of rows contained in the data block multiplied by the number of columns in the data block. When using SQL to write, it is equal to the number of affected rows multiplied by the number of columns in the target table.
total_rows_per_second: Average number of rows written per second
total_points_per_second: Average number of points written per second
start_time: Task start time (reset each time the task is restarted)
written_rows: Total rows written to TDengine in this task run. (may greater than actual value when there are duplicate records)
written_points: Total points written successfully in this task run (equal to written_rows multiplied by the number of columns in the data block)
execute_time: Task execute time for this task run
rows_per_second: Average number of rows written per second for this task run
points_per_second: Average number of points written per second for this task run
read_concurrency: Number of data workers concurrently reading data sources
total_stables: Total super tables to migrate
total_updated_tags: Total updated tag count
total_tables: Total tables to migrate
total_finished_tables: Total number of sub-tables successfully migrated. (may greater than the actual value if task was resumed from break point)
total_success_blocks: Total number of data blocks successfully written
finished_tables: Number of sub-tables successfully migrated in this task run
success_blocks: Number of data blocks successfully written in this task run
updated_tags: Number of updated tags in this task run
total_messages: Total number of messages received via TMQ
total_messages_of_meta: Total number of messages with type "Meta" received via TMQ
total_messages_of_data: Total number of messages with type "Data" and "MetaData" received via TMQ
total_write_raw_fails: Total times of failed to write TMQ messages
topics: Total number of topics subscribed to via TMQ
consumers: Total number of consumers created via TMQ
messages: Total number of messages received via TMQ in this task run
messages_of_meta: Total number of messages with type "Meta" received via TMQ in this task run
messages_of_data: Total number of messages with type "Data" and "MetaData" received via TMQ in this task run
write_raw_fails: Total times of failed to write TMQ messages in this task run
total_received_batches: Total number of data batches received via IPC Stream
total_processed_batches: Total number of data batches successfully processed by taosx
total_failed_batches: Total number of data batches failed to process
total_processed_rows: Total number of rows successfully processed. (equal to the sum of the number of data rows contained in the batch containing data)
total_inserted_sqls: Total number of INSERT SQLs successfully executed by taosx
total_failed_sqls: Total number of INSERT SQLs failed to execute by taosx
total_created_stables: Total number of super tables that taosX try to created. (may greater than successfully created super tables)
total_created_tables: Total number of child tables that taosX try to created.(not include auto created child tables)
total_failed_rows: Total number of rows failed to write
total_drained_rows: Total number of rows filtered out to write in case of timestamp out of range
total_failed_points: Total number of points failed to write
total_written_raw_blocks: Total number of raw blocks successfully written
total_failed_raw_blocks: Total number of raw blocks failed to write
received_batches: Number of data batches received via IPC Stream in this task run
processed_batches: Number of data batches successfully processed by taosx in this task run
failed_batches: Number of data batches failed to process in this task run
processed_rows: Number of rows successfully processed in this task run. (equal to the sum of the number of data rows contained in the batch containing data)
inserted_sqls: Number of INSERT SQLs successfully execute by taosx in this task run
failed_sqls: Number of INSERT SQLs failed to execute by taosx in this task run
created_stables: Number of super tables that taosX try to created in this task run.(may greater than successfully created super tables)
created_tables: Number of child tables that taosX try to created in this task run
failed_rows: Number of rows failed to write in this task run
drained_rows: Number of row filtered out to write in case of timestamp out of range in this task run
failed_points: Number of points failed to write in this task run
written_raw_blocks: Number of raw blocks successfully written in this task run
failed_raw_blocks: Number of raw blocks failed to write in this task run
kafka_consumers: Number of Kafka consumers created
kafka_total_partitions: Total number of partitions of Kafka topic
kafka_consuming_partitions: Number of partitions being consumed
kafka_consumed_messages: Number of messages has been consumed
