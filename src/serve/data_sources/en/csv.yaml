---
id: csv
name: CSV
description: |
  Import a file or a collection of files in CSV format to TDengine.
type: path
options:
  path:
    required: true
    display: Path
    description: CSV file path or directory
    placeholder: "Example: a.csv,b.csv"
strict: true
groups:
  - name: CSV Options
    display_order: 1
    description: CSV reading options
    params:
      - name: skip
        display: Skip Records
        description: Skip number of records for each CSV file.
        value: 0
        hint:
          type: integer
          min: 0
      - name: delimiter
        display: Delimiter Char
        description: The field separator in a CSV record.
        value: ","
        required: true
        editable: true
        hint:
          type: str
          choices:
            - ","
            - ";"
      - name: quote
        display: Quote Char
        description: The quote is used to enclose field values
        value: '"'
        required: true
        editable: true
        hint:
          type: str
          choices:
            - '"'
            - "'"
      - name: comment
        display: Comment Prefix
        description: If the start of a record begins with the byte given here, then that line is ignored by the CSV parser.
        value: "#"
        required: true
        editable: true
        hint:
          type: str
          choices:
            - "#"

advanced:
  name: Advanced Options
  collapsible: true
  description: |
    Advanced options including read/write concurrency, collection options, performance tuning, etc. Users can leave
    these options as default to use the recommended settings.
  params:
    - name: read_concurrency
      display: Read Concurrency
      hidden: false
      description: |
        The number of concurrent read requests. The default value is automatically set by collector. If the data source is slow to respond, you can increase this value appropriately.
      value: 0
      hint:
        type: integer
        min: 0
        max: 1000
    - name: batch_size
      display: Batch Size
      hidden: false
      description: |
        The number of data points to be written in a single request. The default value is 1000. If the data source is slow to respond, you can reduce this value appropriately.
      value: 1000
      hint:
        type: integer
        min: 1
        max: 100000
