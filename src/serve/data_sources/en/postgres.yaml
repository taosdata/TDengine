---
id: postgres
name: PostgreSQL
type: uri
description: |
  PostgreSQL is a very powerful, open-source client/server relational database management system that has many features found in large commercial RDBMSs, including transactions, subselects, triggers, views, referential integrity, and sophisticated locking functionality.
  TDengine can efficiently read data from PostgreSQL and write it to TDengine to achieve historical data migration or real-time data synchronization.
strict: false

options:
  host:
    display: host
    description: |-
      The access address of PostgreSQL.
      If using an Agent, this address must be accessible from the Agent. If not using an Agent, this address must be accessible from the TDengine system.
    placeholder: "127.0.0.1"
    required: true
  port:
    display: port
    description: The port of PostgreSQL.
    placeholder: "5432"
    required: true
  subject:
    display: Database
    description: The name of the PostgreSQL database to connect to.
    placeholder: "for example: db1"
    required: true

authentication:
  display: Authentication
  description: Authentication is the process of verifying the identity before granting access to PostgreSQL.
  value: plain
  alternatives:
    - name: plain
      display: Username and Password
      description: Use username and password of PostgreSQL
      username:
        display: Username
        placeholder: username
        required: true
      password:
        display: Password
        placeholder: password
        required: true

groups:
  - name: Connection options
    display_order: 1
    description: Other connection options.
    connection_option: true
    params:
      - name: application_name
        display: Application Name
        description: Set the application name to identify the connecting application.
        placeholder: "for example: TDengine"
        hint:
          type: str
      - name: ssl_mode
        display: SSL Mode
        description: Set whether to negotiate a secure SSL TCP/IP connection with the server or the priority for negotiation.
        placeholder: "Please select the SSL mode"
        value: "PREFER"
        hint:
          type: str
          choices:
            - DISABLE
            - ALLOW
            - PREFER
            - REQUIRE
  - name: Data Collection
    display_order: 2
    description: Data collection related configuration items.
    required: true
    params:
      - name: sql
        display: SQL Template
        description: |
          SQL statement used for querying. The SQL statement must contain a time range condition, and the start time and end time must appear in pairs.
          SQL uses different placeholders to represent different time format requirements, specifically the following placeholder formats:
          1. `${start}`, `${end}`: Represents the RFC3339 format timestamp, such as: 2024-03-14T08:00:00+0800
          2. `${start_no_tz}`, `${end_no_tz}`: Represents the RFC3339 string without a time zone: 2024-03-14T08:00:00
          3. `${start_date}`, `${end_date}`: Represents only the date, such as: 2024-03-14
          4. `${start_time}`, `${end_time}`: Represents only the time, such as: 08:00:00
        required: true
        placeholder: "SELECT * FROM schema.table WHERE time >= ${start} AND time < ${end}"
        hint:
          type: str
      - name: start
        display: Start Time
        description: >
          Start time for migrating data.
        required: true
        placeholder: "for example: 2023-01-01 00:00:00"
        hint:
          type: time
      - name: end
        display: End Time
        description: >
          End time for migrating data, can be left blank. If set, the migration task will stop automatically after the task is executed to the end time; if left blank, the real-time data will be synchronized continuously, and the task will not stop automatically.
        required: false
        placeholder: "for example: 2024-01-01 00:00:00"
        hint:
          type: time
      - name: interval
        display: Time Interval
        description: >
          The time interval for segmented queries. The default is 1 day. To avoid querying too much data, a data synchronization subtask will use the query interval to query data in time segments.
        required: false
        placeholder: 1d
        hint:
          type: duration
      - name: delay
        display: Delay
        description: >
          In the real-time data synchronization scenario, to avoid the loss of delayed written data, each synchronization task will read data before the delay time.
        required: false
        placeholder: 10s
        hint:
          type: duration

parser:
  display: Data Mapping
  description: |
    taosX could let users to specify the data model in the database, for example, the table name pattern and stable name pattern, field names as tags or field names as columns.
  fields:
    - name: DateTime
      description: The timestamp of the returned value.
      type: timestamp
  required: true

advanced:
  name: Advanced Options
  collapsible: true
  description: |
    Advanced options including read/write concurrency, collection options, performance tuning, etc. Users can leave these options as default to use the recommended settings.
  params:
    - name: read_concurrency
      display: Read Concurrency
      description: |
        The number of concurrent read requests. The default value is automatically set by collector. If the data source is slow to respond, you can increase this value appropriately.
      value: 0
      hint:
        type: integer
        min: 0
        max: 1000
    - name: batch_size
      display: Batch Size
      description: |
        The number of data points to be written in a single request. The default value is 10000. If the data source is slow to respond, you can reduce this value appropriately.
      value: 10000
      hint:
        type: integer
        min: 1
        max: 100000