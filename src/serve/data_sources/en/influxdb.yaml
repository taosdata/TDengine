---
id: influxdb
type: uri
name: InfluxDB
description: |
  InfluxDB is a popular open-source time-series database that is optimized for handling large volumes of timestamped data.

  TaosX can efficiently read the data in influxdb and write it to TDengine through the taosx-influxdb plugin to achieve historical data migration or real-time data synchronization.
strict: false
options:
  host:
    display: IP address
    description: The access address of InfluxDB
    placeholder: 127.0.0.1
    required: true
  port:
    display: Port
    description: The port of InfluxDB
    placeholder: "8086"
    required: true
authentication:
  display: Authentication
  description: Authentication is the process of verifying the identity before granting access to InfluxDB.
  value: 2.x
  alternatives:
    - name: 1.x
      display: Version 1.x
      description: On version 1.x, only username/password mode can be used.
      params:
        - name: version
          display: Version
          description: Specify the version of the source database
          placeholder:
          hint:
            type: str
            choices:
              - "1.8"
              - "1.7"
          required: true
        - name: orgId
          display: Organization Id
          description: It is a workspace for a group of users. All dashboards, tasks, buckets, and users belong to one organization.
          placeholder: Please input your organization id in the InfluxDB
          hint: str
          required: true
        - name: username
          display: Username
          description: This user can at least have permission to read anything in this organization.
          placeholder: Please input a username in the InfluxDB
          hint: str
          required: true
        - name: password
          display: Password
          description: Verification password for the above user.
          placeholder: Please input the password for the above user
          hint: str
          required: true
    - name: 2.x
      display: Version 2.x
      description: On version 2.x, only access token mode can be used.
      value: true
      params:
        - name: version
          display: Version
          description: Specify the version of the source database
          placeholder:
          hint:
            type: str
            choices:
              - "2.7"
              - "2.6"
              - "2.5"
              - "2.4"
              - "2.3"
              - "2.2"
              - "2.1"
              - "2.0"
          required: true
        - name: orgId
          display: Organization Id
          description: It is a workspace for a group of users. All dashboards, tasks, buckets, and users belong to one organization.
          placeholder: Please input your organization id in the InfluxDB
          hint: str
          required: true
        - name: token
          display: Token
          description: This token can at least have permission to read anything in this organization.
          placeholder: Please input your access token in the InfluxDB
          hint: str
          required: true
groups:
  - name: task
    display: Task
    display_order: 1
    description: Configure the data migration task
    params:
      - name: beginTime
        display: Data Begin Time
        description: Set a data start time
        placeholder: YYYY-MM-DD HH:MM:SS
        hint: time
        required: true
      - name: endTime
        display: Data End Time
        description: Set a data end time, if empty, the latest data will always be transmitted
        placeholder: YYYY-MM-DD HH:MM:SS
        hint: time
      - name: readWindow
        display: Read Window
        description: Select a type of read window, if empty, it defaults to minute
        placeholder:
        value: M
        hint:
          type: str
          choices:
            - D
            - H
            - M
      - name: bucket
        display: Bucket
        description: Select a specified bucket to migrate
        placeholder: bucket
        hint:
          type: str
          choices:
            - "--NONE--"
        required: true
      - name: measurements
        display: Measurements
        description: Select one or more specified measurements to migrate, if empty, migrate all
        placeholder: bucket
        multiple: true
        editable: true
        hint:
          type: str
          choices:
            - "--NONE--"
