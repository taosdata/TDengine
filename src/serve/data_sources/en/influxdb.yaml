---
id: influxdb
type: uri
name: InfluxDB
description: |
  InfluxDB is a popular open-source time-series database that is optimized for handling large volumes of timestamped data.

  TDengine can efficiently read the data in InfluxDB and write it to TDengine through the InfluxDB connector to achieve historical data migration or real-time data synchronization.
strict: false
protocol:
  display: Protocol
  description: The protocol of the InfluxDB connection, please choose according to the actual situation, otherwise the task cannot run normally.
  placeholder: http
  value: http
  choices:
    - name: http
      display: HTTP Protocol
    - name: https
      display: HTTPS Protocol
options:
  host:
    display: IP address
    description: |-
      The access address of InfluxDB.
      If using an Agent, this address must be accessible from the Agent. If not using an Agent, this address must be accessible from the TDengine system.
    placeholder: 127.0.0.1
    required: true
  port:
    display: Port
    description: The port of InfluxDB
    placeholder: "8086"
    required: true
authentication:
  display: Authentication
  description: Authentication is the process of verifying the identity before granting access to InfluxDB.
  value: 2.x
  alternatives:
    - name: 1.x
      display: Version 1.x
      description: On version 1.x, only username/password mode can be used.
      params:
        - name: version
          display: Version
          description: The version of InfluxDB, due to interface differences between versions, please choose according to the actual situation.
          placeholder: Please select the version of InfluxDB
          hint:
            type: str
            choices:
              - "1.8"
              - "1.7"
          required: true
        - name: username
          display: Username
          description: This user must have permission to read anything in this organization.
          placeholder: Please input a username in the InfluxDB
          hint: str
          required: true
        - name: password
          display: Password
          description: Verification password for the above user.
          placeholder: Please input the password for the above user
          hint: str
          required: true
    - name: 2.x
      display: Version 2.x
      description: On version 2.x, only access token mode can be used.
      value: true
      params:
        - name: version
          display: Version
          description: The version of InfluxDB, due to interface differences between versions, please choose according to the actual situation.
          placeholder: Please select the version of InfluxDB
          hint:
            type: str
            choices:
              - "2.7"
              - "2.6"
              - "2.5"
              - "2.4"
              - "2.3"
              - "2.2"
              - "2.1"
              - "2.0"
          required: true
        - name: orgId
          display: Organization ID
          description: It's a hex number string generated by InfluxDB, not Organization name, please copy from InfluxDB organization->about page and paste it here.
          placeholder: Please input your organization id in the InfluxDB
          hint: str
          required: true
        - name: token
          display: Token
          description: This token must have permission to read anything in this organization.
          placeholder: Please input your access token in the InfluxDB
          hint: str
          required: true
        - name: addDbrp
          display: Add DBRP
          description: InfluxQL requires a database and retention policy (DBRP) combination in order to query data. In InfluxDB Cloud and some 2.x require manual addition of this mapping relationship. By turning on this switch, the connector can be automatically added during task execution.
          hint:
            type: bool
          value: false
groups:
  - name: task
    display: Task
    display_order: 1
    description: Configure the data migration task
    params:
      - name: bucket
        display: Bucket
        description: A bucket in the InfluxDB is a namespace for storing data, and each task needs to specify a bucket.
        placeholder: Please select the bucket
        hint:
          type: str
          choices:
            - "--NONE--"
        required: true
      - name: measurements
        display: Measurements
        description: Measurements in the above bucket, select one or more specified measurements to migrate, if empty, migrate all.
        placeholder: Please select the measurements
        multiple: true
        editable: true
        hint:
          type: str
          choices:
            - "--NONE--"
      - name: beginTime
        display: Data Begin Time
        description: The starting time of the data, and the task only reads data from the specified time and after.
        placeholder: YYYY-MM-DD HH:mm:ss
        hint: time
        required: true
      - name: endTime
        display: Data End Time
        description: The stopping time of the data, and the task only reads the data at the specified time and before, If a future time is specified, the task will continue until the deadline is reached. If not specified, the task will continue until it is manually terminated.
        placeholder: YYYY-MM-DD HH:mm:ss
        hint: time
      - name: readWindow
        display: Time range per read in minutes
        description: The maximum time range every time when retrieving data from InfluxDB.
        placeholder: Please input the time range
        hint:
          type: integer
          min: 1
          max: 6000
        value: 60
      - name: delay
        display: Delay in seconds
        description: To migrate the out of order data, TDengine connector always waits for time specified here before reading them.
        placeholder: Please input the delay
        hint:
          type: integer
          min: 1
          max: 30
        value: 10
      - name: maxThread
        display: Maximum Read Threads
        description: Performance related parameters, multiple threads read InfluxDB data, allows you to adjust the maximum number of read threads based on server performance.
        placeholder: Please input the maximum number of read threads
        hint:
          type: integer
          min: 1
          max: 150
        value: 50
      - name: queueSizeT
        display: Maximum Thread Caches
        description: Performance related parameters, threads are cached in the memory queue, and then started in sequence, allows you to adjust the maximum number of thread caches based on server performance.
        placeholder: Please input the maximum number of thread caches
        hint:
          type: integer
          min: 10
          max: 2000
        value: 1000
      - name: queueSizeD
        display: Maximum Data Caches
        description: Performance related parameters, InfluxDB datas are cached in the memory queue, and then transmitted downstream, allows you to adjust the maximum number of data caches based on server performance.
        placeholder: Please input the maximum number of data caches
        hint:
          type: integer
          min: 10000
          max: 500000
        value: 200000
      - name: limitSpeed
        display: Transmit Speed Limit
        description: Performance related parameters, to avoid downstream pressure, the transmit speed needs to be limited, allows you to adjust the upper limit of speed based on server performance.
        placeholder: Please input the upper limit of transmit speed
        hint:
          type: integer
          min: 5000
          max: 500000
        value: 100000
