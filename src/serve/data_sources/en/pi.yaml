---
id: pi
name: PI
description: |
  The Aveva PI System is a suite of software products that are used for data collection, historicizing, finding, analyzing, delivering, and visualizing. It is marketed as an enterprise infrastructure for management of real-time data and events.

  The term PI System is often used to refer to the PI Server but the two are not the same. The PI System refers to all Aveva PI software products whereas the PI Server is the core product of the PI System. Data can be automatically collected from many sources (control systems, lab equipment, calculations, manual entry or custom software).
type: uri
params:
  - name: system_configuration
    display: System Configuration
    display_order: 0
    description:
    value: PI Data Archive and Asset Framework (AF) Server
    hint:
      type: str
      choices:
        - PI Data Archive and Asset Framework (AF) Server
        - PI Data Archive Only
  - name: PISystemName
    display: AF Server Name
    placeholder: pi-af-server-name
    required: true
    display_order: 3
    description: |-
      PI System(AF Server) name (hostname).
    hint:
      type: str
options:
  host:
    display: PI Data Archive Server
    description: |-
      PI Data Archive Server (hostname).

      If using an Agent, this address must be accessible from the Agent. If not using an Agent, this address must be accessible from the TDengine system.
    placeholder: pi data archive server
    required: true
  subject:
    display: AF Database Name
    description: AF database name
    placeholder: "Example: Met1"
    required: true
strict: false
groups:
  - name: Auto Backfill
    display_order: 3
    description: Auto-backfill configurations.
    params:
      - name: MaxBackfillRangeDays
        display: Max Backfill Range(in days)
        hint:
          type: integer
          min: 0
          max: 30
        description: Max number of days to automatically backfill when connection is lost or on first startup.
        placeholder: 1
        value: 1

advanced:
  name: Advanced Options
  collapsible: true
  collapsed: true
  description: |
    Advanced options including read/write concurrency, collection options, performance tuning, etc. Users can leave
    these options as default to use the recommended settings.
  params:
    - name: batch_size
      display: Batch Size
      description: |
        The number of data points to be written in a single request. The default value is 1000. If the data source is slow to respond, you can reduce this value appropriately.
      value: 1000
      hint:
        type: integer
        min: 1
        max: 10000
    - name: batch_timeout
      display: Batch Timeout
      description: |
        The maximum time(in seconds) to wait before sending a batch of data points. The default value is 1s. If the data source is slow to respond, you can increase this value appropriately.
      value: 1
      hint:
        type: integer
        min: 1
        max: 60

datasets:
  name: Data Sets
  display: Data Sets
  description: |
    Single column configuration file for point names.
  params:
    - name: point_file
      display: One Table Per Point
      description: |
        The CSV config file is a CSV file with one single column without header:

        | |
        | ------------------- |
        | meter_10001_current |
        | meter_10001_voltage |
      hint:
        type: file
    - name: template_for_pi_point_file
      display: One Table per PI Point from AF Element Template
      description: |
        The CSV config file is a CSV file with one single column without header:

        | |
        | ------------------- |
        | MeterTemplate  |
        | MeterTemplate1 |
      hint:
        type: file
    - name: template_for_af_element_file
      display: One Table per AF Element from AF Element Template
      description: |
        The CSV config file is a CSV file with one single column without header:

        | |
        | ------------------- |
        | MeterTemplate  |
        | MeterTemplate1 |
      hint:
        type: file
