---
id: opc
name: OPC-UA/DA
description: |
  OPC is one of interoperability standard for the secure and reliable exchange of data in the industrial automation space and in other industries.

  OPC DA (Data Access) is a classic COM-based specification that works only on Windows. OPC DA is widely used even though it isn’t the newest and most efficient data communication specification out there. This is mainly because of older devices that only support the OPC DA.

  OPC UA is the next generation beyond the classic OPC specification, a platform-independent, service-oriented architecture specification that integrates all functionality from the existing OPC Classic specifications, providing a migration path to a more secure and scalable solution.

  For more about OPC UA/DA we introduce you to read the [OPC Foundation site](https://opcfoundation.org/), and some useful blogs, such as

  1. [What is OPC](https://opcfoundation.org/about/what-is-opc/)
  2. [What is OPC DA](https://plcynergy.com/opc-da/),
  3. [What is OPC UA](https://opcfoundation.org/about/opc-technologies/opc-ua/).
  4. [WHEN TO USE OPC-UA VS OPC-DA](https://www.vertech.com/blog/opc-ua-vs-opc-da).

  taosX could pull data from OPC server by a OPC connector plugin.

  Check the help message in each part to see the details.
type: uri
protocol:
  display: Protocol
  description: Choose to use OPC UA or DA protocol.
  choices:
    - name: ua
      display: UA
      description: For OPC-UA connections.
    - name: da
      display: DA
      description: For OPC-DA(Classic) connections.
options:
  endpoint:
    display: Server endpoint
    required: true
    description: |
      OPC server endpoint.

      - For OPC-UA, it is like: `127.0.0.1:6666/OPCUA/ServerPath`.
      - For OPC-DA, it is like: `Matrikon.OPC.Simulation.1?nodes=localhost`.
    placeholder: 127.0.0.1:6666/OPCUA/ServerPath

strict: false

authentication:
  display: Authentication
  description: Use username/password plain authentication or with certificate files, or anonymous(default).
  value: anonymous
  alternatives:
    - name: anonymous
      display: Anonymous
      description: Logging in anonymously without any configurations (if available).
      value: true
      params: []

    - name: plain
      display: Username
      description: Use username and password.
      username:
        display: Username
        description: OPC server username.
        placeholder: username
        required: true
      password:
        display: Password
        description: OPC server password.
        placeholder: password
        required: true
    - name: certificates
      display: Certificates
      description: Use certificate file and private key.
      params:
        - name: certificate
          display: Certificate
          description: Path to cert.pem. Required when security mode or policy isn't "None".
          hint:
            type: file
        - name: private_key
          display: Private key
          description: Path to private key.pem. Required when security mode or policy isn't "None"
          hint:
            type: file
        - name: security_mode
          display: Security Mode
          description: |
            Available value is one of None / Sign / SignAndEncrypt.

            - **None**:
            - **Sign**:
            - **SingAndEncrypt**:
          hint:
            type: str
            choices:
              - None
              - Sign
              - SignAndEncrypt
        - name: security_policy
          display: Security Policy
          description: |
            Available value is one of None/Basic128Rsa15/Basic256/Basic256Sha256.
          hint:
            type: str
            choices:
              - None
              - Basic128Rsa15
              - Basic256
              - Basic256Sha256

groups:
  - name: Data Sets
    display_order: 1
    description: "Data points in OPC server to collect."
    params:
      - name: ua.nodes
        display: Nodes
        description: Node id list separated by a ','.
        placeholder: ns=2;i=2, ns=2;i=3
        hint:
          type: str
        if: protocol.ua

      - name: nodes
        display: DA Nodes
        description: A OPC DA node list separated by ','.
        hint:
          type: str
        placeholder: localhost
        if: protocol.da
      - name: da.tags
        display: DA Tags
        description: A OPC DA tags list separated by ','.
        placeholder: ns=2;i=2, ns=2;i=3
        hint:
          type: str
        if: protocol.da

  - name: Connection
    display_order: 2
    description: Some configurations used in connecting step.
    params:
      - name: connect_timeout
        display: Connect Timeout
        description: |-
          Timeout for connect to endpoint in seconds.
        placeholder: 10
        hint:
          type: integer

      - name: request_timeout
        display: Request Timeout
        hint:
          type: integer
        description: Timeout for a request in seconds.
        placeholder: 10



  - name: Others
    display_order: 4
    description: Other configurations.
    params:
      - name: concurrent
        display: Concurrency
        description: Number of concurrency while collecting.
        hint:
          type: integer
      - name: batch_size
        display: Batch Size
        hint:
          type: integer
        description: Max batch size for each record batch while reporting to target.
        placeholder: 100
      - name: batch_timeout
        display: Batch Timeout
        hint:
          type: integer
        description: Reporting timeout for a batch in seconds.
        placeholder: 20
      - name: use_received_time
        display: use_received_time
        hint:
          type: bool
        description: use data received time as timestamp not server time
