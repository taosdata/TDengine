---
id: tmq
name: TDengine Data Subscription
description: |
  TMQ data source is a read-only data source for TDengine.

  ## Protocols

  The following protocols are supported.

  - ws: websocket protocol with plain HTTP connection.
  - wss: websocket protocol with TLS http connection.

  Without protocol settings, TMQ will use the TDengine native connection.

  ## Subject

  A TMQ data source can subscribe to data from a database or a specified table. The table must be specified in the "database.tablename" format.

type: uri
options:
  endpoint:
    display: Topic DSN
    required: true
    description: |
      Please login TDengine Cloud or TDengine enterprise, select "topics", under the list of topics, copy DSN and paste it here.
    placeholder: "Topic example: ws://root:taosdata@127.0.0.1:6041/topic1"
strict: false
groups:
  - name: Subscribe Options
    display_order: 2
    description: Options for TMQ subscription.
    params:
      - name: auto.offset.reset
        display: Start From
        description: |
          Data offset to start subscribing.
          - *earliest*: All the data in TDengine, include the new data,
          - *latest*: Subscribe from latest data.
        value: earliest
        hint:
          type: str
          choices:
            - earliest
            - latest
      - name: group.id
        display: Group ID
        description: |
          Group ID is a string used to identify a subscription group, with a maximum length of 192. Subscribers within the same subscription group share consumption progress. Randomly generated group ID will be used when not specified.      
        hint:
          type: str
      - name: client.id
        display: Client ID
        required: true
        description: |
          Client ID is a string used to identify the client, with a maximum length of 192.
        hint:
          type: str
      - name: timeout
        display: Timeout
        hint:
          type: timeout
        description: |
          A timeout for polling data from the topic.

          The input value should be one of:
          - `never`: means waiting for valid message without timeout.
          - A duration string like `5s`, `1m` etc.
        placeholder: 5s
      - name: experimental.snapshot.enable
        display: TSDB Data
        description: |
          - If enabled, the data that has been persisted in time series data storage files will be replicated too; otherwise, only the data still in WAL (write ahead log) will be replicated.
        hint:
          type: bool
        value: true
      - name: with.meta.drop
        display: Table Deletions
        description: |
          If enabled, the table deletion operations on the source side will be replayed on the sink side.
        hint:
          type: bool
        value: true
      - name: with.meta.delete
        display: Data Deletions
        description: |
          If enabled, the data deletion operations on the source side will be replayed on the sink side.
        hint:
          type: bool
        value: true
