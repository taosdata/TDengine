---
id: tmq
name: TDengine Subscription
description: |
  TMQ data source is a reader-only data source for TDengine.

  ## Protocols

  - **ws**: websocket protocol with plain HTTP connection.
  - **wss**: websocket protocol with TLS http connection.

  Without protocol settings, TMQ will use native connection.

  ## Subject

  TMQ data source could subscribe data from a database or a specified table with fully "database.name" format.
type: uri
protocol:
  display: Protocol
  description:
    Choose a protocol scheme for websocket connection, leave it empty for native connection
  choices:
    - name: "--"
      display: Native
      description: Use libtaos client library for connection
    - name: ws
      display: WS
      description: Use WebSocket with HTTP connection.
    - name: wss
      display: WSS
      description: Use WebSocket with HTTPS connection.
options:
  host:
    display: Host
    description:
      TDengine fqdn. Leave it empty if use server localhost(relative to taosX server).
    placeholder: server
  port:
    display: Port
    description: TDengine connection port, leave it empty if use default port.
    placeholder: auto
  subject:
    required: true
    display: Topics
    description: Database name, database.table name or topic name is all available.
    placeholder: "Example: db1,db1.stb1,topic1"
authentication:
  display: Authentication
  description: Use username/password plain authentication or with **token**.
  value: plain
  alternatives:
    - name: plain
      display: Plain
      description: Use username and password.
      username:
        display: Username
        description: TDengine username. The default is root.
        placeholder: root
      password:
        display: Password
        description: TDengine password. The default is taosdata.
        placeholder: taosdata
    - name: token
      display: Token
      description: Use token in parameters.
      params:
        - name: token
          display: Token
          description: Cloud token or custom token.
strict: false
groups:
  - name: Subscribe Options
    display_order: 2
    description: Options for TMQ subscription.
    params:
      - name: auto.offset.reset
        display: Start From
        description: |-
          Data offset to start subscribing.

          - *earliest*: Subscribe from begin.
          - *latest*: Subscribe from latest data.
        hint:
          type: str
          choices:
            - earliest
            - latest
      - name: timeout
        display: Timeout
        hint:
          type: timeout
        description: |
          A timeout for polling data from the topic.

          The input value should be one of:

          - `never`: means waiting for valid message without timeout.
          - A duration string like `5s`, `1m` etc.
        placeholder: 5s
