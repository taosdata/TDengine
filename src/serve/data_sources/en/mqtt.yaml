---
id: mqtt
name: MQTT
description: |
  MQTT stands for Message Queuing Telemetry Transport. It is a lightweight messaging protocol that is easy to implement and use. It is ideal for connecting devices with limited resources, such as battery-powered devices or devices with low bandwidth. MQTT is also a good choice for applications where latency is important, such as real-time control systems.

  MQTT works by using a publish/subscribe model. This means that devices can publish messages to topics, and other devices can subscribe to those topics to receive the messages. This makes it easy to decouple devices from each other, and to scale up applications as needed.

  MQTT is a popular choice for IoT applications. It is supported by a wide range of devices and platforms, and there are many open source and commercial implementations available.

  taosX could subscribe data from MQTT broker by a connector plugin.

  Check the help message in each part to see the details.
type: uri
options:
  endpoint:
    display: MQTT Server endpoint
    required: true
    description: |
      MQTT server endpoint. e.g: 127.0.0.1:1883
      If using an Agent, this address must be accessible from the Agent. If not using an Agent, this address must be accessible from the TDengine system.
    placeholder: 127.0.0.1:1883

authentication:
  display: Authentication
  value: plain
  alternatives:
    - name: plain
      display: Username Password
      description: Use MQTT Broker username and password。
      username:
        display: Username
        placeholder: username
      password:
        display: Password
        placeholder: password

groups:
  - name: Enable SSL
    display_order: 0
    description: Use self-signed certificate file and private key.
    collapsible: true
    params:
      - name: ca
        display: CA
        description: CA file.
        required: true
        hint:
          type: file
      - name: cert
        display: Client certificate file
        description: Client certificate file.
        required: true
        hint:
          type: file
      - name: cert_key
        display: Client key file
        description: Client key file.
        required: true
        hint:
          type: file
  - name: Connection
    display_order: 1
    description: Some configurations used in connecting step.
    params:
      - name: version
        display: MQTT protocol version
        value: "3.1"
        required: true
        description: |-
          MQTT protocol version.
        hint:
          type: str
          choices:
            - "3.1"
            - "3.1.1"
            - "5.0"
      - name: client_id
        display: Client id
        description: |-
          Client id used to connect to mqtt broker.
        placeholder: client_id
        hint:
          type: str

      - name: keep_alive
        display: Keep Alive
        hint:
          type: integer
          min: 1
        description: |
          If the broker does not receive any messages from the<br>
          client within the keep alive interval, it will assume<br>
          that the client has disconnected and will close the<br>
          connection.
        placeholder: 10
        value: 60
      - name: clean_session
        display: Clean Session
        value: true
        description: |
          True means that the server will forget all information<br>
          about the session, including the client's subscriptions.<br>
          The default value for the clean session flag is true.<br>
        hint:
          type: bool
      - name: topics
        display: Topics Qos Config
        required: true
        description: |
          e.g: topic1::0,topic2::1
        hint:
          type: str
        placeholder: topic1::0,topic2::1

advanced:
  name: Advanced Options
  collapsible: true
  collapsed: true
  description: |
    Advanced options including read/write concurrency, collection options, performance tuning, etc. Users can leave
    these options as default to use the recommended settings.
  params:
    - name: log_level
      display: Log Level
      description: Adjust the log level of the data source as required. This parameter does not always take effect.
      value: info
      hint:
        type: str
        choices:
          - error
          - warn
          - info
          - debug
          - trace

    - name: read_concurrency
      hidden: true
      display: Read Concurrency
      description: |
        The number of concurrent read requests. The default value is automatically set by collector. If the data source is slow to respond, you can increase this value appropriately.
      value: 0
      hint:
        type: integer
        min: 0
        max: 1000
    - name: write_concurrency
      hidden: true
      display: Write Concurrency
      description: |
        The number of concurrent write requests. The default value is automatically set by collector. If the data source is slow to respond, you can increase this value appropriately.
      value: 0
      hint:
        type: integer
        min: 0
        max: 1000
    - name: batch_size
      hidden: true
      display: Batch Size
      description: |
        The number of data points to be written in a single request. The default value is 1000. If the data source is slow to respond, you can reduce this value appropriately.
      value: 1000
      hint:
        type: integer
        min: 1
        max: 10000
    - name: batch_timeout
      hidden: true
      display: Batch Timeout
      description: |
        The maximum time(in milliseconds) to wait before sending a batch of data points. The default value is 1000ms. If the data source is slow to respond, you can increase this value appropriately.
      value: 1000
      hint:
        type: integer
        min: 1
        max: 10000
    - name: keep_raw_data
      hidden: true
      display: Keep Raw Data
      description: |
        Whether to keep the raw data. If enabled, the raw data will be stored.
      hint:
        type: bool
    - name: keep_raw_data_days
      hidden: true
      display: Max Keep Days
      description: |
        The number of days to keep the raw data. The default value is 1 day.
      value: 1
      requires: keep_raw_data
      hint:
        type: integer
        min: 1
        max: 365

    - name: keep_raw_data_dir
      hidden: true
      display: Raw Data Directory
      description: |
        The directory to store the raw data. The default value is `$DATA_DIR/tasks/:id/rawdata/`.
      requires: keep_raw_data
      placeholder: $DATA_DIR/tasks/:id/rawdata/
      hint:
        type: str

parser:
  display: MQTT Payload Parser
  description: |
    MQTT will report exactly four fields of data for each data stream:<br>

    - **ts**: the collect timestamp.
    - **topic**: the topic name to subscribe.
    - **qos**: the QoS of the message, usually 0, 1, 2.
    - **payload**: the data payload of the message.

    taosX could parse the payload with JSON extractor and let users to specify the data model in the database, for example, the table name pattern and stable name pattern, field names as tags or field names as columns.
  fields:
    - name: ts
      description: Timestamp.
    - name: topic
      description: Topic name.
    - name: qos
      description: QoS, one of 0/1/2.
    - name: payload
      description: Payload

  required: true
