---
id: mqtt
name: MQTT
description: |
  MQTT stands for Message Queuing Telemetry Transport. It is a
  lightweight messaging protocol that is easy to implement and
  use. It is ideal for connecting devices with limited resources,
  such as battery-powered devices or devices with low bandwidth.
  MQTT is also a good choice for applications where latency is
  important, such as real-time control systems.

  MQTT works by using a publish/subscribe model. This means that
  devices can publish messages to topics, and other devices can
  subscribe to those topics to receive the messages. This makes
  it easy to decouple devices from each other, and to scale up
  applications as needed.

  MQTT is a popular choice for IoT applications. It is supported
  by a wide range of devices and platforms, and there are many
  open source and commercial implementations available.

  taosX could subscribe data from MQTT broker by a connector
  plugin.

  Check the help message in each part to see the details.
type: uri
options:
  endpoint:
    display: Mqtt Server endpoint
    required: true
    description: |
      Mqtt server endpoint. e.g: 127.0.0.1:1883
    placeholder: 127.0.0.1:1883
  username:
    display: Username
    description: MQTT Broker username.
    placeholder: username
  password:
    display: Password
    description: MQTT Broker password.
    placeholder: password

authentication:
  display: Authentication
  value: plain
  alternatives:
    - name: plain
      display: Username Password
      description: Use MQTT Broker username and password。
      username:
        display: Username
        placeholder: username
        required: false
      password:
        display: Password
        placeholder: password
        required: false

groups:
  - name: Enable SSL
    display_order: 0
    description: Use self-signed certificate file and private key.
    collapsible: true
    params:
      - name: ca
        display: CA
        description: CA file content
        required: true
        hint:
          type: file
      - name: cert
        display: Client certificate file
        description: Client certificate file content.
        required: true
        hint:
          type: file
      - name: cert_key
        display: Client key file
        description: Client key file content.
        required: true
        hint:
          type: file
  - name: Connection
    display_order: 1
    description: Some configurations used in connecting step.
    params:
      - name: version
        display: Mqtt protocol version
        value: "3.1"
        required: true
        description: |-
          MQTT protocol version.
        hint:
          type: str
          choices:
            - "3.1"
            - "3.1.1"
            - "5.0"
      - name: client_id
        display: Client id
        description: |-
          Client id used to connect to mqtt broker.
        hint:
          type: str

      - name: keep_alive
        display: Keep Alive
        hint:
          type: integer
          min: 1
        description: |
          If the broker does not receive any messages from the<br>
          client within the keep alive interval, it will assume<br>
          that the client has disconnected and will close the<br>
          connection.
        placeholder: 10
      - name: clean_session
        display: Clean Session
        value: true
        description: |
          True means that the server will forget all information<br>
          about the session, including the client's subscriptions.<br>
          The default value for the clean session flag is true.<br>
        hint:
          type: bool
      - name: topics
        display: Topics Qos Config
        required: true
        description: |
          e.g: topic1::0,topic2::1
        hint:
          type: str

  - name: Others
    display_order: 2
    description: Other configurations.
    params:
      - name: log_level
        display: Log Level
        description: Log Level
        hint:
          type: str
          choices:
            - error
            - warn
            - info
            - debug
            - trace

parser:
  display: MQTT Payload Parser
  description: |
    MQTT will report exactly four fields of data for each data stream:<br>

    - **ts**: the collect timestamp.<br>
    - **topic**: the topic name to subscribe.<br>
    - **qos**: the QoS of the message, usually 0, 1, 2.<br>
    - **payload**: the data payload of the message.<br>

    taosX could parse the payload with JSON extractor and let users to specify the<br>
    data model in the database, for example, the table name pattern and stable name<br>
    pattern, field names as tags or field names as columns.
  fields:
    - name: ts
      description: Timestamp.
    - name: topic
      description: Topic name.
    - name: qos
      description: QoS, one of 0/1/2.
    - name: payload
      description: Payload

  required: true
