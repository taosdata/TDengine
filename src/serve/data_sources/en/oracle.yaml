---
id: oracle
name: Oracle
type: uri
description: |
  Oracle is the world's most popular relational database management system. It has good portability, ease of use, and powerful functions, and is suitable for various large, medium, and small microcomputer environments. It is an efficient, reliable, and high-throughput database solution.

  TDengine can efficiently read the data in Oracle and write it to TDengine through the Oracle connector to achieve historical data migration or real-time data synchronization.
strict: false

options:
  host:
    display: host
    description: |-
      The access address of Oracle.
      If using an Agent, this address must be accessible from the Agent. If not using an Agent, this address must be accessible from the TDengine system.
    placeholder: "127.0.0.1"
    required: true
  port:
    display: port
    description: The port of Oracle.
    placeholder: "1521"
    required: true
  subject:
    display: Database
    description: The name of the database to connect to.
    placeholder: "for example: db1"
    required: true

authentication:
  display: Authentication
  description: Authentication is the process of verifying the identity before granting access to Oracle.
  value: plain
  alternatives:
    - name: plain
      display: Username and Password
      description: Use username and password of Oracle
      username:
        display: Username
        placeholder: username
        required: true
      password:
        display: Password
        placeholder: password
        required: true

groups:
  - name: Data Collection
    display_order: 2
    description: Data collection related configuration items.
    required: true
    params:
      - name: sql
        display: SQL Template
        description: >
          SQL statement used for querying.
        required: true
        placeholder: "SELECT * FROM table WHERE time >= $start AND time < $end"
        hint:
          type: str
      - name: start
        display: Start Time
        description: >
          Start time applied to the query statement.
        required: true
        placeholder: "for example: 2023-01-01 00:00:00"
        hint:
          type: time
      - name: end
        display: End Time
        description: >
          End time applied to the query statement.
        required: false
        placeholder: "for example: 2024-01-01 00:00:00"
        hint:
          type: time
      - name: interval
        display: Query Interval
        description: >
          Time interval used for segmented queries.
        required: false
        placeholder: 1d
        hint:
          type: duration
      - name: delay
        display: Delay
        description: >
          Waiting time for synchronizing future data.
        required: false
        placeholder: 10s
        hint:
          type: duration

parser:
  display: Data Mapping
  description: |
    taosX could let users to specify the data model in the database, for example, the table name pattern and stable name pattern, field names as tags or field names as columns.
  fields:
    - name: DateTime
      description: The timestamp of the returned value.
      type: timestamp
  required: true

advanced:
  name: Advanced Options
  collapsible: true
  description: |
    Advanced options including read/write concurrency, collection options, performance tuning, etc. Users can leave these options as default to use the recommended settings.
  params:
    - name: read_concurrency
      display: Read Concurrency
      description: |
        The number of concurrent read requests. The default value is automatically set by collector. If the data source is slow to respond, you can increase this value appropriately.
      value: 0
      hint:
        type: integer
        min: 0
        max: 1000
    - name: batch_size
      display: Batch Size
      description: |
        The number of data points to be written in a single request. The default value is 10000. If the data source is slow to respond, you can reduce this value appropriately.
      value: 10000
      hint:
        type: integer
        min: 1
        max: 100000