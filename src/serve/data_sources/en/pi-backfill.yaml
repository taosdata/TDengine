---
id: pibackfill
name: PIBACKFILL
description: |
  The Aveva PI System is a suite of software products that are used for data collection, historicizing, finding, analyzing, delivering, and visualizing. It is marketed as an enterprise infrastructure for management of real-time data and events.

  The term PI System is often used to refer to the PI Server but the two are not the same. The PI System refers to all Aveva PI software products whereas the PI Server is the core product of the PI System. Data can be automatically collected from many sources (control systems, lab equipment, calculations, manual entry or custom software).
type: uri
params:
  - name: system_configuration
    display: System Configuration
    display_order: 0
    description:
    value: PI Data Archive and Asset Framework (AF) Server
    hint:
      type: str
      choices:
        - PI Data Archive and Asset Framework (AF) Server
        - PI Data Archive Only
  - name: PISystemName
    display: AF Server Name
    placeholder: pi-af-server-name
    required: true
    display_order: 3
    description: |-
      PI System(AF Server) name (hostname).
    hint:
      type: str
options:
  host:
    display: Server
    description: |-
      PI server name (hostname).

      If using an Agent, this address must be accessible from the Agent. If not using an Agent, this address must be accessible from the TDengine system.
    placeholder: server
    required: true
  subject:
    required: true
    display: AFDatabaseName
    description: AF database name
    placeholder: "Example: Met1"
strict: false
groups:
  - name: Backfill
    display_order: 3
    description: TDBackfill param set.
    params:
      - name: FromTDengineLastTime
        display: From TDengine Last Time
        description: |-
          Backfill from the last recorded value in TDengine.
        hint:
          type: bool
      - name: ToTDengineFirstTime
        display: To TDengine First Time
        hint:
          type: bool
        description: |
          Backfill up to the first recorded value in TDengine.
      - name: BackfillStartTime
        display: Backfill Start Time
        hint:
          type: time
        description: |
          The start time for backfilling data.

          If not provided, the start time will be the earliest time available(10 days ago from now).
        placeholder: "YYYY-MM-DD HH:mm:ss"
      - name: BackfillEndTime
        display: Backfill End Time
        hint:
          type: time
        description: |
          The end time for backfilling data. The default is now.

        placeholder: "YYYY-MM-DD HH:mm:ss"

  - name: Data Queue
    display_order: 4
    description: Batch and auto-backfill configurations.
    params:
      - name: MaxWaitLen
        display: Update Batch Size(count)
        description: |-
          Max number of updates (rows) to batch before sending data to TDengine.
        hint:
          type: integer
          min: 1
          max: 10000
        value: 1000
      - name: UpdateInterval
        display: Update Interval (in ms)
        hint:
          type: integer
          min: 100
          max: 60000
        description: Max time to wait before sending batch updates to TDengine (in miliseconds).
        placeholder: 10000
        value: 1000
      - name: MaxBackfillRangeDays
        display: Max Backfill Range(in days)
        hint:
          type: integer
        description: Max number of days to automatically backfill when connection is lost or on first startup.
        placeholder: 1
        value: 1

datasets:
  name: Data Sets
  display: Data Sets
  description: |
    Single column configuration file for point names.
  params:
    - name: point_file
      display: One Table Per Point
      description: |
        The CSV config file is a CSV file with one single column without header:

        | |
        | ------------------- |
        | meter_10001_current |
        | meter_10001_voltage |
      hint:
        type: file
    - name: template_for_pi_point_file
      display: One Table per PI Point from AF Element Template
      description: |
        The CSV config file is a CSV file with one single column without header:

        | |
        | ------------------- |
        | MeterTemplate  |
        | MeterTemplate1 |
      hint:
        type: file
    - name: template_for_af_element_file
      display: One Table per AF Element from AF Element Template
      description: |
        The CSV config file is a CSV file with one single column without header:

        | |
        | ------------------- |
        | MeterTemplate  |
        | MeterTemplate1 |
      hint:
        type: file

