---
id: pibackfill
name: PIBACKFILL
description: |
  The PI System is a suite of software products that are used for data collection, historicizing, finding, analyzing, delivering, and visualizing. It is marketed as an enterprise infrastructure for management of real-time data and events.

  The term PI System is often used to refer to the PI Server but the two are not the same. The PI  System refers to all OSIsoft software products whereas the PI Server is the core product of the PI System. Data can be automatically collected from many sources (control systems, lab equipment, calculations, manual entry or custom software).

  taosX could pull history data from PI System by a PIBACKFILL connector plugin.
type: uri
options:
  host:
    display: Server
    description: PI server name (hostname).
    placeholder: server
    required: true
  subject:
    required: true
    display: AFDatabaseName
    description: AF database name
    placeholder: 'Example: Met1'
strict: false
groups:
- name: PI System
  display_order: 2
  description: PI system configurations.
  params:
  - name: PISystemName
    display: PI System Name
    description: |-
      PI System name, leave it empty to use the same hostname with **Server**.
    hint:
      type: str

- name: Backfill
  display_order: 3
  description: TDBackfill param set.
  params:
  - name: FromTDengineLastTime
    display: From TDengine Last Time
    description: |-
      Backfill from the last recorded value in TDengine.
    hint:
      type: bool
  - name: ToTDengineFirstTime
    display: To TDengine First Time
    hint:
      type: bool
    description: |
      Backfill up to the first recorded value in TDengine.
  - name: BackfillStartTime
    display: Backfill Start Time
    hint:
      type: time
    description: |
      The start time for backfilling data.

      If not provided, the start time will be the earliest time available.
    placeholder: "YYYY-MM-DD HH:mm:ss"
  - name: BackfillEndTime
    display: Backfill End Time
    hint:
      type: time
    description: |
      The start time for backfilling data.

      If not provided, the start time will be the earliest time available.
    placeholder: "YYYY-MM-DD HH:mm:ss"

- name: Data Queue
  display_order: 4
  description: Other configurations.
  params:
  - name: MaxWaitLen
    display: Max Wait Length
    description: |-
      Message Wait queue max length
    hint:
      type: integer
      min: 1
      max: 10000
  - name: UpdateInterval
    display: Update Interval (in ms)
    hint:
      type: integer
      min: 100
      max: 60000
    description: Pull Data from PI System Interval in `ms`.
    placeholder: 10000
  - name: MaxBackfillRangeDays
    display: Max Backfill Range(in days)
    hint:
      type: integer
    description: Max backfill time range in days.
    placeholder: 1

datasets:
  name: Data Sets
  description: PI System template and points
  categories:
  - category: PointList
    display: Point List
    description: |
      The point names exists in pi system.
    target:
      name: PointList
      description: Pi System Point List
      required: false
      multiple: true
      editable: true
      selectable: true
  - category: TemplateForPIPoint
    display: Template For PI Point
    description: |
      The template names exists in pi system.
    target:
      name: TemplateForPIPoint
      description: Database datasets.
      required: false
      multiple: true
      editable: true
      selectable: true
  - category: TemplateForAFElement
    display: Template For AF Element
    description: |
      The template names exists in pi system.
    target:
      name: TemplateForAFElement
      description: Database datasets.
      required: false
      multiple: true
      editable: true
      selectable: true
