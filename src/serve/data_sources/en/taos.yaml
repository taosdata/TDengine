---
id: taos
name: TDengine 2.x
description: |
  The TDengine 2.x data source can be used to migrate data from previous version to current cluster.

  ## Protocols

  The supported protocols are:

  - ws: websocket protocol with plain HTTP connection.
  - wss: websocket protocol with TLS http connection.

  If a protocol setting is not specified, a TDengine native connection will be used.

type: uri
protocol:
  display: Protocol
  description: Choose a protocol scheme for websocket connection.
  required: true
  value: ws
  choices:
    - name: ws
      display: WS
      description: Use WebSocket with HTTP connection.
    - name: wss
      display: WSS
      description: Use WebSocket with HTTPS connection.
options:
  host:
    display: Host
    description: Remote server REST API (taosAdapter) address. If you prefer to use multiple nodes, please consider to use a load-balancer.
    placeholder: taos-adapter-addr
    required: true
  port:
    display: Port
    required: true
    description: Remote server REST API (taosAdapter) port.
    placeholder: "6041"
  subject:
    required: true
    display: Database
    description: Database name
    placeholder: "Example: db1"
authentication:
  display: Authentication
  description: Use username/password plain authentication.
  value: plain
  alternatives:
    - name: plain
      display: Plain
      description: Use username and password.
      username:
        display: Username
        description: TDengine username. The default is root.
        placeholder: root
        value: root
      password:
        display: Password
        description: TDengine password. The default is taosdata.
        placeholder: taosdata
        value: taosdata
strict: false
groups:
  - name: Migrate Options
    display_order: 1
    description: How to migrate.
    params:
      - name: mode
        display: Mode
        description: |-
          Migrate history data or realtime or both.
        value: history
        hint:
          type: str
          choices:
            - history
            - realtime
            - all
      - name: schema
        display: Schema
        value: always
        hint:
          type: str
          choices:
            - always
            - none
            - only
        description: |
          Which kind of data to be migrated.

          - `only`: means only migrate schema into target.
          - `none`: means not migrate schema, but only data into target.
          - `always`: means migrate all stuff.
        placeholder: always
      - name: sparse
        display: Sparse
        value: false
        hint:
          type: bool
        description: Enable this mode to improve performance in case of high-cardinality and low data ingestion frequency.
      - name: schema-polling-interval
        display: Schema Polling Interval
        value: 5s
        hint:
          type: duration
        description: |-
          Polling interval to query schema.
        placeholder: "Interval: 5s"

  - name: What to migrate
    display_order: 2
    description: Choose to migrate from stable or tables.
    params:
      - name: stables
        display: STables
        description: |-
          Select some of stables from the database. Separated by `,`.
        placeholder: metrics
        hint:
          type: str
      - name: tables
        display: Tables
        placeholder: d0001
        hint:
          type: str
        description: |
          Select table names to be migrated.

  - name: Range
    display_order: 3
    description: Migration time range.
    params:
      - name: start
        display: Start
        description: |-
          Time range start.
        placeholder: "2023-10-01T12:00:00.000+08:00"
        hint:
          type: time
      - name: end
        display: End
        description: Time range end.
        placeholder: "2023-10-02T12:00:00.000+08:00"
        hint:
          type: time
      - name: unit
        display: Unit
        hint:
          type: duration
        value: 1d
        description: |-
          Time duration unit for query.<br>
          Supports abbreviations of numbers and units, such as "1ms" for 1 millisecond, "1s" for 1 seconds, "1m" for 1 minute, "1h" for 1 hour, "1d" for 1 day, and "1w" for 1 week.<br>
          Only numbers default to seconds as unit.<br>
        placeholder: "Unit: 1s/1h/1d"

  - name: Realtime Settings
    display_order: 4
    description: Only available in `realtime` mode.
    params:
      - name: retro
        display: Retrospection
        description: |-
          Retrospect data from some time ago into target before realtime data migrating.<br>
          Supports abbreviations of numbers and units, such as "1ms" for 1 millisecond, "1s" for 1 seconds, "1m" for 1 minute, "1h" for 1 hour, "1d" for 1 day, and "1w" for 1 week.<br>
          Only numbers default to seconds as unit.<br>
        value: 0s
        hint:
          type: duration
      - name: interval
        display: Interval
        hint:
          type: duration
        description: |-
          Polling interval to query realtime data.<br>
          Supports abbreviations of numbers and units, such as "1ms" for 1 millisecond, "1s" for 1 seconds, "1m" for 1 minute, "1h" for 1 hour, "1d" for 1 day, and "1w" for 1 week.<br>
          Only numbers default to seconds as unit.<br>
        value: 1s
        placeholder: "Interval: 1s"
      - name: excursion
        display: Excursion
        hint:
          type: duration
        value: 500ms
        description: |-
          Wait for some period to querying random-order data.<br>
          Supports abbreviations of numbers and units, such as "1ms" for 1 millisecond, "1s" for 1 seconds, "1m" for 1 minute, "1h" for 1 hour, "1d" for 1 day, and "1w" for 1 week.<br>
          Only numbers default to seconds as unit.<br>
        placeholder: "Duration: 5m"

advanced:
  name: Advanced Options
  collapsible: true
  description: |
    Adjust the parameters related to concurrency setting for reading from data source and  writing into data sink, and error log.
  params:
    - name: workers
      display: Read Concurrency
      description: The number of threads for reading data from the source. If not set, the default value is the number of CPU cores.
      value: 0
      hint:
        type: integer
        min: 0
        max: 100
    - name: write-concurrency
      display: Write Concurrency
      description: |
        The overall maximum concurrency for writing to the target database. It cannot be less than the read concurrency, and the default is equal to the read concurrency.
      value: 1
      hint:
        type: integer
        min: 1
        max: 100
    - name: fails-to
      display: File to write failed data
      description: |
        An absolute path of the environment where taosX is running. If set, the failed data and the reason for the failure will be written to the file and will not block task execution. If not set, a failed write will cause task interruption.
      hint:
        type: str
