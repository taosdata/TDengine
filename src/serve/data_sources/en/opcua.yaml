---
id: opcua
name: OPC-UA
description: |
  OPC is one of interoperability standard for the secure and reliable exchange of data in the industrial automation space and in other industries.

  OPC UA is the next generation beyond the classic OPC specification, a platform-independent, service-oriented architecture specification that integrates all functionality from the existing OPC Classic specifications, providing a migration path to a more secure and scalable solution.

  For more about OPC UA we introduce you to read the [OPC Foundation site](https://opcfoundation.org/), and some useful blogs, such as

  1. [What is OPC](https://opcfoundation.org/about/what-is-opc/)
  2. [What is OPC UA](https://opcfoundation.org/about/opc-technologies/opc-ua/).

  taosX could pull data from OPC server by a OPC connector plugin.

  Check the help message in each part to see the details.
type: uri

options:
  endpoint:
    display: Server endpoint
    required: true
    description: |
      OPC-UA server endpoint, such as `127.0.0.1:6666/OPCUA/ServerPath`.
    placeholder: 127.0.0.1:6666/OPCUA/ServerPath

strict: false

authentication:
  display: Authentication
  description: Use username/password plain authentication or with certificate files, or anonymous(default).
  value: anonymous
  alternatives:
    - name: anonymous
      display: Anonymous
      description: Logging in anonymously without any configurations (if available).
      value: true
      params: []

    - name: plain
      display: Username
      description: Use username and password.
      username:
        display: Username
        description: OPC server username.
        placeholder: username
        required: true
      password:
        display: Password
        description: OPC server password.
        placeholder: password
        required: true
    - name: certificates
      display: Certificates
      description: Use certificate file and private key.
      params:

        - name: security_mode
          display: Security Mode
          description: |
            Available value is one of None / Sign / SignAndEncrypt.

            - **None**:
            - **Sign**:
            - **SingAndEncrypt**:
          hint:
            type: str
            choices:
              - None
              - Sign
              - SignAndEncrypt
        - name: security_policy
          display: Security Policy
          description: |
            Available value is one of None/Basic128Rsa15/Basic256/Basic256Sha256.
          hint:
            type: str
            choices:
              - None
              - Basic128Rsa15
              - Basic256
              - Basic256Sha256
        - name: certificate
          display: Certificate file content
          # description: Path to cert.pem. Required when security mode or policy isn't "None".
          hint:
            type: file
        - name: private_key
          display: Private key file content
          # description: Path to private key.pem. Required when security mode or policy isn't "None"
          hint:
            type: file
datasets:
  name: Data Sets
  description: Data points in OPC server to collect.
  categories:
  - category: nodes
    display: Nodes
    description: |
      OPC UA point configuration list. Use the format configuration of <point name>::<point code>, multiples are separated by commas, the code can be any string, and the generated sub-table table name will be prefixed with the super table_value type_code string .
    target:
      name: ua.nodes
      description: |
        OPC UA point configuration list. Use the format configuration of <point name>::<point code>, multiples are separated by commas, the code can be any string, and the generated sub-table table name will be prefixed with the super table_value type_code string .
      required: true
      multiple: true
      editable: true
      selectable: true

groups:
  - name: Connection
    display_order: 2
    description: Some configurations used in connecting step.
    params:
      - name: connect_timeout
        display: Connect Timeout
        description: |-
          Timeout for connect to endpoint in seconds.
        placeholder: 10
        value: 1
        hint:
          type: integer
          min: 1
          max: 60
      - name: request_timeout
        display: Request Timeout
        hint:
          type: integer
          min: 1
          max: 60
        description: Timeout for a request in seconds.
        placeholder: 10
        value: 1

  - name: Collect
    display_order: 3
    description: Some configurations used in connecting step.
    params:
      - name: interval
        display: Collect interval
        description: |-
          Collect data interval in second
        hint:
          type: integer
          min: 1
          max: 60
        value: 1

      - name: limit
        display: Collect limit
        description: |-
          The upper limit of points for one request for registration
        hint:
          type: integer
          min: 1
          max: 1000

      - name: collect_mode
        display: Collect Mode
        description: |-
          observe or subscribe. default is observe
        placeholder: observe
        hint:
          type: str
          choices:
            - observe
            - subscribe
        value: observe

  - name: Table Config
    display_order: 4
    description: |
      Stable Config

      - **received_time**: time opc collector received<br>
      - **original_time**: time from opc server <br>
      - **value**: point value<br>
      - **status**: point status<br>

    params:
      - name: opc_table_config
        display: OPC Table Config
        required: true
        placeholder: 10
        hint:
          type: json

  - name: Others
    display_order: 5
    description: Other configurations.
    params:
      - name: concurrent
        display: Concurrency
        description: Number of concurrency while collecting.
        hint:
          type: integer
          min: 1
          max: 100
        value: 1
      - name: batch_size
        display: Batch Size
        hint:
          type: integer
          min: 1
          max: 10000
        description: Max batch size for each record batch while reporting to target.
        placeholder: 100
        value: 1
      - name: batch_timeout
        display: Batch Timeout
        hint:
          type: integer
          min: 1
          max: 60
        description: Reporting timeout for a batch in seconds.
        placeholder: 20
        value: 1

      - name: debug
        display: Enable Debug Log
        hint:
          type: bool
        description: Set true to enable Debug log
