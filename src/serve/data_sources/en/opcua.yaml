---
id: opcua
name: OPC-UA
description: |
  OPC is one of interoperability standard for the secure and reliable exchange of data in the industrial automation space and in other industries.

  OPC UA is the next generation beyond the classic OPC specification, a platform-independent, service-oriented architecture specification that integrates all functionality from the existing OPC Classic specifications, providing a migration path to a more secure and scalable solution.

  To learn more about OPC, OPC UA and OPC DA, please visit the following links on the [OPC Foundation site](https://opcfoundation.org/):

  1. [What is OPC](https://opcfoundation.org/about/what-is-opc/)
  2. [What is OPC UA](https://opcfoundation.org/about/opc-technologies/opc-ua/)
type: uri

options:
  endpoint:
    display: Server endpoint
    required: true
    description: |
      OPC-UA server endpoint, such as `127.0.0.1:6666/OPCUA/ServerPath`.
      If using an Agent, this address must be accessible from the Agent. If not using an Agent, this address must be accessible from the TDengine system.
    placeholder: 127.0.0.1:6666/OPCUA/ServerPath

strict: false

authentication:
  display: Authentication
  description: Use username/password plain authentication or with certificate files, or anonymous(default).
  value: anonymous
  alternatives:
    - name: anonymous
      display: Anonymous
      description: Logging in anonymously without any configurations (if available).
      value: true
      params: []

    - name: plain
      display: Username
      description: Use username and password.
      username:
        display: Username
        description: OPC server username.
        placeholder: username
        required: true
      password:
        display: Password
        description: OPC server password.
        placeholder: password
        required: true

    - name: certificates
      display: Certificates
      description: Use certificate file and private key.
      params:
        - name: security_mode
          display: Security Mode
          description: |
            Available value is one of None / Sign / SignAndEncrypt.

            - **None**:
            - **Sign**:
            - **SingAndEncrypt**:
          hint:
            type: str
            choices:
              - None
              - Sign
              - SignAndEncrypt
        - name: security_policy
          display: Security Policy
          description: |
            Available value is one of None/Basic128Rsa15/Basic256/Basic256Sha256.
          hint:
            type: str
            choices:
              - None
              - Basic128Rsa15
              - Basic256
              - Basic256Sha256
        - name: certificate
          display: Certificate file content
          # description: Path to cert.pem. Required when security mode or policy isn't "None".
          hint:
            type: file
        - name: private_key
          display: Private key file content
          # description: Path to private key.pem. Required when security mode or policy isn't "None"
          hint:
            type: file

datasets:
  name: Data Sets
  description: Data points in OPC server to collect.
  value: csv_config_file
  categories:
  - category: csv_config_file
    display: Upload CSV
    description: |
      Use OPC UA point configuration file.
    target:
      name: csv_config_file
      description: |
        OPC UA point configuration list.
      required: true
      multiple: true
      editable: true
      selectable: true

  - category: select_all_points
    display: All Points
    description: |
      OPC UA point configuration file.
    target:
      name: select_all_points
      description: |
        Select All Points on OPC Server.
      required: true
      multiple: true
      editable: true
      selectable: true
    params:
      - name: table_primary_key
        display: Primary Key
        description:
        required: true
        value: original_ts
        hint:
          type: str
          choices:
            - received_ts
            - original_ts
      - name: child_table_expression
        display: Table Name
        value: meter_{ns}_{id}
        description: |
          Support <child table prefix>_{ns}_{id} pattern
        hint:
          type: str
        required: true

groups:
  - name: Connection
    display_order: 1
    description: Configuration used in OPC connection
    params:
      - name: connect_timeout
        display: Connect Timeout
        description: |-
          Timeout for connect to endpoint in seconds
        placeholder: 10
        value: 1
        hint:
          type: integer
          min: 1
          max: 60

      - name: request_timeout
        display: Request Timeout
        description: Timeout for a request to endpoint in seconds
        placeholder: 10
        value: 1
        hint:
          type: integer
          min: 1
          max: 60

  - name: Collect
    display_order: 2
    description: Configurations for collecting data from OPC
    params:
      - name: interval
        display: Collect interval
        description: |-
          Collect data interval in second
        value: 10
        hint:
          type: integer
          min: 1
          max: 60

      - name: collect_mode
        display: Collect Mode
        description: |-
          observe or subscribe. default is subscribe
        placeholder: subscribe
        value: subscribe
        hint:
          type: str
          choices:
            - observe
            - subscribe

  - name: Original Data Save
    display_order: 3
    description: Original Data Collected By OPC Connector Save Config
    params:
      - name: enable
        display: Enable Save Original Collected Data
        description: |-
          Default is false (Not Save).
        value: false
        hint:
          type: bool

      - name: path
        display: Path to Save
        description: Data save path, should config if enable save data.
        placeholder: /data/
        hint:
          type: str

      - name: keep
        display: Data Keep Days
        description: Original Data Keep Days, should config if enable save data.
        placeholder: 10
        value: 10
        hint:
          type: integer
          min: 1

  - name: Advanced Options
    display_order: 4
    description: |
      Advanced options including read/write concurrency, collection options, performance tuning, etc. Users can leave 
      these options as default to use the recommended settings.
    params:
      - name: concurrent
        display: Write Concurrency
        description: Number of concurrency while connecting with server or agent.
        value: 1
        hint:
          type: integer
          min: 1
          max: 100

      - name: batch_size
        display: Batch Size
        description: Maximum(but soft) number of records for a batch to write up upstream.
        placeholder: 100
        value: 1000
        hint:
          type: integer
          min: 1
          max: 10000

      - name: batch_timeout
        display: Batch Timeout
        description: Timeout for writing a batch to upstream in seconds
        placeholder: 20
        value: 1
        hint:
          type: integer
          min: 1
          max: 60

      - name: log_level
        display: Log Level
        description: Adjust the log level of the data source as required. This parameter does not always take effect.
        value: info
        hint:
          type: str
          choices:
            - error
            - warn
            - info
            - debug
            - trace
