---
id: opcda
name: OPC-DA
description: |
  OPC is one of interoperability standard for the secure and reliable exchange of data in the industrial automation space   and in other industries.

  OPC DA (Data Access) is a classic COM-based specification that works only on Windows.
  OPC DA is widely used even though it isn't the newest and most efficient data communication specification out there. This is mainly because of older devices that only support the OPC DA.

  For more about OPC DA we introduce you to read the [OPC Foundation site](https://opcfoundation.org/), and some useful blogs, such as

  1. [What is OPC](https://opcfoundation.org/about/what-is-opc/)
  2. [What is OPC DA](https://plcynergy.com/opc-da/)

  taosX could pull data from OPC server by a OPC connector plugin.

  Check the help message in each part to see the details.
type: uri

options:
  endpoint:
    display: Server endpoint
    required: true
    description: |
      OPC server endpoint, such as `127.0.0.1<,localhost>/Matrikon.OPC.Simulation.1`.
      If using an Agent, this address must be accessible from the Agent. If not using an Agent, this address must be accessible from the TDengine system.
    placeholder: 127.0.0.1/Matrikon.OPC.Simulation.1

strict: false

datasets:
  name: Data Sets
  description: Data points in OPC server to collect.
  value: csv_config_file
  categories:
  - category: csv_config_file
    display: Upload CSV
    description: |
      Use OPC DA point configuration file.
    target:
      name: csv_config_file
      description: |
        OPC DA point configuration list.
      required: true
      multiple: true
      editable: true
      selectable: true

  - category: select_all_points
    display: All Points
    description: |
      OPC DA point configuration file.
    target:
      name: select_all_points
      description: |
        Select All Points on OPC Server.
      required: true
      multiple: true
      editable: true
      selectable: true
    params:
      - name: table_primary_key
        display: Primary Key
        description:
        required: true
        value: original_ts
        hint:
          type: str
          choices:
            - received_ts
            - original_ts
      - name: child_table_expression
        display: Table Name
        value: Meter_{TagName}
        description: |
          Support <child table prefix>_{TagName} pattern
        hint:
          type: str
        required: true

groups:
  - name: Connection
    display_order: 1
    description: Configuration used in OPC connection
    params:
      - name: connect_timeout
        display: Connect Timeout
        description: |-
          Timeout for connect to endpoint in seconds
        placeholder: 10
        value: 10
        hint:
          type: integer
          min: 1
          max: 60

      - name: request_timeout
        display: Request Timeout
        hint:
          type: integer
          min: 1
          max: 60
        description: Timeout for a request to endpoint in seconds
        placeholder: 10
        value: 10

  - name: Collect
    display_order: 3
    description: Configurations for collecting data from OPC
    params:
      - name: interval
        display: Collect interval
        description: |-
          Collect data interval in second
        hint:
          type: integer
          min: 1
          max: 60
        value: 1

  - name: Original Data Save
    display_order: 2
    description: Original Data Collected By OPC Connector Save Config
    params:
      - name: enable
        display: Save Original Collected Data
        description: |-
          Default is false (Not Save).
        value: false
        hint:
          type: bool

      - name: path
        display: Path to Save
        hint:
          type: str
        description: Data save path, should config if enable save data.
        placeholder: /data/

      - name: keep
        display: Data Keep Days
        hint:
          type: integer
          min: 1
        description: Original Data Keep Days, should config if enable save data.
        placeholder: 10
        value: 10

  - name: Others
    display_order: 3
    description: Other configurations.
    params:
      - name: concurrent
        display: Write Concurrency
        description: Number of concurrency while writing to database
        hint:
          type: integer
          min: 1
          max: 100
        value: 1
      - name: batch_size
        display: Write Batch Size
        hint:
          type: integer
          min: 1
          max: 10000
        description: Maximum number of records for a batch when writing to database
        placeholder: 100
        value: 1
      - name: batch_timeout
        display: Write Batch Timeout
        hint:
          type: integer
          min: 1
          max: 60
        description: Timeout for writing a batch to database in seconds
        placeholder: 20
        value: 1

      - name: debug
        display: Enable Debug Log
        hint:
          type: bool
        description: Set true to enable Debug log
