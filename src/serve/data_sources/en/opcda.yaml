---
id: opcda
name: OPC-DA
description: |
  OPC is one of interoperability standard for the secure and reliable exchange of data in the industrial automation space   and in other industries.

  OPC DA (Data Access) is a classic COM-based specification that works only on Windows.
  OPC DA is widely used even though it isn't the newest and most efficient data communication specification out there. This is mainly because of older devices that only support the OPC DA.

  For more about OPC DA we introduce you to read the [OPC Foundation site](https://opcfoundation.org/), and some useful blogs, such as

  1. [What is OPC](https://opcfoundation.org/about/what-is-opc/)
  2. [What is OPC DA](https://plcynergy.com/opc-da/)

  taosX could pull data from OPC server by a OPC connector plugin.

  Check the help message in each part to see the details.
type: uri

options:
  endpoint:
    display: Server endpoint
    required: true
    description: |
      OPC server endpoint, such as `127.0.0.1<,localhost>/Matrikon.OPC.Simulation.1`.
      If using an Agent, this address must be accessible from the Agent. If not using an Agent, this address must be the taosX host.
    placeholder: 127.0.0.1/Matrikon.OPC.Simulation.1

strict: false

datasets:
  name: Data Sets
  description: Data points in OPC server to collect.
  value: csv_config_file
  categories:
    - category: csv_config_file
      display: Upload CSV
      description: |
        OPC DataIn task uses a csv file to define the mapping rules for each data point to the TDengine table:
        
        (1) tag_name: required, the id of the data point on the OPC DA server;
        
        (2) stable: required. TDengine super table corresponding to data points;
        
        (3) tbname: required. TDengine subtable corresponding to the data point;
        
        (4) enable: optional. The default value is '1', which specifies whether to collect data at this point. 0- Do not collect and delete the corresponding sub-table, 1- collect the point data, create a sub-table when there is no sub-table;
        
        (5) value_col: optional. The default value is val. The column name corresponding to the data point collection value in TDengine;
        
        (6) value_transform: optional, the transformation function executed in taosX for data point acquisition values. Currently, only numerical calculation expressions are supported. See expr expression description in transform document for details.
        
        (7) type: optional. The default value is the source data type. The data type of the data point collection value, which can be used to replace the placeholder {type} in the supertable name;
        
        (8) quality_col: optional, the column name corresponding to the quality of data point collection value in TDengine;
        
        (9) ts_col/received_ts_col: required. TDengine timestamp primary key definition: If only ts_col exists, the original timestamp is used as the primary key. If only received_ts_col exists, the collection timestamp is used as the primary key. If both columns exist, the first timestamp column is used as the primary key.
        
        (10) ts_transform: optional, the original timestamp transform function, refer to the description of the transform numerical calculation expression expr;
        
        (11) received_ts_transform: optional, collect data timestamp transform function, refer to the description of Transform numerical calculation expression expr;
        
        (12) tag::VARCHAR(200)::name: Multiple tag columns are optional or configurable. The Tag column corresponding to the data point in TDengine; tag is reserved keyword, indicating that the column is a tag column. VARCHAR(200) indicates the type of the tag, or any other valid type. name is the column name of the tag.
        
        For more rules, please refer to the <a target="_blank" href="/docs-en/enterprise/datain/opcda">enterprise version document</a>.
      target:
        name: csv_config_file
        description: |
          OPC DA point configuration list.
        required: true
        multiple: true
        editable: true
        selectable: true

    - category: select_all_points
      display: Data Points
      description: |
        OPC DA point configuration file.
      target:
        name: select_all_points
        description: |
          Select data points that meet specified conditions on the OPC server.
        required: true
        multiple: true
        editable: true
        selectable: true
      params:
        - name: root
          display: Root node
          description: |
            Query all child nodes starting from this node.
          placeholder: For example root.parent
          hint:
            type: str
        - name: pattern
          display: Regex pattern
          description: |
            Match the data point TagName.
          hint:
            type: str
        - name: super_table_expression
          display: Super Table Name
          value: opc_{type}
          description: |
            Support <super table prefix>_{type} pattern, {type} is the data type of the OPC point.
          required: true
          hint:
            type: str
        - name: child_table_expression
          display: Table Name
          value: t_{tagname}
          description: |
            Support <child table prefix>_{tagname} pattern, {tagname} is the name of the OPC point.
          required: true
          hint:
            type: str
        - name: table_primary_key
          display: Primary Key
          description: |
            The selected value will be the primary key of target table, original_ts represents the time when OPC service receive data from data points, and received_ts represents the time when the taosX task received data from OPC server.
          required: false
          value: original_ts
          hint:
            type: str
            choices:
              - original_ts
              - received_ts
        - name: table_primary_key_alias
          display: Primary Key Name
          description: |
            The primary key column name in the target table.
          required: false
          value: ts
          hint:
            type: str

groups:
  - name: Connection
    display_order: 1
    description: Configuration used in OPC connection
    params:
      - name: connect_timeout
        display: Connect Timeout
        description: |-
          Timeout for connect to endpoint in seconds
        placeholder: 10
        value: 10
        hint:
          type: integer
          min: 1
          max: 60

      - name: request_timeout
        display: Request Timeout
        hint:
          type: integer
          min: 1
          max: 60
        description: Timeout for a request to endpoint in seconds
        placeholder: 10
        value: 10

  - name: Collect
    display_order: 2
    description: Configurations for collecting data from OPC
    params:
      - name: interval
        display: Collect interval
        description: |-
          Collect data interval in second
        hint:
          type: integer
          min: 1
          max: 60
        value: 1

advanced:
  name: Advanced Options
  collapsible: true
  description: |
    Advanced options including read/write concurrency, collection options, performance tuning, etc. Users can leave
    these options as default to use the recommended settings.
  params:
    - name: log_level
      display: Log Level
      description: Adjust the log level of the data source as required. This parameter does not always take effect.
      value: info
      hint:
        type: str
        choices:
          - error
          - warn
          - info
          - debug
          - trace
    - name: write_concurrency
      display: Write Concurrency
      description: |
        The number of concurrent write requests. The default value is automatically set by collector. If the data source is slow to respond, you can increase this value appropriately.
      value: 0
      hint:
        type: integer
        min: 0
        max: 128
    - name: batch_size
      display: Batch Size
      description: |
        The number of data points to be written in a single request. The default value is 1000. If the data source is slow to respond, you can reduce this value appropriately.
      value: 1000
      hint:
        type: integer
        min: 1
        max: 10000
    - name: batch_timeout
      display: Batch Timeout
      description: |
        The maximum time(in seconds) to wait before sending a batch of data points. The default value is 1s. If the data source is slow to respond, you can increase this value appropriately.
      value: 1
      hint:
        type: integer
        min: 1
        max: 60
    - name: keep_raw_data
      display: Keep Raw Data
      description: |
        Whether to keep the raw data. If enabled, the raw data will be stored.
      hint:
        type: bool
    - name: keep_raw_data_days
      display: Max Keep Days
      description: |
        The number of days to keep the raw data. The default value is 1 day.
      value: 1
      requires: keep_raw_data
      hint:
        type: integer
        min: 1
        max: 365

    - name: keep_raw_data_dir
      display: Raw Data Directory
      description: |
        The directory to store the raw data. The default value is `$DATA_DIR/tasks/:id/rawdata/`.
      requires: keep_raw_data
      placeholder: $DATA_DIR/tasks/:id/rawdata/
      hint:
        type: str
