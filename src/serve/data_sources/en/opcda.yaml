---
id: opcda
name: OPC-DA
description: |
  OPC is one of interoperability standard for the secure and  
  reliable exchange of data in the industrial automation space  
  and in other industries.

  OPC DA (Data Access) is a classic COM-based specification that  
  works only on Windows.
  OPC DA is widely used even though it isn't the newest and most  
  efficient data communication specification out there. This is  
  mainly because of older devices that only support the OPC DA.

  For more about OPC DA we introduce you to read the [OPC  
  Foundation site](https://opcfoundation.org/), and some useful blogs, such as

  1. [What is OPC](https://opcfoundation.org/about/what-is-opc/)
  2. [What is OPC DA](https://plcynergy.com/opc-da/),

  taosX could pull data from OPC server by a OPC 
  connector plugin.

  Check the help message in each part to see the details.
type: uri

options:
  endpoint:
    display: Server endpoint
    required: true
    description: |
      OPC server endpoint, such as `Matrikon.OPC.Simulation.1`.
    placeholder: Matrikon.OPC.Simulation.1

strict: false

datasets:
  name: Data Sets
  description: Data points in OPC server to collect.
  categories:
  - category: tags
    display: DA Tags
    description: A OPC DA tags list.
    target:
      name: da.tags
      description: A OPC DA tags list.
      required: true
      multiple: true
      editable: true
      selectable: true

groups:
  - name: Connection
    display_order: 2
    description: Some configurations used in connecting step.
    params:
      - name: nodes
        display: DA Nodes
        description: A OPC DA node list separated by ','.
        hint:
          type: str
        placeholder: localhost

      - name: connect_timeout
        display: Connect Timeout
        description: |-
          Timeout for connect to endpoint in seconds.
        placeholder: 10
        hint:
          type: integer
          min: 1
          max: 60

      - name: request_timeout
        display: Request Timeout
        hint:
          type: integer
          min: 1
          max: 60
        description: Timeout for a request in seconds.
        placeholder: 10
        
  - name: Table Config
    display_order: 4
    description: | 
      Stable Config

      - **received_time**: time opc collector received<br>
      - **original_time**: time from opc server <br>
      - **value**: point value<br>
      - **status**: point status<br>

    params:
      - name: opc_table_config
        display: OPC Table Config
        required: true
        placeholder: 10
        hint:
          type: json

  - name: Others
    display_order: 3
    description: Other configurations.
    params:
      - name: concurrent
        display: Concurrency
        description: Number of concurrency while collecting.
        hint:
          type: integer
          min: 1
          max: 100
      - name: batch_size
        display: Batch Size
        hint:
          type: integer
          min: 1
          max: 10000
        description: Max batch size for each record batch while reporting to target.
        placeholder: 100
      - name: batch_timeout
        display: Batch Timeout
        hint:
          type: integer
          min: 1
          max: 60
        description: Reporting timeout for a batch in seconds.
        placeholder: 20
      
      - name: debug
        display: Enable Debug Log
        hint:
          type: bool
        description: Set true to enable Debug log
