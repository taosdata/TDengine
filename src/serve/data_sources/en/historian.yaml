---
id: historian
name: AVEVA™ Historian
type: uri
description: |
  AVEVA™ Historian process database integrated with operations control enabling access to your process, alarm, and event history data. Wonderware Historian is now AVEVA Historian.

  TDengine efficiently reads data from the AVEVA™ Historian and writes it to TDengine for historical data migration or real-time data flow into the library.
strict: false
options:
  host:
    display: host
    description: AVEVA™ Historian SQL Server IP address or host name
    placeholder: "127.0.0.1"
    required: true
  port:
    display: port
    description: AVEVA™ Historian SQL Server port
    placeholder: "1433"
    required: false

authentication:
  display: Authentication
  description: Use username and password of AVEVA™ Historian SQL Server
  value: plain
  alternatives:
    - name: plain
      display: Username and Password
      description: Use username and password of AVEVA™ Historian SQL Server
      username:
        display: Username
        placeholder: aaAdmin
        required: true
      password:
        display: Password
        placeholder: password
        required: true

groups:
  - name: Collect
    display_order: 1
    description: Configure Data Collection Task
    required: false
    params:
      - name: mode
        display: Collection Mode
        description: >
          Collection mode. The optional values are `synchronize` and `migrate`.
        required: true
        placeholder: synchronize
        value: synchronize
        hint:
          type: str
          choices:
            - synchronize
            - migrate
      - name: table
        display: Table
        description: >
          Retrieves database tables in historian, with historical data in Runtime.dbo.History and real-time data in Runtime.dbo.Live.
        required: true
        placeholder: Runtime.dbo.History
        hint:
          type: str
          choices:
            - Runtime.dbo.History
            - Runtime.dbo.Live
      - name: tags
        display: Tags
        description: >
          tags to be migrated/synchronized. `*` indicates that all tags.
        required: false
        placeholder: "*"
        value: "*"
        hint:
          type: str
      - name: beginDateTime
        display: Begin Time
        description: The start time of the task is in rfc3339 format.
        required: true
        placeholder: e.g., 2023-01-01T00:00:00.000Z
        hint:
          type: time
      - name: endDateTime
        display: End Time
        description: The end time of the task is in rfc3339 format.
        required: false
        placeholder: e.g., 2023-01-01T00:00:00.000Z
        hint:
          type: time
      - name: retrieveInterval
        display: Retrieve Interval
        description: Pull interval for real-time data synchronization.
        required: false
        placeholder: 1 day
        value: 1 day
        hint:
          type: str
      - name: timeWindow
        display: Time Window
        description: Time window for historical data synchronization.
        required: false
        placeholder: 1 hour
        value: 1 hour
        hint:
          type: str
      - name: tolerance
        display: Tolerance
        description: The maximum time limit for tolerating out-of-order data delay.
        required: false
        placeholder: 0 ms
        value: 0 ms
        hint:
          type: str

parser:
  display: Data Mapping
  description: |
    Historian source, when synchronizing/migrating the Runtime.dbo.History table, uploads the following fields:<br>
    
    - **DateTime**: The timestamp of the returned value.<br>
    - **TagName**: The unique name of the tag.<br>
    - **Value**: The value of the tag at the timestamp. The value is always NULL for string tags.<br>
    - **vValue**: The value of the analog, discrete, or string tag stored as a sql_variant.<br>
    - **Quality**: The basic data quality indicator associated with the data value.<br>
    - **QualityDetail**: An internal representation of data quality.<br>
    - **wwTagKey**: The unique numerical identifier of a tag.<br>
    - **wwResolution**: The sampling rate, in milliseconds, for retrieving the data in cyclic mode.<br>
    - **StartDateTime**: Start time of the retrieval cycle for which this row is returned.<br>
    - **SourceTag**: The name of the source tag for a replicated tag at the time this point was stored.<br>
    - **SourceServer**: The name of the server for this replicated tag at the time this point was stored.<br>
    
    when synchronizing/migrating the Runtime.dbo.Live table, uploads the following fields:<br>
    
    - **DateTime**: The timestamp of the returned value.<br>
    - **TagName**: The unique name of the tag.<br>
    - **Value**: The value of the tag at the timestamp. The value is always NULL for string tags.<br>
    - **vValue**: The value of the analog, discrete, or string tag stored as a sql_variant.<br>
    - **Quality**: The basic data quality indicator associated with the data value.<br>
    - **QualityDetail**: An internal representation of data quality.<br>
    - **OPCQuality**: The quality value received from the data source.<br>
    - **wwTagKey**: The unique numerical identifier of a tag.<br>
    - **SourceTag**: The name of the source tag for a replicated tag at the time this point was stored.<br>
    - **SourceServer**: The name of the server for this replicated tag at the time this point was stored.<br>
    
    taosX could let users to specify the data model in the database, for example, the table name pattern <br>
    and stable name pattern, field names as tags or field names as columns.

  fields:
    - name: DateTime
      description: The timestamp of the returned value.
      type: timestamp
    - name: TagName
      description: The unique name of the tag.
      type: varchar
    - name: Value
      description: The value of the tag at the timestamp. The value is always NULL for string tags.
      type: double
    - name: vValue
      description: The value of the analog, discrete, or string tag stored as a sql_variant.
      type: varchar
    - name: Quality
      description: The basic data quality indicator associated with the data value.
      type: int
    - name: QualityDetail
      description: An internal representation of data quality.
      type: int
    - name: OPCQuality
      description: The quality value received from the data source.
      type: int
    - name: wwTagKey
      description: The unique numerical identifier of a tag.
      type: int
    - name: wwResolution
      description: The sampling rate, in milliseconds, for retrieving the data in cyclic mode.
      type: int
    - name: StartDateTime
      description: Start time of the retrieval cycle for which this row is returned.
      type: timestamp
    - name: SourceTag
      description: The name of the source tag for a replicated tag at the time this point was stored.
      type: varchar
    - name: SourceServer
      description: The name of the server for this replicated tag at the time this point was stored.
      type: varchar
  required: true