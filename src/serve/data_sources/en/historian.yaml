---
id: avevaHistorian
name: AVEVA Historian
type: uri
description: |
  AVEVA Historian process database integrated with operations control enabling access to your process, alarm, and event history data. Wonderware Historian is now AVEVA Historian.
  
  TDengine efficiently reads data from the AVEVA Historian and writes it to TDengine for historical data migration or real-time data synchronization.
strict: false

options:
  host:
    display: host
    description: AVEVA Historian SQL Server IP address or host name
    placeholder: "127.0.0.1"
    required: true
  port:
    display: port
    description: AVEVA Historian SQL Server port
    placeholder: "1433"
    required: false

authentication:
  display: Authentication
  description: Use username and password of AVEVA Historian SQL Server
  value: plain
  alternatives:
    - name: plain
      display: Username and Password
      description: Use username and password of AVEVA Historian SQL Server
      username:
        display: Username
        placeholder: aaAdmin
        required: true
      password:
        display: Password
        placeholder: password
        required: true

groups:
  - name: Collect
    display_order: 1
    description: Configure Data Collection Task
    required: false
    params:
      - name: mode
        display: Collection Mode
        description: >
          Collection mode. The optional values are `synchronize` and `migrate`.
        required: true
        placeholder: synchronize
        value: synchronize
        hint:
          type: str
          choices:
            - synchronize
            - migrate
      - name: table
        display: Table
        description: >
          Retrieves database tables in historian, with historical data in Runtime.dbo.History and real-time data in Runtime.dbo.Live.
        required: true
        placeholder: Runtime.dbo.History
        hint:
          type: str
          choices:
            - Runtime.dbo.History
            - Runtime.dbo.Live
      - name: tags
        display: Tags
        description: >
          tags to be migrated/synchronized. `*` indicates that all tags.
        required: false
        placeholder: "*"
        value: "*"
        hint:
          type: str
      - name: tagListSize
        display: Tag List Size
        description: >
          When `table` is `Runtime.dbo.History` and TagName in `tags` exceeds the `tagListSize`, tags are divided according to each group of `tagListSize`.
          The `tagListSize` is used to partition TagName to improve query efficiency during data migration/synchronization. 
          The default value of `tagListSize` is 10.
        required: false
        placeholder: 10
        value: 10
        hint:
          type: integer
          min: 1
          max: 1000
      - name: beginDateTime
        display: Begin Time
        description: The start time of the task is in rfc3339 format.
        required: true
        placeholder: e.g., 2023-01-01T00:00:00.000Z
        hint:
          type: time
      - name: endDateTime
        display: End Time
        description: The end time of the task is in rfc3339 format.
        required: false
        placeholder: e.g., 2023-01-01T00:00:00.000Z
        hint:
          type: time
      - name: timeWindow
        display: Time Window
        description: Time window for historical data migration.
        required: false
        placeholder: 1 day
        value: 1 day
        hint:
          type: str
      - name: retrieveInterval
        display: Retrieve Interval
        description: Pull interval for real-time data synchronization.
        required: false
        placeholder: 10s
        value: 10s
        hint:
          type: str
      - name: tolerance
        display: Tolerance
        description: The maximum time limit for tolerating out-of-order data delay.
        required: false
        placeholder: 0 ms
        value: 0 ms
        hint:
          type: str

parser:
  display: Payload Transformation
  description: |
    taosX could let users to specify the data model in the database, for example, the table name pattern <br>
    and stable name pattern, field names as tags or field names as columns.
  fields:
    - name: DateTime
      description: The timestamp of the returned value.
      type: timestamp
    - name: TagName
      description: The unique name of the tag.
      type: varchar
    - name: Value
      description: The value of the tag at the timestamp. The value is always NULL for string tags.
      type: double
    - name: vValue
      description: The value of the analog, discrete, or string tag stored as a sql_variant.
      type: varchar
    - name: Quality
      description: The basic data quality indicator associated with the data value.
      type: int
    - name: QualityDetail
      description: An internal representation of data quality.
      type: int
    - name: OPCQuality
      description: The quality value received from the data source.
      type: int
    - name: wwTagKey
      description: The unique numerical identifier of a tag.
      type: int
    - name: wwResolution
      description: The sampling rate, in milliseconds, for retrieving the data in cyclic mode.
      type: int
    - name: StartDateTime
      description: Start time of the retrieval cycle for which this row is returned.
      type: timestamp
    - name: SourceTag
      description: The name of the source tag for a replicated tag at the time this point was stored.
      type: varchar
    - name: SourceServer
      description: The name of the server for this replicated tag at the time this point was stored.
      type: varchar
  required: true

advanced:
  name: Advanced Options
  collapsible: true
  description: |
    Advanced options including read/write concurrency, collection options, performance tuning, etc. Users can leave
    these options as default to use the recommended settings.
  params:
    - name: read_concurrency
      display: Read Concurrency
      description: |
        The number of concurrent read requests. The default value is automatically set by collector. If the data source is slow to respond, you can increase this value appropriately.
      value: 0
      hint:
        type: integer
        min: 0
        max: 1000
    - name: batch_size
      display: Batch Size
      description: |
        The number of data points to be written in a single request. The default value is 1000. If the data source is slow to respond, you can reduce this value appropriately.
      value: 10000
      hint:
        type: integer
        min: 1
        max: 100000
    - name: keep_raw_data
      display: Keep Raw Data
      description: |
        Whether to keep the raw data. If enabled, the raw data will be stored.
      hint:
        type: bool
    - name: keep_raw_data_days
      display: Max Keep Days
      description: |
        The number of days to keep the raw data. The default value is 1 day.
      value: 1
      requires: keep_raw_data
      hint:
        type: integer
        min: 1
        max: 365
    - name: keep_raw_data_dir
      display: Raw Data Directory
      description: |
        The directory to store the raw data. The default value is `$DATA_DIR/tasks/:id/rawdata/`.
      requires: keep_raw_data
      placeholder: $DATA_DIR/tasks/:id/rawdata/
      hint:
        type: str
