---
id: kafka
name: Kafka
type: uri
description: |
  Apache Kafka is an open-source distributed streaming system used for stream processing, real-time data pipelines, and data integration at scale.
  TDengine can efficiently read the data from Kafka and write to TDengine to achieve historical data migration or real-time data streaming.
strict: false
options:
  endpoint:
    display: bootstrap-servers
    description: |-
      kafka bootstrap-servers.
      If using an Agent, this address must be accessible from the Agent. If not using an Agent, this address must be accessible from the TDengine system.
    placeholder: 127.0.0.1:9092
    required: true
groups:
  - name: Enable SSL
    display_order: 0
    description: Use self-signed certificate file and private key.
    collapsible: true
    params:
      - name: cert
        display: Client certificate file
        description: Client certificate file.
        required: true
        hint:
          type: file
      - name: cert_key
        display: Client key file
        description: Client key file.
        required: true
        hint:
          type: file
  - name: Consumer
    display_order: 1
    description: Configure the data migration task
    required: false
    params:
      - name: timeout
        display: Timeout
        description: >
          Specifies the timeout of the Kafka Source. When no data is consumed from Kafka, the data migration task will exit after timeout.
          The default value is 500 ms. When use `timeout=never`, taosx will wait for a usable message forever and never stop the subscription until any error caused.
        placeholder: 500
        required: false
        hint:
          type: str
      - name: group
        display: Group
        description: >
          Specifies the group on whose behalf to maintain consumed message offsets.

          The group is allowed to be the empty string, in which case the resulting consumer will be group-less. e.g. `my_group`
        placeholder: "my_group"
        required: false
        hint:
          type: str
      - name: topics
        display: Topics
        description: >
          Specifies one topic or several topics to consume.

          All of the available partitions of the identified topic will be consumed unless override when the topic_partitions is specified. e.g. topics=tp1,tp2

          At least one of "Topics" and "Topic Partitions" must be specified to assign topic to the consumer.
        placeholder: "tp1,tp2"
        required: false
        hint:
          type: str
      - name: topic_partitions
        display: Topic with Partitions
        description: >
          Explicitly specifies topic partitions to consume.

          Only the specified partitions for the identified topic will be consumed. e.g. `tp1,tp2:2,tp3:0..9`
        placeholder: "tp1,tp2:2,tp3:0..9"
        required: false
        hint:
          type: str
      - name: fallback_offset
        display: Fallback Offset
        description: >
          Possible values when querying a topic’s offset.

          * Earliest: Receive the earliest available offset.
          * Latest: Receive the latest offset.
          * ByTime: Used to ask for all messages before a certain time (ms); unix timestamp in milliseconds.

          default is Earliest.
        placeholder: Earliest
        required: false
        hint:
          type: str
          choices:
            - Earliest
            - Latest
            - ByTime
        value: Earliest
      - name: fetch_max_wait_time
        display: Maximum time to wait for data
        description: >
          Sets the maximum time in milliseconds to wait for insufficient data to become available when fetching messages.(e.g. fetch_max_wait_time=500ms)
          
          default is 100ms.
        placeholder: 100ms
        required: false
        hint:
          type: str
      - name: fetch_min_bytes
        display: Minimum bytes to wait for data
        description: >
          Sets the minimum number of bytes of available data to wait for as long as specified by KafkaClient::set_fetch_max_wait_time when fetching messages.

          By setting higher values in combination with the timeout the consumer can tune for throughput and trade a little additional latency for reading only large chunks of data (e.g. setting MaxWaitTime to 100 ms and setting MinBytes to 64k would allow the server to wait up to 100ms to try to accumulate 64k of data before responding).
          
          default is 4096.
        placeholder: 4096
        required: false
        hint:
          type: integer
          min: 0
          max: 2147483647
      - name: fetch_max_bytes_per_partition
        display: Maximum bytes to fetch per partition
        description: >
          Sets the default maximum number of bytes to obtain from a single kafka partition when fetching messages.

          This basically determines the maximum message size this client will be able to fetch. If a topic partition contains a message larger than this specified number of bytes, the server will not deliver it.

          Note that this setting is related to a single partition. The overall potential data size in a fetch messages response will thus be determined by the number of partitions in the fetch messages request times this “max bytes per partitions.”

          This client will use this setting by default for all queried partitions, however, fetch_messages does allow you to override this setting for a particular partition being queried.
          
          default is 1024 * 1024.
        placeholder: 1048576
        required: false
        hint:
          type: integer
          min: 0
          max: 2147483647
      - name: fetch_crc_validation
        display: CRC Validation
        description: >
          Specifies whether the to perform CRC validation on fetched messages.

          This ensures detection of on-the-wire or on-disk corruption to fetched messages. This check adds some overhead, so it may be disabled in cases seeking extreme performance.
          
          default is true.
        placeholder: true
        required: false
        hint:
          type: bool
      - name: offset_storage
        display: Offset Storage
        description: >
          Defines the available storage types to utilize when fetching or committing group offsets.

          * Zookeeper：Zookeeper based storage (available as of kafka 0.8.1)
          * Kafka：Kafka based storage (available as of Kafka 0.8.2). This is the preferred method for groups to store their offsets at.

          default is Kafka.
        placeholder: Kafka
        value: Kafka
        required: false
        hint:
          type: str
          choices:
            - Zookeeper
            - Kafka
      - name: retry_max_bytes_limit
        display: Maximum bytes limit when retrying fetch request
        description: >
          Specifies the upper bound of data bytes to allow fetching from a kafka partition when retrying a fetch request due to a too big message in the partition.
          
          default is 0.
        placeholder: 0
        required: false
        hint:
          type: integer
          min: 0
          max: 2147483647
      - name: connection_idle_timeout
        display: Connection idle timeout
        description: >
          Specifies the timeout for idle connections.
          
          default is 540000ms
        placeholder: 540000ms
        required: false
        hint:
          type: str
      - name: client_id
        display: Client ID
        description: >
          Specifies a client_id to be sent along every request to Kafka brokers. 
          
          default is None.
        placeholder: None
        required: false
        hint:
          type: str
parser:
  display: Kafka Message Parser
  description: |
    Kafka will report exactly five fields of data for each data stream:<br>

    - **ts**: the collect timestamp.<br>
    - **topic**: the topic name to subscribe.<br>
    - **partition**: the topic partition.<br>
    - **offset**: the message offset in the topic.<br>
    - **key**: the message offset in the topic.<br>
    - **value**: the data payload of the message.<br>

    taosX could parse the payload with JSON extractor and let users to specify the<br>
    data model in the database, for example, the table name pattern and stable name<br>
    pattern, field names as tags or field names as columns.
  fields:
    - name: ts
      description: Timestamp.
      type: timestamp
    - name: topic
      description: Topic name.
      type: binary
    - name: partition
      description: Topic partition.
      type: int
    - name: offset
      description: Message offset.
      type: bigint
    - name: key
      description: Message key.
      type: binary
    - name: value
      description: Value
      type: binary
  required: true
