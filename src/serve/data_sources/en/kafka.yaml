---
id: kafka
name: Kafka
type: uri
description: |
  Apache Kafka is an open-source distributed streaming system used for stream processing, real-time data pipelines, and data integration at scale.
  TDengine can efficiently read the data from Kafka and write to TDengine to achieve historical data migration or real-time data streaming.
strict: false
options:
  endpoint:
    display: bootstrap-servers
    description: |-
      kafka bootstrap-servers.
      If using an Agent, this address must be accessible from the Agent. If not using an Agent, this address must be accessible from the TDengine system.
    placeholder: 127.0.0.1:9092
    required: true
groups:
  - name: SASL Authentication
    display_order: 1
    description: Simple Authentication and Security Layer.
    collapsible: true
    connection_option: true
    params:
      - name: sasl_mechanism
        display: Mechanism
        description: SASL authentication mechanism.
        required: true
        value: PLAIN
        hint:
          type: str
          choices:
            - PLAIN
            - SCRAM-SHA-256
      - name: sasl_username
        display: Username
        description: The username for SASL authentication mechanism.
        required: true
        hint:
          type: str
      - name: sasl_password
        display: Password
        description: The password for SASL authentication mechanism.
        required: true
        hint:
          type: str
  # - name: Enable SSL
  #   display_order: 2
  #   description: Use self-signed certificate file and private key.
  #   collapsible: true
  #   connection_option: true
  #   params:
  #     - name: ca
  #       display: CA
  #       description: CA file.
  #       required: true
  #       hint:
  #         type: file
  #     - name: cert
  #       display: Client certificate file
  #       description: Client certificate file.
  #       required: true
  #       hint:
  #         type: file
  #     - name: cert_key
  #       display: Client key file
  #       description: Client key file.
  #       required: true
  #       hint:
  #         type: file
  - name: Collect
    display_order: 3
    description: Configurations for collecting data.
    required: false
    connection_option: true
    params:
      - name: timeout
        display: Timeout
        description: >
          Specifies the timeout of the Kafka Source. When no data is consumed from Kafka, the data migration task will exit after timeout. The default value is 500 ms.

          When use `timeout=never`, it will wait for an usable message forever and never stop the subscription until any error caused.
        placeholder: 500
        required: false
        hint:
          type: str
      - name: topics
        display: Topics
        description: >
          Specifies one topic or several topics to consume. e.g. topics=tp1,tp2
        placeholder: "tp1,tp2"
        required: true
        hint:
          type: str
      - name: fallback_offset
        display: Fallback Offset
        description: >
          Possible values when querying a topic’s offset.

          * Earliest: Receive the earliest available offset.
          * Latest: Receive the latest offset.
          * ByTime: Used to ask for all messages before a certain time (ms); unix timestamp in milliseconds.

          default is Earliest.
        required: false
        placeholder: Earliest
        value: Earliest
        hint:
          type: str
          choices:
            - Earliest
            - Latest
            - ByTime
      - name: fetch_max_wait_time
        display: Maximum time to wait for data
        description: >
          Sets the maximum time in milliseconds to wait for insufficient data to become available when fetching messages.(e.g. fetch_max_wait_time=500ms)

          default is 100ms.
        required: false
        placeholder: 100ms
        hint:
          type: str

parser:
  display: Payload Transformation
  description: |
    Kafka will report exactly five fields of data for each data stream:<br>

    - **ts**: the collect timestamp.<br>
    - **topic**: the topic name to subscribe.<br>
    - **partition**: the topic partition.<br>
    - **offset**: the message offset in the topic.<br>
    - **key**: the message offset in the topic.<br>
    - **value**: the data payload of the message.<br>

    taosX could parse the payload with JSON extractor and let users to specify the<br>
    data model in the database, for example, the table name pattern and stable name<br>
    pattern, field names as tags or field names as columns.
  fields:
    - name: ts
      description: Timestamp.
      type: timestamp
    - name: topic
      description: Topic name.
      type: varchar
    - name: partition
      description: Topic partition.
      type: int
    - name: offset
      description: Message offset.
      type: bigint
    - name: key
      description: Message key.
      type: varchar
    - name: value
      description: Value
      type: varchar
  required: true

advanced:
  name: Advanced Options
  collapsible: true
  description: |
    Advanced options including read/write concurrency, collection options, performance tuning, etc. Users can leave
    these options as default to use the recommended settings.
  params:
    - name: read_concurrency
      display: Read Concurrency
      description: |
        The number of concurrent read requests. The default value is automatically set by collector. If the data source is slow to respond, you can increase this value appropriately.
      value: 0
      hint:
        type: integer
        min: 0
        max: 1000
    - name: batch_size
      display: Batch Size
      description: |
        The number of data points to be written in a single request. The default value is 1000. If the data source is slow to respond, you can reduce this value appropriately.
      value: 1000
      hint:
        type: integer
        min: 1
        max: 100000