---
id: kafka
name: Kafka
type: uri
description: |
  Apache Kafka is an open-source distributed event streaming platform used by thousands of companies for high-performance
  data pipelines, streaming analytics, data integration, and mission-critical applications.

  TaosX can efficiently read the data from Kafka and write to TDengine through the Taosx Kafka Source to achieve
  historical data migration or real-time data synchronization.
strict: false
options:
  bootstrap-servers:
    display: bootstrap-servers
    description: kafka bootstrap-servers
    placeholder: "127.0.0.1:9092"
    required: true
groups:
  - name: Enable SSL
    display_order: 0
    description: Use self-signed certificate file and private key.
    collapsible: true
    params:
      - name: cert
        display: Client certificate file
        description: Client certificate file.
        required: true
        hint:
          type: file
      - name: cert_key
        display: Client key file
        description: Client key file.
        required: true
        hint:
          type: file
  - name: Consumer
    display_order: 1
    description: Configure the data migration task
    required: false
    params:
      - name: group
        display: Group
        description: >
          Specifies the group on whose behalf to maintain consumed message offsets.

          The group is allowed to be the empty string, in which case the resulting consumer will be group-less. e.g. `my_group`
        placeholder: ""
        required: false
        hint:
          type: str
      - name: topics
        display: Topics
        description: >
          Specifies one topic or several topics to consume.

          All of the available partitions of the identified topic will be consumed unless override when the topic_partitions is specified. e.g. topics=tp1,tp2

          At least one of "Topics" and "Topic Partitions" must be specified to assign topic to the consumer.
        placeholder:
        hint:
          type: str
      - name: topic_partitions
        display: Topic with Partitions
        description: >
          Explicitly specifies topic partitions to consume.

          Only the specified partitions for the identified topic will be consumed. e.g. `tp1,tp2:2,tp3:0..9`
        placeholder: "tp1,tp2:2,tp3:0..9"
        hint:
          type: str
      - name: fallback_offset
        display: Fallback Offset
        description: >
          Possible values when querying a topic’s offset.

          * Earliest: Receive the earliest available offset.
          * Latest: Receive the latest offset.
          * ByTime: Used to ask for all messages before a certain time (ms); unix timestamp in milliseconds.

          default is Earliest.
        placeholder: Earliest
        required: false
        hint:
          type: str
        value: Earliest
      - name: offset_storage
        display: Offset Storage
        description: >
          Defines the available storage types to utilize when fetching or committing group offsets.

          * Zookeeper：Zookeeper based storage (available as of kafka 0.8.1)
          * Kafka：Kafka based storage (available as of Kafka 0.8.2). This is the preferred method for groups to store their offsets at.

          default is Kafka.
        placeholder: Kafka
        required: false
        hint:
          type: str
