---
id: opentsdb
type: uri
name: OpenTSDB
description: |
  OpenTSDB is a real-time monitoring information collection and display platform based on the HBase system.

  TDengine can efficiently read the data in OpenTSDB and write it to TDengine through the OpenTSDB connector to achieve historical data migration or real-time data synchronization.
strict: false
protocol:
  display: Protocol
  description: The protocol of the OpenTSDB connection, please choose according to the actual situation, otherwise the task cannot run normally.
  placeholder: http
  value: http
  choices:
    - name: http
      display: HTTP Protocol
    - name: https
      display: HTTPS Protocol
options:
  host:
    display: IP address
    description: |-
      The access address of OpenTSDB.
      If using an Agent, this address must be accessible from the Agent. If not using an Agent, this address must be accessible from the TDengine system.

    placeholder: 127.0.0.1
    required: true
  port:
    display: Port
    description: The port of OpenTSDB
    placeholder: "4242"
    required: true
groups:
  - name: task
    display: Task
    display_order: 1
    description: Configure the data migration task
    params:
      - name: metrics
        display: Metrics
        description: Metrics in OpenTSDB, select one or more specified metrics to migrate, if empty, migrate all.
        placeholder: Please select the Metrics
        multiple: true
        editable: true
        hint:
          type: str
          choices:
            - "--NONE--"
      - name: beginTime
        display: Data Begin Time
        description: The starting time of the data, and the task only reads data from the specified time and after.
        placeholder: YYYY-MM-DD HH:mm:ss
        hint: time
        required: true
      - name: endTime
        display: Data End Time
        description: The stopping time of the data, and the task only reads the data at the specified time and before, If a future time is specified, the task will continue until the deadline is reached. If not specified, the task will continue until it is manually terminated.
        placeholder: YYYY-MM-DD HH:mm:ss
        hint: time
      - name: readWindow
        display: Time range per read in minutes
        description: The maximum time range every time when retrieving data from OpenTSDB.
        placeholder: Please input the time range
        hint:
          type: integer
          min: 1
          max: 6000
        value: 60
advanced:
  name: Advanced Options
  collapsible: true
  collapsed: true
  description: |
    Advanced options including read/write concurrency, collection options, performance tuning, etc. Users can leave
    these options as default to use the recommended settings.
  params:
    - name: log_level
      display: Log Level
      description: Adjust the log level of the data source as required. This parameter does not always take effect.
      value: info
      hint:
        type: str
        choices:
          - error
          - warn
          - info
          - debug
          - trace
    - name: read_concurrency
      hidden: true
      display: Read Concurrency
      description: |
        The number of concurrent read requests. The default value is automatically set by collector. If the data source is slow to respond, you can increase this value appropriately.
      value: 0
      hint:
        type: integer
        min: 0
        max: 1000
    - name: write_concurrency
      hidden: true
      display: Write Concurrency
      description: |
        The number of concurrent write requests. The default value is automatically set by collector. If the data source is slow to respond, you can increase this value appropriately.
      value: 0
      hint:
        type: integer
        min: 0
        max: 1000
    - name: batch_size
      hidden: true
      display: Batch Size
      description: |
        The number of data points to be written in a single request. The default value is 1000. If the data source is slow to respond, you can reduce this value appropriately.
      value: 1000
      hint:
        type: integer
        min: 1
        max: 10000
    - name: batch_timeout
      hidden: true
      display: Batch Timeout
      description: |
        The maximum time(in milliseconds) to wait before sending a batch of data points. The default value is 1000ms. If the data source is slow to respond, you can increase this value appropriately.
      value: 1000
      hint:
        type: integer
        min: 1
        max: 10000
    - name: keep_raw_data
      hidden: true
      display: Keep Raw Data
      description: |
        Whether to keep the raw data. If enabled, the raw data will be stored.
      hint:
        type: bool
    - name: keep_raw_data_days
      hidden: true
      display: Max Keep Days
      description: |
        The number of days to keep the raw data. The default value is 1 day.
      value: 1
      requires: keep_raw_data
      hint:
        type: integer
        min: 1
        max: 365
    - name: keep_raw_data_dir
      hidden: true
      display: Raw Data Directory
      description: |
        The directory to store the raw data. The default value is `$DATA_DIR/tasks/:id/rawdata/`.
      requires: keep_raw_data
      placeholder: $DATA_DIR/tasks/:id/rawdata/
      hint:
        type: str
