---
id: opentsdb
type: uri
name: OpenTSDB
description: |
  OpenTSDB is a real-time monitoring information collection and display platform based on the HBase system.

  TDengine can efficiently read the data in OpenTSDB and write it to TDengine through the OpenTSDB connector to achieve historical data migration or real-time data synchronization.
strict: false
protocol:
  display: Protocol
  description: The protocol of the OpenTSDB connection, please choose according to the actual situation, otherwise the task cannot run normally.
  placeholder: http
  value: http
  choices:
    - name: http
      display: HTTP Protocol
    - name: https
      display: HTTPS Protocol
options:
  host:
    display: IP address
    description: |-
      The access address of OpenTSDB.
      If using an Agent, this address must be accessible from the Agent. If not using an Agent, this address must be accessible from the TDengine system.

    placeholder: 127.0.0.1
    required: true
  port:
    display: Port
    description: The port of OpenTSDB
    placeholder: "4242"
    required: true
groups:
  - name: task
    display: Task
    display_order: 1
    description: Configure the data migration task
    params:
      - name: metrics
        display: Metrics
        description: Metrics in OpenTSDB, select one or more specified metrics to migrate, if empty, migrate all.
        placeholder: Please select the Metrics
        multiple: true
        editable: true
        hint:
          type: str
          choices:
            - "--NONE--"
      - name: beginTime
        display: Data Begin Time
        description: The starting time of the data, and the task only reads data from the specified time and after.
        placeholder: YYYY-MM-DD HH:mm:ss
        hint: time
        required: true
      - name: endTime
        display: Data End Time
        description: The stopping time of the data, and the task only reads the data at the specified time and before, If a future time is specified, the task will continue until the deadline is reached. If not specified, the task will continue until it is manually terminated.
        placeholder: YYYY-MM-DD HH:mm:ss
        hint: time
      - name: readWindow
        display: Time range per read in minutes
        description: The maximum time range every time when retrieving data from OpenTSDB.
        placeholder: Please input the time range
        hint:
          type: integer
          min: 1
          max: 6000
        value: 60
      - name: delay
        display: Delay in seconds
        description: To migrate the out of order data, TDengine connector always waits for time specified here before reading them.
        placeholder: Please input the delay
        hint:
          type: integer
          min: 1
          max: 30
        value: 10
      - name: maxThread
        display: Maximum Read Threads
        description: Performance related parameters, multiple threads read OpenTSDB data, allows you to adjust the maximum number of read threads based on server performance.
        placeholder: Please input the maximum number of read threads
        hint:
          type: integer
          min: 1
          max: 150
        value: 50
      - name: queueSizeT
        display: Maximum Thread Caches
        description: Performance related parameters, threads are cached in the memory queue, and then started in sequence, allows you to adjust the maximum number of thread caches based on server performance.
        placeholder: Please input the maximum number of thread caches
        hint:
          type: integer
          min: 10
          max: 2000
        value: 1000
      - name: queueSizeD
        display: Maximum Data Caches
        description: Performance related parameters, OpenTSDB datas are cached in the memory queue, and then transmitted downstream, allows you to adjust the maximum number of data caches based on server performance.
        placeholder: Please input the maximum number of data caches
        hint:
          type: integer
          min: 10000
          max: 500000
        value: 200000
      - name: limitSpeed
        display: Transmit Speed Limit
        description: Performance related parameters, to avoid downstream pressure, the transmit speed needs to be limited, allows you to adjust the upper limit of speed based on server performance.
        placeholder: Please input the upper limit of transmit speed
        hint:
          type: integer
          min: 5000
          max: 500000
        value: 100000
