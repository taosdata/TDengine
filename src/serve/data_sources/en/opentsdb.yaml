---
id: opentsdb
type: uri
name: OpenTSDB
description: |
  OpenTSDB is a real-time monitoring information collection and display platform based on the HBase system.

  TaosX can efficiently read the data in OpenTSDB and write it to TDengine through the taosx-opentsdb plugin to achieve historical data migration or real-time data synchronization.
strict: false
protocol:
  display: Protocol
  description: The protocol of the OpenTSDB connection
  choices:
    - name: http
      display: HTTP Protocol
      description: Connect to OpenTSDB using the HTTP protocol
    - name: https
      display: HTTPS Protocol
      description: Connect to OpenTSDB using the HTTPS protocol
options:
  host:
    display: IP address
    description: The access address of OpenTSDB
    placeholder: 127.0.0.1
    required: true
  port:
    display: Port
    description: The port of OpenTSDB
    placeholder: "4242"
    required: true
groups:
  - name: task
    display: Task
    display_order: 1
    description: Configure the data migration task
    params:
      - name: metrics
        display: Metrics
        description: Select one or more specified Metrics to migrate, if empty, migrate all
        placeholder: Please select the Metrics
        multiple: true
        editable: true
        hint:
          type: str
          choices:
            - "--NONE--"
      - name: beginTime
        display: Data Begin Time
        description: Set a data start time
        placeholder: YYYY-MM-DD HH:mm:ss
        hint: time
        required: true
      - name: endTime
        display: Data End Time
        description: Set a data end time, if empty, the latest data will always be transmitted
        placeholder: YYYY-MM-DD HH:mm:ss
        hint: time
      - name: readWindow
        display: Read Window
        description: Select a type of read window(D-Day, H-Hour, M-Minute), if empty, it defaults to "M-Minute"
        placeholder: Please select the type of read window
        value: 'M'
        hint:
          type: str
          choices:
            - D
            - H
            - M
      - name: delay
        display: Delay interval(ms)
        description: When synchronizing real-time data, only synchronize data before the specified interval time to ensure data integrity
        placeholder: Please input the delay interval
        hint:
          type: integer
          min: 1
          max: 30000
        value: 10000
      - name: maxThread
        display: Maximum Read Threads
        description: Multiple threads read OpenTSDB data, allows you to adjust the maximum number of read threads based on server performance.
        placeholder: Please input the maximum number of read threads
        hint:
          type: integer
          min: 1
          max: 150
        value: 50
      - name: queueSizeT
        display: Maximum Thread Caches
        description: Threads are cached in the memory queue, and then started in sequence, allows you to adjust the maximum number of thread caches based on server performance.
        placeholder: Please input the maximum number of thread caches
        hint:
          type: integer
          min: 10
          max: 2000
        value: 1000
      - name: queueSizeD
        display: Maximum Data Caches
        description: OpenTSDB datas are cached in the memory queue, and then transmitted downstream, allows you to adjust the maximum number of data caches based on server performance.
        placeholder: Please input the maximum number of data caches
        hint:
          type: integer
          min: 10000
          max: 500000
        value: 200000
      - name: limitSpeed
        display: Transmit Speed Limit
        description: To avoid downstream pressure, the transmit speed needs to be limited, allows you to adjust the upper limit of speed based on server performance.
        placeholder: Please input the upper limit of transmit speed
        hint:
          type: integer
          min: 5000
          max: 500000
        value: 100000