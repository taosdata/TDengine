---
id: csv
name: CSV
description: |
  导入一个或多个 CSV 文件数据到 TDengine。
type: path
options:
  path:
    required: true
    display: Path
    description: CSV 文件名或文件路径（处理该路径下的所有 CSV 文件）。
    placeholder: "示例: a.csv,b.csv"
strict: true
groups:
  - name: CSV 选项
    display_order: 1
    description: CSV 读取选项
    params:
      # - name: sep
      #   display: 分隔符
      #   hint: str
      - name: skip
        display: 忽略前 N 行
        description: 忽略 CSV 文件的前 N 行。
        value: 0
        hint:
          type: integer
          min: 0

advanced:
  name: 高级选项
  collapsible: true
  description: |
    对数据源性能、日志等其他参数进行调整，可修改以下选项。
  params:
    - name: read_concurrency
      display: 最大读取并发数
      description: |
        数据源连接数或读取线程数限制，当默认参数不满足需要或需要调整资源使用量时修改此参数。
      value: 0
      hint:
        type: integer
        min: 0
        max: 1000
    - name: batch_size
      display: 批次大小
      description: |
        单次发送的最大消息数或行数。
      value: 1000
      hint:
        type: integer
        min: 1
        max: 100000