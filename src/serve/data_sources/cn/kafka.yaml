---
id: kafka
name: Kafka
type: uri
description: |
  Apache Kafka 是一个用于流处理、实时数据管道和大规模数据集成的开源分布式流系统。
  TDengine 可以高效地从 Kafka 读取数据并将其写入 TDengine，以实现历史数据迁移或实时数据流入库。
strict: false
options:
  endpoint:
    display: bootstrap-servers
    description: |
      Kafka Server 地址。
      如果使用了 Agent ，该地址必须能够从 Agent 访问。如果没有使用 Agent, 该地址必须能够从 TDengine 系统所在服务器访问。
    placeholder: 127.0.0.1:9092
    required: true
groups:
  - name: SASL 认证机制
    display_order: 1
    description: 用来认证服务器与客户端的一种认证机制。
    collapsible: true
    connection_option: true
    params:
      - name: sasl_mechanism
        display: 认证机制
        description: SASL 的认证机制
        required: true
        value: PLAIN
        hint:
          type: str
          choices:
            - PLAIN
            - SCRAM-SHA-256
      - name: sasl_username
        display: 用户名
        description: 用于 SASL 认证机制的用户名
        required: true
        hint:
          type: str
      - name: sasl_password
        display: 密码
        description: 用于 SASL 认证机制的密码
        required: true
        hint:
          type: str
  # - name: SSL 证书
  #   display_order: 2
  #   description: 使用证书和私钥建立连接以启用 SSL。
  #   collapsible: true
  #   connection_option: true
  #   params:
  #     - name: ca
  #       display: CA
  #       description: CA 证书文件
  #       required: true
  #       hint:
  #         type: file
  #     - name: cert
  #       display: 客户端证书
  #       description: .cert 文件
  #       required: true
  #       hint:
  #         type: file
  #     - name: cert_key
  #       display: 客户端私钥
  #       description: 私钥文件
  #       required: true
  #       hint:
  #         type: file
  - name: 采集配置
    display_order: 3
    description: 数据采集相关配置项。
    required: false
    connection_option: true
    params:
      - name: timeout
        display: 超时时间
        description: >
          指定 Kafka Source 的超时时间，当从 Kafka 消费不到任何数据，超过 timeout 后，数据采集任务会退出。 默认值是 500 ms。
          当 timeout 设置为 `never` 时，Kafka Source 会一直等待，直到有数据可用，或者发生错误。
        placeholder: 500
        required: false
        hint:
          type: str
      - name: topics
        display: 主题
        description: >
          指定要消费的 Topic。可以配置多个 Topic，Topic 之间使用逗号分隔，例如：`tp1,tp2`。
        placeholder: "tp1,tp2"
        required: true
        hint:
          type: str
      - name: fallback_offset
        display: Offset
        description: >
          Fallback Offset 参数可以指定以下值：

          * `Earliest`：用于请求最早的 offset.
          * `Latest`：用于请求最晚的 offset.
          * `ByTime`：用于请求在特定时间（毫秒）之前的所有消息; 时间戳为毫秒精度。

          默认值为Earliest。
        required: false
        placeholder: Earliest
        value: Earliest
        hint:
          type: str
          choices:
            - Earliest
            - Latest
            - ByTime
      - name: fetch_max_wait_time
        display: 获取数据的最大时长
        description: >
          设置获取消息时等待数据不足的最长时间（以毫秒为单位），默认值为 100ms。
        required: false
        placeholder: 100ms
        hint:
          type: str

parser:
  display: Payload 转换
  description: |
    Kafka 连接器会上传以下六列到服务端：<br>

    - **ts**: 采集时间戳。<br>
    - **topic**: 订阅主题名。<br>
    - **partition**: 当前消息所在的分区 ID。<br>
    - **offset**: 当前消息的偏移量。<br>
    - **key**: 当前消息的 Key。<br>
    - **value**: 当前消息的数据内容。<br>

    taosX 可以使用 JSON 提取器解析数据，并允许用户在数据库中指定数据模型，<br>
    包括，指定表名称和超级表名，设置普通列和标签列等。
  fields:
    - name: ts
      description: 时间戳。
      type: timestamp
    - name: topic
      description: 主题名。
      type: varchar
    - name: partition
      description: 分区 ID。
      type: int
    - name: offset
      description: 偏移。
      type: bigint
    - name: key
      description: 消息 Key。
      type: varchar
    - name: value
      description: 消息体。
      type: varchar
  required: true

advanced:
  name: 高级选项
  collapsible: true
  description: |
    对数据源性能、日志等其他参数进行调整，可修改以下选项。
  params:
    - name: read_concurrency
      display: 最大读取并发数
      description: |
        数据源连接数或读取线程数限制，当默认参数不满足需要或需要调整资源使用量时修改此参数。
      value: 0
      hint:
        type: integer
        min: 0
        max: 1000