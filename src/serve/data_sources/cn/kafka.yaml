---
id: kafka
name: Kafka
type: uri
description: |
  Apache Kafka 是一个用于流处理、实时数据管道和大规模数据集成的开源分布式流系统。
  TDengine 可以高效地从 Kafka 读取数据并将其写入 TDengine，以实现历史数据迁移或实时数据流入库。
strict: false
options:
  endpoint:
    display: bootstrap-servers
    description: |
      Kafka Server 地址。
      如果使用了 Agent ，该地址必须能够从 Agent 访问。如果没有使用 Agent, 该地址必须能够从 TDengine 系统所在服务器访问。
    placeholder: 127.0.0.1:9092
    required: true
groups:
  - name: SSL 证书
    display_order: 1
    description: 使用证书和私钥建立连接以启用 SSL。
    collapsible: true
    params:
      - name: cert
        display: 客户端证书
        description: .cert 文件
        required: true
        hint:
          type: file
      - name: cert_key
        display: 客户端私钥
        description: 私钥文件
        required: true
        hint:
          type: file

  - name: 采集配置
    display_order: 2
    description: 数据采集相关配置项。
    required: false
    params:
      - name: timeout
        display: Timeout
        description: >
          指定 Kafka Source 的超时时间，当从 Kafka 消费不到任何数据，超过 timeout 后，数据采集任务会退出。 默认值是 500 ms。
          当 timeout 设置为 `never` 时，Kafka Source 会一直等待，直到有数据可用，或者发生错误。
        placeholder: 500
        required: false
        hint:
          type: str

      - name: topics
        display: Topics
        description: >
          指定要消费的 Topic。可以配置多个 Topic，Topic 之间使用逗号分隔，例如：`tp1,tp2`。

          "Topics" 参数不是必需的，当配置了 “Topics Partitions” 参数时，可以不配置该参数。
        placeholder: "tp1,tp2"
        required: false
        hint:
          type: str

      - name: fallback_offset
        display: Fallback Offset
        description: >
          Fallback Offset 参数可以指定以下值：

          * `Earliest`：用于请求最早的 offset.
          * `Latest`：用于请求最晚的 offset.
          * `ByTime`：用于请求在特定时间（毫秒）之前的所有消息; 时间戳为毫秒精度。

          默认值为Earliest。。
        required: false
        placeholder: Earliest
        value: Earliest
        hint:
          type: str
          choices:
            - Earliest
            - Latest
            - ByTime

      - name: fetch_max_wait_time
        display: 获取消息时等待数据的最大时长
        description: >
          设置获取消息时等待数据不足的最长时间（以毫秒为单位），默认值为 100ms。
        required: false
        placeholder: 100ms
        hint:
          type: str

parser:
  display: Payload 解析
  description: |
    Kafka 连接器会上传以下六列到服务端：<br>

    - **ts**: 采集时间戳。<br>
    - **topic**: 订阅主题名。<br>
    - **partition**: 当前消息所在的分区 ID。<br>
    - **offset**: 当前消息的偏移量。<br>
    - **key**: 当前消息的 Key。<br>
    - **value**: 当前消息的数据内容。<br>

    taosX 可以使用 JSON 提取器解析数据，并允许用户在数据库中指定数据模型，<br>
    包括，指定表名称和超级表名，设置普通列会标签列等。
  fields:
    - name: ts
      description: 时间戳。
      type: timestamp
    - name: topic
      description: 主题名。
      type: nchar
    - name: partition
      description: 分区 ID。
      type: int
    - name: offset
      description: 偏移。
      type: bigint
    - name: key
      description: 消息 Key。
      type: binary
    - name: value
      description: 消息体。
      type: binary
  required: true
