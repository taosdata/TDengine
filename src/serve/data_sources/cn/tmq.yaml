---
id: tmq
name: TDengine 订阅
description: |
  使用 TMQ 进行 TDengine 指定从数据库或超级表的订阅。

  支持使用原生连接或 WebSocket 连接（使用 HTTP 或 HTTPS 协议）。默认使用原生连接。

  使用 `database` 方式指定数据库名，或 `database.table` 方式指定订阅一个超级表或普通表。
type: uri
protocol:
  display: 连接协议
  description:
    选择使用何种方式连接到 TDengine 数据源。默认为原生连接。
  choices:
    - name: "--"
      display: 原生连接
      description: 使用 TDengine 提供的 C 客户端进行连接。
    - name: ws
      display: WS
      description: 使用 HTTP 协议的 WebSocket 连接。
    - name: wss
      display: WSS
      description: 使用 HTTPS 协议的 WebSocket 连接。
options:
  host:
    display: 服务器
    description: |
      TDengine FQDN，可以使用域名或 IP 地址。
    placeholder: server
  port:
    display: 端口
    description: TDengine 服务端口，留空以为各连接方式使用默认端口。
    placeholder: auto
  subject:
    required: true
    display: 主题
    description: 可以订阅一个或多个数据库，或超级表或普通表，也可以是一个已创建的 Topic。
    placeholder: "示例: db1,db1.stb1,topic1"
authentication:
  display: 认证
  description: 使用用户名密码或令牌进行认证。
  value: plain
  alternatives:
    - name: plain
      display: 用户名密码
      description: 使用用户名和密码进行访问。
      username:
        display: 用户名
        description: TDengine 用户名，默认使用 `root`。
        placeholder: root
      password:
        display: Password
        description: TDengine 密码，默认为 `taosdata`。
        placeholder: taosdata
    - name: token
      display: 令牌认证
      description: 使用云服务令牌进行认证。
      params:
        - name: token
          display: 令牌
          description: 云服务令牌。
strict: false
groups:
  - name: 订阅设置
    display_order: 2
    description: TDengine TMQ 订阅设置。
    params:
      - name: auto.offset.reset
        display: 订阅初始位置
        description: |-
          订阅初始位置。有以下可选项：

          - *earliest*: 从最早的数据开始订阅。
          - *latest*: 从最新的数据开始订阅。
        hint:
          type: str
          choices:
            - earliest
            - latest
      - name: timeout
        display: 超时
        hint:
          type: timeout
        description: |
          订阅超时间隔。可配置为：

          - `never`: 表示无超时时间，持续进行订阅。
          - 指定超时时间：`5s`, `1m` 等。
        placeholder: 5s
