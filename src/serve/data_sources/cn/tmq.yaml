---
id: tmq
name: TDengine 数据订阅
description: |
  使用 TMQ 进行 TDengine 指定从数据库或超级表的订阅。

  支持使用原生连接或 WebSocket 连接（使用 HTTP 或 HTTPS 协议）。默认使用原生连接。

  使用 `database` 方式指定数据库名，或 `database.table` 方式指定订阅一个超级表或普通表。
type: uri
options:
  endpoint:
    display: Topic DSN
    required: true
    description: |
      请登录 TDengine 云服务或打开企业版的 Explorer, 点击`数据订阅`，你将看到主题列表，复制主题对应的 DSN 到这里即可。
    placeholder: "Topic 示例: tmq+ws://root:taosdata@localhost:6041/topic"

strict: false
groups:
  - name: 订阅设置
    display_order: 2
    description: TDengine TMQ 订阅设置。
    params:
      - name: auto.offset.reset
        display: 订阅初始位置
        description: |
          订阅初始位置定义了拉取数据范围。
          有以下可选项：
          - *earliest*: 相当于拉取全量数据，包括新增的数据；
          - *latest*: 从最新的数据开始订阅。
        value: earliest
        hint:
          type: str
          choices:
            - earliest
            - latest
      - name: group.id
        display: 订阅组 ID
        description: |
          订阅组 ID 是用于标识一个订阅组的字符串，最大长度为 192。同一个订阅组内的订阅者共享消费进度。不指定情况下将使用随机生成的 group ID。
        hint:
          type: str
      - name: client.id
        display: 客户端 ID
        required: true
        description: |
          客户端 ID 是一个用于标识客户端的字符串，最大长度为 192。
        hint:
          type: str
      - name: timeout
        display: 超时
        hint:
          type: timeout
        description: |
          超时时间范围内没有新增数据，同步任务将自动结束。
          可配置为：
          - `never`: 表示无超时时间，持续进行订阅。
          - 指定超时时间：`5s`, `1m` 等。
        placeholder: 5s
      - name: experimental.snapshot.enable
        display: 同步已落盘数据
        description: |
          如启用，可以同步已经落盘到 TSDB 时序数据存储文件中（即不在 WAL 中）的数据。如关闭，则只同步尚未落盘（即保存在 WAL 中）的数据。
        hint:
          type: bool
        value: true
      - name: with.meta.drop
        display: 同步删表操作
        description: |
          如启用则会同步删表操作到目标数据库。
        hint:
          type: bool
        value: true
      - name: with.meta.delete
        display: 同步删数据操作
        description: |
          如启用则会同步删数据操作到目标数据库。
        hint:
          type: bool
        value: true
