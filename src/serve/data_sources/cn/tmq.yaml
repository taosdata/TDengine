---
id: tmq
name: TDengine 订阅
description: |
  使用 TMQ 进行 TDengine 指定从数据库或超级表的订阅。

  支持使用原生连接或 WebSocket 连接（使用 HTTP 或 HTTPS 协议）。默认使用原生连接。

  使用 `database` 方式指定数据库名，或 `database.table` 方式指定订阅一个超级表或普通表。
type: uri
options:
  endpoint:
    display: Topic DSN
    required: true
    description: |
      请登录 TDengine 云服务或打开企业版的 Explorer, 点击 Topics，你将看到 Topics 列表，复制 Topic 对应的 DSN 到这里即可。
    placeholder: "Topic 示例: ws://root:taosdata@127.0.0.1:6041/topic1"
authentication:
  display: 认证
  description: 使用用户名密码或令牌进行认证。
  value: plain
  alternatives:
    - name: plain
      display: 用户名密码
      description: 使用用户名和密码进行访问。
      username:
        display: 用户名
        description: TDengine 用户名，默认使用 `root`。
        placeholder: root
        value: root
      password:
        display: Password
        description: TDengine 密码，默认为 `taosdata`。
        placeholder: taosdata
        value: taosdata
    - name: token
      display: 令牌认证
      description: 使用云服务令牌进行认证。
      params:
        - name: token
          display: 令牌
          description: 云服务令牌。
strict: false
groups:
  - name: 订阅设置
    display_order: 2
    description: TDengine TMQ 订阅设置。
    params:
      - name: auto.offset.reset
        display: 订阅初始位置
        description: |-
          订阅初始位置。有以下可选项：

          - *earliest*: 从最早的数据开始订阅。
          - *latest*: 从最新的数据开始订阅。
        hint:
          type: str
          choices:
            - earliest
            - latest
      - name: timeout
        display: 超时
        hint:
          type: timeout
        description: |
          订阅超时间隔。可配置为：

          - `never`: 表示无超时时间，持续进行订阅。
          - 指定超时时间：`5s`, `1m` 等。
        placeholder: 5s
