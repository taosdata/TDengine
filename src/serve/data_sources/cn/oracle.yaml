---
id: oracle
name: Oracle
type: uri
description: |
  Oracle 数据库系统是世界上流行的关系数据库管理系统，系统可移植性好、使用方便、功能强，适用于各类大、中、小微机环境。它是一种高效率的、可靠性好的、适应高吞吐量的数据库方案。
  TDengine 可以高效地从 Oracle 读取数据并将其写入 TDengine，以实现历史数据迁移或实时数据同步。
strict: false

options:
  host:
    display: 服务地址
    description: Oracle 的服务器地址
    placeholder: "127.0.0.1"
    required: true
  port:
    display: 服务端口
    description: Oracle 的端口
    placeholder: "1521"
    required: true
  subject:
    display: 数据库
    description: Oracle 数据库名称
    placeholder: "示例: db1"
    required: true

authentication:
  display: 认证
  description: 使用用户名和密码访问 Oracle 数据库
  value: plain
  alternatives:
    - name: plain
      display: 用户名密码访问
      description: 使用用户名和密码访问 Oracle 数据库
      username:
        display: 用户
        placeholder: username
        required: true
      password:
        display: 密码
        placeholder: password
        required: true

groups:
  - name: SQL 查询
    display_order: 2
    description: 数据采集相关配置项。
    required: true
    params:
      - name: sql
        display: SQL 模板
        description: |
          用于查询的 SQL 语句，SQL 语句中必须包含时间范围条件，且开始时间和结束时间必须成对出现。
          SQL使用不同的占位符表示不同的时间格式要求，具体有以下占位符格式：
          1. `${start}`、`${end}`：表示 RFC3339 格式时间戳，如：2024-03-14T08:00:00+0800
          2. `${start_no_tz}`、`${end_no_tz}`：表示不带时区的 RFC3339 字符串：2024-03-14T08:00:00
          3. `${start_date}`、`${end_date}`：表示仅日期，如：2024-03-14
          4. `${start_time}`、`${end_time}`：表示仅时间，如：08:00:00
        required: true
        placeholder: "SELECT * FROM table WHERE time >= ${start} AND time < ${end}"
        hint:
          type: str
      - name: start
        display: 起始时间
        description: >
          迁移数据的起始时间。
        required: true
        placeholder: 如：2023-01-01 00:00:00
        hint:
          type: time
      - name: end
        display: 结束时间
        description: >
          迁移数据的结束时间，可留空。如果设置，则迁移任务执行到结束时间后，任务完成自动停止；如果留空，则持续同步实时数据，任务不会自动停止。
        required: false
        placeholder: 如：2024-01-01 00:00:00
        hint:
          type: time
      - name: interval
        display: 查询间隔
        description: >
          分段查询数据的时间间隔，默认1天。为了避免查询数据量过大，一次数据同步子任务会使用查询间隔分时间段查询数据。
        required: false
        placeholder: 1d
        hint:
          type: duration
      - name: delay
        display: 延迟时长
        description: >
          实时同步数据场景中，为了避免延迟写入的数据丢失，每次同步任务会读取延迟时长之前的数据。
        required: false
        placeholder: 10s
        hint:
          type: duration

parser:
  display: 数据映射
  description: |
    taosX 允许用户在数据库中指定数据模型，包括：指定表名称和超级表名，设置普通列和标签列等
  fields:
    - name: DateTime
      description: 值对应的时间戳。
      type: timestamp
  required: true

advanced:
  name: 高级选项
  collapsible: true
  description: |
    对数据源性能、日志等其他参数进行调整，可修改以下选项。
  params:
    - name: read_concurrency
      display: 最大读取并发数
      description: |
        数据源连接数或读取线程数限制，当默认参数不满足需要或需要调整资源使用量时修改此参数。
      value: 0
      hint:
        type: integer
        min: 0
        max: 1000
    - name: batch_size
      display: 批次大小
      description: |
        单次发送的最大消息数或行数。
      value: 10000
      hint:
        type: integer
        min: 1
        max: 100000