---
id: opentsdb
type: uri
name: OpenTSDB
description: |
  OpenTSDB 是一个架构在 HBase 系统之上的实时监控信息收集和展示平台。

  TDengine 可以通过 OpenTSDB 连接器高效地读取 OpenTSDB 中的数据，并将其写入 TDengine，以实现历史数据迁移或实时数据同步。
strict: false
protocol:
  display: 连接协议
  description: OpenTSDB 数据库的连接协议，请按实际情况选择，否则无法正常运行任务。
  placeholder: http
  value: http
  choices:
    - name: http
      display: HTTP 协议
    - name: https
      display: HTTPS 协议
  value: http
options:
  host:
    display: 服务器地址
    description: |-
      OpenTSDB 数据库的 IP 地址或域名。
      如果使用了 Agent ，该地址必须能够从 Agent 访问。如果没有使用 Agent, 该地址必须能够从 TDengine 系统所在服务器访问。
    placeholder: 127.0.0.1
    required: true
  port:
    display: 端口
    description: OpenTSDB 数据库的服务端口。
    placeholder: "4242"
    required: true
groups:
  - name: task
    display: 任务设置
    display_order: 1
    description: 配置同步任务的数据集、时间范围与性能参数等内容。
    params:
      - name: metrics
        display: 物理量 Metrics
        description: OpenTSDB 中的物理量，可以指定多个需要同步的 Metrics，未指定则同步数据库中的全部数据。
        placeholder: 请选择 Metrics
        multiple: true
        editable: true
        hint:
          type: str
          choices:
            - "--NONE--"
      - name: beginTime
        display: 起始时间
        description: 数据的起始时间，同步任务仅读取该指定时间及之后的数据。
        placeholder: YYYY-MM-DD HH:mm:ss
        hint: time
        required: true
      - name: endTime
        display: 结束时间
        description: 数据的截止时间，同步任务仅读取该指定时间及之前的数据，如果指定未来时间，任务将持续进行直至到达截止时间，如果未指定，任务将持续进行直至人为结束。
        placeholder: YYYY-MM-DD HH:mm:ss
        hint: time
      - name: readWindow
        display: 每次读取的时间范围（分钟）
        description: 每次从 OpenTSDB 读取数据时，最大的时间范围。
        placeholder: 请输入读取时间范围
        hint:
          type: integer
          min: 1
          max: 6000
        value: 60
      - name: delay
        display: 延迟（秒）
        description: 为了消除乱序数据的影响，TDengine 总是等待这里指定的时长，然后才读取数据。
        placeholder: 请输入延迟时长
        hint:
          type: integer
          min: 1
          max: 30
        value: 10
      - name: maxThread
        display: 读库线程数量上限
        description: 性能相关参数，程序使用多线程读取 OpenTSDB 数据，请根据服务器性能合理填写读库线程数量上限。
        placeholder: 请输入读库线程数量上限
        hint:
          type: integer
          min: 1
          max: 150
        value: 50
      - name: queueSizeT
        display: 线程缓存数量上限
        description: 性能相关参数，读库线程先缓存到内存队列，再由调度线程依次启动，请根据服务器性能合理填写线程缓存数量上限。
        placeholder: 请输入线程缓存数量上限
        hint:
          type: integer
          min: 10
          max: 2000
        value: 1000
      - name: queueSizeD
        display: 数据缓存数量上限
        description: 性能相关参数，读取 OpenTSDB 数据先缓存到内存队列，再由推送线程向下游传输，请根据服务器性能合理填写数据缓存数量上限。
        placeholder: 请输入数据缓存数量上限
        hint:
          type: integer
          min: 10000
          max: 500000
        value: 200000
      - name: limitSpeed
        display: 传输速度上限
        description: 性能相关参数，数据向下游传输，为避免下游压力过大，需要限制传输速度，请根据服务器性能合理填写速度上限。
        placeholder: 请输入传输速度上限
        hint:
          type: integer
          min: 5000
          max: 500000
        value: 100000