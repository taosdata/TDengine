---
id: opentsdb
type: uri
name: OpenTSDB
description: |
  OpenTSDB 是一个架构在 HBase 系统之上的实时监控信息收集和展示平台。

  TaosX 可以通过 `taosx-opentsdb` 插件高效地读取 OpenTSDB 中的数据，并将其写入 TDengine，以实现历史数据迁移或实时数据同步。
strict: false
protocol:
  display: 连接协议
  description: OpenTSDB 数据库连接的协议
  choices:
    - name: http
      display: HTTP 协议
      description: 使用 HTTP 协议连接 OpenTSDB
    - name: https
      display: HTTPS 协议
      description: 使用 HTTPS 协议连接 OpenTSDB
options:
  host:
    display: 服务器地址
    description: OpenTSDB 服务器 IP 地址或域名
    placeholder: 127.0.0.1
    required: true
  port:
    display: 端口
    description: OpenTSDB 服务器端口。
    placeholder: "4242"
    required: true
groups:
  - name: task
    display: 同步设置
    display_order: 1
    description: 配置同步任务的起始时间和所同步的内容。
    params:
      - name: metrics
        display: 物理量 Metrics
        description: 指定需要同步的 Metrics ，未指定则同步全部。
        placeholder: 请选择 Metrics
        multiple: true
        editable: true
        hint:
          type: str
          choices:
            - "--NONE--"
      - name: beginTime
        display: 起始时间
        description: 同步数据的起始时间戳。
        placeholder: YYYY-MM-DD HH:mm:ss
        hint: time
        required: true
      - name: endTime
        display: 结束时间
        description: 同步数据的结束时间戳，如果未指定，将持续进行数据同步。
        placeholder: YYYY-MM-DD HH:mm:ss
        hint: time
      - name: readWindow
        display: 读取窗口（分钟）
        description: OpenTSDB 查询数据接口需指定时间范围，如果指定范围内数据量极大（建议不超过20万），则 OpenTSDB 服务容易发生故障，如果范围小则查询次数过多，用户需要根据数据密度进行设置。
        placeholder: 请输入读取窗口
        hint:
          type: integer
          min: 1
          max: 6000
        value: 2
      - name: delay
        display: 延迟间隔（毫秒）
        description: 在同步实时数据时，仅同步指定间隔时间之前的数据，以尽量保证数据完整（单位：毫秒）。
        placeholder: 请输入延迟间隔
        hint:
          type: integer
          min: 1
          max: 30000
        value: 10000
      - name: maxThread
        display: 读库线程数量上限
        description: 程序使用多线程读取 OpenTSDB 数据，可根据服务器性能调整读库线程数量上限。
        placeholder: 请输入读库线程数量上限
        hint:
          type: integer
          min: 1
          max: 150
        value: 50
      - name: queueSizeT
        display: 线程缓存数量上限
        description: 读库线程先缓存到内存队列，再由调度线程依次启动，可根据服务器性能调整线程缓存数量上限。
        placeholder: 请输入线程缓存数量上限
        hint:
          type: integer
          min: 10
          max: 2000
        value: 1000
      - name: queueSizeD
        display: 数据缓存数量上限
        description: 读取 OpenTSDB 数据先缓存到内存队列，再由推送线程向下游传输，可根据服务器性能调整数据缓存数量上限。
        placeholder: 请输入数据缓存数量上限
        hint:
          type: integer
          min: 10000
          max: 500000
        value: 200000
      - name: limitSpeed
        display: 传输速度上限
        description: OpenTSDB 数据向下游传输，为避免下游压力，需要限制传输速度，可根据服务器性能调整速度上限。
        placeholder: 请输入传输速度上限
        hint:
          type: integer
          min: 5000
          max: 500000
        value: 100000