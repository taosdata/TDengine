id: opcua
name: OPC-UA
description: |
  OPC 是工业自动化领域和其他行业中安全可靠地交换数据的互操作标准之一。

  OPC UA是经典OPC规范的下一代标准，是一个平台无关的面向服务的架构规范，集成了现有 OPC Classic 规范的所有功能，提供了一条迁移到更安全和可扩展解决方案的路径。

  如果想了解更多关于 OPC UA 的信息，可以阅读OPC Foundation网站和一些有用的博客，例如：
  1. [What is OPC](https://opcfoundation.org/about/what-is-opc/)
  2. [What is OPC UA](https://opcfoundation.org/about/opc-technologies/opc-ua/)

  taosX 使用 OPC 连接器从 OPC 服务器拉取或订阅数据。
type: uri

options:
  endpoint:
    display: 服务地址
    required: true
    description: |
      OPC-UA 服务器端点，如：`127.0.0.1:6666/OPCUA/ServerPath`。
      如果使用了 Agent ，该地址必须能够从 Agent 访问。如果没有使用 Agent, 该地址必须能够从 TDengine 系统所在服务器访问。
    placeholder: 127.0.0.1:6666/OPCUA/ServerPath

strict: false

authentication:
  display: 认证
  description: OPC 可选择使用多种认证方式。
  value: anonymous
  alternatives:
    - name: anonymous
      display: 匿名访问
      description: Logging in anonymously without any configurations (if available).
      value: true
      params: []

    - name: plain
      display: 用户名
      description: 使用用户名和密码访问 OPC 服务器。
      username:
        display: 用户名
        description: OPC 服务登录用户名。
        placeholder: username
        required: true
      password:
        display: 密码
        description: OPC 服务登录密码.
        placeholder: password
        required: true
    - name: certificates
      display: 证书访问
      description: 使用私钥及证书反问 OPC 服务器。
      params:

        - name: security_mode
          display: 安全模式
          description: |
            Security mode（安全模式）是OPC UA协议中用于保护通信安全的一种机制。安全模式定义了如何加密和验证通信数据，以防止未经授权的访问和篡改。

            OPC UA支持以下几种安全模式：
            - **None（无）**: 不进行任何加密或身份验证，通信数据以明文形式传输。这种模式只适用于测试和开发环境，不建议在生产环境中使用。
            - **Sign（签名）**: 使用数字签名对通信数据进行验证，以确保数据的完整性和真实性，但不进行加密。这种模式适用于需要保护数据完整性的场景，如数据采集和监控。
            - **SingAndEncrypt（签名和加密）**: 使用数字签名对通信数据进行验证，并使用加密算法对数据进行加密，以保证数据的完整性、真实性和保密性。这种模式适用于需要保护数据完整性和保密性的场景，如敏感数据的传输和存储。
          hint:
            type: str
            choices:
              - None
              - Sign
              - SignAndEncrypt
        - name: security_policy
          display: 安全策略
          description: |
            Security Policy（安全策略）是OPC UA协议中用于定义安全机制的一种机制。安全策略定义了如何实现安全模式中的加密和验证机制，包括使用的加密算法、密钥长度、数字证书等。

            OPC UA支持以下几种安全策略：
            1. **None**（无）：不进行任何加密或身份验证，通信数据以明文形式传输。这种策略只适用于测试和开发环境，不建议在生产环境中使用。
            2. **Basic128Rsa15**：使用RSA算法和128位的密钥长度对通信数据进行加密和身份验证。这种策略适用于需要保护数据完整性和真实性的场景，如数据采集和监控。
            3. **Basic256**：使用AES算法和256位的密钥长度对通信数据进行加密和身份验证。这种策略适用于需要保护数据完整性和真实性的场景，如数据采集和监控。
            4. **Basic256Sha256**：使用AES算法和256位的密钥长度，并使用SHA-256算法对数字签名进行加密，以保证数据的完整性、真实性和保密性。这种策略适用于需要保护数据完整性和保密性的场景，如敏感数据的传输和存储。

          hint:
            type: str
            choices:
              - None
              - Basic128Rsa15
              - Basic256
              - Basic256Sha256
        - name: certificate
          display: 证书文件内容
          # description: 证书文件。当 security mode or policy isn't "None".
          hint:
            type: file
        - name: private_key
          display: 私钥文件内容
          # description: 私钥文件. Required when security mode or policy isn't "None"
          hint:
            type: file
datasets:
  name: 点位集
  description: OPC 采集数据点位列表。
  value: csv_config_file
  categories:
  - category: csv_config_file
    display: 上传 CSV 配置文件
    description: |
      使用 CSV 文件进行配置。
    target:
      name: csv_config_file
      description:
      required: true
      multiple: true
      editable: true
      selectable: true

  - category: select_all_points
    display: 选择所有点位
    description:
    target:
      name: select_all_points
      description: |
        选择 OPC 服务器上面的所有点位。
      required: true
      multiple: true
      editable: true
      selectable: true
    params:
      - name: table_primary_key
        display: 主键列
        description:
        required: true
        value: original_ts
        hint:
          type: str
          choices:
            - received_ts
            - original_ts
      - name: child_table_expression
        display: 表名称
        description: |
          支持 <child table prefix>_{ns}_{id} 格式，如果 NodeId 中不存在 ns 或 id 将置为空
        required: true
        value: Meter_{ns}_{id}
        hint:
          type: str

groups:
  - name: 连接配置
    display_order: 1
    description: OPC 连接相关配置
    params:
      - name: connect_timeout
        display: 连接超时
        description: |-
          连接超时间隔，单位为：秒 (s)。
        placeholder: 10
        value: 10
        hint:
          type: integer
          min: 1
          max: 60
      - name: request_timeout
        display: 采集超时
        hint:
          type: integer
          min: 1
          max: 60
        description: 数据采集请求超时间隔，单位为：秒 (s)。
        placeholder: 10
        value: 10

  - name: 采集配置
    display_order: 2
    description: 数据采集相关配置项。
    params:
      - name: interval
        display: 采集间隔
        description: |-
          数据点位采集间隔，单位为：秒。
        hint:
          type: integer
          min: 1
          max: 60
        value: 10

      - name: collect_mode
        display: 采集模式
        description: |-
          `observe` 模式（读取点位最新值上报）或 `subscribe`（订阅模式，变更时上报）。默认为 `subscribe`。
        placeholder: subscribe
        hint:
          type: str
          choices:
            - observe
            - subscribe
        value: subscribe


advanced:
  name: 高级选项
  collapsible: true
  collapsed: true
  description: |
    Advanced options including read/write concurrency, collection options, performance tuning, etc. Users can leave
    these options as default to use the recommended settings.
  params:
    - name: log_level
      display: 日志级别
      description: 根据需要调整数据源的日志级别，此参数不总是生效。
      value: info
      hint:
        type: str
        choices:
          - error
          - warn
          - info
          - debug
          - trace

    - name: read_concurrency
      hidden: true
      display: 最大读取并发数
      description: |
        数据源连接数或读取线程数限制，当默认参数不满足需要或需要调整资源使用量时修改此参数。
      value: 0
      hint:
        type: integer
        min: 0
        max: 1000
    - name: write_concurrency
      hidden: true
      display: 最大写入并发数
      description: |
        写入 taosX 的最大并发数限制，当默认参数性能不足时，可增大此参数。
      value: 0
      hint:
        type: integer
        min: 0
        max: 1000
    - name: batch_size
      hidden: true
      display: 批次大小
      description: |
        单次发送的最大消息数或行数。
      value: 1000
      hint:
        type: integer
        min: 1
        max: 10000
    - name: batch_timeout
      hidden: true
      display: 批次延时
      description: |
        单次读取最大延时（单位为毫秒），当超时结束时，只要有数据，即使不满足 Batch Size，也立即发送。
      value: 1
      hint:
        type: integer
        min: 1
        max: 60
    - name: keep_raw_data
      hidden: true
      display: 保存原始数据
      description: |
        是否保存原始数据？
      hint:
        type: bool
    - name: keep_raw_data_days
      hidden: true
      display: 最大保留天数
      description: |
        原始数据最大保存天数，默认 1 天。
      value: 1
      requires: keep_raw_data
      hint:
        type: integer
        min: 1
        max: 365

    - name: keep_raw_data_dir
      hidden: true
      display: 原始数据存储目录
      description: |
        自定义原始数据存储目录，默认存储到系统数据目录下。
      requires: keep_raw_data
      placeholder: $DATA_DIR/tasks/:id/rawdata/
      hint:
        type: str
