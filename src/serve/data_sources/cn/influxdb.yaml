---
id: influxdb
type: uri
name: InfluxDB
description: |
  InfluxDB 是一种流行的开源时间序列数据库，它针对处理大量时间序列数据进行了优化。

  TDengine 可以通过 InfluxDB 连接器高效地读取 InfluxDB 中的数据，并将其写入 TDengine，以实现历史数据迁移或实时数据同步。
strict: false
protocol:
  display: 连接协议
  description: InfluxDB 数据库的连接协议，请按实际情况选择，否则无法正常运行任务。
  choices:
    - name: http
      display: HTTP 协议
    - name: https
      display: HTTPS 协议
options:
  host:
    display: 服务器地址
    description: |-
      InfluxDB 数据库的 IP 地址或域名。
      如果使用了 Agent ，该地址必须能够从 Agent 访问。如果没有使用 Agent, 该地址必须能够从 TDengine 系统所在服务器访问。
    placeholder: 127.0.0.1
    required: true
  port:
    display: 端口
    description: InfluxDB 数据库的服务端口。
    placeholder: "8086"
    required: true
authentication:
  display: 认证
  description: InfluxDB 的鉴权认证。
  value: 2.x
  alternatives:
    - name: 1.x
      display: 1.x 版本
      description: 使用 1.x 版本时，只能使用“用户/密码”进行认证。
      params:
        - name: version
          display: 版本
          description: InfluxDB 数据库的版本，由于版本之间存在接口差异，所以请按实际情况选择。
          placeholder: 请选择 InfluxDB 版本
          hint:
            type: str
            choices:
              - "1.8"
              - "1.7"
          required: true
        - name: username
          display: 用户
          description: InfluxDB 数据库的用户，该用户必须在该组织中拥有读取权限。
          placeholder: 请输入 InfluxDB 用户
          hint: str
          required: true
        - name: password
          display: 密码
          description: InfluxDB 数据库中用户的登陆密码。
          placeholder: 请输入登陆密码
          hint: str
          required: true
    - name: 2.x
      display: 版本 2.x
      description: 使用 2.x 版本时，只能使用“令牌 Token”进行认证。
      value: true
      params:
        - name: version
          display: 版本
          description: InfluxDB 数据库的版本，由于版本之间存在接口差异，所以请按实际情况选择。
          placeholder: 请选择 InfluxDB 版本
          hint:
            type: str
            choices:
              - "2.7"
              - "2.6"
              - "2.5"
              - "2.4"
              - "2.3"
              - "2.2"
              - "2.1"
              - "2.0"
          required: true
        - name: orgId
          display: 组织 ID
          description: InfluxDB 数据库的组织 ID，这是一个由 InfluxDB 生成的十六进制字符串，而不是组织名称，请从 'InfluxDB organization->about' 页面复制并粘贴到这里。
          placeholder: 请输入 InfluxDB 组织 ID
          hint: str
          required: true
        - name: token
          display: 令牌 Token
          description: InfluxDB 数据库的访问令牌，该令牌必须在该组织中拥有读取权限。
          placeholder: 请输入 InfluxDB 令牌
          hint: str
          required: true
groups:
  - name: task
    display: 任务设置
    display_order: 1
    description: 配置同步任务的数据集、时间范围与性能参数等内容。
    params:
      - name: bucket
        display: 桶 Bucket
        description: InfluxDB 数据库中的 Bucket，是存储数据的一个命名空间，每个任务需要指定一个 Bucket。
        placeholder: 请选择 Bucket
        hint:
          type: str
          choices:
            - "--NONE--"
        required: true
      - name: measurements
        display: 测量值 Measurements
        description: Bucket 中的测量值，可以指定多个需要同步的 Measurements，未指定则同步该 Bucket 中的全部数据。
        placeholder: 请选择 Measurements
        multiple: true
        editable: true
        hint:
          type: str
          choices:
            - "--NONE--"
      - name: beginTime
        display: 起始时间
        description: 数据的起始时间，同步任务仅读取该指定时间及之后的数据。
        placeholder: YYYY-MM-DD HH:mm:ss
        hint: time
        required: true
      - name: endTime
        display: 结束时间
        description: 数据的截止时间，同步任务仅读取该指定时间及之前的数据，如果指定未来时间，任务将持续进行直至到达截止时间，如果未指定，任务将持续进行直至人为结束。
        placeholder: YYYY-MM-DD HH:mm:ss
        hint: time
      - name: readWindow
        display: 读取窗口（分钟）
        description: 每次从 InfluxDB 读取数据的最大时间范围，请根据 InfluxDB 中存储数据的特点，合理填写时间窗口长度，建议单次读取的数据不超过20万条记录。
        placeholder: 请输入读取窗口
        hint:
          type: integer
          min: 1
          max: 6000
        value: 2
      - name: delay
        display: 延迟间隔（毫秒）
        description: 性能相关参数，同步实时数据时的延迟间隔，为了消除乱序数据的影响，TDengine 总是等待这里指定的时长，然后才读取数据。此参数仅在同步实时数据时有意义。
        placeholder: 请输入延迟间隔
        hint:
          type: integer
          min: 1
          max: 30000
        value: 10000
      - name: maxThread
        display: 读库线程数量上限
        description: 性能相关参数，程序使用多线程读取 InfluxDB 数据，请根据服务器性能合理填写读库线程数量上限。
        placeholder: 请输入读库线程数量上限
        hint:
          type: integer
          min: 1
          max: 150
        value: 50
      - name: queueSizeT
        display: 线程缓存数量上限
        description: 性能相关参数，读库线程先缓存到内存队列，再由调度线程依次启动，请根据服务器性能合理填写线程缓存数量上限。
        placeholder: 请输入线程缓存数量上限
        hint:
          type: integer
          min: 10
          max: 2000
        value: 1000
      - name: queueSizeD
        display: 数据缓存数量上限
        description: 性能相关参数，读取 InfluxDB 数据先缓存到内存队列，再由推送线程向下游传输，请根据服务器性能合理填写数据缓存数量上限。
        placeholder: 请输入数据缓存数量上限
        hint:
          type: integer
          min: 10000
          max: 500000
        value: 200000
      - name: limitSpeed
        display: 传输速度上限
        description: 性能相关参数，数据向下游传输，为避免下游压力过大，需要限制传输速度，请根据服务器性能合理填写速度上限。
        placeholder: 请输入传输速度上限
        hint:
          type: integer
          min: 5000
          max: 500000
        value: 100000