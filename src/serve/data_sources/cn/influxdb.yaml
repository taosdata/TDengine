---
id: influxdb
type: uri
name: InfluxDB
description: |
  InfluxDB 是一种流行的开源时间序列数据库，它针对处理大量时间序列数据进行了优化。

  TaosX 可以通过 `taosx-influxdb` 插件高效地读取 InfluxDB 中的数据，并将其写入 TDengine，以实现历史数据迁移或实时数据同步。
strict: false
protocol:
  display: 连接协议
  description: InfluxDB 数据库连接的协议
  choices:
    - name: http
      display: HTTP 协议
      description: 使用 HTTP 协议连接 InfluxDB
    - name: https
      display: HTTPS 协议
      description: 使用 HTTPS 协议连接 InfluxDB
options:
  host:
    display: 服务器地址
    description: InfluxDB 服务器 IP 地址或域名
    placeholder: 127.0.0.1
    required: true
  port:
    display: 端口
    description: InfluxDB 服务器端口。
    placeholder: "8086"
    required: true
authentication:
  display: 认证
  description: InfluxDB 的身份认证
  value: 2.x
  alternatives:
    - name: 1.x
      display: 1.x 版本
      description: 使用 1.x 版本时，只能使用“用户/密码”进行认证。
      params:
        - name: version
          display: 版本
          description: 指定数据库的版本。
          placeholder: 请选择 InfluxDB 版本
          hint:
            type: str
            choices:
              - "1.8"
              - "1.7"
          required: true
        - name: username
          display: 用户
          description: 该用户至少在该组织中拥有读取权限。
          placeholder: 请输入 InfluxDB 用户
          hint: str
          required: true
        - name: password
          display: 密码
          description: 用户的登陆密码。
          placeholder: 请输入登陆密码
          hint: str
          required: true
    - name: 2.x
      display: 版本 2.x
      description: 使用 2.x 版本时，只能使用“令牌 Token”进行认证。
      value: true
      params:
        - name: version
          display: 版本
          description: 指定数据库的版本。
          placeholder: 请选择 InfluxDB 版本
          hint:
            type: str
            choices:
              - "2.7"
              - "2.6"
              - "2.5"
              - "2.4"
              - "2.3"
              - "2.2"
              - "2.1"
              - "2.0"
          required: true
        - name: orgId
          display: 组织 ID
          description: 所有的仪表板、任务、存储桶和用户都属于一个组织。
          placeholder: 请输入 InfluxDB 组织 ID
          hint: str
          required: true
        - name: token
          display: 令牌 Token
          description: 该令牌至少在该组织中拥有读取权限。
          placeholder: 请输入 InfluxDB 令牌
          hint: str
          required: true
groups:
  - name: task
    display: 同步设置
    display_order: 1
    description: 配置同步任务的起始时间和所同步的内容。
    params:
      - name: bucket
        display: 桶 Bucket
        description: 指定需要同步的 Bucket 。
        placeholder: 请选择 Bucket
        hint:
          type: str
          choices:
            - "--NONE--"
        required: true
      - name: measurements
        display: 测量值 Measurements
        description: 指定需要同步的 Measurements ，未指定则同步全部。
        placeholder: 请选择 Measurements
        multiple: true
        editable: true
        hint:
          type: str
          choices:
            - "--NONE--"
      - name: beginTime
        display: 起始时间
        description: 同步数据的起始时间戳。
        placeholder: YYYY-MM-DD HH:mm:ss
        hint: time
        required: true
      - name: endTime
        display: 结束时间
        description: 同步数据的结束时间戳，如果未指定，将持续进行数据同步。
        placeholder: YYYY-MM-DD HH:mm:ss
        hint: time
      - name: readWindow
        display: 读取窗口（分钟）
        description: InfluxDB 查询数据接口需指定时间范围，如果指定范围内数据量极大（建议不超过20万），则 InfluxDB 服务容易发生故障，如果范围小则查询次数过多，用户需要根据数据密度进行设置。
        placeholder: 请输入读取窗口
        hint:
          type: integer
          min: 1
          max: 6000
        value: 2
      - name: delay
        display: 延迟间隔（毫秒）
        description: 在同步实时数据时，仅同步指定间隔时间之前的数据，以尽量保证数据完整（单位：毫秒）。
        placeholder: 请输入延迟间隔
        hint:
          type: integer
          min: 1
          max: 30000
        value: 10000
      - name: maxThread
        display: 读库线程数量上限
        description: 程序使用多线程读取 InfluxDB 数据，可根据服务器性能调整读库线程数量上限。
        placeholder: 请输入读库线程数量上限
        hint:
          type: integer
          min: 1
          max: 150
        value: 50
      - name: queueSizeT
        display: 线程缓存数量上限
        description: 读库线程先缓存到内存队列，再由调度线程依次启动，可根据服务器性能调整线程缓存数量上限。
        placeholder: 请输入线程缓存数量上限
        hint:
          type: integer
          min: 10
          max: 2000
        value: 1000
      - name: queueSizeD
        display: 数据缓存数量上限
        description: 读取 InfluxDB 数据先缓存到内存队列，再由推送线程向下游传输，可根据服务器性能调整数据缓存数量上限。
        placeholder: 请输入数据缓存数量上限
        hint:
          type: integer
          min: 10000
          max: 500000
        value: 200000
      - name: limitSpeed
        display: 传输速度上限
        description: InfluxDB 数据向下游传输，为避免下游压力，需要限制传输速度，可根据服务器性能调整速度上限。
        placeholder: 请输入传输速度上限
        hint:
          type: integer
          min: 5000
          max: 500000
        value: 100000