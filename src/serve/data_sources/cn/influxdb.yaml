---
id: influxdb
type: uri
name: InfluxDB
description: |
  InfluxDB 是一种流行的开源时间序列数据库，它针对处理大量时间序列数据进行了优化。

  TaosX 可以通过 `taosx-influxdb` 插件高效地读取 influxdb 中的数据，并将其写入TDengine，以实现历史数据迁移或实时数据同步。

strict: false

options:
  host:
    display: 服务器地址
    description: InfluxDB 服务器 IP 地址或域名
    placeholder: 127.0.0.1
    required: true
  port:
    display: 端口
    description: InfluxDB 服务器端口，默认情况下，InfluxDB 监听 8086 端口的 HTTP 请求和 8088 端口的 HTTPS 请求。
    placeholder: "8086"
    required: true
authentication:
  display: 认证
  description: InfluxDB 的身份认证
  value: 2.x
  alternatives:
    - name: 1.x
      display: 1.x 版本
      description: 使用 1.x 版本时，只能使用“用户/密码”进行认证。
      params:
        - name: version
          display: 版本
          description: 指定数据库的版本。
          placeholder: 请选择 InfluxDB 版本
          hint:
            type: str
            choices:
              - "1.8"
              - "1.7"
          required: true
        - name: orgId
          display: 组织 ID
          description: 所有的仪表板、任务、存储桶和用户都属于一个组织。
          placeholder: 请输入 InfluxDB 组织 ID
          hint: str
          required: true
        - name: username
          display: 用户
          description: 该用户至少在该组织中拥有读取权限。
          placeholder: 请输入 InfluxDB 用户
          hint: str
          required: true
        - name: password
          display: 密码
          description: 用户的登陆密码。
          placeholder: 请输入登陆密码
          hint: str
          required: true
    - name: 2.x
      display: 版本 2.x
      description: 使用 2.x 版本时，只能使用“令牌 Token”进行认证。
      value: true
      params:
        - name: version
          display: 版本
          description: 指定数据库的版本。
          placeholder: 请选择 InfluxDB 版本
          hint:
            type: str
            choices:
              - "2.7"
              - "2.6"
              - "2.5"
              - "2.4"
              - "2.3"
              - "2.2"
              - "2.1"
              - "2.0"
          required: true
        - name: orgId
          display: 组织 ID
          description: 所有的仪表板、任务、存储桶和用户都属于一个组织。
          placeholder: 请输入 InfluxDB 组织 ID
          hint: str
          required: true
        - name: token
          display: 令牌 Token
          description: 该令牌至少在该组织中拥有读取权限。
          placeholder: 请输入 InfluxDB 令牌
          hint: str
          required: true
groups:
  - name: task
    display: 同步设置
    display_order: 1
    description: 配置同步任务的起始时间和所同步的内容。
    params:
      - name: beginTime
        display: 起始时间
        description: 同步数据的起始时间戳。
        placeholder: YYYY-MM-DD HH:MM:SS
        hint: time
        required: true
      - name: endTime
        display: 结束时间
        description: 同步数据的结束时间戳，如果未指定，将持续进行数据同步。
        placeholder: YYYY-MM-DD HH:MM:SS
        hint: time
      - name: readWindow
        display: 读取窗口
        description: 选择一个读取窗口类型，如果未指定，默认按分钟
        placeholder: 请选择读取窗口类型
        value: 'M'
        hint:
          type: str
          choices:
            - D
            - H
            - M
      - name: bucket
        display: 桶 Bucket
        description: 指定需要同步的 Bucket 。
        placeholder: 请选择 Bucket
        hint:
          type: str
          choices:
            - "--NONE--"
        required: true
      - name: measurements
        display: 测量值 Measurements
        description: 指定需要同步的 Measurements ，未指定则同步全部。
        placeholder: 请选择 Measurements
        multiple: true
        editable: true
        hint:
          type: str
          choices:
            - "--NONE--"