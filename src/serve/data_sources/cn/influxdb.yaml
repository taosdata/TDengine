---
id: influxdb
type: uri
name: InfluxDB
description: |
  InfluxDB 是一种流行的开源时间序列数据库，它针对处理大量时间序列数据进行了优化。

  TDengine 可以通过 InfluxDB 连接器高效地读取 InfluxDB 中的数据，并将其写入 TDengine，以实现历史数据迁移或实时数据同步。
strict: false
protocol:
  display: 连接协议
  description: InfluxDB 数据库的连接协议，请按实际情况选择，否则无法正常运行任务。
  placeholder: http
  value: http
  choices:
    - name: http
      display: HTTP 协议
    - name: https
      display: HTTPS 协议
options:
  host:
    display: 服务器地址
    description: |-
      InfluxDB 数据库的 IP 地址或域名。
      如果使用了 Agent ，该地址必须能够从 Agent 访问。如果没有使用 Agent, 该地址必须能够从 TDengine 系统所在服务器访问。
    placeholder: 127.0.0.1
    required: true
  port:
    display: 端口
    description: InfluxDB 数据库的服务端口。
    placeholder: "8086"
    required: true
authentication:
  display: 认证
  description: InfluxDB 的鉴权认证。
  value: 2.x
  alternatives:
    - name: 1.x
      display: 1.x 版本
      description: 使用 1.x 版本时，只能使用“用户/密码”进行认证。
      params:
        - name: version
          display: 版本
          description: InfluxDB 数据库的版本，由于版本之间存在接口差异，所以请按实际情况选择。
          placeholder: 请选择 InfluxDB 版本
          hint:
            type: str
            choices:
              - "1.8"
              - "1.7"
          required: true
        - name: username
          display: 用户
          description: InfluxDB 数据库的用户，该用户必须在该组织中拥有读取权限。
          placeholder: 请输入 InfluxDB 用户
          hint: str
          required: true
        - name: password
          display: 密码
          description: InfluxDB 数据库中用户的登陆密码。
          placeholder: 请输入登陆密码
          hint: str
          required: true
    - name: 2.x
      display: 版本 2.x
      description: 使用 2.x 版本时，只能使用“令牌 Token”进行认证。
      value: true
      params:
        - name: version
          display: 版本
          description: InfluxDB 数据库的版本，由于版本之间存在接口差异，所以请按实际情况选择。
          placeholder: 请选择 InfluxDB 版本
          hint:
            type: str
            choices:
              - "2.7"
              - "2.6"
              - "2.5"
              - "2.4"
              - "2.3"
              - "2.2"
              - "2.1"
              - "2.0"
          required: true
        - name: orgId
          display: 组织 ID
          description: InfluxDB 数据库的组织 ID, 它是一个由十六进制字符组成的字符串，而不是组织名称，可以从 InfluxDB 控制台的Organization -> About页面获取。
          placeholder: 请输入 InfluxDB 组织 ID
          hint: str
          required: true
        - name: token
          display: 令牌 Token
          description: InfluxDB 数据库的访问令牌，该令牌必须在该组织中拥有读取权限。
          placeholder: 请输入 InfluxDB 令牌
          hint: str
          required: true
        - name: addDbrp
          display: 添加数据库保留策略
          description: InfluxQL 需要数据库与保留策略（DBRP）的组合才能查询数据，InfluxDB 的 Cloud 版本及某些 2.x 版本需要人工添加这个映射关系，打开这个开关，连接器可以在执行任务时自动添加。
          hint:
            type: bool
          value: false
groups:
  - name: task
    display: 任务设置
    display_order: 1
    description: 配置同步任务的数据集、时间范围与性能参数等内容。
    params:
      - name: bucket
        display: 桶 Bucket
        description: InfluxDB 数据库中的 Bucket，是存储数据的一个命名空间，每个任务需要指定一个 Bucket。
        placeholder: 请选择 Bucket
        hint:
          type: str
          choices:
            - "--NONE--"
        required: true
      - name: measurements
        display: 测量值 Measurements
        description: Bucket 中的测量值，可以指定多个需要同步的 Measurements，未指定则同步该 Bucket 中的全部数据。
        placeholder: 请选择 Measurements
        multiple: true
        editable: true
        hint:
          type: str
          choices:
            - "--NONE--"
      - name: beginTime
        display: 起始时间
        description: 数据的起始时间，同步任务仅读取该指定时间及之后的数据。
        placeholder: YYYY-MM-DD HH:mm:ss
        hint: time
        required: true
      - name: endTime
        display: 结束时间
        description: 数据的截止时间，同步任务仅读取该指定时间及之前的数据，如果指定未来时间，任务将持续进行直至到达截止时间，如果未指定，任务将持续进行直至人为结束。
        placeholder: YYYY-MM-DD HH:mm:ss
        hint: time
      - name: readWindow
        display: 每次读取的时间范围（分钟）
        description: 每次从 InfluxDB 读取数据时，最大的时间范围。
        placeholder: 请输入读取时间范围
        hint:
          type: integer
          min: 1
          max: 6000
        value: 60
advanced:
  name: 高级选项
  collapsible: true
  collapsed: true
  description: |
    对数据源性能、日志等其他参数进行调整，可修改以下选项。
  params:
    - name: log_level
      display: 日志级别
      description: 根据需要调整数据源的日志级别，此参数不总是生效。
      value: info
      hint:
        type: str
        choices:
          - error
          - warn
          - info
          - debug
          - trace
    - name: read_concurrency
      hidden: true
      display: 最大读取并发数
      description: |
        数据源连接数或读取线程数限制，当默认参数不满足需要或需要调整资源使用量时修改此参数。
      value: 0
      hint:
        type: integer
        min: 0
        max: 1000
    - name: write_concurrency
      hidden: true
      display: 最大写入并发数
      description: |
        写入 taosX 的最大并发数限制，当默认参数性能不足时，可增大此参数。
      value: 0
      hint:
        type: integer
        min: 0
        max: 1000
    - name: batch_size
      hidden: true
      display: 批次大小
      description: |
        单次发送的最大消息数或行数。
      value: 1000
      hint:
        type: integer
        min: 1
        max: 10000
    - name: batch_timeout
      hidden: true
      display: 批次延时
      description: |
        单次读取最大延时（单位为毫秒），当超时结束时，只要有数据，即使不满足 Batch Size，也立即发送。
      value: 1000
      hint:
        type: integer
        min: 1
        max: 10000
    - name: keep_raw_data
      hidden: true
      display: 保存原始数据
      description: |
        是否保存原始数据？
      hint:
        type: bool
    - name: keep_raw_data_days
      hidden: true
      display: 最大保留天数
      description: |
        原始数据最大保存天数，默认 1 天。
      value: 1
      requires: keep_raw_data
      hint:
        type: integer
        min: 1
        max: 365
    - name: keep_raw_data_dir
      hidden: true
      display: 原始数据存储目录
      description: |
        自定义原始数据存储目录，默认存储到系统数据目录下。
      requires: keep_raw_data
      placeholder: $DATA_DIR/tasks/:id/rawdata/
      hint:
        type: str