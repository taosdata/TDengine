---
id: opcda
name: OPC-DA
description: |
  OPC是工业自动化领域和其他行业中安全可靠地交换数据的互操作标准之一。

  OPC DA（数据访问）是一种经典的基于COM的规范，仅适用于Windows。尽管OPC DA不是最新和最高效的数据通信规范，但它被广泛使用。这主要是因为一些旧设备只支持OPC DA。

  OPC UA是经典OPC规范的下一代标准，是一个平台无关的面向服务的架构规范，集成了现有OPC Classic规范的所有功能，提供了一条迁移到更安全和可扩展解决方案的路径。

  如果想了解更多关于OPC UA/DA的信息，可以阅读OPC Foundation网站和一些有用的博客，例如：
  1. [What is OPC](https://opcfoundation.org/about/what-is-opc/)
  2. [What is OPC DA](https://plcynergy.com/opc-da/)

  taosX 使用 OPC 连接器从 OPC 服务器拉取或订阅数据。
type: uri

options:
  endpoint:
    display: 服务地址
    required: true
    description: |
      OPC 服务器地址。如： `127.0.0.1<,localhost>/Matrikon.OPC.Simulation.1`。
      如果使用了 Agent ，该地址必须能够从 Agent 访问。如果没有使用 Agent, 该地址必须能够从 TDengine 系统所在服务器访问。
    placeholder: 127.0.0.1/Matrikon.OPC.Simulation.1

strict: false

datasets:
  name: 点位集
  description: OPC 采集数据点位列表。
  value: csv_config_file
  categories:
  - category: csv_config_file
    display: 上传 CSV 配置文件
    description: |
      使用 CSV 文件进行配置。
    target:
      name: csv_config_file
      description:
      required: true
      multiple: true
      editable: true
      selectable: true

  - category: select_all_points
    display: 选择所有点位
    description:
    target:
      name: select_all_points
      description: |
        选择 OPC 服务器上面的所有点位。
      required: true
      multiple: true
      editable: true
      selectable: true
    params:
      - name: table_primary_key
        display: 主键列
        description:
        required: true
        value: original_ts
        hint:
          type: str
          choices:
            - received_ts
            - original_ts
      - name: child_table_expression
        display: 表名称
        value: Meter_{TagName}
        description: |
          支持 <child table prefix>_{TagName} 的格式
        hint:
          type: str
        required: true

groups:
  - name: 连接配置
    display_order: 1
    description: OPC 连接相关配置
    params:
      - name: connect_timeout
        display: 连接超时
        description: |-
          DA 连接超时间隔，单位为：秒 (s)。
        placeholder: 10
        value: 10
        hint:
          type: integer
          min: 1
          max: 60
      - name: request_timeout
        display: 采集超时
        hint:
          type: integer
          min: 1
          max: 60
        description: DA 数据采集超时间隔，单位为：秒 (s)。
        placeholder: 10
        value: 10

  - name: 采集配置
    display_order: 2
    description: 数据采集相关配置项。
    params:
      - name: interval
        display: 采集间隔
        description: |-
          数据点位采集间隔，单位为：秒。
        hint:
          type: integer
          min: 1
          max: 60
        value: 1

advanced:
  name: 高级选项
  collapsible: true
  collapsed: true
  description: |
    对数据源性能、日志等其他参数进行调整，可修改以下选项。
  params:
    - name: log_level
      display: 日志级别
      description: 根据需要调整数据源的日志级别，此参数不总是生效。
      value: info
      hint:
        type: str
        choices:
          - error
          - warn
          - info
          - debug
          - trace

    - name: read_concurrency
      hidden: true
      display: 最大读取并发数
      description: |
        数据源连接数或读取线程数限制，当默认参数不满足需要或需要调整资源使用量时修改此参数。
      value: 0
      hint:
        type: integer
        min: 0
        max: 1000
    - name: write_concurrency
      hidden: true
      display: 最大写入并发数
      description: |
        写入 taosX 的最大并发数限制，当默认参数性能不足时，可增大此参数。
      value: 0
      hint:
        type: integer
        min: 0
        max: 1000
    - name: batch_size
      hidden: true
      display: 批次大小
      description: |
        单次发送的最大消息数或行数。
      value: 1000
      hint:
        type: integer
        min: 1
        max: 10000
    - name: batch_timeout
      hidden: true
      display: 批次延时
      description: |
        单次读取最大延时（单位为毫秒），当超时结束时，只要有数据，即使不满足 Batch Size，也立即发送。
      value: 1
      hint:
        type: integer
        min: 1
        max: 60
    - name: keep_raw_data
      hidden: true
      display: 保存原始数据
      description: |
        是否保存原始数据？
      hint:
        type: bool
    - name: keep_raw_data_days
      hidden: true
      display: 最大保留天数
      description: |
        原始数据最大保存天数，默认 1 天。
      value: 1
      requires: keep_raw_data
      hint:
        type: integer
        min: 1
        max: 365

    - name: keep_raw_data_dir
      hidden: true
      display: 原始数据存储目录
      description: |
        自定义原始数据存储目录，默认存储到系统数据目录下。
      requires: keep_raw_data
      placeholder: $DATA_DIR/tasks/:id/rawdata/
      hint:
        type: str


