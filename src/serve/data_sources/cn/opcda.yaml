---
id: opcda
name: OPC-DA
description: |
  OPC是工业自动化领域和其他行业中安全可靠地交换数据的互操作标准之一。

  OPC DA（数据访问）是一种经典的基于COM的规范，仅适用于Windows。尽管OPC DA不是最新和最高效的数据通信规范，但它被广泛使用。这主要是因为一些旧设备只支持OPC DA。

  OPC UA是经典OPC规范的下一代标准，是一个平台无关的面向服务的架构规范，集成了现有OPC Classic规范的所有功能，提供了一条迁移到更安全和可扩展解决方案的路径。

  如果想了解更多关于OPC UA/DA的信息，可以阅读OPC Foundation网站和一些有用的博客，例如：
  1. [What is OPC](https://opcfoundation.org/about/what-is-opc/)
  2. [What is OPC DA](https://plcynergy.com/opc-da/)

  taosX 使用 OPC 连接器从 OPC 服务器拉取或订阅数据。
type: uri

options:
  endpoint:
    display: 服务地址
    required: true
    description: |
      OPC 服务器地址。如： `127.0.0.1<,localhost>/Matrikon.OPC.Simulation.1`。
      如果使用了 Agent ，该地址必须能够从 Agent 访问。如果没有使用 Agent, 该地址应是 taosX 服务器所在主机。
    placeholder: 127.0.0.1/Matrikon.OPC.Simulation.1

strict: false

datasets:
  name: 点位集
  description: OPC 采集数据点位列表。
  value: csv_config_file
  categories:
    - category: csv_config_file
      display: 上传 CSV 配置文件
      description: |
        OPC 数据写入使用 csv 文件定义每一个数据点位到 TDengine 数据子表的映射规则：
        
        (1) tag_name：必填，数据点位在 OPC DA 服务器上的 id；
        
        (2) stable：必填，数据点位对应的 TDengine 超级表；
        
        (3) tbname：必填，数据点位对应的 TDengine 子表；
        
        (4) enable：可选，默认值 '1'，指定是否采集该点位数据。0-不采集并且删除对应子表，1-采集点位数据，没有子表时创建子表；
        
        (5) value_col：可选，默认值 'val'。数据点位采集值在 TDengine 中对应的列名；
        
        (6) value_transform：可选，数据点位采集值在 taosX 中执行的变换函数，目前仅支持数值计算表达式，详见 transform 文档的 expr 表达式说明；
        
        (7) type：可选，默认值取源数据类型。数据点位采集值的数据类型，可用于替换超级表名称中的占位符 {type}；
        
        (8) quality_col：可选，数据点位采集值质量在 TDengine 中对应的列名；
        
        (9) ts_col/received_ts_col：必填，TDengine 时间戳主键定义：只存在 ts_col 时使用原始时间戳作为主键，只存在 received_ts_col 时使用采集时间戳作为主键，两列都存在时，居前的时间戳列作为主键；
        
        (10) ts_transform：可选，原始时间戳变换函数，参考 transform 数值计算表达式 expr 的说明；
        
        (11) received_ts_transform：可选，采集数据时间戳变换函数，参考 transform 数值计算表达式 expr 的说明；
        
        (12) tag::VARCHAR(200)::name：可选/可配置多个tag列；数据点位在 TDengine 中对应的 Tag 列；其中 tag 为保留关键字，表示该列为一个 tag 列；VARCHAR(200) 表示该 tag 的类型，也可以是其它合法的类型；name 是该 tag 的列名。
        
        更多填写规则请参考<a target="_blank" href="/docs/enterprise/datain/opcda">企业版文档</a>。  
      
      target:
        name: csv_config_file
        description:
        required: true
        multiple: true
        editable: true
        selectable: true

    - category: select_all_points
      display: 选择数据点位
      description:
      target:
        name: select_all_points
        description: |
          设置过滤条件，选择 OPC 服务器上满足指定条件的数据点位。
        required: true
        multiple: true
        editable: true
        selectable: true
      params:
        - name: root
          display: 根节点
          description: |
            从该节点开始查询所有子节点, 多级父节点间用“.”相连接。
          placeholder: 例如 root.parent
          hint:
            type: str
        - name: pattern
          display: 正则匹配
          description: |
            数据点位 TagName 需要满足设置的正则表达式。
          hint:
            type: str
        - name: super_table_expression
          display: 超级表名称
          description: |
            支持 <super table prefix>_{type} 格式，{type} 表示点位的数据类型。
          required: true
          value: opc_{type}
          hint:
            type: str
        - name: child_table_expression
          display: 表名称
          description: |
            支持 <child table prefix>_{tag_name} 格式，{tag_name} 表示点位名称。
          required: true
          value: t_{tag_name}
          hint:
            type: str
        - name: table_primary_key
          display: 主键列
          description: |
            目标数据表主键将使用选择的值作为时间戳主键列，original_ts 表示使用数据点位上报 OPC 服务时间，received_ts 表示 taosX 任务接收数据的时间。
          required: false
          value: original_ts
          hint:
            type: str
            choices:
              - original_ts
              - received_ts
        - name: table_primary_key_alias
          display: 主键别名
          description: |
            在目标数据表中的主键列名称。
          required: false
          value: ts
          hint:
            type: str
groups:
  - name: 连接配置
    display_order: 1
    description: OPC 连接相关配置
    params:
      - name: connect_timeout
        display: 连接超时
        description: |-
          DA 连接超时间隔，单位为：秒 (s)。
        placeholder: 10
        value: 10
        hint:
          type: integer
          min: 1
          max: 60
      - name: request_timeout
        display: 采集超时
        hint:
          type: integer
          min: 1
          max: 60
        description: DA 数据采集超时间隔，单位为：秒 (s)。
        placeholder: 10
        value: 10

  - name: 采集配置
    display_order: 2
    description: 数据采集相关配置项。
    params:
      - name: interval
        display: 采集间隔
        description: |-
          数据点位采集间隔，单位为：秒。
        hint:
          type: integer
          min: 1
          max: 60
        value: 1
      - name: update_mode
        display: 点位更新模式
        description: |
          点位更新模式，在使用“选择数据点位”时，可以开启动态点位更新。none：不开启动态点位更新；append：开启动态点位更新，但只追加；update：开启动态点位更新，追加或删除。
        value: none
        hint:
          type: str
          choices:
            - none
            - append
            - update
      - name: update_interval
        display: 点位更新间隔
        description: |
          动态点位更新间隔，在“点位更新模式”为 append 和 update 时生效，以秒为单位。
        value: 600
        hint:
          type: integer
          min: 60
          max: 2147483647

advanced:
  name: 高级选项
  collapsible: true
  description: |
    对数据源性能、日志等其他参数进行调整，可修改以下选项。
  params:
    - name: log_level
      display: 日志级别
      description: 根据需要调整数据源的日志级别，此参数不总是生效。
      value: info
      hint:
        type: str
        choices:
          - error
          - warn
          - info
          - debug
          - trace
    - name: write_concurrency
      display: 最大写入并发数
      description: |
        写入 taosX 的最大并发数限制，当默认参数性能不足时，可增大此参数。
      value: 0
      hint:
        type: integer
        min: 0
        max: 128
    - name: batch_size
      display: 批次大小
      description: |
        单次发送的最大消息数或行数。
      value: 1000
      hint:
        type: integer
        min: 1
        max: 10000
    - name: batch_timeout
      display: 批次延时
      description: |
        单次读取最大延时（单位为秒），当超时结束时，只要有数据，即使不满足 Batch Size，也立即发送。
      value: 1
      hint:
        type: integer
        min: 1
        max: 60
    - name: keep_raw_data
      display: 保存原始数据
      description: |
        是否保存原始数据？
      hint:
        type: bool
    - name: keep_raw_data_days
      display: 最大保留天数
      description: |
        原始数据最大保存天数，默认 1 天。
      value: 1
      requires: keep_raw_data
      hint:
        type: integer
        min: 1
        max: 365

    - name: keep_raw_data_dir
      display: 原始数据存储目录
      description: |
        自定义原始数据存储目录，默认存储到系统数据目录下。
      requires: keep_raw_data
      placeholder: $DATA_DIR/tasks/:id/rawdata/
      hint:
        type: str


