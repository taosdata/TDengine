---
id: opcda
name: OPC-DA
description: |
  OPC是工业自动化领域和其他行业中安全可靠地交换数据的互操作标准之一。

  OPC DA（数据访问）是一种经典的基于COM的规范，仅适用于Windows。尽管OPC DA不是最新和最高效的数据通信规范，但它被广泛使用。这主要是因为一些旧设备只支持OPC DA。

  OPC UA是经典OPC规范的下一代标准，是一个平台无关的面向服务的架构规范，集成了现有OPC Classic规范的所有功能，提供了一条迁移到更安全和可扩展解决方案的路径。

  如果想了解更多关于OPC UA/DA的信息，可以阅读OPC Foundation网站和一些有用的博客，例如：
  1. [What is OPC](https://opcfoundation.org/about/what-is-opc/)
  2. [What is OPC DA](https://plcynergy.com/opc-da/)

  taosX 使用 OPC 连接器从 OPC 服务器拉取或订阅数据。
type: uri

options:
  endpoint:
    display: 服务地址
    required: true
    description: |
      OPC 服务器地址。如： `127.0.0.1<,localhost>/Matrikon.OPC.Simulation.1`。
      如果使用了 Agent ，该地址必须能够从 Agent 访问。如果没有使用 Agent, 该地址必须能够从 TDengine 系统所在服务器访问。
    placeholder: 127.0.0.1/Matrikon.OPC.Simulation.1

strict: false

datasets:
  name: 点位集
  description: OPC 采集数据点位列表。
  value: csv_config_file
  categories:
  - category: csv_config_file
    display: 上传 CSV 配置文件
    description: |
      使用 CSV 文件进行配置。
    target:
      name: csv_config_file
      description:
      required: true
      multiple: true
      editable: true
      selectable: true

  - category: select_all_points
    display: 选择所有点位
    description:
    target:
      name: select_all_points
      description: |
        选择 OPC 服务器上面的所有点位。
      required: true
      multiple: true
      editable: true
      selectable: true
    params:
      - name: table_primary_key
        display: 主键列
        description:
        required: true
        hint:
          type: str
          choices:
            - received_ts
            - original_ts
      - name: child_table_expression
        display: 表名称
        description: |
          支持 <child table prefix>_{ns}_{id} 格式
        hint:
          type: str
        required: true


groups:
  - name: 连接配置
    display_order: 1
    description: OPC 连接相关配置
    params:
      - name: connect_timeout
        display: 连接超时
        description: |-
          DA 连接超时间隔，单位为：秒 (s)。
        placeholder: 10
        value: 10
        hint:
          type: integer
          min: 1
          max: 60
      - name: request_timeout
        display: 采集超时
        hint:
          type: integer
          min: 1
          max: 60
        description: DA 数据采集超时间隔，单位为：秒 (s)。
        placeholder: 10
        value: 10

  - name: 采集配置
    display_order: 2
    description: 数据采集相关配置项。
    params:
      - name: interval
        display: 采集间隔
        description: |-
          数据点位采集间隔，单位为：秒。
        hint:
          type: integer
          min: 1
          max: 60
        value: 1

  - name: 原始数据保存
    display_order: 2
    description: OPC 连接器采集到的原始数据保存配置。
    params:
      - name: enable
        display: 启用保存
        description: |-
          是否启用原始数据保存，默认为 false，即不保存原始数据。
        value: false
        hint:
          type: bool

      - name: path
        display: 保存路径
        hint:
          type: str
        description: 原始数据的保存路径，若启用保存原始数据需配置。
        placeholder: /data/

      - name: keep
        display: 保留天数
        hint:
          type: integer
          min: 1
        description: 原始数据的保留天数，若启用保存原始数据需配置。
        placeholder: 10
        value: 10

  - name: 其他
    display_order: 3
    description: 其他配置项。
    params:
      - name: concurrent
        display: 上报并行度
        description: 采集的数据写入数据库的并行度
        hint:
          type: integer
          min: 1
          max: 100
        value: 1
      - name: batch_size
        display: 上报批次大小
        hint:
          type: integer
          min: 1
          max: 10000
        description: 每次采集数据写入数据库的最大记录条数
        placeholder: 100
        value: 1
      - name: batch_timeout
        display: 上报超时
        hint:
          type: integer
          min: 1
          max: 60
        description: 每批次采集数据上报的超时时间间隔，单位为：秒 (s)
        placeholder: 20
        value: 1

      - name: debug
        display: 开启 Debug 日志
        hint:
          type: bool
        description: 是否开启 opc 连接器的 debug 日志


