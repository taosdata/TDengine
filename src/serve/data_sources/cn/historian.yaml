---
id: historian
name: AVEVA™ Historian
type: uri
description: |
  AVEVA™ Historian 是一款工业大数据分析软件，前身为 Wonderware。可以捕获并存储高保真工业大数据，释放受制约的潜力，从而改善运营。
  TDengine 可以高效地从 Historian 读取数据并将其写入 TDengine，以实现历史数据迁移或实时数据流入库。
strict: false
options:
  host:
    display: Server 地址
    description: AVEVA™ Historian SQL Server 的 IP 地址或域名
    placeholder: "127.0.0.1"
    required: true
  port:
    display: Server 端口
    description: AVEVA™ Historian SQL Server 的端口
    placeholder: "1433"
    required: false

authentication:
  display: 认证
  description: 使用用户名和密码访问 AVEVA™ Historian SQL Server
  value: plain
  alternatives:
    - name: plain
      display: 用户名密码访问
      description: 使用用户名和密码访问 AVEVA™ Historian SQL Server
      username:
        display: 用户
        placeholder: username
        required: true
      password:
        display: 密码
        placeholder: password
        required: true

groups:
  - name: 采集配置
    display_order: 1
    description: 数据采集相关配置项。
    required: true
    params:
      - name: mode
        display: 采集模式
        description: >
          采集模式，可选值为 `synchronize` 和 `migrate`。
        required: true
        placeholder: synchronize
        value: synchronize
        hint:
          type: str
          choices:
            - synchronize
            - migrate
      - name: table
        display: 表
        description: >
          检索 historian 中的数据库表，历史数据在 Runtime.dbo.History 中，实时数据在 Runtime.dbo.Live 中。
        required: true
        placeholder: Runtime.dbo.History
        hint:
          type: str
          choices:
            - Runtime.dbo.History
            - Runtime.dbo.Live
      - name: tags
        display: 标签
        description: >
          需要迁移/同步的tag，`*`代表除了Sys开头以外的全部tag。
        required: false
        placeholder: "*"
        value: "*"
        hint:
          type: str
      - name: beginDateTime
        display: 任务开始时间
        description: >
          任务的开始时间，rfc3339格式的日期时间。
        required: true
        placeholder: 如：2023-01-01T00:00:00+08:00
        hint:
          type: time
      - name: endDateTime
        display: 任务结束时间
        description: >
          任务的结束时间，rfc3339格式的日期时间。
        required: false
        placeholder: 如：2023-01-01T00:00:00+08:00
        hint:
          type: time
      - name: timeWindow
        display: 查询的时间窗口
        description: >
          历史数据迁移时，每次查询的时间窗口。
        required: false
        placeholder: 1 day
        value: 1 day
        hint:
          type: str
      - name: retrieveInterval
        display: 实时同步的时间间隔
        description: >
          实时数据同步时，每次查询的时间间隔。
        required: false
        placeholder: 10s
        value: 10s
        hint:
          type: str
      - name: tolerance
        display: 乱序时间上限
        description: >
          容忍乱序数据延迟到达的时间上限。
        required: false
        placeholder: 0 ms
        value: 0 ms
        hint:
          type: str

parser:
  display: 数据映射
  description: |
    Historian 数据源，同步/迁移 Runtime.dbo.History表时，上传以下字段：<br>
    
    - **DateTime**: 值对应的时间戳。<br>
    - **TagName**: 测点名称。<br>
    - **Value**: 标记在时间戳处的值。对于字符串tag，该值始终为NULL。<br>
    - **vValue**: 字符串形式的值，在查询中使用此列允许您使用混合数据类型的值。<br>
    - **Quality**: 与数据值相关联的基本数据质量指标。<br>
    - **QualityDetail**: 数据质量的内部表示。<br>
    - **wwTagKey**: 单个AVEVA历史记录中tag的唯一数字标识符。<br>
    - **wwResolution**: 在循环模式下检索数据的采样率，以毫秒为单位。<br>
    - **StartDateTime**: 返回该行的检索周期的开始时间。<br>
    - **SourceTag**: 在存储该点时复制标记的源标记的名称。<br>
    - **SourceServer**: 在存储该点时复制标记的服务器的名称。<br>
    
    同步/迁移 Runtime.dbo.Live表时，上传以下字段：<br>
    
    - **DateTime**: 值对应的时间戳。<br>
    - **TagName**: 测点名称。<br>
    - **Value**: 标记在时间戳处的值。对于字符串tag，该值始终为NULL。<br>
    - **vValue**: 字符串形式的值，在查询中使用此列允许您使用混合数据类型的值。<br>
    - **Quality**: 与数据值相关联的基本数据质量指标。<br>
    - **QualityDetail**: 数据质量的内部表示。<br>
    - **OPCQuality**: 从数据源接收到的质量值。<br>
    - **wwTagKey**: 单个AVEVA历史记录中tag的唯一数字标识符。<br>
    - **SourceTag**: 在存储该点时复制标记的源标记的名称。<br>
    - **SourceServer**: 在存储该点时复制标记的服务器的名称。<br>
    
    taosX 允许用户在数据库中指定数据模型，包括：指定表名称和超级表名，设置普通列会标签列等
  fields:
    - name: DateTime
      description: 值对应的时间戳。
      type: timestamp
    - name: TagName
      description: 测点名称。
      type: varchar
    - name: Value
      description: 标记在时间戳处的值。对于字符串tag，该值始终为NULL。
      type: double
    - name: vValue
      description: 字符串形式的值，在查询中使用此列允许您使用混合数据类型的值。
      type: varchar
    - name: Quality
      description: 与数据值相关联的基本数据质量指标。
      type: int
    - name: QualityDetail
      description: 数据质量的内部表示。
      type: int
    - name: OPCQuality
      description: 从数据源接收到的质量值。
      type: int
    - name: wwTagKey
      description: 单个AVEVA历史记录中tag的唯一数字标识符。
      type: int
    - name: wwResolution
      description: 在循环模式下检索数据的采样率，以毫秒为单位。
      type: int
    - name: StartDateTime
      description: 返回该行的检索周期的开始时间。
      type: timestamp
    - name: SourceTag
      description: 在存储该点时复制标记的源标记的名称。
      type: varchar
    - name: SourceServer
      description: 在存储该点时复制标记的服务器的名称。
      type: varchar
  required: true