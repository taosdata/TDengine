---
id: mqtt
name: MQTT
description: |
  MQTT 表示 Message Queuing Telemetry Transport （消息队列遥测传输）。它是一种轻量级的消息协议，易于实现和使用。它非常适合连接资源有限的设备，例如电池供电的设备或带宽较低的设备。MQTT也是实时控制系统等延迟重要的应用程序的不错选择。

  MQTT 通过使用发布/订阅模型来工作。这意味着设备可以将消息发布到主题，其他设备可以订阅这些主题以接收消息。这使得轻松将设备解耦，并根据需要扩展应用程序。

  MQTT 是物联网应用程序的流行选择。它得到了广泛的设备和平台支持，并提供许多开源和商业实现。

  taosX 可以通过连接器插件从 MQTT 代理订阅数据。请查看每个部分的帮助消息以了解详细信息。
type: uri
options:
  endpoint:
    display: MQTT 地址
    required: true
    pattern: "^[0-9A-Za-z.\-_]+:(?:[0-9]{1,5})$"
    pattern_msg: "输入格式有误，请按照格式 `host:port`，port 范围为 1-65535。"
    description: |
      MQTT 服务器地址。如: “127.0.0.1:1883”
      如果使用了 Agent ，该地址必须能够从 Agent 访问。如果没有使用 Agent, 该地址必须能够从 TDengine 系统所在服务器访问。
    placeholder: 127.0.0.1:1883

authentication:
  display: 认证
  description: 使用用户名和密码访问 MQTT Broker。
  value: plain
  alternatives:
    - name: plain
      display: 用户名密码访问
      description: 使用用户名和密码访问 MQTT Broker。
      username:
        display: 用户
        placeholder: username
      password:
        display: 密码
        placeholder: password

groups:
  - name: SSL 证书
    description: 使用证书和私钥建立连接以启用 SSL。
    collapsible: true
    connection_option: true
    params:
      - name: ca
        display: CA
        description: CA 证书文件
        required: true
        hint:
          type: file
      - name: cert
        display: 客户端证书
        description: .cert 文件
        required: true
        hint:
          type: file
      - name: cert_key
        display: 客户端私钥
        description: 私钥文件
        required: true
        hint:
          type: file
  - name: 采集配置
    display_order: 1
    description: 采集任务配置
    connection_option: true
    params:
      - name: version
        display: MQTT 协议
        value: "3.1"
        required: true
        description: |-
          MQTT 协议版本。
        hint:
          type: str
          choices:
            - "3.1"
            - "3.1.1"
            - "5.0"
      - name: client_id
        display: Client ID
        description: |-
          MQTT Broker 客户端 ID。
        placeholder: client_id
        hint:
          type: str

      - name: keep_alive
        display: Keep Alive
        value: 60
        hint:
          type: integer
          min: 1
        description: |
          如果代理在保持活动间隔内没有收到来自客户端的任何消息，它将假定客户端已断开连接，并关闭连接。

          保持活动间隔是指客户端和代理之间协商的时间间隔，用于检测客户端是否活动。如果客户端在保持活动间隔内没有向代理发送消息，则代理将断开连接。

          保持活动间隔的默认值为60秒，但可以通过在连接时设置 CONNECT 报文中的 keep alive 字段来更改它。
        placeholder: 10
      - name: clean_session
        display: Clean Session
        value: true
        description: |
          如果clean session标志设置为True，则代理将忘记有关会话的所有信息，包括客户端的订阅。<br>
          clean session 标志的默认值为True。<br>
          如果设置为False，则代理将保留有关客户端的信息，包括其订阅。这意味着客户端在重新连接时可以恢复其以前的订阅。<br>
        hint:
          type: bool
      - name: topics
        display: 订阅主题及 QoS 配置
        required: true
        pattern: "^(?:\\S+::[0-2],)*\\S+::[0-2]$"
        pattern_msg: "输入格式有误，请按照格式 `<topic name>::<QoS>`，其中QoS 只能输入0、1、2，例如： `topic1::0,topic2::1`"
        description: |
          输入格式 `<topic name>::<QoS>`，其中QoS 只能输入0、1、2，订阅多个主题使用逗号分割，例如: `topic1::0,topic2::1`
        hint:
          type: str
        placeholder: topic1::0,topic2::1

advanced:
  name: 高级选项
  collapsible: true
  description: |
    对数据源性能、日志等其他参数进行调整，可修改以下选项。
  params:
    - name: log_level
      display: 日志级别
      description: 根据需要调整数据源的日志级别，此参数不总是生效。
      value: info
      hint:
        type: str
        choices:
          - error
          - warn
          - info
          - debug
          - trace

    - name: read_concurrency
      hidden: true
      display: 最大读取并发数
      description: |
        数据源连接数或读取线程数限制，当默认参数不满足需要或需要调整资源使用量时修改此参数。
      value: 0
      hint:
        type: integer
        min: 0
        max: 1000
    - name: write_concurrency
      hidden: true
      display: 最大写入并发数
      description: |
        写入 taosX 的最大并发数限制，当默认参数性能不足时，可增大此参数。
      value: 0
      hint:
        type: integer
        min: 0
        max: 1000
    - name: batch_size
      hidden: true
      display: 批次大小
      description: |
        单次发送的最大消息数或行数。
      value: 1000
      hint:
        type: integer
        min: 1
        max: 10000
    - name: batch_timeout
      hidden: true
      display: 批次延时
      description: |
        单次读取最大延时（单位为毫秒），当超时结束时，只要有数据，即使不满足 Batch Size，也立即发送。
      value: 1
      hint:
        type: integer
        min: 1
        max: 60
    - name: keep_raw_data
      display: 保存原始数据
      description: |
        是否保存原始数据？
      hint:
        type: bool
    - name: keep_raw_data_days
      display: 最大保留天数
      description: |
        原始数据最大保存天数，默认 1 天。
      value: 1
      requires: keep_raw_data
      hint:
        type: integer
        min: 1
        max: 365

    - name: keep_raw_data_dir
      display: 原始数据存储目录
      description: |
        自定义原始数据存储目录，默认存储到系统数据目录下。
      requires: keep_raw_data
      placeholder: $DATA_DIR/tasks/:id/rawdata/
      hint:
        type: str

parser:
  display: Payload 转换
  description: |
    MQTT 连接器会上传以下四列到服务端：

    - **ts**: 采集时间戳。
    - **topic**: 订阅主题名。
    - **qos**: 采集点质量。
    - **payload**: 采集数据。

    taosX 可以使用 JSON 提取器解析数据，并允许用户在数据库中指定数据模型，包括，指定表名称和超级表名，设置普通列和标签列等。
  fields:
    - name: ts
      description: 时间戳
      type: timestamp
    - name: topic
      description: 主题
      type: varchar
    - name: qos
      description: 质量
      type: int
    - name: payload
      description: 负载
      type: varchar

  required: true
