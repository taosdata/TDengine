---
id: mqtt
name: MQTT
description: |
  MQTT 表示 Message Queuing Telemetry Transport （消息队列遥测传输）。它是一种轻量级的消息协议，易于实现和使用。它非常适合连接资源有限的设备，例如电池供电的设备或带宽较低的设备。MQTT也是实时控制系统等延迟重要的应用程序的不错选择。

  MQTT 通过使用发布/订阅模型来工作。这意味着设备可以将消息发布到主题，其他设备可以订阅这些主题以接收消息。这使得轻松将设备解耦，并根据需要扩展应用程序。

  MQTT 是物联网应用程序的流行选择。它得到了广泛的设备和平台支持，并提供许多开源和商业实现。

  taosX 可以通过连接器插件从 MQTT 代理订阅数据。请查看每个部分的帮助消息以了解详细信息。
type: uri
options:
  endpoint:
    display: MQTT 地址
    required: true
    description: |
      Mqtt server endpoint. e.g: 127.0.0.1:1883
    placeholder: 127.0.0.1:1883
  username:
    display: 用户名
    description: MQTT Broker 用户名。
    placeholder: username
  password:
    display: 密码
    description: MQTT Broker 密码。
    placeholder: password


groups:
  - name: 证书
    description: 使用证书和私钥登录。
    params:
      - name: ca
        display: CA
        description: CA 证书文件内容。
        required: true
        hint:
          type: file
      - name: cert
        display: 客户端证书
        description: .cert 文件内容。
        required: true
        hint:
          type: file
      - name: cert_key
        display: 客户端私钥
        description: 私钥文件内容。
        required: true
        hint:
          type: file
  - name: 连接
    display_order: 1
    description: MQTT Broker 连接配置
    params:
      - name: version
        display: MQTT 协议
        value: "3.1"
        required: true
        description: |-
          MQTT 协议版本。
        hint:
          type: str
          choices:
            - "3.1"
            - "3.1.1"
            - "5.0"
      - name: client_id
        display: Client ID
        description: |-
          MQTT Broker 客户端 ID。
        hint:
          type: str

      - name: keep_alive
        display: Keep Alive
        hint:
          type: integer
          min: 1
        description: |
          如果代理在保持活动间隔内没有收到来自客户端的任何消息，它将假定客户端已断开连接，并关闭连接。

          保持活动间隔是指客户端和代理之间协商的时间间隔，用于检测客户端是否活动。如果客户端在保持活动间隔内没有向代理发送消息，则代理将断开连接。

          保持活动间隔的默认值为60秒，但可以通过在连接时设置 CONNECT 报文中的 keep alive 字段来更改它。
        placeholder: 10
      - name: clean_session
        display: Clean Session
        value: true
        description: |
          如果clean session标志设置为True，则代理将忘记有关会话的所有信息，包括客户端的订阅。<br>
          clean session 标志的默认值为True。<br>
          如果设置为False，则代理将保留有关客户端的信息，包括其订阅。这意味着客户端在重新连接时可以恢复其以前的订阅。<br>
        hint:
          type: bool
      - name: topics
        display: 订阅主题及 QoS 配置
        required: true
        description: |
          使用如下格式设置： `topic1::0,topic2::1`
        hint:
          type: str


  - name: 其他
    display_order: 2
    params:
      - name: log_level
        display: 日志级别
        description: 选择日志级别。默认为： `info` 。
        hint:
          type: str
          choices:
            - error
            - warn
            - info
            - debug
            - trace

parser:
  display: MQTT Payload 解析
  description: |
    MQTT 连接器会上传以下四列到服务端：<br>

    - **ts**: 采集时间戳。<br>
    - **topic**: 订阅主题名。<br>
    - **qos**: 采集点质量。<br>
    - **payload**: 采集数据。<br>

    taosX 可以使用 JSON 提取器解析数据，并允许用户在数据库中指定数据模型，<br>
    包括，指定表名称和超级表名，设置普通列会标签列等。
  fields:
  - name: ts
    description: 时间戳
  - name: topic
    description: 主题
  - name: qos
    description: 质量
  - name: payload
    description: 负载

  required: true
