---
id: pi
name: PI
description: |
  PI 系统是一套用于数据收集、查找、分析、传递和可视化的软件产品，可以作为管理实时数据和事件的企业级系统的基础架构。

  PI 系统这个术语通常用来指代PI服务器，但这两者并不相同。PI系统指的是所有 OSIsoft 软件产品，而 PI 服务器是 PI 系统的核心产品。数据可以自动从许多来源（控制系统、实验室设备、计算、手动输入或定制软件）收集。

  taosX 可以通过 PI 连接器插件从 PI 系统中提取实时数据。
type: uri
params:
  - name: system_configuration
    display: PI 系统配置
    display_order: 0
    description:
    value: PI Data Archive and Asset Framework (AF) Server
    hint:
      type: str
      choices:
        - PI Data Archive and Asset Framework (AF) Server
        - PI Data Archive Only
  - name: PISystemName
    display: AF Server 名称
    placeholder: pi-af-server-name
    display_order: 3
    required: true
    description: |-
      PI 系统(AF Server) 名称 (hostname).
    hint:
      type: str
options:
  host:
    display: PI服务名
    description: |-
      PI 服务器地址（通常使用主机名）。
      如果使用了 Agent ，该地址必须能够从 Agent 访问。如果没有使用 Agent, 该地址必须能够从 TDengine 系统所在服务器访问。
    placeholder: server
    required: true
  subject:
    display: AF Database Name
    description: AF 数据库名
    placeholder: "如: Met1"
    required: true
strict: false
groups:
  - name: 自动回填
    display_order: 1
    description: 自动回填配置。
    params:
      - name: MaxBackfillRangeDays
        display: 重启补偿时间
        hint:
          type: integer
          min: 0
          max: 30
        description: 连接丢失或首次启动时自动回填的最大天数。
        placeholder: 1
        value: 1

advanced:
  name: 高级选项
  collapsible: true
  collapsed: true
  description: |
    对数据源性能、日志等其他参数进行调整，可修改以下选项。
  params:
    - name: batch_size
      display: 批次大小
      description: |
        单次发送的最大消息数或行数。
      value: 1000
      hint:
        type: integer
        min: 1
        max: 10000
    - name: batch_timeout
      display: 批次延时
      description: |
        单次读取最大延时（单位为毫秒），当超时结束时，只要有数据，即使不满足 Batch Size，也立即发送。
      value: 1
      hint:
        type: integer
        min: 1
        max: 60
datasets:
  name: Data Sets
  display: 监测点集
  description: |
    不同类型的点位配置文件，这将决定入库的数据模型。
  params:
    - name: point_file
      display: 单列模式点位列表
      description: |
        一个单列点位名称列表文件。

        | |
        | ------------------- |
        | meter_10001_current |
        | meter_10001_voltage |
      hint:
        type: file
    - name: template_for_pi_point_file
      display: 单列模式 AF 模板列表
      description: |
        单列点位名称（AF 模板）列表文件。

        | |
        | ------------------- |
        | MeterTemplate  |
        | MeterTemplate1 |
      hint:
        type: file
    - name: template_for_af_element_file
      display: AF 模式模板列表
      description: |
        单列模板名称列表文件。

        | |
        | ------------------- |
        | MeterTemplate  |
        | MeterTemplate1 |
      hint:
        type: file
