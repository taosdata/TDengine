---
id: mqtt
name: MQTT
description: |
  MQTT stands for Message Queuing Telemetry Transport. It is a lightweight
  messaging protocol that is easy to implement and use. It is ideal for connecting 
  devices with limited resources, such as battery-powered devices or devices with
  low bandwidth. MQTT is also a good choice for applications where latency is 
  important, such as real-time control systems.   

  MQTT works by using a publish/subscribe model. This means that devices can
  publish messages to topics, and other devices can subscribe to those topics to  
  receive the messages. This makes it easy to decouple devices from each other, 
  and to scale up applications as needed.  

  MQTT is a popular choice for IoT applications. It is supported by a wide range of 
  devices and platforms, and there are many open source and commercial 
  implementations available.  

  taosX could subscribe data from MQTT server by a MQTT connector plugin.  

  Check the help message in each part to see the details.  
type: uri
options:
  endpoint:
    display: Mqtt Server endpoint
    required: true
    description: |
      Mqtt server endpoint. e.g: 127.0.0.1:1883
    placeholder: 127.0.0.1:1883

authentication:
  display: Authentication
  description: Use username/password plain authentication or with certificate files, or anonymous(default).
  value: anonymous
  alternatives:
    - name: anonymous
      display: Anonymous
      description: Logging in anonymously without any configurations (if available).
      value: true
      params: []

    - name: plain
      display: Username
      description: Use username and password.
      username:
        display: Username
        description: MQTT Broker username.
        placeholder: username
        required: true
      password:
        display: Password
        description: MQTT Broker password.
        placeholder: password
    - name: certificates
      display: Certificates
      description: Use certificate file and private key.
      params:
        - name: ca
          display: CA
          description: CA file path
          hint: 
            type: file
        - name: cert
          display: Client certificate file
          description: Path to Client certificate file. 
          hint: 
            type: file
        - name: cert_key
          display: Client key file
          description: Path to Client certificate file. 
          hint:
            type: file

groups:
  - name: Connection
    display_order: 1
    description: Some configurations used in connecting step.
    params:
      - name: client_id
        display: Client id
        description: |-
          Client id used to connect to mqtt broker.
        hint:
          type: str

      - name: keep_alive
        display: Keep Alive
        hint:
          type: integer
          min: 1
        description: |
          If the broker does not receive any messages from the client within the keep alive interval,  
          it will assume that the client has disconnected and will close the connection.  
        placeholder: 10
      - name: clean_session
        display: Clean Session
        description: |
          True means that the server will forget all information about the session, including the  
          client's subscriptions. The default value for the clean session flag is true.  
        hint:
          type: bool
      - name: topics
        display: Topics Qos Config
        description: |
          e.g: topic1::0,topic2::1 
        hint: 
          type: str


  - name: Others
    display_order: 2
    description: Other configurations.
    params:
      - name: log_level
        display: Log Level
        description: Log Level
        hint:
          type: str
          choices:
            - error
            - warn
            - info
            - debug
            - trace