---
id: influxdb
type: uri
name: InfluxDB
description: |
  InfluxDB is a popular open-source time-series database that is optimized for
  handling large volumes of timestamped data.

  TaosX can efficiently read the data in influxdb and write it to TDengine through
  the taosx-influxdb plugin to achieve historical data migration or real-time data
  synchronization.
strict: false

options:
  host:
    display: IP address
    description: The access address of InfluxDB
    placeholder: 127.0.0.1
    required: true
  port:
    display: Port
    description: The port of InfluxDB
    placeholder: "8086"
    required: true
authentication:
  display: Authentication
  description: Authentication is the process of verifying the identity before granting access to InfluxDB.
  value: token
  alternatives:
    - name: token
      display: Token
      description: Use access token.
      params:
        - name: orgId
          display: Organization Id
          description: It is a workspace for a group of users. All dashboards, tasks, buckets, and users belong to one organization.
          placeholder: Please input your organization id in the InfluxDB
          hint: str
          required: true
        - name: token
          display: Token
          description: This token can at least have permission to read anything in this organization.
          placeholder: Please input your access token in the InfluxDB
          hint: str
          required: true
groups:
  - name: task
    display: Task
    display_order: 1
    description: Configure the data migration task
    params:
      - name: mode
        display: Task Mode
        description: Whether to resume running from the last breakpoint
        placeholder: normal
        hint:
          type: str
          choices:
            - normal
            - resume
        required: true
      - name: beginTime
        display: Data Begin Time
        description: Set a data start time
        placeholder: YYYY-MM-DD HH:MM:SS
        hint: time
        required: true
      - name: endTime
        display: Data End Time
        description: Set a data end time
        placeholder: YYYY-MM-DD HH:MM:SS
        hint: time
      - name: buckets
        display: Buckets
        description: Input the buckets to migrate, multiple separated by commas.
        placeholder: bucket1,bucket2,...
        hint: str