---
id: opcda
name: OPC-DA
description: |
  OPC is one of interoperability standard for the secure and reliable exchange of data
  in the industrial automation space and in other industries.

  OPC DA (Data Access) is a classic COM-based specification that works only on Windows.
  OPC DA is widely used even though it isn’t the newest and most efficient data communication
  specification out there. This is mainly because of older devices that only support the OPC DA.

  For more about OPC DA we introduce you to read the [OPC Foundation site](https://opcfoundation.org/),
  and some useful blogs, such as

  1. [What is OPC](https://opcfoundation.org/about/what-is-opc/)
  2. [What is OPC DA](https://plcynergy.com/opc-da/),

  taosX could pull data from OPC server by a OPC connector plugin.

  Check the help message in each part to see the details.
type: uri

options:
  endpoint:
    display: Server endpoint
    required: true
    description: |
      OPC server endpoint, such as `Matrikon.OPC.Simulation.1`.
    placeholder: Matrikon.OPC.Simulation.1

strict: false

groups:
  - name: Data Sets
    display_order: 1
    description: "Data points in OPC server to collect."
    params:
      - name: nodes
        display: DA Nodes
        description: A OPC DA node list separated by ','.
        hint:
          type: str
        placeholder: localhost
      - name: da.tags
        display: DA Tags
        description: A OPC DA tags list separated by ','.
        placeholder: ns=2;i=2, ns=2;i=3
        hint:
          type: str

  - name: Connection
    display_order: 2
    description: Some configurations used in connecting step.
    params:
      - name: connect_timeout
        display: Connect Timeout
        description: |-
          Timeout for connect to endpoint in seconds.
        placeholder: 10
        hint:
          type: integer

      - name: request_timeout
        display: Request Timeout
        hint:
          type: integer
        description: Timeout for a request in seconds.
        placeholder: 10

  - name: Others
    display_order: 3
    description: Other configurations.
    params:
      - name: concurrent
        display: Concurrency
        description: Number of concurrency while collecting.
        hint:
          type: integer
      - name: batch_size
        display: Batch Size
        hint: 
          type: integer
        description: Max batch size for each record batch while reporting to target.
        placeholder: 100
      - name: batch_timeout
        display: Batch Timeout
        hint:
          type: integer
        description: Reporting timeout for a batch in seconds.
        placeholder: 20
      - name: use_received_time
        display: use_received_time
        hint:
          type: bool
        description: use data received time as timestamp not server time
