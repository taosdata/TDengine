testCases:
    - scenarioId: "D1"
      classif: "Delay"
      description: ""
      sql: |
         create stream db.stm_d1 
            interval(1a) 
            sliding(1a)
            from db.stbd1 
            stream_options(IGNORE_NODATA_TRIGGER|LOW_LATENCY_CALC) 
            into db.res_d1 
            as 
              select  _twstart    ts, 
                      cast(_tlocaltime/1000000 as timestamp) AS localtime,
                      count(*)    cnt,
                      last(ts)    lastts,
                      first(ts)   firstts
                from %%trows

