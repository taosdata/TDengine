instanceId = 64

# Listening host, supports IPv4/Ipv6, default is ""
host = ""
# Listen port, default is 6043
port = 6043

# go pool size
gopoolsize = 50000

# interval for metrics
RotationInterval = "15s"

[tdengine]
# Use square brackets for IPv6 (e.g., "[::1]") and dotted decimal for IPv4.
host = "127.0.0.1"
port = 6041
username = "root"
password = "taosdata"
usessl = false
# Skip TDengine server TLS certificate verification when usessl is true.
# Default is true for compatibility; set to false to verify the server certificate.
# Before setting this to false, make sure the CA that signed the server certificate
# is installed in the system trust store (on Linux you may instead point
# SSL_CERT_FILE/SSL_CERT_DIR to the CA file), otherwise connections will fail
# with x509 errors when the server uses a self-signed or internal-CA certificate.
skipVerify = true

[metrics]
# metrics prefix in metrics names.
prefix = "taos"

# export some tables that are not super table
tables = []

# database for storing metrics data
[metrics.database]
name = "log"
# database options for db storing metrics data
[metrics.database.options]
vgroups = 1
buffer = 64
keep = 90
cachemodel = "both"

# prometheus v2 memory cache mode configuration
[prometheus]
# Additional tables to cache (restore from default exclusion list)
# Example: includeTables = ["taosd_write_metrics", "adapter_c_interface"]
includeTables = []

# TTL for cached metrics in memory (in seconds)
# Data older than this will be automatically cleaned up
# Default: 300 (5 minutes), Minimum: 60 (1 minute)
cacheTTL = 300

[environment]
# Whether running in cgroup.
incgroup = false

[log]
# The directory where log files are stored.
# path = "/var/log/taos"
level = "info"
# Number of log file rotations before deletion.
rotationCount = 3
# The number of days to retain log files.
keepDays = 3
# The maximum size of a log file before rotation.
rotationSize = "1GB"
# If set to true, log files will be compressed.
compress = false
# Minimum disk space to reserve. Log files will not be written if disk space falls below this limit.
reservedDiskSize = "1GB"
