[package]
name = "taos-explorer"
version = "1.6.0"
edition = "2021"
description = "TDengine Explorer UI"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-cors = "0.6.4"
actix-embed = "0.1.0"
actix-files = "0.6.2"
actix-web = {version = "4.4.0", features = ["rustls"]}
rustls = "0.20"
rustls-pemfile = "2.0.0"
reqwest = { version = "0.11.22", default_features = false, features = ["stream", "json", "rustls", "deflate", "rustls-tls"] }
anyhow = "1"
atty = "0.2.14"
clap = { version = "4", features = ["derive", "env"] }
clap-verbosity-flag = "2.0.0"
tokio-util = "0.7.10"
tokio-stream = "0.1.14"
log = { version = "0.4", features = ["serde"] }
futures-util = "0.3.26"
http-auth-basic = "0.3"
rust-embed = "6.8.1"
serde = { version = "1.0.32", features = ["derive"] }
serde_json = "1"
thiserror = "1"
toml = "0.8.8"
tracing = "0.1"
tracing-actix-web = "0.7.2"
tracing-subscriber = "0.3"
utoipa = "4.1.0"
sha1 = "0.10.6"
rand = "0.8.4"
lazy_static = "1.4.0"
captcha = "0.0.9"
cargo_metadata = "0.18.1"

taos = { version = "0.10.19", default-features = false, features = [
	"ws-rustls",
	"optin",
	"deadpool",
] }

const-str = "0.5.4"
const_format = "0.2.30"
shadow-rs = "0.24.1"

[build-dependencies]
shadow-rs = "0.24.1"

[dev-dependencies]
zstd = "0"
