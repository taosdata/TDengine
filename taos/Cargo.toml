[package]
name = "taos"
version = "0.1.0"
edition = "2021"
homepage = "https://taosdata.com"
license = "MIT"
description = "resered namespace for TDengine"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bitsvec = "0.1.1"
chrono = "0.4"
derive_builder = "0.10.2"
futures = "0.3.21"
itertools = "0.10"
log = "0.4"
num_enum = "0.5"
paste = "1"
serde = { version = "1", features = ["derive"] }
taos-sys = { path = "../taos-sys" }
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
[dev-dependencies]
criterion = "0.3"
serde_json = "1"
[[bench]]
name = "async_query"
harness = false
