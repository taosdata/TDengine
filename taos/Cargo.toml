[package]
name = "taos"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "*"
async-trait = "*"
taos-query = { path = "../taos-query" }
taos-sys = { path = "../taos-sys", optional = true }
taos-ws = { path = "../taos-ws", optional = true }
thiserror = "*"

[dev-dependencies]
itertools = "0.10.3"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }

[features]
default = ["ws", "native"]
ws = ["taos-ws"]
native = ["taos-sys"]
test = []
