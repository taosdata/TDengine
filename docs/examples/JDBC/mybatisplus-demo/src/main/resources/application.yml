spring:
  datasource:
    driver-class-name: com.taosdata.jdbc.ws.WebSocketDriver
    url: jdbc:TAOS-WS://localhost:6041/mp_test?charset=UTF-8&locale=en_US.UTF-8&timezone=UTC-8&varcharAsString=true
    username: root
    password: taosdata

    druid:
      initial-size: 10
      min-idle: 5
      max-active: 50

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: false

logging:
  level:
    com:
      taosdata:
        example:
          mybatisplusdemo:
            mapper: debug
