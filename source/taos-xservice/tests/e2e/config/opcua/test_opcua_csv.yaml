task_name: opcua
task_type: opcua

from:
  fromhost: opcua://{0}/OPCUA/SimulationServer
  connect_timeout: 1
  request_timeout: 1
  interval: 10
  collect_mode: observe
  enable: "false"
  keep: 10
  concurrent: 1
  batch_size: 1
  batch_timeout: 1
  debug: "false"

to:
  target_type: taos
  target_dbname: ci_opcua

via: 7
task_exec_time: 10
