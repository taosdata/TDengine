task_name: opcua_select_all_points
task_type: opcua

from:
  fromhost: opcua://{0}/OPCUA/SimulationServer
  select_all_points: "true"
  interval: 1
  child_table_expression: t_{ns}_{id}
  table_primary_key: "received_ts"
  collect_mode: subscribe

to:
  target_type: taos
  target_dbname: ci_opcua

via: 7
task_exec_time: 20
