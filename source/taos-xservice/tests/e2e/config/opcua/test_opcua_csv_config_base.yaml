task_name: opcua
task_type: opcua

# 除必要的线性配置外所有配置都使用默认值

from:
  fromhost: opcua://{0}/OPCUA/SimulationServer
  connect_timeout: 10
  interval: 10
  collect_mode: subscribe
  request_timeout: 10
  log_level: info
  write_concurrency: 0
  batch_size: 1000
  batch_timeout: 1
  keep_raw_data: "false"
  keep_raw_data_days: 1

to:
  target_type: taos
  target_dbname: ci_opcua

via: 7
task_exec_time: 10
