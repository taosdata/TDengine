task_name: opcda
task_type: opcda

from:
  fromhost: opcda://{0}/Matrikon.OPC.Simulation.1
  da.tags: device1.tag1::table1,device1.tag2::table2
  connect_timeout: 1
  request_timeout: 1
  interval: 1
  collect_mode: observe
  enable: "false"
  opc_table_config: |
    {
        "stable_prefix": "stb_ua",
        "column_configs": [{
            "column_name": "received_time",
            "column_type": "timestamp",
            "column_alias": "received_time",
            "is_primary_key": true
        }, {
            "column_name": "original_time",
            "column_type": "timestamp",
            "column_alias": "original_time",
            "is_primary_key": false
        }, {
            "column_name": "value",
            "column_alias": "value",
            "is_primary_key": false
        }, {
            "column_name": "quality",
            "column_type": "int",
            "column_alias": "quality",
            "is_primary_key": false
        }]
    }
  concurrent: 1
  batch_size: 1
  batch_timeout : 1
  debug: "true"

to:
  target_type: taos
  target_dbname: ci_opcua

via: 7
task_exec_time: 150
