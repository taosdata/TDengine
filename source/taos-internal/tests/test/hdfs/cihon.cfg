########################################################
#                                                      #
#          TDengine Configuration for CSV              #
#   Any questions, please email support@taosdata.com   #
#                                                      #
########################################################

# Below is the configuration entry for importing CSV files
 
# Program Configuration
csvThreadNum 10
# range [5, 1000000]
fileCacheRows 10000
localFile /home/slguan/work/dest.csv
# localDir
# hdfsUrl
# hdfsDir
# hdfsFile

# may be bigint, or patterns like yyyy-MM-dd HH:mm:ss
timestampPattern yyyy-MM-dd HH:mm:ss
# the precision parsed from column, while timestampPattern is bigint, second, millisecond, microsecond is allowed
timestampPrecision millisecond
timestampMinValue 20050101
timestampMaxValue 20250101
# You can start this option
# 1. timestampPrecision is second
# 2. timestampPrecision is millisecond, and datadbMicroSecond is enabled
retainDuplicate true
sortBeforeInsert true
autoTimestamp false

# Log File section
# logDir /home/slguan/work/log
numOfLogLines 1000000
# debugFlag 8 bits mask: FILE-SCREEN-UNUSED-HeartBeat-DUMP-TRACE_WARN-ERROR
# 131: output warning and error，135: output info, warning and error to log.
# 199: output debug, info, warning and error to both screen and file, 195
debugFlag 131

# File Configuration
split ,
colSize 24
ignoreFirstLine true
binaryContainQuotation false
# dispose lines like "1554048015000","64963137490"
splitContainQuotation false
# dispose lines like CAITS 0_0 70111_17036059169 410703 U_REPT 
splitContainBlank false
# dispose lines like 1:64228842,2:21250152
splitContainColon false
# dispose lines like 990:1,vid:7413088259427309444}
splitContainRightBracket false
# can be csv or zjxl
fileType csv

# TDengine Connection Configuration
user root
password taosdata
host 192.168.0.1

# Log Configuration Items
logdbRecord true
logdbName log
logdbCache 2048
logdbAblocks 2
logdbTblocks 50
logdbTables 20
logdbRows 4096
logdbKeep 3650
logdbDays 10
logdbReplica 1
logdbTablePrefix csv

# Target database configuration items
datadbName db
datadbCache 16384
datadbAblocks 2
datadbTblocks 200
datadbTables 5000
datadbRows 8000
datadbKeep 3650
datadbDays 10
datadbReplica 1
datadbMicroSecond true

# stable configuration items
stableName st

# table configuration items
# tableNameColumn : aggregate multiple column into one column as table name, such as $0$1$2, also can be fileName
# tableRadix : use this value to aggregate multiple sensors into one table (treat tablename as integer)
tableNameColumn $0
tableFieldSize 22
tableTagSize 2
tablePrefix t
tableRadix 0
tableNameMd5 false
tableIgnoreFrontNum 1

# fields configuration can be found here
# 1.column: aggregate multiple columns into one column, such as $0$1$2, also can be tableName or fileName
# 2.name : the name of table field
# 3.type: the type of table field
fieldColumn $3  recordtimestamp          timestamp
fieldColumn $2  cardatatimestamp         timestamp
fieldColumn $4  longitude                double
fieldColumn $5  latitud                  double
fieldColumn $6  kilometremileage         double
fieldColumn $7  flpressure               double
fieldColumn $8  frpressure               double
fieldColumn $9  rlpressure               double
fieldColumn $10 rrpressure               double
fieldColumn $11 statdoorajarfl           double
fieldColumn $12 statdoorajarfr           double
fieldColumn $13 statdoorajarrl           double
fieldColumn $14 statdoorajarrr           double
fieldColumn $15 stattrunkajar            double
fieldColumn $16 fuellevel                double
fieldColumn $17 drivingdirection         double
fieldColumn $18 cartime                  timestamp
fieldColumn $19 instantconsum            double
fieldColumn $20 longacceleration         double
fieldColumn $21 steeringpos              double
fieldColumn $22 vehiclespeed             double
fieldColumn $23 enginespeed              double

# tags configuration can be found here
# 1.column : aggregate multiple columns into one column, such as $0$1$2, also can be tableName or fileName
# 2.name : the name of table tag
# 3.type : the type of table tag
tagColumn $0 vin                         binary(25)
tagColumn $1 useraccount                 binary(32)
