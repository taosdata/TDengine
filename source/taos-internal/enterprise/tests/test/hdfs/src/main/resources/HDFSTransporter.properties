## URI of HDFS
uri=hdfs://192.168.1.24:54310

## Target file location on HDFS
targetPath=/user/jyhou/gutenberg/test.lzo

## Target file encoding
targetFileEncoding=UTF-8

## Destination file encoding
destFileEncoding=UTF-8

## Destination file location on local file system
destPath=/home/jyhou/jhou/hdfs_test/tmp/dest.txt

## IO stream buffer size to use when transporting data from HDFS to local FS
ioStreamBuffSize=4096

## The granularity of target, i.e. whether the target path is a file or a directory
granularity=file
#granularity=directory

## Whether to recursively transport all the files in target directory, used only when $(granularity) is set to "directory"
recursive=false

#inputDir=/home/jyhou/jhou/hdfs_test/input

## Whether to decompress data
decompressData=true

## Format of compressed data, used only when $(decompressData) is set to "true", currently supported formats: .lzo
compressedDataFormat=lzo
#compressedDataFormat=parquet
#compressionAlgorithm=LzoAlgorithm.LZO1X