---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tdengine.fullname" . }}-server
  labels:
    {{- include "tdengine.labels" . | nindent 4 }}
data:
  serverEnv: |-
{{ .Values.services.server.environment | toYaml | indent 4 }}

  {{- range .Values.services.server.files }}
  {{ .name }}: |-
{{ .content |trim | indent 6 }}
  {{- end }}

# The taosx service is disabled by default. To enable it, set the following values:
# services:
#   taosx:
#
{{- if .Values.services.taosx }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tdengine.fullname" . }}-taosx
  labels:
    {{- include "tdengine.labels" . | nindent 4 }}
data:
  taosxEnv: |-
{{ .Values.services.taosx.environment | toYaml | indent 4 }}

  {{- range .Values.services.taosx.files }}
  {{ .name }}: |-
{{ .content |trim | indent 6 }}
  {{- end }}
{{- end }}
