{{- if .Values.services.arbitrator }}
---
# The arbitrator service is disabled by default. To enable it, set the following values:
# services:
#   arbitrator:
#
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tdengine.fullname" . }}-arbitrator
  labels:
    {{- include "tdengine.labels" . | nindent 4 }}
data:
  env: |-
{{ .Values.services.arbitrator.environment | toYaml | indent 4 }}

  {{- range .Values.services.arbitrator.files }}
  {{ .name }}: |-
{{ .content |trim | indent 6 }}
  {{- end }}
{{- end }}

---
# Arbitrator Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tdengine.fullname" . }}-arbitrator
  labels:
    {{- include "tdengine.labels" . | nindent 4 }}
    app: "arbitrator"
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "tdengine.selectorLabels" . | nindent 6 }}
      app: "arbitrator"
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "tdengine.selectorLabels" . | nindent 8 }}
        app: "arbitrator"
    spec:
      containers:
        - name: arbitrator
          image: "{{ .Values.image.repository }}{{ .Values.image.arbitrator | default .Values.image.server }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          ports:
          - name: tcp6042
            containerPort: 6042
            protocol: TCP

          env:
          # POD_NAME for FQDN config
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          # SERVICE_NAME and NAMESPACE for fqdn resolve
          - name: SERVICE_NAME
            value: {{ include "tdengine.fullname" . }}
          - name: STS_NAME
            value: {{ include "tdengine.fullname" . }}
          - name: STS_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          # TZ for timezone settings, we recommend to always set it.
          - name: TZ
            value: {{ .Values.timezone }}
          - name: TAOS_SUPPORT_VNODES
            value: "0"
          # TAOS_ prefix will configured in taos.cfg, strip prefix and camelCase.
          - name: TAOS_SERVER_PORT
            value: "6030"
          # Must set if you want a cluster.
          - name: TAOS_FIRST_EP
            value: "$(STS_NAME)-0.$(SERVICE_NAME).$(STS_NAMESPACE).svc.cluster.local:$(TAOS_SERVER_PORT)"
          # TAOS_FQND should always be setted in k8s env.
          - name: TAOS_FQDN
            value: "$(POD_NAME).$(SERVICE_NAME).$(STS_NAMESPACE).svc.cluster.local"

          
          volumeMounts:
          
          {{- range .Values.services.arbitrator.files }}
          - name: {{ printf "%s-%s" $serviceName .name }}
            mountPath: {{ .mountPath }}
            subPath: {{ .name }}
          {{- end }}

          {{- range .Values.services.arbitrator.volumes }}
          - name: {{ printf "%s-%s" $serviceName .name }}
            mountPath: {{ .mountPath }}
          {{- end }}
          readinessProbe:
            exec:
              command:
              - taos
              - -s
              - "select server_version()"
            initialDelaySeconds: 15
            timeoutSeconds: 15000
          livenessProbe:
            tcpSocket:
              port: 6030
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      volumes:
      {{- range .Values.services.arbitrator.files }}
        - name: {{ printf "%s-%s" $serviceName .name }}
          configMap:
            name: {{ $serviceName }}-arbitrator
            items:
              - key: {{ .name }}
                path: {{ .name }}
      {{- end }}
  volumeClaimTemplates:
  {{- range .Values.services.arbitrator.volumes }}
  - metadata:
      name: {{ printf "%s-%s" $serviceName .name }}
    spec:
      {{- toYaml .spec | nindent 6 }}
  {{- end }}
{{- end }}
