[package]
name = "taosx-ipc"
version = "0.1.0"
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
arrow = { version = "34.0.0", features = ["ipc"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
shadow-rs = "0.21.0"
taos-query = "0.5.0"
thiserror = "1.0.38"
tracing = "0.1"
zstd = "0.12.1"

[dev-dependencies]
actix-web = "4"
anyhow = "1"
taos = { version = "0.5.0" }
tokio = { version = "1", features = ["full"] }
tracing-actix-web = { version = "0.7" }
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter"] }

[build-dependencies]
shadow-rs = "0.21.0"
