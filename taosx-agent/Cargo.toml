[package]
name = "taosx-agent"
version.workspace = true
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow.workspace = true
cfg-if.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
clap-verbosity-flag = { workspace = true }
const_format.workspace = true
log = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["serde"] }

thiserror.workspace = true
twelf = { version = "0.15.0", default-features = false, features = [
  "toml",
  "env",
  "clap",
] }

dashmap = "5.4.0"
flume.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = "1"

arrow = { workspace = true, features = ["chrono-tz"] }
arrow-flight = { workspace = true }
chrono = { workspace = true }
tonic = { workspace = true, features = ["gzip", "tls", "tls-native-roots"] }
shadow-rs = { workspace = true }
metrics = { workspace = true }
futures.workspace = true
tokio = { workspace = true, features = [
  "rt",
  "rt-multi-thread",
  "io-util",
  "io-std",
  "net",
  "time",
  "process",
  "macros",
  "sync",
  "signal",
  "fs",
] }
tokio-util.workspace = true
tracing = { workspace = true, features = ["log"] }

taosx-core = { path = "../taosx-core" }
taosx-metrics = { path = "../taosx-metrics" }

tracing-subscriber = { workspace = true, features = [
  "time",
  "local-time",
  "env-filter",
] }

hyper = "1.5.2"
hyper-util = "0.1.10"
tower = "0.5.2"

taoslog = { workspace = true }
bytes = { workspace = true }
sysinfo = { workspace = true }

taosx-task.workspace = true

[build-dependencies]
dotenv = "0.15.0"
shadow-rs = { workspace = true }

[lints]
workspace = true
