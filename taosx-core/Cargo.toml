[package]
name = "taosx-core"
version = { workspace = true }
edition = "2021"
homepage = "https://taosdata.com"
publish = false
description = "taosX - TDengine data integration tool"

[dependencies]
anyhow.workspace = true
chrono = { workspace = true }
chrono-tz = { workspace = true }

arrow = { workspace = true }
arrow-schema = { workspace = true, features = ["serde"] }
arrow-flight = { workspace = true }
serde_arrow = { workspace = true }
faststr = { workspace = true }
parquet = { workspace = true }
rayon = { workspace = true }
tonic = { workspace = true, features = ["gzip", "tls"] }
zerocopy = { workspace = true }
dashmap = { workspace = true }

dlopen2 = "0.7.0"

regex = { workspace = true }

arrow-cast-guess-precision = { workspace = true }
arrow-compute-ext = { workspace = true }
ring-channel = "0.12"

async-compression = { version = "*", features = ["all"] }
async-trait = "0.1"
bon = "3.3.0"
bytes = "1"
bitflags = "2"
crossbeam = { version = "0.8.4" }
rhai = { version = "1.18.0", features = ["sync"] }
rhai-dylib = { version = "0.3.0", features = ["sync"] }
strum = { version = "0.26.3", features = ["derive"] }
paste = "1"
half = "2.3"
humantime = "2.1"

clap = { workspace = true, features = ["default", "derive"] }
convert_case = "0.6.0"
csv-async = { version = "1.2.4", features = ["tokio"] }

flate2 = { version = "1.0" }
futures = { workspace = true, features = ["thread-pool"] }
itertools = { workspace = true }
lazy_static = "1.4"
linked-hash-map = { version = "0.5.6", features = ["serde_impl"] }
log = "0.4"
fundu.workspace = true
scc = { workspace = true, features = ["serde"] }
semver = { version = "1.0.22" }
serde = { workspace = true, features = ["derive"] }
sha2 = "0.10"
thiserror = { workspace = true }
tokio = { workspace = true, features = [
  "rt",
  "rt-multi-thread",
  "io-util",
  "io-std",
  "net",
  "time",
  "process",
  "macros",
  "sync",
  "signal",
  "fs",
] }
tokio-util = { workspace = true, features = ["full"] }
tokio-stream = { workspace = true, features = ["time"] }
tokio-process-terminate = { version = "0.3" }
toml = "0.8.5"
either = "1.8"
serde_regex = "1"
tinytemplate = { git = "https://github.com/bitcapybara/TinyTemplate.git", rev = "9085af2b9c824e670750369827b9d6bbf24ae876" }
serde_json_path = "0.7"
csv_lib = { version = "1.2", package = "csv" }
glob = "0.3.1"
notify.workspace = true
futures-ext = { path = "../crates/futures-ext" }

file-rotate = "0.7.5"
ringbuf = { version = "0.3.3" }
deadpool = "=0.10"

actix-web = "4"
serde_json = { version = "1.0", features = ["raw_value", "preserve_order"] }
utoipa = { version = "4.0.0", features = ["actix_extras", "chrono"] }
utoipa-swagger-ui = { version = "7.1.0", features = ["actix-web"] }

cfg-if = "1.0.0"
metrics = { workspace = true }

async-backtrace = "0.2.2"
dotenv = "0.15.0"
tracing = { workspace = true, features = ["log"] }
tracing-subscriber = "0.3.17"

flume.workspace = true
futures-util = "0.3.30"
serde_with = "3.3"

bitvec = "1"
tempfile.workspace = true

reqwest = { workspace = true }
taosx-ipc = { path = "../taosx-ipc" }

taos = { workspace = true }
shadow-rs = { workspace = true }

md5 = "0.7.0"
kafka = "0.10.0"
rand.workspace = true
base64 = "0.21.2"
tiberius = { version = "0.12.2", default-features = false, features = [
  "chrono",
  "tds73",
  "time",
  "winauth",
  "bigdecimal",
] }

sled = "0.34.7"
socket2 = "0.5.5"
sysinfo = { workspace = true }
chardetng = "0.1.17"
encoding_rs = "0.8.33"

sqlx = { version = "0.8", features = [
  "mysql",
  "runtime-tokio",
  "chrono",
  "bigdecimal",
  "tls-rustls",
] }
bigdecimal.workspace = true
bit-vec = "0.6.3"
uuid = "1.4.0"
sqlx-postgres = { version = "0.8", features = [
  "chrono",
  "bigdecimal",
  "bit-vec",
] }
oracle = { version = "0.5", features = ["chrono"] }
rumqttc.workspace = true
rustls-pemfile = "2"
rustls-native-certs = "0.7"

mongodb = { version = "3.0.0", features = [
  "aws-auth",
  "zstd-compression",
  "zlib-compression",
  "snappy-compression",
  "openssl-tls",
] }
rdkafka = { version = "0.37.0", features = ["cmake-build", "ssl", "tracing"] }
opendal = { workspace = true }
taoslog.workspace = true
bitfield.workspace = true
deadpool-tiberius = "=0.1.8"
file-guard = "0.2.0"
config = "0.14.0"
snafu.workspace = true
parking_lot.workspace = true
lz4 = "1.28.0"
snap = "1.1.1"
datafusion = { version = "45.0.0", default-features = false, features = [
  "parquet",
] }
zstd = "0.13.2"
awaitgroup = "0.7.0"

hex.workspace = true

persist-queue = { path = "../crates/persist-queue" }
archive = { workspace = true }

prost.workspace = true

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["processthreadsapi"] }
openssl = "0.10.55"

[target.'cfg(not(windows))'.dependencies]
rdkafka = { version = "0.37.0", features = [
  "cmake-build",
  "ssl",
  "gssapi-vendored",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(all(unix, not(target_arch = "loongarch64")))'.dependencies]
openssl = { version = "0.10.55", features = ["vendored"] }

[target.'cfg(target_arch="loongarch64")'.dependencies]
openssl = { version = "0.10.55" }

[features]
default = ["optin", "native-tls"]
optin = ["taos/optin"]
rustls = ["taos/ws-rustls"]
native-tls = ["taos/ws-native-tls"]
disable-enterprise-only-validation = []
disable-enterprise-connector-validation = []

[build-dependencies]
dotenv = "0.15.0"
shadow-rs = { workspace = true }

[dev-dependencies]
pretty_env_logger = "0.5.0"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
urlencoding = { workspace = true }
shadow-rs = { workspace = true }

[lints]
workspace = true
